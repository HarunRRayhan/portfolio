<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body {
    margin: 0; padding: 0; width: 1600px; height: 840px; overflow: hidden;
  }
  .cover {
    width: 1600px; height: 840px; position: relative;
    /* swap background-image per cover; keep the dark scrim gradient for text legibility */
    background-image:
      linear-gradient(135deg, rgba(6,14,24,0.88) 0%, rgba(8,20,26,0.72) 45%, rgba(10,30,28,0.80) 100%),
      url('./photo.jpg');
    background-size: cover;
    background-position: center;
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
  }
  .title {
    position: absolute; top: 190px; left: 0; right: 0;
    text-align: center; color: #ffffff; font-weight: 800;
    font-size: 54px; line-height: 1.28; letter-spacing: -0.5px;
    text-shadow: 0 2px 18px rgba(0,0,0,0.45);
  }
  .icons {
    position: absolute; top: 520px; left: 0; right: 0;
    display: flex; justify-content: center; gap: 20px;
  }
  .badge {
    width: 84px; height: 84px; border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,0.94);
    box-shadow: 0 4px 20px rgba(0,0,0,0.35);
  }
  .badge img {
    width: 48px; height: 48px; object-fit: contain;
  }
  .footer {
    position: absolute; bottom: 40px; left: 60px; right: 60px;
    display: flex; justify-content: space-between; align-items: center;
    color: #ffffff; font-weight: 700; font-size: 20px;
    text-shadow: 0 1px 10px rgba(0,0,0,0.5);
  }
  .footer-left, .footer-right { display: flex; align-items: center; gap: 10px; }
  .social { display: flex; align-items: center; gap: 6px; margin-right: 4px; }
  .social span {
    width: 22px; height: 22px; border-radius: 4px;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700;
  }
</style>
</head>
<body>
  <!-- Replace the title text and badge logos below per cover. Keep the footer as-is. -->
  <div class="cover">
    <div class="title">Replace With The<br>Cover Title, Wrapped<br>Into 2-4 Lines</div>

    <div class="icons">
      <!-- One badge per real technology logo. Use local files fetched from cdn.simpleicons.org -->
      <div class="badge"><img src="./logo-1.svg" alt=""></div>
      <div class="badge"><img src="./logo-2.svg" alt=""></div>
      <div class="badge"><img src="./logo-3.svg" alt=""></div>
    </div>

    <div class="footer">
      <div class="footer-left">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6"><circle cx="12" cy="12" r="10"/><ellipse cx="12" cy="12" rx="4.2" ry="10"/><line x1="2" y1="12" x2="22" y2="12"/></svg>
        <span>harun.dev</span>
      </div>
      <div class="footer-right">
        <span class="social">
          <span style="background:transparent; color:#fff; font-size:16px;">𝕏</span>
          <span style="background:#0a66c2;">in</span>
          <span style="background:#1877f2;">f</span>
        </span>
        <span>@harundotdev</span>
      </div>
    </div>
  </div>
</body>
</html>
