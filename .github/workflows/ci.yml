name: PR checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    name: PHP, build, images, SSR and browser
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, pdo_pgsql, mbstring, gd
          coverage: none
          tools: composer:v2
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: npm ci
      - run: node --test tests/frontend/directory-badge-slider.test.mjs
      - run: npm run test:images
      - run: npm run build
      - run: node tests/ssr/seo-head.test.mjs
      - run: node tests/ssr/blog.test.mjs
      - run: node tests/ssr/blog-startup.test.mjs
      - run: python3 -m unittest discover -s tests/operations -p 'test_*.py'
      - run: php -d memory_limit=512M vendor/bin/phpunit
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
        env:
          PLAYWRIGHT_CHANNEL: chromium
          BROWSER_TEST_SSR: '1'
      - name: Validate operational scripts
        run: bash -n scripts/run-scheduler.sh scripts/monitor-recovery.sh scripts/monitor-production.sh

  postgres:
    name: PostgreSQL concurrency
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: harundev_ci
          POSTGRES_USER: harundev_ci
          POSTGRES_PASSWORD: isolated-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U harundev_ci -d harundev_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CONSULTATION_PG_TESTS: '1'
      CONSULTATION_PG_HOST: 127.0.0.1
      CONSULTATION_PG_PORT: '5432'
      CONSULTATION_PG_DATABASE: harundev_ci
      CONSULTATION_PG_USERNAME: harundev_ci
      CONSULTATION_PG_PASSWORD: isolated-ci-password
      CONSULTATION_PG_SSLMODE: disable
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, pdo_pgsql, mbstring, gd
          coverage: none
          tools: composer:v2
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: php -d memory_limit=512M vendor/bin/phpunit tests/Feature/ConsultationPostgresConcurrencyTest.php tests/Feature/OperationalPostgresHealthTest.php

  required:
    name: Required PR checks
    if: always()
    needs: [application, postgres]
    runs-on: ubuntu-latest
    steps:
      - name: Require every check to succeed
        env:
          APPLICATION_RESULT: ${{ needs.application.result }}
          POSTGRES_RESULT: ${{ needs.postgres.result }}
        run: test "$APPLICATION_RESULT" = success && test "$POSTGRES_RESULT" = success
