name: Monitor and Recover Production

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: production-monitor
  cancel-in-progress: false

jobs:
  monitor:
    name: Check harun.dev and recover Railway
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_PROJECT_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
      RAILWAY_ENVIRONMENT_ID: e9e1a067-1249-415e-9746-7465bb263062
      RAILWAY_WEB_SERVICE_ID: 8f1fd0c1-d316-4ea1-9a82-3f5ae441e293
      RAILWAY_SCHEDULER_SERVICE_ID: ec04aca0-0bc3-45a4-8dba-da93501cd882
      RAILWAY_POSTGRES_SERVICE_ID: b50c7e7b-e8a6-4d30-870f-658e4236e40b
    steps:
      - name: Check health and recover if needed
        shell: bash
        run: |
          set -Eeuo pipefail

          incident_title='[monitor] harun.dev outage'
          graphql_url='https://backboard.railway.com/graphql/v2'
          health_detail=''
          deployment_data=''

          health_check() {
            local response_file code body
            response_file="$(mktemp)"
            code="$(curl -sS --max-time 20 \
              -H 'Cache-Control: no-cache' \
              -H 'Pragma: no-cache' \
              -o "$response_file" \
              -w '%{http_code}' \
              "https://harun.dev/health?monitor=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${RANDOM}" || true)"
            body="$(cat "$response_file" 2>/dev/null || true)"
            rm -f "$response_file"

            if [[ "$code" != '200' ]]; then
              health_detail="HTTP ${code:-000}: ${body:0:240}"
              return 1
            fi

            if ! jq -e '.status == "ok"' >/dev/null 2>&1 <<<"$body"; then
              health_detail="HTTP 200 with invalid health payload: ${body:0:240}"
              return 1
            fi

            health_detail='HTTP 200, status=ok'
            return 0
          }

          find_open_incident() {
            gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/issues?state=open&per_page=100" \
              --jq '.[] | select(.pull_request == null and .title == "[monitor] harun.dev outage") | .number' \
              | head -n 1
          }

          close_incident() {
            local issue_number="$1"
            gh issue comment "$issue_number" \
              --repo "$GITHUB_REPOSITORY" \
              --body "Production recovered at $(date -u '+%Y-%m-%d %H:%M:%S UTC'). Health check: ${health_detail}."
            gh issue close "$issue_number" \
              --repo "$GITHUB_REPOSITORY" \
              --reason completed
          }

          # Three checks prevent a transient Cloudflare or Railway edge error from
          # triggering a rollback.
          for attempt in 1 2 3; do
            if health_check; then
              if issue_number="$(find_open_incident)"; then
                if [[ -n "$issue_number" ]]; then
                  close_incident "$issue_number"
                fi
              fi
              echo "Production healthy: ${health_detail}"
              exit 0
            fi

            echo "Health check ${attempt}/3 failed: ${health_detail}"
            if [[ "$attempt" -lt 3 ]]; then
              sleep 20
            fi
          done

          incident_number="$(find_open_incident || true)"

          query='query($environmentId:String!, $webServiceId:String!, $schedulerServiceId:String!, $postgresServiceId:String!) {
            web: deployments(input:{environmentId:$environmentId, serviceId:$webServiceId, includeDeleted:true}, first:20) {
              edges { node { id status createdAt deploymentStopped canRollback canRedeploy serviceId } }
            }
            scheduler: deployments(input:{environmentId:$environmentId, serviceId:$schedulerServiceId, includeDeleted:true}, first:20) {
              edges { node { id status createdAt deploymentStopped canRollback canRedeploy serviceId } }
            }
            postgres: deployments(input:{environmentId:$environmentId, serviceId:$postgresServiceId, includeDeleted:true}, first:20) {
              edges { node { id status createdAt deploymentStopped canRollback canRedeploy serviceId } }
            }
          }'

          if [[ -z "${RAILWAY_TOKEN:-}" || -z "${RAILWAY_PROJECT_ID:-}" ]]; then
            railway_error='RAILWAY_PROJECT_TOKEN or RAILWAY_PROJECT_ID is not configured in the production GitHub Environment.'
          else
            graphql_payload="$(jq -cn \
              --arg query "$query" \
              --arg environment_id "$RAILWAY_ENVIRONMENT_ID" \
              --arg web_service_id "$RAILWAY_WEB_SERVICE_ID" \
              --arg scheduler_service_id "$RAILWAY_SCHEDULER_SERVICE_ID" \
              --arg postgres_service_id "$RAILWAY_POSTGRES_SERVICE_ID" \
              '{query:$query,variables:{environmentId:$environment_id,webServiceId:$web_service_id,schedulerServiceId:$scheduler_service_id,postgresServiceId:$postgres_service_id}}')"

            deployment_data="$(curl -sS --max-time 30 \
              -H "Authorization: Bearer ${RAILWAY_TOKEN}" \
              -H 'Content-Type: application/json' \
              --data "$graphql_payload" \
              "$graphql_url" || true)"

            if [[ -z "$deployment_data" ]] || jq -e '.errors and (.errors | length > 0)' >/dev/null 2>&1 <<<"$deployment_data"; then
              railway_error="Railway deployment query failed: $(jq -c '.errors // .' <<<"${deployment_data:-{}}" 2>/dev/null | cut -c1-500)"
            else
              railway_error=''
            fi
          fi

          if [[ -n "$railway_error" ]]; then
            rollback_summary="$railway_error"
          else
            rollback_summary="$(jq -r '
              ["postgres", "web", "scheduler"][] as $service |
              ($service + ": " + ((.[$service].edges // []) | map(.node) | .[0:3] | map(\(.status + " " + .id + " " + .createdAt)) | join("; ")))
            ' <<<"$deployment_data")"
          fi

          incident_body="$(mktemp)"
          cat > "$incident_body" <<EOF
          ## Production outage detected

          The harun.dev health endpoint failed three consecutive checks.

          - Detected: $(date -u '+%Y-%m-%d %H:%M:%S UTC')
          - Health result: ${health_detail}
          - Workflow: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - Railway project: ${RAILWAY_PROJECT_ID:-not configured}

          ### Railway state

          ${rollback_summary}

          The monitor will attempt one rollback for this incident. If Railway is
          enforcing a workspace billing or usage stop, the rollback can fail until
          that account-level condition is resolved.
          EOF

          if [[ -z "$incident_number" ]]; then
            incident_url="$(gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --title "$incident_title" \
              --body-file "$incident_body")"
            incident_number="${incident_url##*/}"
            new_incident=true
          else
            new_incident=false
            echo "Existing incident #${incident_number}; no second rollback will be started."
          fi

          rollback_results=()
          if [[ "$new_incident" == true && -z "$railway_error" ]]; then
            rollback_mutation='mutation($id:String!){ deploymentRollback(id:$id) }'
            redeploy_mutation='mutation($id:String!){ deploymentRedeploy(id:$id, usePreviousImageTag:true){ id status } }'

            # Restore the database before the application, then the scheduler.
            for service in postgres web scheduler; do
              rollback_id="$(jq -r --arg service "$service" '
                (.[$service].edges // [])
                | map(.node)
                | map(select(.status == "REMOVED" and .canRollback == true))
                | sort_by(.createdAt)
                | reverse
                | .[0].id // empty
              ' <<<"$deployment_data")"

              if [[ -n "$rollback_id" ]]; then
                mutation_payload="$(jq -cn --arg query "$rollback_mutation" --arg id "$rollback_id" '{query:$query,variables:{id:$id}}')"
                mutation_response="$(curl -sS --max-time 30 \
                  -H "Authorization: Bearer ${RAILWAY_TOKEN}" \
                  -H 'Content-Type: application/json' \
                  --data "$mutation_payload" \
                  "$graphql_url" || true)"

                if jq -e '.data.deploymentRollback == true' >/dev/null 2>&1 <<<"$mutation_response"; then
                  rollback_results+=("${service}: rollback requested for ${rollback_id}")
                else
                  rollback_results+=("${service}: rollback failed $(jq -c '.errors // .' <<<"${mutation_response:-{}}" 2>/dev/null | cut -c1-300)")
                fi
                continue
              fi

              # If the rollback snapshot has expired, reuse the latest available
              # image instead of silently leaving that service offline.
              redeploy_id="$(jq -r --arg service "$service" '
                (.[$service].edges // [])
                | map(.node)
                | map(select(.canRedeploy == true and .status != "FAILED"))
                | sort_by(.createdAt)
                | reverse
                | .[0].id // empty
              ' <<<"$deployment_data")"

              if [[ -n "$redeploy_id" ]]; then
                mutation_payload="$(jq -cn --arg query "$redeploy_mutation" --arg id "$redeploy_id" '{query:$query,variables:{id:$id}}')"
                mutation_response="$(curl -sS --max-time 30 \
                  -H "Authorization: Bearer ${RAILWAY_TOKEN}" \
                  -H 'Content-Type: application/json' \
                  --data "$mutation_payload" \
                  "$graphql_url" || true)"

                if jq -e '.data.deploymentRedeploy.id' >/dev/null 2>&1 <<<"$mutation_response"; then
                  rollback_results+=("${service}: redeploy requested for ${redeploy_id}")
                else
                  rollback_results+=("${service}: redeploy failed $(jq -c '.errors // .' <<<"${mutation_response:-{}}" 2>/dev/null | cut -c1-300)")
                fi
              else
                rollback_results+=("${service}: no rollback or redeploy candidate")
              fi
            done
          else
            rollback_results+=("rollback skipped because this incident is already open or Railway state could not be queried")
          fi

          rollback_result_text="$(printf '%s\n' "${rollback_results[@]}")"
          gh issue comment "$incident_number" \
            --repo "$GITHUB_REPOSITORY" \
            --body "Health failure: ${health_detail}\n\nRollback actions:\n\n\`\`\`\n${rollback_result_text}\`\`\`"

          # Give Railway time to restore the snapshots before declaring recovery
          # unsuccessful. A failed workflow remains an additional warning signal.
          for attempt in 1 2 3 4 5; do
            sleep 20
            if health_check; then
              close_incident "$incident_number"
              echo "Production recovered after Railway recovery action."
              exit 0
            fi
            echo "Recovery check ${attempt}/5 failed: ${health_detail}"
          done

          gh issue comment "$incident_number" \
            --repo "$GITHUB_REPOSITORY" \
            --body "Automatic recovery did not restore harun.dev after five checks. Manual intervention is required. Last result: ${health_detail}."
          exit 1
