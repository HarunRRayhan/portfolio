name: Monitor and Recover Production

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: production-monitor
  cancel-in-progress: false

jobs:
  monitor:
    name: Check ${{ matrix.component }} readiness
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        component: [web, scheduler]
    env:
      GH_TOKEN: ${{ github.token }}
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_PROJECT_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
      RAILWAY_ENVIRONMENT_ID: e9e1a067-1249-415e-9746-7465bb263062
      RAILWAY_WEB_SERVICE_ID: 8f1fd0c1-d316-4ea1-9a82-3f5ae441e293
      RAILWAY_SCHEDULER_SERVICE_ID: ec04aca0-0bc3-45a4-8dba-da93501cd882
      MONITOR_COMPONENT: ${{ matrix.component }}
    steps:
      - uses: actions/checkout@v7
      - name: Check readiness and recover only the diagnosed application service
        run: bash scripts/monitor-production.sh
