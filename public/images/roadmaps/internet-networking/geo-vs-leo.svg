  <path d="M246 372 a14 9 0 0 0 28 0 Z" fill="#475569"/><line x1="260" y1="381" x2="260" y2="392" stroke="#475569" stroke-width="3"/>
  <text x="260" y="420" font-size="14" fill="#0f172a" text-anchor="middle">your dish</text>
  <path d="M520 372 a20 12 0 0 0 40 0 Z" fill="#475569"/><line x1="540" y1="384" x2="540" y2="394" stroke="#475569" stroke-width="3"/>
