  <text x="32" y="58" font-size="14" fill="#475569">GEO orbit: 35,786 km (Viasat, HughesNet)</text>
  <line x1="24" y1="300" x2="776" y2="300" stroke="#cbd5e1" stroke-dasharray="6 6"/>
  <text x="32" y="290" font-size="14" fill="#475569">LEO orbit: about 550 km (Starlink)</text>
