<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <rect width="800" height="300" rx="16" fill="#ffffff"/>
  <text x="24" y="36" font-size="15" font-weight="600" fill="#0f172a">The IPv4 space by first octet (0–255), drawn to scale</text>
  <!-- scale: x = 24 + octet * 2.9 ; total width 742.4 -->
  <rect x="24" y="60" width="371.2" height="60" fill="#dbeafe"/>
  <rect x="395.2" y="60" width="185.6" height="60" fill="#dcfce7"/>
  <rect x="580.8" y="60" width="92.8" height="60" fill="#fef9c3"/>
  <rect x="673.6" y="60" width="46.4" height="60" fill="#fce7f3"/>
  <rect x="720" y="60" width="46.4" height="60" fill="#e5e7eb"/>
  <g font-size="14" font-weight="600" text-anchor="middle">
    <text x="209.6" y="88" fill="#1e40af">Class A · 0–127</text><text x="209.6" y="108" font-size="12" font-weight="400" fill="#1e40af">half of all addresses</text>
    <text x="488" y="88" fill="#166534">Class B</text><text x="488" y="108" font-size="12" font-weight="400" fill="#166534">128–191</text>
    <text x="627.2" y="88" fill="#854d0e">C</text><text x="627.2" y="108" font-size="12" font-weight="400" fill="#854d0e">192–223</text>
    <text x="696.8" y="88" fill="#9d174d">D</text><text x="696.8" y="108" font-size="11" font-weight="400" fill="#9d174d">224+</text>
    <text x="743.2" y="88" fill="#374151">E</text><text x="743.2" y="108" font-size="11" font-weight="400" fill="#374151">240+</text>
  </g>
  <g stroke="#0f172a" stroke-width="2">
    <line x1="24" y1="120" x2="24" y2="150"/><line x1="53" y1="120" x2="53" y2="186"/><line x1="392.3" y1="120" x2="392.3" y2="150"/>
    <line x1="314" y1="120" x2="314" y2="218"/><line x1="523" y1="120" x2="523" y2="186"/><line x1="580.8" y1="120" x2="580.8" y2="250"/>
  </g>
  <g font-size="12" fill="#0f172a">
    <text x="28" y="148">0/8 "this network"</text>
    <text x="57" y="184">10/8 private</text>
    <text x="318" y="216">100.64/10 CGNAT</text>
    <text x="388" y="148" text-anchor="end">127/8 loopback</text>
    <text x="527" y="184">172.16/12 private · 169.254/16 link-local</text>
    <text x="577" y="248" text-anchor="end">192.168/16 private · 192.0.2, 198.51.100, 203.0.113 docs</text>
  </g>
  <text x="24" y="284" font-size="12" fill="#475569">Everything else in A, B and C that an RIR allocated is public unicast. D is multicast, E is reserved.</text>
</svg>
