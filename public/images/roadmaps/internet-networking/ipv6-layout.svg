<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <rect width="800" height="300" rx="16" fill="#ffffff"/>
  <text x="24" y="36" font-size="15" font-weight="600" fill="#0f172a">A global IPv6 address: 128 bits, drawn to scale</text>
  <text x="24" y="60" font-size="13" font-family="ui-monospace,Menlo,monospace" fill="#475569">2001:0db8:85a3 : 0042 : 1a2b:3cff:fe4d:5e6f</text>
  <!-- 752px for 128 bits => 5.875 px/bit -->
  <rect x="24" y="80" width="282" height="64" fill="#dbeafe"/>
  <rect x="306" y="80" width="94" height="64" fill="#dcfce7"/>
  <rect x="400" y="80" width="376" height="64" fill="#fef9c3"/>
  <g text-anchor="middle" font-size="14" font-weight="600">
    <text x="165" y="108" fill="#1e40af">global routing prefix</text><text x="165" y="128" font-size="12" font-weight="400" fill="#1e40af">48 bits · registry + ISP</text>
    <text x="353" y="108" fill="#166534">subnet</text><text x="353" y="128" font-size="12" font-weight="400" fill="#166534">16 bits · you</text>
    <text x="588" y="108" fill="#854d0e">interface ID</text><text x="588" y="128" font-size="12" font-weight="400" fill="#854d0e">64 bits · the device (SLAAC)</text>
  </g>
  <g stroke="#0f172a" stroke-width="2">
    
    <line x1="212" y1="150" x2="212" y2="176"/><line x1="306" y1="150" x2="306" y2="206"/>
    <line x1="353" y1="150" x2="353" y2="236"/><line x1="400" y1="150" x2="400" y2="266"/>
  </g>
  <g font-size="12" fill="#0f172a">
    <text x="208" y="172" text-anchor="end">/32 · ISP (65,536 /48s)</text>
    <text x="302" y="202" text-anchor="end">/48 · a site or company (65,536 subnets)</text>
    <text x="349" y="232" text-anchor="end">/56 · a typical home (256 subnets)</text>
    <text x="396" y="262" text-anchor="end">/64 · one LAN, always this size</text>
  </g>
  <text x="776" y="186" font-size="12" fill="#475569" text-anchor="end">2^64 ≈ 18 quintillion per LAN</text>
</svg>
