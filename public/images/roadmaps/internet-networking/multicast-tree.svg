<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <rect width="800" height="380" rx="16" fill="#ffffff"/>
  <text x="200" y="34" font-size="15" font-weight="600" fill="#0f172a" text-anchor="middle">Unicast: one copy per viewer</text>
  <text x="600" y="34" font-size="15" font-weight="600" fill="#0f172a" text-anchor="middle">Multicast: copies only where paths split</text>
  <line x1="400" y1="50" x2="400" y2="360" stroke="#e2e8f0" stroke-width="2"/>
  <g stroke="#dc2626" stroke-width="2"><line x1="194" y1="88" x2="194" y2="170"/><line x1="200" y1="88" x2="200" y2="170"/><line x1="206" y1="88" x2="206" y2="170"/>
    <line x1="194" y1="190" x2="100" y2="290"/><line x1="200" y1="190" x2="200" y2="290"/><line x1="206" y1="190" x2="300" y2="290"/></g>
  <text x="222" y="134" font-size="12" fill="#dc2626">3 copies on this link</text>
  <g stroke="#0d9488" stroke-width="3"><line x1="600" y1="88" x2="600" y2="170"/><line x1="600" y1="190" x2="500" y2="290"/><line x1="600" y1="190" x2="600" y2="290"/><line x1="600" y1="190" x2="700" y2="290"/></g>
  <text x="614" y="134" font-size="12" fill="#0d9488">1 copy</text>
  <g font-size="13" text-anchor="middle">
    <rect x="150" y="56" width="100" height="32" rx="8" fill="#e0f2fe" stroke="#0284c7"/><text x="200" y="77" fill="#075985">source</text>
    <rect x="550" y="56" width="100" height="32" rx="8" fill="#e0f2fe" stroke="#0284c7"/><text x="600" y="77" fill="#075985">source</text>
    <circle cx="200" cy="180" r="14" fill="#334155"/><text x="200" y="185" fill="#fff" font-size="11">R</text>
    <circle cx="600" cy="180" r="14" fill="#334155"/><text x="600" y="185" fill="#fff" font-size="11">R</text>
    <rect x="60" y="290" width="80" height="30" rx="8" fill="#f1f5f9" stroke="#94a3b8"/><text x="100" y="310" fill="#0f172a">viewer</text>
    <rect x="160" y="290" width="80" height="30" rx="8" fill="#f1f5f9" stroke="#94a3b8"/><text x="200" y="310" fill="#0f172a">viewer</text>
    <rect x="260" y="290" width="80" height="30" rx="8" fill="#f1f5f9" stroke="#94a3b8"/><text x="300" y="310" fill="#0f172a">viewer</text>
    <rect x="460" y="290" width="80" height="30" rx="8" fill="#f1f5f9" stroke="#94a3b8"/><text x="500" y="310" fill="#0f172a">joined</text>
    <rect x="560" y="290" width="80" height="30" rx="8" fill="#f1f5f9" stroke="#94a3b8"/><text x="600" y="310" fill="#0f172a">joined</text>
    <rect x="660" y="290" width="80" height="30" rx="8" fill="#f1f5f9" stroke="#94a3b8"/><text x="700" y="310" fill="#0f172a">joined</text>
  </g>
  <text x="600" y="346" font-size="12" fill="#475569" text-anchor="middle">receivers join with IGMP; routers build the tree with PIM</text>
  <text x="200" y="346" font-size="12" fill="#475569" text-anchor="middle">1,000 viewers = 1,000 copies from the source</text>
</svg>
