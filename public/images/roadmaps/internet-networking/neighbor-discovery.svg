<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <rect width="800" height="340" rx="16" fill="#ffffff"/>
  <text x="200" y="34" font-size="15" font-weight="600" fill="#0f172a" text-anchor="middle">IPv4 ARP: broadcast</text>
  <text x="600" y="34" font-size="15" font-weight="600" fill="#0f172a" text-anchor="middle">IPv6 NDP: solicited-node multicast</text>
  <line x1="400" y1="50" x2="400" y2="320" stroke="#e2e8f0" stroke-width="2"/>
  <g font-size="12" text-anchor="middle">
    <rect x="140" y="56" width="120" height="44" rx="8" fill="#e0f2fe" stroke="#0284c7"/><text x="200" y="75" fill="#075985">asker</text><text x="200" y="92" fill="#075985" font-size="11">who has 10.0.0.7?</text>
    <rect x="540" y="56" width="120" height="44" rx="8" fill="#e0f2fe" stroke="#0284c7"/><text x="600" y="75" fill="#075985">asker</text><text x="600" y="92" fill="#075985" font-size="11">who has …abcd:1234?</text>
  </g>
  <g stroke="#dc2626" stroke-width="2"><line x1="200" y1="100" x2="70" y2="220"/><line x1="200" y1="100" x2="155" y2="220"/><line x1="200" y1="100" x2="245" y2="220"/><line x1="200" y1="100" x2="330" y2="220"/></g>
  <g stroke="#0d9488" stroke-width="3"><line x1="600" y1="100" x2="645" y2="220"/></g>
  <g stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"><line x1="600" y1="100" x2="470" y2="220"/><line x1="600" y1="100" x2="555" y2="220"/><line x1="600" y1="100" x2="730" y2="220"/></g>
  <g font-size="12" text-anchor="middle" fill="#0f172a">
    <rect x="40" y="220" width="60" height="30" rx="6" fill="#fee2e2" stroke="#dc2626"/><text x="70" y="240">host</text>
    <rect x="125" y="220" width="60" height="30" rx="6" fill="#fee2e2" stroke="#dc2626"/><text x="155" y="240">host</text>
    <rect x="215" y="220" width="60" height="30" rx="6" fill="#fee2e2" stroke="#dc2626"/><text x="245" y="240">target</text>
    <rect x="300" y="220" width="60" height="30" rx="6" fill="#fee2e2" stroke="#dc2626"/><text x="330" y="240">host</text>
    <rect x="440" y="220" width="60" height="30" rx="6" fill="#f1f5f9" stroke="#94a3b8"/><text x="470" y="240">host</text>
    <rect x="525" y="220" width="60" height="30" rx="6" fill="#f1f5f9" stroke="#94a3b8"/><text x="555" y="240">host</text>
    <rect x="615" y="220" width="60" height="30" rx="6" fill="#ccfbf1" stroke="#0d9488"/><text x="645" y="240">target</text>
    <rect x="700" y="220" width="60" height="30" rx="6" fill="#f1f5f9" stroke="#94a3b8"/><text x="730" y="240">host</text>
  </g>
  <g font-size="12" fill="#475569" text-anchor="middle">
    <text x="200" y="280">to ff:ff:ff:ff:ff:ff</text>
    <text x="200" y="300">every host's CPU handles the request</text>
    <text x="600" y="280">to ff02::1:ffcd:1234 (MAC 33:33:ff:cd:12:34)</text>
    <text x="600" y="300">other NICs drop it in hardware</text>
  </g>
</svg>
