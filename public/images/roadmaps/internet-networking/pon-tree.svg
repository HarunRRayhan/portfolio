<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <rect width="800" height="360" rx="16" fill="#ffffff"/>
  <rect x="24" y="140" width="130" height="80" rx="10" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="89" y="172" font-size="16" font-weight="600" fill="#075985" text-anchor="middle">OLT</text>
  <text x="89" y="194" font-size="12" fill="#075985" text-anchor="middle">ISP exchange</text>
  <line x1="154" y1="180" x2="380" y2="180" stroke="#16a34a" stroke-width="4"/>
  <text x="267" y="166" font-size="13" fill="#0f172a" text-anchor="middle">one fiber, up to ~20 km</text>
  <text x="166" y="204" font-size="12" fill="#2563eb">↓ down 1490 nm GPON · 1577 nm XGS</text>
  <text x="166" y="222" font-size="12" fill="#dc2626">↑ up 1310 nm GPON · 1270 nm XGS</text>
  <polygon points="380,160 420,180 380,200" fill="#64748b"/>
  <text x="400" y="240" font-size="13" fill="#0f172a" text-anchor="middle">passive splitter</text>
  <text x="400" y="258" font-size="12" fill="#64748b" text-anchor="middle">1:32 or 1:64, no power</text>
  <g stroke="#16a34a" stroke-width="2" fill="none">
    <path d="M420 180 C500 180 520 60 600 60"/><path d="M420 180 C500 180 520 130 600 130"/>
    <path d="M420 180 C500 180 520 230 600 230"/><path d="M420 180 C500 180 520 300 600 300"/>
  </g>
  <text x="560" y="186" font-size="18" fill="#94a3b8" text-anchor="middle">⋮</text>
  <g font-size="13" fill="#0f172a">
    <rect x="600" y="42" width="176" height="36" rx="8" fill="#f1f5f9" stroke="#94a3b8"/><text x="688" y="65" text-anchor="middle">ONT · home 1</text>
    <rect x="600" y="112" width="176" height="36" rx="8" fill="#f1f5f9" stroke="#94a3b8"/><text x="688" y="135" text-anchor="middle">ONT · home 2</text>
    <rect x="600" y="212" width="176" height="36" rx="8" fill="#f1f5f9" stroke="#94a3b8"/><text x="688" y="235" text-anchor="middle">ONT · home 31</text>
    <rect x="600" y="282" width="176" height="36" rx="8" fill="#f1f5f9" stroke="#94a3b8"/><text x="688" y="305" text-anchor="middle">ONT · home 32</text>
  </g>
  <text x="24" y="40" font-size="13" fill="#475569">Down: every ONT hears everything (encrypted per home).</text>
  <text x="24" y="60" font-size="13" fill="#475569">Up: the OLT gives each ONT a time slot.</text>
  <text x="24" y="330" font-size="13" fill="#475569">GPON 2.5 / 1.25 Gbps · XGS-PON 10 / 10 Gbps, shared per port</text>
</svg>
