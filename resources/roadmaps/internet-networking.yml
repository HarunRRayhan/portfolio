      - id: fiber-and-undersea-cables
        title: Fiber and undersea cables
        summary: The internet is physical. Glass fibers carry light across cities and under oceans, laid and repaired by a small fleet of ships.
        lessons:
          - id: how-fiber-works
            title: How fiber carries light
            summary: "Fiber carries data as flashes of light inside a glass strand about as thin as a hair. The glass keeps the light trapped inside, even around bends."
            learn:
              - "What is inside a fiber strand"
              - "Why light stays inside the glass"
              - "Long-distance vs short-distance fiber"
              - "How many colours of light share one fiber"
            body: |
              A fiber cable is a thin strand of glass, about the thickness of a hair. Data goes in as very fast flashes of light from a laser or LED. A receiver at the other end turns the flashes back into data.

              The strand has a **core** in the middle and a layer called the **cladding** around it. The cladding acts like a mirror and bounces the light back into the core. So the light zig-zags along the strand and follows the cable around gentle bends. This trick is called **total internal reflection**.

              ### Key ideas
              - **Single-mode** fiber has a very thin core and carries light over long distances, even across oceans
              - **Multimode** fiber has a wider core and is cheaper, but only works over short runs, such as inside a building
              - Fiber loses far less signal than copper wire over distance, and electrical noise does not affect it
              - Several colours of light can travel down one fiber at the same time without mixing. Each colour carries its own stream of data, which multiplies what the fiber can carry (engineers call this **WDM**)

              ### Example
              Picture one fiber carrying 80 colours of light at once, each one as fast as a single colour on its own. One strand now does the work of 80.
            resources:
              - { label: "How do fiber optic cables work?", url: "https://www.youtube.com/watch?v=0t7Ina7_dIU", kind: video }
              - { label: "Optical fiber (Wikipedia)", url: "https://en.wikipedia.org/wiki/Optical_fiber", kind: article }
              - { label: "Total internal reflection (Wikipedia)", url: "https://en.wikipedia.org/wiki/Total_internal_reflection", kind: article }
              - { label: "Wavelength-division multiplexing (Wikipedia)", url: "https://en.wikipedia.org/wiki/Wavelength-division_multiplexing", kind: article }
              - { label: "Fiber optic cables: how they work (engineerguy)", url: "https://www.youtube.com/watch?v=0MwMkBET_5I", kind: video }
              - { label: "How does light carry data? Fiber optics explained (Techquickie)", url: "https://www.youtube.com/watch?v=G1Ke-H8I1uk", kind: video }
              - { label: "Fiber optic basics (The Fiber Optic Association)", url: "https://www.thefoa.org/tech/ref/basic/fiber.html", kind: article }
              - { label: "Optical fibre cables, how do they work? (Sabin Civil Engineering)", url: "https://www.youtube.com/watch?v=jZOg39v73c4", kind: video }
          - id: fiber-history
            title: Where fiber optics came from
            summary: "From telegraph cables under the Atlantic to the idea of pure glass that carries light, and the first fiber cable across an ocean."
            learn:
              - "The first telegraph cables under the Atlantic (1858 and 1866)"
              - "Charles Kao's idea of very pure glass (1966, Nobel Prize 2009)"
              - "The first useful fiber, made by Corning in 1970"
              - "TAT-8, the first fiber cable across the Atlantic (1988)"
            body: |
              Long-distance messages began with the telegraph. The 1858 cable across the Atlantic worked for only a few weeks. A lasting one followed in 1866, and it linked Europe and North America with electrical signals.

              Light was the next step. In 1966 Charles Kao showed that a glass fiber could carry light over long distances if the glass were pure enough. He won the Nobel Prize for it in 2009. In 1970 the glass company Corning made the first fiber clear enough to be useful.

              ### Key ideas
              - 1858 and 1866: telegraph cables under the Atlantic
              - 1966: Kao's paper on low-loss glass fiber
              - 1970: Corning's first low-loss fiber
              - 1988: TAT-8, the first fiber cable across the Atlantic

              ### Why it matters
              Fiber replaced copper cables under the sea. One fiber cable carries far more traffic than the old copper ones, at a much lower cost for each bit of data.
            resources:
              - { label: "Transatlantic telegraph cable (Wikipedia)", url: "https://en.wikipedia.org/wiki/Transatlantic_telegraph_cable", kind: article }
              - { label: "Charles K. Kao (Wikipedia)", url: "https://en.wikipedia.org/wiki/Charles_K._Kao", kind: article }
              - { label: "TAT-8 (Wikipedia)", url: "https://en.wikipedia.org/wiki/TAT-8", kind: article }
              - { label: "Charles K. Kao, Nobel Prize in Physics 2009 (NobelPrize.org)", url: "https://www.nobelprize.org/prizes/physics/2009/kao/facts/", kind: article }
              - { label: "The 2009 Nobel Prize in Physics, press release (NobelPrize.org)", url: "https://www.nobelprize.org/prizes/physics/2009/press-release/", kind: article }
              - { label: "Nobel Prize winner Charles Kao interview with FiberStory (OFC)", url: "https://www.youtube.com/watch?v=m53Er379L2U", kind: video }
              - { label: "Fiber-optic communication history (Wikipedia)", url: "https://en.wikipedia.org/wiki/Fiber-optic_communication#History", kind: article }
          - id: undersea-cables
            title: Undersea cables carry the world's traffic
            summary: "Almost all traffic between continents runs through a few hundred cables on the sea floor, not through satellites."
            learn:
              - "What is inside an undersea cable"
              - "Where cables come ashore"
              - "Who owns them, from phone companies to Google and Meta"
              - "How to read the public cable map"
            body: |
              Almost all traffic between continents travels through cables on the sea floor, not through satellites. Cables carry far more data and with less delay.

              An undersea cable is about as thick as a garden hose. The glass fibers sit in the centre, wrapped in steel wire and plastic for strength. Along the route, boxes called **repeaters** boost the light every so often, so it can cross thousands of kilometres. They get their power from electricity sent down the cable itself.

              ### Key ideas
              - Cables come ashore at **landing stations**, buildings near the beach where they join the networks on land
              - Telecom companies built most cables, and Google, Meta, Microsoft and Amazon now build and own many
              - Several companies often share one cable, each owning some of its fibers
              - A map of all cables is public

              ### In practice
              Open the Submarine Cable Map and pick a country. You can see which cables land there, who owns them and when they went live. Notice that many countries depend on just a few cables.
            resources:
              - { label: "Submarine Cable Map (TeleGeography)", url: "https://www.submarinecablemap.com/", kind: tool }
              - { label: "Submarine communications cable (Wikipedia)", url: "https://en.wikipedia.org/wiki/Submarine_communications_cable", kind: article }
              - { label: "Cable landing point (Wikipedia)", url: "https://en.wikipedia.org/wiki/Cable_landing_point", kind: article }
              - { label: "How the internet travels across oceans (VISION)", url: "https://www.youtube.com/watch?v=yd1JhZzoS6A", kind: video }
              - { label: "How a million miles of undersea cables power the internet (CNBC)", url: "https://www.youtube.com/watch?v=Pz5XRyo5fiw", kind: video }
              - { label: "Submarine cable frequently asked questions (TeleGeography)", url: "https://www2.telegeography.com/submarine-cable-faqs-frequently-asked-questions", kind: article }
              - { label: "Global internet map (TeleGeography)", url: "https://global-internet-map-2022.telegeography.com/", kind: tool }
              - { label: "International Cable Protection Committee (ICPC)", url: "https://www.iscpc.org/", kind: article }
              - { label: "Mother Earth Mother Board (Neal Stephenson, Wired)", url: "https://www.wired.com/1996/12/ffglass/", kind: article }
          - id: cable-ships
            title: The ships that lay and repair cables
            summary: "A small fleet of special ships lays new undersea cables and fixes broken ones, often kilometres below the surface."
            learn:
              - "How a ship lays and buries cable"
              - "How a break is found and repaired at sea"
              - "Why repairs can take weeks"
            body: |
              Cable ships are special vessels that lay and fix undersea cables. A ship carries thousands of kilometres of cable in large tanks and lets it out slowly as it sails along a planned route.

              Near the shore, where anchors and fishing nets can reach, the cable is buried in the sea floor by a plough pulled behind the ship or by an underwater robot. In deep water it just lies on the bottom.

              ### Key ideas
              - Ships lay cable along a surveyed route and bury it near the coast
              - To find a break, engineers send test signals from the shore and measure how far they get, a bit like shouting down a pipe and timing the echo
              - At the break, the ship hooks the cable, lifts it to the deck, cuts out the damaged part and joins in new cable
              - There are few repair ships, so the nearest one may be far away
              - Bad weather and permits can add more delay

              ### Example
              A test signal shows a break 200 km off a coast. A ship sails there, pulls up both ends and joins them on deck. Repairs often take days to weeks.
            resources:
              - { label: "How undersea internet cables are made and laid", url: "https://www.youtube.com/watch?v=pkbv4tyQoF0", kind: video }
              - { label: "How undersea cables get repaired 4 km down", url: "https://www.youtube.com/watch?v=GoPnMffCxuA", kind: video }
              - { label: "Cable layer (Wikipedia)", url: "https://en.wikipedia.org/wiki/Cable_layer", kind: article }
              - { label: "Inside the extreme life of divers repairing underwater cables (Fluctus)", url: "https://www.youtube.com/watch?v=l1knCR6xAzo", kind: video }
              - { label: "Inside the largest cable-laying ship ever built (Nauctis)", url: "https://www.youtube.com/watch?v=bgRsiGGSgjc", kind: video }
              - { label: "The invisible seafaring industry that keeps the internet afloat (The Verge)", url: "https://www.theverge.com/c/24070570/internet-cables-undersea-deep-repair-ships", kind: article }
              - { label: "Behind the process of repairing cables deep underwater (Fluctus)", url: "https://www.youtube.com/watch?v=eXjmr2AXIWk", kind: video }
              - { label: "CS Faraday, an early purpose-built cable ship (Wikipedia)", url: "https://en.wikipedia.org/wiki/CS_Faraday", kind: article }
              - { label: "Submarine cable industry news, including repair ships (Submarine Networks)", url: "https://www.submarinenetworks.com/", kind: article }
          - id: cable-fragility
            title: How fragile the cables are
            summary: "Around 150 to 200 undersea cable faults happen every year, mostly from ship anchors and fishing. Real cuts show what happens when a route goes down."
            learn:
              - "What usually breaks cables"
              - "Real outages, such as the Red Sea and Baltic Sea cuts"
              - "Why having several routes keeps the internet up"
            body: |
              Undersea cables are tough but not safe. Around 150 to 200 faults happen each year around the world. Most are caused by people: ships dragging anchors and fishing gear. Earthquakes and underwater landslides cut some others.

              Deep cables rarely break. Most faults happen in shallow water near ports and fishing grounds.

              ### Key ideas
              - Anchors and fishing cause most faults
              - Natural events such as earthquakes can cut several cables at once
              - Real cuts, such as those in the Red Sea and the Baltic Sea, slowed traffic and forced it onto other routes
              - **Route diversity** means having more than one cable and more than one path, so a single cut does not take a region offline. It is like a town with several roads in, not just one bridge

              ### Common mistakes
              - Thinking the internet is wireless or runs on satellites: it is mostly cables
              - Thinking a cut means a blackout: traffic usually finds another way, but it gets slower and costs more
              - Counting cables instead of routes: two cables through one narrow strait can fail together
            resources:
