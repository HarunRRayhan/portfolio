              - { label: "Starlink vs HughesNet and Viasat, Speedtest data (Ookla)", url: "https://www.ookla.com/articles/starlink-hughesnet-viasat-performance-q1-2023", kind: article }
              - { label: "Amazon vs SpaceX: the battle for space internet (WSJ)", url: "https://www.youtube.com/watch?v=8HkCSDZc_70", kind: video }
              - { label: "Geostationary orbit latency, speed of light (Wikipedia: Satellite internet latency)", url: "https://en.wikipedia.org/wiki/Satellite_Internet_access#Latency", kind: article }
          - id: latency-vs-bandwidth
            title: Why latency matters more than bandwidth
            summary: "Bandwidth is how wide the pipe is. Latency is how long it is. For browsing, calls and games, the length often matters more."
            learn:
              - "Bandwidth, latency and jitter in plain words"
              - "Why every web page needs several round trips"
              - "Why a fast plan can still feel slow"
            body: |
              **Bandwidth** is how much data a link can carry each second, the number on your plan, like 100 Mbps. **Latency** is how long a message takes to get there and back, called the round-trip time. **Jitter** is how much that delay jumps around.

              Think of a motorway. Bandwidth is the number of lanes. Latency is the length of the road. Adding lanes lets more cars through, but does not get any single car there sooner.

              ### Why delay slows everything
              Computers do not just fire data and hope. They send some, wait for a "got it" reply, then send more. A new connection also starts slowly and speeds up once each round trip. So on a link with long delay, every small download spends most of its time waiting, however big your plan is.

              ### Counting round trips in a page load
              Before a page starts to appear, your device usually needs about four round trips:
              1. Look up the site's address (DNS, the internet's phone book)
              2. Open a connection
              3. Set up encryption (the padlock)
              4. Ask for the page and get the first part back

              | Link | Round trip | 4 round trips |
              |---|---|---|
              | Fiber | 10 ms | 40 ms |
              | Starlink | 40 ms | 160 ms |
              | High-orbit satellite | 600 ms | 2.4 s |

              That is before any picture, script or video loads. This is why big sites keep copies of their content close to you, and why newer web technology tries hard to cut out round trips.

              ### In practice
              Run a speed test such as speedtest.net or fast.com. Next to the download speed it shows **ping** or latency in milliseconds. Try it on Wi-Fi and on mobile data and compare both numbers.

              ### Go deeper
              The technical detail is in [Transport in depth](/roadmaps/networking/transport-in-depth) on the Networking roadmap.
