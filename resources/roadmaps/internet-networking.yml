          - id: network-devices
            title: Routers, switches and modems
            summary: "Three boxes move your traffic: a switch, a router and a modem. Each does a different job, and at home they are often one box."
            learn:
              - "A switch connects devices inside one network"
              - "A router moves traffic between networks"
              - "A modem connects you to your internet provider"
              - "Why your home box does all three"
            body: |
              Three kinds of box do most of the work in a small network. In a home they are usually squeezed into one device.

              A **switch** connects devices inside one network, like a receptionist who passes each note only to the right desk. A **router** connects different networks and picks where each piece of data goes next, like a post office sorting letters to other towns. A **modem** turns the signal on your provider's line (cable, phone line or fiber) into a normal network connection.

              ### Key ideas
              - Switch: links devices in one network, using each device's hardware address (its MAC address)
              - Router: moves traffic between networks, using **IP addresses**, the internet's postal addresses
              - Modem: your bridge to the internet provider
              - The "router" your provider gave you is usually a modem, router, switch and Wi-Fi point in one case

              ### Example
              Your phone loads a web page. The Wi-Fi in the home box carries the request to its router part. The router sends it out through the modem, and the modem passes it to your provider.

              ### Go deeper
              The technical detail is in [Switching and VLANs](/roadmaps/networking/switching-vlans) and [Routing](/roadmaps/networking/routing) on the Networking roadmap.
