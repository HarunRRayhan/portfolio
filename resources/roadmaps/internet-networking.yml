          - id: anycast-ddos
            title: Why anycast helps
            optional: true
            summary: Spreading one address across many data centres splits an attack into many small ones.
            learn:
              - Absorbing traffic at the edge
              - Hiding the origin
            body: |
              A large attack can easily overwhelm a single site. **Anycast** spreads one IP address over many data centres. Attack traffic follows BGP to the nearest site, so each location receives only the part of the attack that is close to it.

              A 1 Tbps attack from bots all over the world may reach 300 sites and hit each with a few Gbps, which each site can absorb. This is how big edge networks soak up attacks.

              ### Key ideas
              - Split one big attack into many small ones, near where the bots are
              - Absorb traffic at the edge, and only pass clean traffic on to the origin
              - A site under heavy load can withdraw routes, and traffic goes to other sites
              - **Hide the origin**: keep your server's real IP private and accept traffic only from the edge network
              - The attacker can still go for the origin directly if its address leaks

              ### Common mistakes
              - Leaving the origin open to the whole internet, so attackers skip the edge
              - Using old DNS records or mail servers that reveal the origin IP
            resources:
              - { label: "What is an anycast network? (Cloudflare)", url: "https://www.cloudflare.com/learning/cdn/glossary/anycast-network/", kind: article }
              - { label: "A Brief Primer on Anycast (Cloudflare)", url: "https://blog.cloudflare.com/a-brief-anycast-primer/", kind: article }
