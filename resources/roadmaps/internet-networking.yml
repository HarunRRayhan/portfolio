          - id: satellite-orbits
            title: Satellite orbits and the speed of light
            summary: "Satellites fly at very different heights, and height sets the shortest possible delay. A little arithmetic shows why."
            learn:
              - "High, middle and low orbits, and what each is used for"
              - "Why some satellites seem to stand still in the sky"
              - "How distance sets the delay"
            body: |
              A satellite link is a radio path from your dish up to a satellite and back down to a **ground station** that is on fiber. How high the satellite flies decides how long that trip takes.

              | Orbit | Height | Seen from the ground | Examples |
              |---|---|---|---|
              | **GEO** (geostationary, high) | 35,786 km | fixed point in the sky | Viasat, HughesNet, satellite TV |
              | **MEO** (medium) | about 8,000 km | moves slowly | SES O3b mPOWER, GPS (20,200 km) |
              | **LEO** (low Earth orbit) | about 340 to 1,200 km | crosses the sky in minutes | Starlink (~550 km), OneWeb (~1,200 km), Amazon Kuiper |

              At 35,786 km a satellite takes exactly one day to go round the Earth, the same time the Earth takes to spin once. Above the equator it seems to hang still, so a fixed dish can point at it forever. One such satellite sees about a third of the planet.

              ![A dish on the ground reaching a gateway through a LEO satellite at 550 km and a GEO satellite at 35,786 km, with minimum round trips of about 7 ms and 477 ms](/images/roadmaps/internet-networking/geo-vs-leo.svg)

              ### The arithmetic
              Radio travels at about 300,000 km per second, or 300 km every millisecond. A request and its reply each go up and down once, so the signal makes four trips between ground and satellite:

              - **High orbit**: 4 × 35,786 km is about 143,000 km, which takes about **477 ms**, nearly half a second, before any equipment adds its own time. Real round trips are usually 600 ms or more
              - **Low orbit at 550 km**: 4 × 550 km is about 2,200 km, about **7 ms**. The satellite is rarely straight overhead, and the network adds its own time, so real round trips are about 25 to 60 ms
              - **Fiber across 1,000 km of land**: light in glass covers about 200 km per ms, so there and back is about 10 ms

              ### Key ideas
              - No technology can beat the half-second floor of high-orbit satellites. It is distance divided by the speed of light
              - Low-orbit satellites move fast (about 27,000 km/h), so you need many of them, and your dish keeps switching between them
              - Near the poles, a high-orbit satellite sits low on the horizon or out of sight
