              - { label: "RFC 2488: Enhancing TCP over satellite channels", url: "https://www.rfc-editor.org/rfc/rfc2488", kind: docs }
              - { label: "Geostationary orbit (ESA)", url: "https://www.esa.int/media/geostationary-orbit", kind: article }
