              - { label: "Cable modem (Wikipedia)", url: "https://en.wikipedia.org/wiki/Cable_modem", kind: article }
              - { label: "Residential gateway: the home router-modem box (Wikipedia)", url: "https://en.wikipedia.org/wiki/Residential_gateway", kind: article }
          - id: network-of-networks
            title: The internet as a network of networks
            summary: "No one owns the internet. It is tens of thousands of separate networks that agree to carry each other's traffic."
            learn:
              - "What an internet provider (ISP) does"
              - "How providers connect to each other"
              - "Why no single company runs the internet"
              - "Why one outage rarely takes everything down"
            body: |
              The internet is not one network. It is tens of thousands of separate networks that agree to pass each other's traffic. Home networks, companies, universities, cloud providers and internet providers are all part of it.

              An **ISP** (internet service provider) is the company that connects you to the rest of the internet. Small ISPs buy access from bigger ones, and big ones connect directly to each other. Everyone follows the same shared rules, mainly the Internet Protocol (IP), so the pieces fit together.

              It works a bit like the world's road system: each country builds and runs its own roads, but they meet at borders and follow similar rules, so a lorry can drive across a continent.

              ### Key ideas
              - Each network has its own owner
              - Providers connect by paying a bigger network to carry their traffic (**transit**) or by swapping traffic for free as equals (**peering**)
              - No company owns the whole internet
              - Shared standards, not a central boss, keep it working

              ### Why it matters
              If one network fails, traffic can often take another path. That is why one company's outage rarely takes down the whole internet.

              ### Go deeper
              How networks announce routes to each other is in [BGP in depth](/roadmaps/networking/bgp-in-depth) on the Networking roadmap.
            resources:
