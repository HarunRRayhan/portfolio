              - { label: "UDP-based amplification attacks (CISA)", url: "https://www.cisa.gov/news-events/alerts/2014/01/17/udp-based-amplification-attacks", kind: docs }
              - { label: "Memcrashed: major amplification attacks from UDP port 11211 (Cloudflare)", url: "https://blog.cloudflare.com/memcrashed-major-amplification-attacks-from-port-11211/", kind: article }
              - { label: "February 28th DDoS incident report (GitHub)", url: "https://github.blog/news-insights/company-news/ddos-incident-report/", kind: article }
              - { label: "HTTP/2 Rapid Reset: deconstructing the record-breaking attack (Cloudflare)", url: "https://blog.cloudflare.com/technical-breakdown-http2-rapid-reset-ddos-attack/", kind: article }
              - { label: "RFC 4987: TCP SYN Flooding Attacks and Common Mitigations", url: "https://www.rfc-editor.org/rfc/rfc4987", kind: docs }
          - id: anycast-ddos
            title: Why anycast helps
            optional: true
            summary: "Big sites survive huge attacks by announcing one address from hundreds of data centres. The flood is split into many small streams that each site can handle."
            learn:
              - "How anycast splits one big attack"
              - "Cleaning traffic at the edge"
              - "Keeping the real server hidden"
              - "How attackers try to get around it"
            body: |
              A big attack can easily overwhelm a single site. The trick large networks use is **anycast**: the same address is announced from many data centres at once. Attack traffic, like any traffic, flows to the nearest site. So each location only receives the part of the attack that comes from its own region.

              It is like a flood hitting a river delta instead of a single pipe. The water splits into hundreds of small channels, and none of them bursts.

              ### Example
              A 1 Tbps attack (about a trillion bits per second) from bots all over the world may reach 300 sites. Each site gets a few Gbps, which it can absorb. This is how big edge networks soak up attacks.

              ### Key ideas
              - One huge attack becomes many small ones, near where the bots are
              - Each site filters the flood and only passes clean traffic on to the real server, called the **origin**
              - A site under heavy strain can stop announcing the address, and its traffic moves to other sites
              - **Hide the origin**: keep the real server's address private, and accept traffic only from the protection network
              - If the origin's address leaks, an attacker can skip the protection and hit it directly

              ### Common mistakes
              - Leaving the origin open to the whole internet, so attackers go around the shield
              - Old DNS records or mail servers that still reveal the origin's real address

              ### Why it matters
              This is why services like Cloudflare can keep sites online through attacks that would flatten any single data centre.

              ### Go deeper
              Filtering, rate limiting and web application firewalls are in [Firewalls](/roadmaps/networking/firewalls) on the Networking roadmap.
            resources:
              - { label: "What is an anycast network? (Cloudflare)", url: "https://www.cloudflare.com/learning/cdn/glossary/anycast-network/", kind: article }
              - { label: "A Brief Primer on Anycast (Cloudflare)", url: "https://blog.cloudflare.com/a-brief-anycast-primer/", kind: article }
