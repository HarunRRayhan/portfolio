          - id: fiber-to-the-home
            title: "How fiber reaches your home"
            summary: "One fiber from the provider's building is split, with no power needed, to dozens of homes. How that works, and why the glass in the street lasts for decades."
            learn:
              - "\"Fiber\" to the street vs fiber all the way to your home"
              - "How one fiber is shared by many homes"
              - "The box on your wall that turns light into a network connection"
              - "Why the glass outlives the equipment"
            body: |
              "Fiber" in adverts covers several setups. Some run fiber only to a box in the street and use old copper phone wire for the last few hundred metres. Some stop in the basement of a block of flats. **Fiber to the home** (FTTH) runs glass all the way to a small box on your wall. Only that gets the full benefit.

              Most fiber to the home uses a **passive optical network**. "Passive" means nothing out in the street needs power.

              1. A machine in the provider's building sends light down one fiber
              2. That fiber runs out to your neighbourhood
              3. A **splitter**, just a shaped piece of glass, divides it into 32 or 64 fibers, one per home, up to about 20 km from the provider
              4. The box on your wall turns the light into a normal network connection for your router

              ![An OLT at the exchange feeding one fiber into a passive splitter that fans out to 32 home ONTs, with GPON and XGS-PON wavelengths](/images/roadmaps/internet-networking/pon-tree.svg)

              ### Sharing one fiber
              - **Downloads**: the provider sends one stream, and every home's box hears all of it. Each box keeps only its own data, and each home's traffic is encrypted, so neighbours cannot read it
              - **Uploads**: homes take turns. The provider gives each box short time slots, so their light does not collide at the splitter, like people taking turns to speak
              - Common systems today give each shared fiber about 2.5 Gbps down, or 10 Gbps both ways on newer kit, split among the homes on it

              ### Why the glass outlives the equipment
              Going faster means swapping the machine at the provider and the box on your wall. The fiber in the street stays. The digging, which is most of the cost, is done once and lasts for decades.

              ### In practice
              If your provider's box on the wall has a green fiber cable going into it, labelled PON, you have fiber to the home. If a phone cable goes in, it is a copper line.
