              - { label: "A ship's anchor cut 3 internet cables in the Red Sea (What's Going on at Sea?)", url: "https://www.youtube.com/watch?v=IYJjxFh6i8s", kind: video }
              - { label: "Subsea cable resilience, internet outages (Internet Society Pulse)", url: "https://pulse.internetsociety.org/", kind: tool }
              - { label: "Red Sea cable cuts and their impact (Kentik blog)", url: "https://www.kentik.com/blog/what-caused-the-red-sea-submarine-cable-cuts/", kind: article }
              - { label: "Germany suspects sabotage behind severed undersea cables (BBC News)", url: "https://www.youtube.com/watch?v=B2ZO9jn_mwo", kind: video }
              - { label: "2008 submarine cable disruption (Wikipedia)", url: "https://en.wikipedia.org/wiki/2008_submarine_cable_disruption", kind: article }
              - { label: "2006 Hengchun earthquakes and the cables they cut (Wikipedia)", url: "https://en.wikipedia.org/wiki/2006_Hengchun_earthquakes", kind: article }
          - id: next-generation-fiber
            title: New kinds of fiber
            optional: true
            summary: "Hollow-core fiber sends light through air instead of solid glass, so data arrives sooner. Labs in China and elsewhere are setting records."
            learn:
              - "Why light is faster in air than in glass"
              - "What hollow-core fiber is"
              - "Other ways to fit more data in one cable"
            body: |
              Normal fiber has a solid glass core. Light slows down in glass, to about two thirds of its top speed in empty space.

              **Hollow-core fiber** guides the light through air inside the glass instead. Light moves faster in air, so the delay drops by about a third. The signal also fades less and gets less distorted, so it can travel farther before it needs a boost.

              ### Key ideas
              - Hollow-core fiber means less delay (lower **latency**), which matters for trading firms, cloud links and data centres
              - Labs and operators in China and elsewhere have run field trials with record speeds
              - **Multi-core fiber** puts several cores in one strand, like several lanes in one road, so one cable carries more
              - Other approaches add more colours of light, or pack more data into each flash

              ### Why it matters
              People keep using more data, and laying new cables is slow and expensive. Getting more out of each fiber is a cheaper way to keep up.
            resources:
              - { label: "China's hollow-core fiber trial pushes 51.3 Tb/s over 128 miles (Tom's Hardware)", url: "https://www.tomshardware.com/networking/chinas-hollow-core-fiber-trial-pushes-51-3-tb-s-over-128-miles-without-signal-regeneration-milestone-targets-ai-era-networking-bottlenecks", kind: article }
