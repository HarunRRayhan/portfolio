          - id: why-fiber-wins
            title: Why most people who can get fiber use it
            summary: "Fiber carries more, with less delay, and uploads as fast as it downloads. Its only real problem is the cost of digging to lay it."
            learn:
              - "How much glass can carry compared with radio"
              - "Delay, steadiness and reliability"
              - "Cost and how it upgrades"
              - "Why the countryside still relies on satellite and mobile"
            body: |
              Where fiber is available, it is usually the best connection. In countries that built it widely, such as South Korea, Japan, Spain and China, it carries most home broadband. Worldwide, mobile is still the most common way people get online, mainly because no cable needs to reach the person.

              ### Why fiber wins
              - **Capacity.** One fiber strand can carry far more than radio. A whole large internet satellite carries a few hundred gigabits to about a terabit per second, shared across a continent. Radio is shared by everyone in range. A fiber strand belongs to its path alone
              - **Low delay.** Light in glass covers about 200 km every millisecond, and the route runs nearly straight to your provider. Typical delay is 1 to 10 ms
              - **Steady.** Rain, trees and moving satellites do not affect it, and the delay barely changes from moment to moment. That steadiness matters for calls and games
              - **Upload as fast as download**, which helps video calls, backups and sending big files
              - **Cheap to run.** Once the glass is in, carrying more traffic costs little
              - **Easy to upgrade.** New equipment at each end, same fiber

              ### The catch: digging
              Most of the cost of fiber is the building work: trenches, ducts, poles and permits. In a city, one street of fiber serves hundreds of homes. On a farm 5 km from the next house, the same money serves one. That is why the countryside, ships and aircraft use satellite and mobile instead.

              ### Common mistakes
              - Comparing only the speed number: a 100 Mbps fiber link feels faster than a 150 Mbps high-orbit satellite link, because of the delay
              - Thinking wireless will replace fiber: every phone mast and satellite ground station is itself connected by fiber
