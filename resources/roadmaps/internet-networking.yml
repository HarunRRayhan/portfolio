stages:
  - level: beginner
    title: The basics
    topics:
      - id: what-is-a-network
        title: What a network is
        summary: Two or more devices that can send data to each other, and how many small networks join into the internet.
        lessons:
          - id: lan-vs-wan
            title: LAN vs WAN
            summary: "A LAN is the network in one place, like your home or office. A WAN joins places that are far apart."
            learn:
              - "What makes a network \"local\""
              - "What a wide area network joins, and who runs it"
              - "Why the internet is the biggest WAN of all"
            body: |
              A **network** is two or more devices that can send data to each other. Networks come in two broad sizes.

              A **LAN** (local area network) connects devices in one place, such as a home, a school or an office. You own the Wi-Fi box and the cables, so it is fast and cheap to run.

              A **WAN** (wide area network) joins networks that are far apart, like two offices in different cities. You usually rent those long links from a telecom company or an internet provider.

              Think of a LAN as the corridors inside one building, and a WAN as the roads between towns.

              ### Key ideas
              - LAN: one site, high speed, you run it
              - WAN: many sites, slower and paid for, run by a provider
              - The internet is the largest WAN there is

              ### Example
              Your laptop sends a file to the office printer over the LAN. It never leaves the building. When you open a website, your request leaves through the router and travels over your provider's WAN.

              ### Go deeper
              How engineers plan LANs and WANs is in [Network design](/roadmaps/networking/network-design) on the Networking roadmap.
            resources:
              - { label: "What is a LAN? (Cloudflare)", url: "https://www.cloudflare.com/learning/network-layer/what-is-a-lan/", kind: article }
              - { label: "What is a WAN? (Cloudflare)", url: "https://www.cloudflare.com/learning/network-layer/what-is-a-wan/", kind: article }
