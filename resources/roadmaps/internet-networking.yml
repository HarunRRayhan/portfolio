          - id: how-viasat-works
            title: How geostationary satellite internet works (Viasat)
            summary: "A few very large satellites 35,786 km up cover whole continents. How the signal travels, how the system hides some of the delay, and where it struggles."
            learn:
              - "The path from your dish to the internet"
              - "How one satellite serves many areas with narrow beams"
              - "Tricks to hide the half-second delay"
              - "Rain, shared beams and data limits"
            body: |
              Viasat, like HughesNet, provides internet from **geostationary** satellites, which sit at one fixed point in the sky. A small number of very large satellites cover whole continents.

              ### The path
              1. Your dish points at one fixed spot in the sky and sends and receives radio signals
              2. The satellite relays your signal down to a **gateway**, a ground station with a big dish
              3. The gateway is on fiber, and from there your traffic joins the internet
              4. Replies come back the same way

              ### Many narrow beams
              Older satellites used one wide beam for a whole country. Newer ones such as ViaSat-2 and ViaSat-3 use hundreds of narrow **spot beams**, like many small torches instead of one floodlight. Beams far enough apart can reuse the same radio frequencies, so total capacity multiplies. ViaSat-3 satellites were designed for about 1 terabit per second each. The first one, launched in 2023, had its large antenna fail to open fully, which cut its usable capacity.

              Everyone under one beam shares it. So plans come with a monthly amount of priority data. After that, your traffic can be slowed when the beam is busy.

              ### Hiding the delay
              Every round trip takes about 600 ms, and normal web connections need several of them. To help, Viasat's equipment answers some of your computer's "got it" messages on the spot instead of waiting for the far end. These helpers are called **performance-enhancing proxies**. Encryption limits this trick, because the helper cannot see inside an encrypted connection, and newer web connections hide even more of these messages.

              ### Weaknesses
              - **Rain fade**: heavy rain soaks up the signal and can drop the link
              - Delay of 600 ms or more makes gaming, video calls and remote desktops hard
              - Capacity is shared across huge areas, and adding more means launching a new satellite, which takes years

              ### Strengths
              It covers oceans and sky. Viasat, which bought Inmarsat in 2023, is still strong on aircraft, ships and government links, where wide coverage matters more than delay.

              ### Go deeper
              How connections handle long delays is in [Transport in depth](/roadmaps/networking/transport-in-depth) on the Networking roadmap.
            resources:
              - { label: "ViaSat-3 (Wikipedia)", url: "https://en.wikipedia.org/wiki/ViaSat-3", kind: article }
              - { label: "High-throughput satellite (Wikipedia)", url: "https://en.wikipedia.org/wiki/High-throughput_satellite", kind: article }
