          - id: how-starlink-works
            title: How Starlink works (low Earth orbit)
            summary: "Thousands of small satellites about 550 km up, a dish that aims itself without moving, constant switching between satellites, and lasers linking them in space."
            learn:
              - "Why thousands of satellites are needed"
              - "How the flat dish aims without moving"
              - "The path from dish to internet, and lasers in space"
              - "Why you usually cannot run a server on Starlink"
            body: |
              Starlink, run by SpaceX, uses **low Earth orbit** satellites about 550 km up, with some lower. Each one crosses your sky in a few minutes, so to always have one in view the network needs thousands. By 2025 there were more than 7,000 in orbit, in several layers at different heights and angles, including orbits over the poles.

              ### The dish
              The Starlink dish has no motor to follow satellites. It is a **phased array**: hundreds of tiny antennas whose signals are timed so the beam points where it needs to, steered electronically in a blink. The network moves your dish to a different satellite about every 15 seconds, and you can sometimes see small jumps in delay at those moments.

              ### The path
              1. Dish to a satellite overhead
              2. Satellite to a nearby **gateway** ground station
              3. Gateway over fiber to a Starlink hub where traffic joins the internet

              Where no gateway is in range, such as mid-ocean, satellites pass traffic to each other with **lasers** in space until one can reach a gateway. Light in empty space is about 50% faster than in glass fiber, so on very long routes lasers can rival undersea cables.

              ### Addresses
              Most home Starlink users share a public address with many other customers. This is called **carrier-grade NAT**. It means you cannot easily host a server or let devices outside reach in. Starlink also gives out newer IPv6 addresses, which do reach you directly.

              ### Limits
              - Each satellite beam covers an area on the ground, and everyone there shares it. Busy areas slow at peak times, which is why Starlink limits signups or charges more in some regions
              - The dish needs a clear view of the sky. Trees and buildings cause short drops
              - Satellites last about five years before they are brought down, so the fleet must be replaced all the time
              - Astronomers report the satellites spoil telescope images

              ### Go deeper
              How shared addresses work is in [NAT](/roadmaps/networking/nat) on the Networking roadmap.
            resources:
              - { label: "Starlink technology (Starlink)", url: "https://www.starlink.com/technology", kind: docs }
              - { label: "Starlink (Wikipedia)", url: "https://en.wikipedia.org/wiki/Starlink", kind: article }
