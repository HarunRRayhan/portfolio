      - id: access-networks
        title: "The last mile: fiber, satellite, cable and mobile"
        summary: How your home actually connects to the internet. Fiber to the home, geostationary satellites like Viasat, low-orbit Starlink, and why fiber wins wherever it can be laid.
        lessons:
          - id: last-mile-overview
            title: The ways a home gets online
            summary: "Every connection ends with a \"last mile\" from your provider to your home. The main options, from old phone lines to satellites, and how they compare."
            learn:
              - "What the last mile is and why it is the costly part"
              - "Phone line, cable, fiber, wireless, mobile and satellite"
              - "Typical speed and delay of each"
            body: |
              The backbone of the internet is fiber: long cables on land and under the sea, data centres and meeting points between networks. The hard and costly part is the **last mile**: the link from your provider's nearest building to your home. There are millions of homes, and each needs its own path, like a driveway from the main road.

              | Access | Runs over | Typical download | Typical delay to the provider |
              |---|---|---|---|
              | **DSL** | old copper phone line | 10 to 100 Mbps, less if you live far away | 10 to 40 ms |
              | **Cable** | TV cable, shared per street | 100 Mbps to 1+ Gbps | 10 to 30 ms |
              | **Fiber to the home** | glass to your wall | 300 Mbps to 10 Gbps, upload often as fast | 1 to 10 ms |
              | **Fixed wireless / 5G home** | radio to a mast | 50 to 500 Mbps | 15 to 40 ms |
              | **Mobile 4G/5G** | radio, shared per cell | 20 to 500 Mbps | 20 to 60 ms |
              | **Low-orbit satellite** (Starlink) | satellites 550 km up | 50 to 250 Mbps | 25 to 60 ms |
              | **High-orbit satellite** (Viasat, HughesNet) | satellites 35,786 km up | 25 to 150 Mbps | 600 ms or more |

              Mbps (megabits per second) measures how much data arrives each second. ms (milliseconds, thousandths of a second) measures delay, called **latency**.

              ### Key ideas
              - Every option except satellite reaches fiber within a few kilometres of you. Even satellite traffic lands at a ground station and continues on fiber
              - Copper wire is limited by distance and electrical noise. Glass is not, over these distances
              - Radio options are shared by everyone nearby, so speed drops at busy times
              - Delay depends on distance, and no plan upgrade can change physics

              ### Why it matters
              Picking a connection is mostly picking delay, how much you share and how it can be upgraded later. The next lessons look at fiber and satellites in more detail.
