          - id: cable-docsis
            title: "How cable internet works"
            summary: "Cable internet uses the network built for cable TV. Fiber reaches your neighbourhood, then a shared TV cable runs to each home."
            learn:
              - "How fiber and TV cable work together"
              - "How cable has got faster over the years"
              - "Why upload is slow and busy evenings hurt"
              - "How providers add capacity to a crowded area"
            body: |
              Cable broadband runs on the network built for TV. Fiber runs from the cable company to a box in your area called a **node**. From there, copper TV cable (**coax**, the round cable with a screw-on plug) runs past a few hundred homes.

              A machine at the cable company talks to the **cable modem** in each home. The rules they follow are called **DOCSIS**. Data travels on the cable as radio channels, the same way TV channels do.

              | Version | Year | Top speed (down / up) |
              |---|---|---|
              | DOCSIS 3.0 | 2006 | about 1 Gbps / 200 Mbps |
              | DOCSIS 3.1 | 2013 | 10 Gbps / 1 to 2 Gbps |
              | DOCSIS 4.0 | 2020 | 10 Gbps / 6 Gbps |

              These are top speeds for the system. Your plan and your street decide what you actually get.

              ### Key ideas
              - **Shared with the street.** Everyone on the node shares the same capacity. At 9 pm, when the whole street streams video, each home gets less, like water pressure dropping when every house runs a tap
              - **Slow upload.** Only a small slice of the cable's channels is set aside for upload. So a 1 Gbps plan often uploads at just 35 to 50 Mbps
              - **Taking turns to send.** A modem must ask permission before it uploads, which adds a few milliseconds
              - Giving upload a bigger slice means changing equipment out in the street, not just your modem

              ### Adding capacity
              When a node gets full, the company runs fiber deeper and **splits** it into two or more nodes. Each now serves fewer homes, so each home gets a bigger share. Taken far enough, the node sits a few houses away and the network starts to look like fiber.

              ### Common mistakes
              - Buying a newer modem and expecting faster upload: the equipment in the street sets that
              - Blaming the shared node for slowness that really comes from weak home Wi-Fi
