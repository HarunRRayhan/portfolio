              - { label: "DOCSIS (Wikipedia)", url: "https://en.wikipedia.org/wiki/DOCSIS", kind: article }
              - { label: "Hybrid fiber-coaxial (Wikipedia)", url: "https://en.wikipedia.org/wiki/Hybrid_fiber-coaxial", kind: article }
              - { label: "Cable modem termination system (Wikipedia)", url: "https://en.wikipedia.org/wiki/Cable_modem_termination_system", kind: article }
              - { label: "Cable Internet access (Wikipedia)", url: "https://en.wikipedia.org/wiki/Cable_Internet_access", kind: article }
              - { label: "Orthogonal frequency-division multiplexing (Wikipedia)", url: "https://en.wikipedia.org/wiki/Orthogonal_frequency-division_multiplexing", kind: article }
              - { label: "How Cable Internet Really Works: DOCSIS 3.0, 3.1 and 4.0 (Telecom Training)", url: "https://www.youtube.com/watch?v=TB-GBvPmYkI", kind: video }
              - { label: "What is DOCSIS 4.0 technology? (CableLabs)", url: "https://www.youtube.com/watch?v=hyIEUs0A1js", kind: video }
              - { label: "How Cable Modems Work (Hill's Workbench)", url: "https://www.youtube.com/watch?v=1Y-MX2iZe14", kind: video }
          - id: dsl-vdsl
            title: "DSL and why distance matters"
            summary: "DSL sends internet over the old copper phone line, using sounds far too high to hear. The farther you live from the street cabinet, the slower it gets."
            learn:
              - "How DSL shares the phone line with voice"
              - "The main kinds of DSL, from older to faster"
              - "Why speed falls with distance"
              - "What \"fiber to the cabinet\" really means"
            body: |
              Phone calls use only low frequencies, the range of the human voice. **DSL** uses much higher frequencies on the same copper wire to carry data, so you can be online and on the phone at the same time.

              The far end is either in the telephone exchange or in a green street cabinet fed by fiber. That second setup is called **fiber to the cabinet**: fiber to the street box, and only the last stretch from the cabinet to you is copper.

              | Kind | Best case (down / up) | Works well up to |
              |---|---|---|
              | ADSL2+ | 24 / 1 Mbps | about 5 km |
              | VDSL2 | about 80 to 100 / 20 to 40 Mbps | about 1 km |
              | Faster VDSL2 versions | up to about 300 Mbps down | a few hundred metres |
              | G.fast | up to about 1 Gbps total | under about 300 m |

              ### Why distance kills speed
              Copper wire loses high frequencies faster than low ones. On a long line the high part of the signal fades away and carries nothing, so only the low, slow part is left. It is like shouting down a long corridor: the far end hears less and less. That is why fast DSL needs a cabinet nearby, while basic ADSL still works far from the exchange.

              ### Neighbouring lines
              Phone wires in the same cable leak into each other, a bit like hearing a neighbour's call faintly on your line. At high speeds this is the main limit. A technique called **vectoring** measures the leakage and cancels it out, so lines keep their speed.

              ### In practice
              Your router's settings page usually has a DSL section. It shows the line's real connection speed, often called **sync rate**. If that is far below your plan, distance or wiring is the likely reason.

              ### Common mistakes
              - "Up to 80 Mbps" applies to homes near the cabinet. Check the estimate for your exact address
              - Calling fiber to the cabinet "fiber broadband": the last part is still copper
            resources:
              - { label: "Digital subscriber line (Wikipedia)", url: "https://en.wikipedia.org/wiki/Digital_subscriber_line", kind: article }
              - { label: "VDSL (Wikipedia)", url: "https://en.wikipedia.org/wiki/VDSL", kind: article }
              - { label: "G.992.5, ADSL2+ (Wikipedia)", url: "https://en.wikipedia.org/wiki/G.992.5", kind: article }
              - { label: "G.fast (Wikipedia)", url: "https://en.wikipedia.org/wiki/G.fast", kind: article }
              - { label: "Crosstalk (Wikipedia)", url: "https://en.wikipedia.org/wiki/Crosstalk", kind: article }
              - { label: "Fiber to the x (Wikipedia)", url: "https://en.wikipedia.org/wiki/Fiber_to_the_x", kind: article }
              - { label: "How VDSL lines work (Telecom Training)", url: "https://www.youtube.com/watch?v=ieVvVLjrlWQ", kind: video }
              - { label: "How VDSL2 vectoring works (Telecom Training)", url: "https://www.youtube.com/watch?v=ZlmBqfH7u3E", kind: video }
          - id: mobile-4g-5g
            title: How mobile data works (4G and 5G)
            summary: "Your phone talks by radio to a nearby mast. From there, the operator's network is mostly cables. How 4G and 5G work, and what speeds and delays to expect."
            learn:
              - "Mast, backhaul and the operator's core network"
              - "What changed from 4G to 5G"
              - "Low, middle and very high radio bands"
              - "Real delay, and why you share an address"
            body: |
              A mobile network is mostly wires. Only the first few hundred metres to a few kilometres are radio.

              1. Your phone talks to a **base station**, the antennas on a mast or rooftop. Each covers a few areas called **cells**, and everyone in a cell shares its capacity
              2. **Backhaul**, usually fiber and sometimes a microwave radio link, connects the mast to the operator
              3. The operator's **core network** checks your SIM, keeps track of which cell you are in, hands you over as you move, gives you an IP address and connects you to the internet

              ### 4G and 5G
              - **4G** (LTE) launched in 2009 and is the base that 5G was built on
              - Early **5G**, from 2019, added new 5G radio but still leaned on the 4G network behind it
              - Full **5G** uses a new core network that can set up connections faster. It is still rolling out

              ### Radio bands
              | Band | Reaches | Typical speed |
              |---|---|---|
              | Low (600 to 900 MHz) | many km, inside buildings | tens of Mbps |
              | Middle (1.8 to 4.2 GHz) | 1 to 2 km | hundreds of Mbps |
              | Very high, called mmWave (26 to 39 GHz) | a few hundred metres, needs a clear line | 1 Gbps or more |

              mmWave is blocked by walls, trees and even a hand, so it lives mainly in stadiums and city centres. Most "5G" you use is the middle band.

              ### Delay in real life
              5G's famous 1 ms figure is a target for the radio part only. Real phone delays are usually 20 to 50 ms, because traffic also crosses the cables and the core, often to another city. A phone that has been idle must wake its radio first, which adds more.

              ### Shared addresses
              Most operators make thousands of phones share one public internet address, using **carrier-grade NAT**. That is why nothing on the internet can start a connection to your phone. Many operators also use the newer IPv6 addresses.

              ### Go deeper
              How shared addresses work is in [NAT](/roadmaps/networking/nat) on the Networking roadmap.
            resources:
              - { label: "LTE (Wikipedia)", url: "https://en.wikipedia.org/wiki/LTE_(telecommunication)", kind: article }
              - { label: "5G NR (Wikipedia)", url: "https://en.wikipedia.org/wiki/5G_NR", kind: article }
              - { label: "5G NR frequency bands (Wikipedia)", url: "https://en.wikipedia.org/wiki/5G_NR_frequency_bands", kind: article }
              - { label: "System Architecture Evolution, the LTE core (Wikipedia)", url: "https://en.wikipedia.org/wiki/System_Architecture_Evolution", kind: article }
              - { label: "5G System Overview (3GPP)", url: "https://www.3gpp.org/technologies/5g-system-overview", kind: docs }
              - { label: "Carrier-grade NAT (Wikipedia)", url: "https://en.wikipedia.org/wiki/Carrier-grade_NAT", kind: article }
              - { label: "RFC 6877: 464XLAT", url: "https://www.rfc-editor.org/rfc/rfc6877", kind: docs }
              - { label: "How Cell Towers Actually Work, base station tour (Wireless Future)", url: "https://www.youtube.com/watch?v=5DtwjQnNgiw", kind: video }
              - { label: "5G Technologies: Millimeter Waves Explained (IEEE Spectrum)", url: "https://www.youtube.com/watch?v=aacnhn8IcHI", kind: video }
          - id: fixed-wireless-5g-home
            title: Fixed wireless and 5G home internet vs fiber
            summary: "A box by your window or on your roof uses radio instead of a cable as your home internet. Quick to set up, but shared and less steady than fiber."
            learn:
              - "What fixed wireless is"
              - "5G home internet vs local rooftop radio providers"
              - "How it compares with fiber"
              - "Why where you put the box matters"
            body: |
              **Fixed wireless** brings broadband to a home over radio instead of a cable. There are two common kinds:

              - **5G or 4G home internet**: a router with a SIM card, indoors or on an outside wall, using the same masts as phones. Mobile operators sell it where they have spare capacity
              - **Local radio providers**: a small dish on the roof aimed at a nearby provider's mast. Common in the countryside

              ### Fiber vs 5G home
              | | Fiber to the home | 5G home internet |
              |---|---|---|
              | Setup | engineer visit, sometimes digging | plug in, same day |
              | Download | steady, often 1 Gbps or more | 50 to 500 Mbps, changes through the day |
              | Upload | often as fast as download | usually 10 to 50 Mbps |
              | Delay | 1 to 10 ms to the provider | 20 to 40 ms, and less steady |
              | Shared with | a few dozen homes, lots of room to spare | every phone and home in the cell |
              | Weather and walls | no effect | trees and walls matter, rain can too |
              | Your own public address | often | usually shared with others |

              ### Key ideas
              - Each cell has a fixed amount of capacity. Operators limit how many homes can sign up per cell, and many put phones first when a cell is busy
              - Where you put the box matters more than the plan. A box by an upstairs window facing the mast can be several times faster than one in a back room
              - Every mast is itself connected by fiber. Fixed wireless is a quick way to reach homes, not a replacement for the fiber behind it

              ### In practice
              The router's app or settings page usually shows signal bars or signal strength. Try the box in a few spots, note which gives the best signal, then run a speed test in a busy evening hour as well as in the morning.

              ### Common mistakes
              - Judging it by a midday speed test: evenings are what count
              - Expecting to host a game server or reach home cameras directly when your address is shared
            resources:
              - { label: "Fixed wireless (Wikipedia)", url: "https://en.wikipedia.org/wiki/Fixed_wireless", kind: article }
              - { label: "Wireless Internet service provider (Wikipedia)", url: "https://en.wikipedia.org/wiki/Wireless_Internet_service_provider", kind: article }
              - { label: "5G (Wikipedia)", url: "https://en.wikipedia.org/wiki/5G", kind: article }
              - { label: "5G NR frequency bands (Wikipedia)", url: "https://en.wikipedia.org/wiki/5G_NR_frequency_bands", kind: article }
              - { label: "Ookla research articles on fixed and mobile speeds", url: "https://www.ookla.com/articles", kind: article }
              - { label: "What Is FWA? Fixed Wireless Access Explained (globalnetworkhub)", url: "https://www.youtube.com/watch?v=0j9KvHNdr5U", kind: video }
              - { label: "Fiber vs. 5G Home Internet: Does the Difference Really Matter? (Michael Saves)", url: "https://www.youtube.com/watch?v=M48oVjk2Si4", kind: video }
              - { label: "5 Years of 5G Home Internet vs Cable and Fiber (Nater Tater)", url: "https://www.youtube.com/watch?v=hPdeDopr2ko", kind: video }
          - id: starlink-laser-links
            title: "Lasers between satellites"
            optional: true
            summary: "Starlink satellites pass traffic to each other with lasers. Why that helps over oceans, why it is tricky, and when space can beat undersea cables."
            learn:
              - "What the lasers between satellites do"
              - "Why routing through a moving swarm is hard"
              - "Light in space vs light in glass"
              - "How Starlink uses lasers today"
            body: |
              Early Starlink satellites worked like mirrors: up from your dish, straight down to a ground station in range. Lasers between satellites began flying in 2021. Now each satellite carries a few laser units and links to its neighbours, so traffic can hop across several satellites before it comes down.

              ### Why it matters
              - **Coverage**: ships, aircraft, oceans and polar regions have no ground station below them. Lasers carry their traffic to one that does
              - **Fewer ground stations**: one site can serve a much larger area
              - **Speed of light**: light in space covers about 300 km per millisecond, in glass fiber about 200 km

              ### Steering through a moving swarm
              Satellites in the same orbit keep steady links to the ones ahead and behind. Links to satellites in other orbits keep changing as paths cross, and every satellite moves at about 27,000 km/h. A laser must find and lock onto a tiny moving target, which takes time, so links cannot be rebuilt instantly. Routes have to be worked out again and again from the known orbits. SpaceX has not published how it does this. Research such as Mark Handley's 2018 study works out routes from the predictable positions of the satellites.

              ### When space beats fiber
              London to New York is about 5,570 km in a straight line over the globe.

              | Path | One way | Round trip |
              |---|---|---|
              | Perfect straight fiber | about 28 ms | about 56 ms |
              | Real undersea routes | longer cables, plus equipment | usually 65 to 75 ms |
              | Lasers at 550 km | about 24 ms | about 48 ms at best |

              Going up to the satellites and back down costs about 7 ms per round trip, so over short distances fiber wins. With these numbers, space pulls ahead beyond roughly 2,700 km, before the zig-zags between orbits eat into the gain.

              ### What happens today
              Starlink traffic still lands at a ground station and joins the internet, usually in the user's region. Lasers are used mainly to reach places with no ground station, not to beat undersea cables between continents.
            resources:
              - { label: "Laser communication in space (Wikipedia)", url: "https://en.wikipedia.org/wiki/Laser_communication_in_space", kind: article }
              - { label: "Free-space optical communication (Wikipedia)", url: "https://en.wikipedia.org/wiki/Free-space_optical_communication", kind: article }
              - { label: "Starlink technology (Starlink)", url: "https://www.starlink.com/technology", kind: docs }
              - { label: "Reliable Low-Delay Routing in Space with Routing-Oblivious LEO Satellites (arXiv)", url: "https://arxiv.org/abs/2401.11490", kind: article }
              - { label: "Measuring a Low-Earth-Orbit Satellite Network (arXiv)", url: "https://arxiv.org/abs/2307.06863", kind: article }
              - { label: "A Cool Simulation of SpaceX's Revised Satellite Broadband Plan (CircleID)", url: "https://circleid.com/posts/20181128_a_cool_simulation_of_spacexs_revised_satellite_broadband_plan", kind: article }
              - { label: "Submarine communications cable (Wikipedia)", url: "https://en.wikipedia.org/wiki/Submarine_communications_cable", kind: article }
              - { label: "Using ground relays with Starlink (Mark Handley)", url: "https://www.youtube.com/watch?v=m05abdGSOxY", kind: video }
              - { label: "Laser Inter-Satellite Links in a Starlink Constellation (Punyaslok Swain)", url: "https://www.youtube.com/watch?v=rNCknogpDKM", kind: video }

      - id: ip-addresses
        title: IP addresses
        summary: Every device on a network needs an address so packets know where to go. Two versions are in use, IPv4 and IPv6.
        lessons:
          - id: what-is-an-ip-address
            title: What an IP address is
            summary: "An IP address is the address a device uses on a network, so data can find it the way a letter finds a house."
            learn:
              - "What an IP address is for"
              - "How it differs from a device's hardware ID and a website name"
              - "Why there are two kinds, IPv4 and IPv6"
            body: |
              Every device that talks on the internet, your phone, laptop or a website's server, needs an **IP address**. It works like a street address on an envelope: it says where to deliver the data, not who lives there.

              Three kinds of names are easy to mix up:

              | Name | What it is | Example |
              |---|---|---|
              | **MAC address** | A fixed ID built into a network card. Only used inside your local network | Printed on your router's label |
              | **IP address** | Where a device is on a network. It can change when you move | `93.184.216.34` |
              | **Domain name** | A human-friendly name for a website | `harun.dev` |

              When you type a domain name, a service called **DNS** (the internet's phone book) looks up its IP address first. Then your device sends data to that address.

              ### Key ideas
              - IP addresses let data travel across many networks to the right place
              - Your phone gets a different IP address at home, at work and in a cafe
              - **IPv4** is the older, shorter kind of address, and the world has nearly run out
              - **IPv6** is the newer, much longer kind that fixes the shortage
              - Both kinds are in use side by side today

              ### Example
              `93.184.216.34` is an IPv4 address. `2606:2800:220:1:248:1893:25c8:1946` is an IPv6 address. A website can have one of each.

              ### In practice
              Open your Wi-Fi settings and look for "IP address". That is the address your device has on your home network right now.
            resources:
              - { label: "Internet Protocol (Cloudflare)", url: "https://www.cloudflare.com/learning/network-layer/internet-protocol/", kind: article }
              - { label: "IP address (Wikipedia)", url: "https://en.wikipedia.org/wiki/IP_address", kind: article }
              - { label: "IP address, IPv4 vs IPv6 tutorial (PowerCert)", url: "https://www.youtube.com/watch?v=ThdO9beHhpA", kind: video }
              - { label: "What is an IP address? (NetworkChuck)", url: "https://www.youtube.com/watch?v=5WfiTHiU4x8", kind: video }
              - { label: "IP addresses explained (WhiteboardDoodles)", url: "https://www.youtube.com/watch?v=zZ02fvBXNAI", kind: video }
              - { label: "What is an IP address? (Cloudflare)", url: "https://www.cloudflare.com/learning/dns/glossary/what-is-my-ip-address/", kind: article }
              - { label: "What is an IP address? (MDN glossary)", url: "https://developer.mozilla.org/en-US/docs/Glossary/IP_Address", kind: docs }
              - { label: "Check your public IP (icanhazip)", url: "https://icanhazip.com/", kind: tool }
          - id: public-vs-private-ip
            title: Public vs private addresses
            summary: "Some addresses only work inside your home or office network. Others can be reached from anywhere on the internet."
            learn:
              - "What public and private addresses are"
              - "Why your laptop's address differs from the one websites see"
              - "How many devices share one public address"
            body: |
              A **public** address is unique in the whole world and can be reached from anywhere on the internet. A **private** address works only inside one network, like a room number inside a building. Millions of homes reuse the same private addresses at the same time, and that is fine because they never leave the building.

              Your home router has one public address from your internet provider. Every device at home gets a private address. When your laptop visits a website, the router swaps the private address for its public one on the way out, and swaps it back on the way in. This trick is called **NAT** (network address translation).

              ### Key ideas
              - Public: unique worldwide, reachable from the internet
              - Private: reused everywhere, never sent out onto the public internet
              - The address in your Wi-Fi settings is usually private
              - Websites see your router's public address, not your laptop's
              - Common private addresses start with `192.168.`, `10.` or `172.16.` to `172.31.`

              ### Example
              Your laptop shows `192.168.1.20` in its settings. Your neighbour's laptop may show exactly the same address. But a website sees each of you by your own router's public address.

              ### In practice
              Compare the IP address in your Wi-Fi settings with the one shown when you search "what is my IP". They will almost always be different.

              ### Common mistakes
              - Thinking the address in your settings is the one the world sees
              - Thinking a private address is "secret". It is just not reachable from outside

              ### Go deeper
              How NAT works in detail is in [NAT](/roadmaps/networking/nat) on the Networking roadmap.
            resources:
              - { label: "What is my IP address? (Cloudflare)", url: "https://www.cloudflare.com/learning/dns/glossary/what-is-my-ip-address/", kind: article }
              - { label: "Reserved IP addresses (Wikipedia)", url: "https://en.wikipedia.org/wiki/Reserved_IP_addresses", kind: article }
              - { label: "Private network (Wikipedia)", url: "https://en.wikipedia.org/wiki/Private_network", kind: article }
              - { label: "Public vs private IP address (PowerCert)", url: "https://www.youtube.com/watch?v=po8ZFG0Xc4Q", kind: video }
              - { label: "NAT explained (PowerCert)", url: "https://www.youtube.com/watch?v=FTUV0t6JaDA", kind: video }
              - { label: "Network address translation (Computerphile)", url: "https://www.youtube.com/watch?v=01ajHxPLxAw", kind: video }
              - { label: "RFC 1918: Address allocation for private internets", url: "https://www.rfc-editor.org/rfc/rfc1918", kind: docs }
              - { label: "Network address translation (Wikipedia)", url: "https://en.wikipedia.org/wiki/Network_address_translation", kind: article }
          - id: dhcp
            title: How your device gets an address (DHCP)
            summary: "When you join a Wi-Fi network, a service called DHCP automatically gives your device an address and the other settings it needs."
            learn:
              - "Why a new device needs to be given an address"
              - "The short four-step exchange that hands it out"
              - "Why addresses are lent, not given forever"
              - "What else your device receives along with the address"
            body: |
              When your phone joins a Wi-Fi network, it has no address yet. **DHCP** (Dynamic Host Configuration Protocol) fixes that. A DHCP server, usually built into your home router, hands out addresses automatically, like a hotel front desk handing out room keys.

              The exchange takes four quick messages, often remembered as **DORA**:
              1. **Discover**: the device shouts to the whole network, "Is there a DHCP server here?"
              2. **Offer**: the server replies, "You can have this address"
              3. **Request**: the device says, "Yes, I'd like that one"
              4. **Acknowledge**: the server confirms, "It's yours"

              All of this happens in well under a second, while your Wi-Fi icon is still connecting.

              ### Key ideas
              - The address is a **lease**: it is lent for a while, and the device renews it before it runs out
              - DHCP also tells the device where the router is and which DNS servers to use
              - Your router can give the same device the same address every time (a reservation), handy for a printer
              - With IPv6, devices can also build their own address without asking anyone

              ### Example
              You walk into a cafe and join its Wi-Fi. In a moment your phone has an address, knows the cafe's router and can look up websites. When you leave, the lease eventually expires and the address goes back to the pool.

              ### In practice
              Open your Wi-Fi settings and find your IP address and "router". Your router's admin page often lists every device it has handed an address to.

              ### Go deeper
              How IPv6 devices set up their own address is in [IPv6 in depth](/roadmaps/networking/ipv6-in-depth) on the Networking roadmap.
            resources:
              - { label: "Dynamic Host Configuration Protocol (Wikipedia)", url: "https://en.wikipedia.org/wiki/Dynamic_Host_Configuration_Protocol", kind: article }
              - { label: "RFC 2131: DHCP", url: "https://www.rfc-editor.org/rfc/rfc2131", kind: docs }
              - { label: "RFC 2132: DHCP Options and BOOTP Vendor Extensions", url: "https://www.rfc-editor.org/rfc/rfc2132", kind: docs }
              - { label: "DHCP explained (PowerCert)", url: "https://www.youtube.com/watch?v=e6-TaH5bkjo", kind: video }
              - { label: "DHCP explained step by step (CertBros)", url: "https://www.youtube.com/watch?v=S43CFcpOZSI", kind: video }
              - { label: "What happens when DHCP fails? APIPA (PowerCert)", url: "https://www.youtube.com/watch?v=0tEjUR6tjBU", kind: video }
              - { label: "What is DHCP? (Microsoft Learn)", url: "https://learn.microsoft.com/en-us/windows-server/networking/technologies/dhcp/dhcp-top", kind: docs }
              - { label: "IANA BOOTP and DHCP parameters registry", url: "https://www.iana.org/assignments/bootp-dhcp-parameters/bootp-dhcp-parameters.xhtml", kind: docs }
              - { label: "RFC 8415: DHCPv6", url: "https://www.rfc-editor.org/rfc/rfc8415", kind: docs }

      - id: ipv4
        title: IPv4
        summary: "IPv4 is the original style of internet address, four numbers like 192.168.1.10, and the world has used up nearly all of them."
        lessons:
          - id: ipv4-format
            title: The IPv4 address format
            summary: "An IPv4 address is four numbers from 0 to 255 separated by dots, which allows about 4.3 billion addresses in total."
            learn:
              - "How to read an address like 192.168.1.10"
              - "Why each number stops at 255"
              - "How many IPv4 addresses exist"
            body: |
              An IPv4 address is written as four numbers separated by dots, like `192.168.1.10`. Each number is between 0 and 255. This style is called **dotted decimal**.

              Why 255? Inside the computer each of the four parts has room for exactly 256 values, 0 to 255. Four parts together allow about **4.3 billion** different addresses.

              Like a phone number with an area code, the first part of an address names the network and the rest names one device on it.

              ### Key ideas
              - Four numbers, each from 0 to 255, separated by dots
              - About 4.3 billion possible addresses in total
              - The first part names the network, the rest names the device
              - Many addresses are set aside for special uses, so fewer are usable on the public internet

              ### Example
              `192.168.1.10` is a valid address. `192.168.1.300` is not, because 300 is bigger than 255.

              4.3 billion sounded huge when IPv4 was designed in the early 1980s. Today there are more phones, laptops, TVs and smart devices than that, which is why IPv4 ran short.

              ### Go deeper
              The technical detail, including how addresses look to the computer, is in [IPv4 in depth](/roadmaps/networking/ipv4-in-depth) on the Networking roadmap.
            resources:
              - { label: "Internet Protocol (Cloudflare)", url: "https://www.cloudflare.com/learning/network-layer/internet-protocol/", kind: article }
              - { label: "RFC 791: Internet Protocol", url: "https://www.rfc-editor.org/rfc/rfc791", kind: docs }
              - { label: "Internet Protocol version 4 (Wikipedia)", url: "https://en.wikipedia.org/wiki/Internet_Protocol_version_4", kind: article }
              - { label: "Binary explained for IPv4 (CertBros)", url: "https://www.youtube.com/watch?v=EDAnsWpOjGM", kind: video }
              - { label: "IPv4 address, part 1 (Neso Academy)", url: "https://www.youtube.com/watch?v=phOlq9SuscM", kind: video }
              - { label: "IPv4 header, Free CCNA day 10 (Jeremy's IT Lab)", url: "https://www.youtube.com/watch?v=aQB22y4liXA", kind: video }
              - { label: "IP subnet calculator (subnet-calculator.com)", url: "https://www.subnet-calculator.com/", kind: tool }
              - { label: "Subnetting mastery and binary (Practical Networking)", url: "https://www.practicalnetworking.net/stand-alone/subnetting-mastery/", kind: course }
              - { label: "ipcalc online calculator (jodies.de)", url: "https://jodies.de/ipcalc", kind: tool }
          - id: ipv4-delivery-types
            title: "One receiver, many receivers or the nearest one"
            summary: "A message can go to one device, to every device nearby, to a group that signed up, or to whichever copy of a server is closest."
            learn:
              - "The four ways a message can be delivered"
              - "Everyday examples of each"
              - "Why who receives a message is a different question from public or private"
            body: |
              An address answers two different questions. **How far can it reach?** That is public or private. **Who receives the message?** That is the delivery type. There are four.

              | Type | Who receives it | Like... | Everyday example |
              |---|---|---|---|
              | **Unicast** | Exactly one device | A letter to one house | Loading a web page |
              | **Broadcast** | Every device on your local network | Shouting in a room | A new phone asking "is there a DHCP server here?" |
              | **Multicast** | Only devices that joined a group | A radio station people tune into | Live TV over the internet, a printer announcing itself |
              | **Anycast** | The nearest of many identical servers | Calling a chain's one number and reaching the closest branch | Public DNS services like `1.1.1.1` |

              ### Key ideas
              - Almost all everyday traffic is unicast
              - Broadcast never leaves your local network
              - Multicast saves effort: one stream reaches many viewers who asked for it
              - Anycast makes big services fast, since your request goes to a nearby copy
              - The newer IPv6 drops broadcast and uses multicast for those jobs instead

              ### Example
              You open your laptop at home. It shouts a broadcast to find the router. Your printer announces itself with multicast. Your browser looks up `harun.dev` from a public DNS service, probably reached by anycast, then loads the page by unicast.

              ### Go deeper
              The address ranges behind each type are in [IPv4 in depth](/roadmaps/networking/ipv4-in-depth) on the Networking roadmap.
            resources:
              - { label: "What is anycast? (Cloudflare)", url: "https://www.cloudflare.com/learning/cdn/glossary/anycast-network/", kind: article }
              - { label: "Unicast (Wikipedia)", url: "https://en.wikipedia.org/wiki/Unicast", kind: article }
              - { label: "Routing schemes (Wikipedia)", url: "https://en.wikipedia.org/wiki/Routing#Delivery_schemes", kind: article }
              - { label: "Multicast address (Wikipedia)", url: "https://en.wikipedia.org/wiki/Multicast_address", kind: article }
              - { label: "Every transmission type in 5 minutes: unicast, broadcast, multicast, anycast (Packetbrew)", url: "https://www.youtube.com/watch?v=5hp8r9uZlpE", kind: video }
              - { label: "IPv4 unicast, multicast and broadcast (Neso Academy)", url: "https://www.youtube.com/watch?v=aDdArElVJvQ", kind: video }
              - { label: "Unicast, multicast, broadcast and anycast (Tariq Abosallout)", url: "https://www.youtube.com/watch?v=xr1u3LUwcek", kind: video }
              - { label: "RFC 4786: Operation of anycast services", url: "https://www.rfc-editor.org/rfc/rfc4786", kind: docs }
              - { label: "Anycast (Wikipedia)", url: "https://en.wikipedia.org/wiki/Anycast", kind: article }
              - { label: "Broadcast address (Wikipedia)", url: "https://en.wikipedia.org/wiki/Broadcast_address", kind: article }
          - id: ipv4-exhaustion
            title: Running out of IPv4
            summary: "The last free IPv4 addresses were handed out in 2011. Address sharing and buying addresses keep IPv4 going while the world moves to IPv6."
            learn:
              - "Why 4.3 billion addresses was not enough"
              - "How homes and internet providers share addresses"
              - "Why IPv4 addresses now cost money"
            body: |
              IPv4 has about 4.3 billion addresses. That is fewer than one per person on Earth, and many people own a phone, a laptop, a TV and more. The central pool of free addresses ran out in **2011**, and the regional pools that hand them out followed over the next years.

              The internet kept growing thanks to workarounds, like sharing one phone line among a whole office.

              ### Key ideas
              - **NAT** lets every device in a home or office share one public address
              - **Carrier-grade NAT** goes further: your internet provider shares one public address among many customers
              - Sharing works, but makes it harder for anyone outside to connect in, for example to a home camera or game server
              - IPv4 addresses are now bought, sold and rented, and priced per address
              - Cloud providers now charge for public IPv4 addresses too
              - **IPv6** is the real fix, but switching the whole internet takes years

              ### Example
              With carrier-grade NAT, many customers of the same internet provider can share one public address. Websites see all of them coming from the same place.

              ### Why it matters
              IPv4 keeps getting more expensive and more complicated. More and more services are built for IPv6 first, and most networks run both for now.

              ### Go deeper
              How NAT works is in [NAT](/roadmaps/networking/nat), and the IPv4 detail is in [IPv4 in depth](/roadmaps/networking/ipv4-in-depth), both on the Networking roadmap.
            resources:
              - { label: "IPv4 address exhaustion (Wikipedia)", url: "https://en.wikipedia.org/wiki/IPv4_address_exhaustion", kind: article }
              - { label: "Carrier-grade NAT (Wikipedia)", url: "https://en.wikipedia.org/wiki/Carrier-grade_NAT", kind: article }
              - { label: "Regional Internet registry (Wikipedia)", url: "https://en.wikipedia.org/wiki/Regional_Internet_registry", kind: article }
              - { label: "IPv4 address report, live exhaustion stats (Geoff Huston)", url: "https://ipv4.potaroo.net/", kind: tool }
              - { label: "IANA IPv4 address space registry", url: "https://www.iana.org/assignments/ipv4-address-space/ipv4-address-space.xhtml", kind: docs }
              - { label: "RIPE NCC IPv4 exhaustion", url: "https://www.ripe.net/manage-ips-and-asns/ipv4/ipv4-run-out/", kind: article }
              - { label: "NAT explained (PowerCert)", url: "https://www.youtube.com/watch?v=FTUV0t6JaDA", kind: video }
              - { label: "Google IPv6 adoption statistics", url: "https://www.google.com/intl/en/ipv6/statistics.html", kind: tool }
              - { label: "RFC 6598: shared address space for CGNAT", url: "https://www.rfc-editor.org/rfc/rfc6598", kind: docs }

      - id: ipv6-basics
        title: IPv6
        summary: "IPv6 is the newer, much longer style of internet address, built so the world never runs out again."
        lessons:
          - id: ipv6-addresses
            title: "What an IPv6 address looks like"
            summary: "IPv6 addresses are much longer, written as groups of numbers and letters separated by colons, so the world will not run out again."
            learn:
              - "How to recognise an IPv6 address"
              - "Why it is so long"
              - "How long addresses get written shorter"
              - "Whether your own device has one"
            body: |
              IPv4 ran out of addresses, so engineers designed **IPv6** with far more. An IPv6 address is written as eight groups of characters separated by colons. Each character is a digit or a letter from a to f.

              Full length, an address looks like this:

              `2001:0db8:0000:0000:0000:0000:0000:0001`

              That is a mouthful, so there is a short way to write it. Leading zeros in a group can be dropped, and one long stretch of zero groups can be replaced with `::`. The address above becomes simply `2001:db8::1`.

              ### Key ideas
              - IPv6 has so many addresses that every device on Earth could have billions of its own
              - Colons instead of dots, and letters a to f as well as digits
              - `::` means "a run of zeros goes here", and can appear only once in an address
              - The first part of an address names the network, just as in IPv4
              - Your phone may already use IPv6 without you noticing

              ### Example
              `::1` is the IPv6 way for a computer to say "myself", the same job `127.0.0.1` does in IPv4.

              ### In practice
              Search "test IPv6" and open one of the free test sites. It tells you whether your connection already uses IPv6.

              ### Go deeper
              The full format and rules are in [IPv6 in depth](/roadmaps/networking/ipv6-in-depth) on the Networking roadmap.
            resources:
              - { label: "IPv6 (Wikipedia)", url: "https://en.wikipedia.org/wiki/IPv6", kind: article }
              - { label: "RFC 4291: IPv6 addressing", url: "https://www.rfc-editor.org/rfc/rfc4291", kind: docs }
              - { label: "RFC 8200: Internet Protocol, Version 6 (IPv6) Specification", url: "https://www.rfc-editor.org/rfc/rfc8200", kind: docs }
              - { label: "IPv6 addresses explained (CertBros)", url: "https://www.youtube.com/watch?v=irhS0ASkvy8", kind: video }
              - { label: "IPv6 from scratch, the very basics (OneMarcFifty)", url: "https://www.youtube.com/watch?v=oItwDXraK1M", kind: video }
              - { label: "RFC 5952: Recommendation for IPv6 address text representation", url: "https://www.rfc-editor.org/rfc/rfc5952", kind: docs }
              - { label: "IPv6 subnet calculator (subnetonline)", url: "https://www.subnetonline.com/pages/subnet-calculators/ipv6-subnet-calculator.php", kind: tool }
              - { label: "Google IPv6 adoption statistics", url: "https://www.google.com/intl/en/ipv6/statistics.html", kind: tool }
              - { label: "Test your IPv6 connectivity (test-ipv6.com)", url: "https://test-ipv6.com/", kind: tool }
          - id: ipv6-address-types
            title: IPv6 address types
            summary: "IPv6 has public addresses, addresses that only work nearby, private ones for inside a company, and group addresses. The start of an address tells you which."
            learn:
              - "Public and private IPv6 addresses"
              - "Addresses that only work on your local network"
              - "Why IPv6 has no 'shout to everyone' broadcast"
              - "Why one device often has several IPv6 addresses"
            body: |
              IPv6 addresses come in a few kinds, each for a different job. You can usually tell the kind from how the address starts.

              | Kind | Starts with | What it is for |
              |---|---|---|
              | **Global** | `2` or `3` | Public, reachable across the internet, like a public IPv4 address |
              | **Link-local** | `fe80` | Only works on your local network. Every IPv6 device has one |
              | **Unique local** | `fd` | Private, for use inside a home or company |
              | **Loopback** | `::1` | The device talking to itself |
              | **Multicast** | `ff` | One message to a group of devices |

              ### Key ideas
              - A single device usually has several IPv6 addresses at once, one for each job
              - Link-local addresses let devices on the same network find each other and the router
              - IPv6 has **no broadcast**. Instead of shouting to everyone, it sends to a group that the right devices listen to
              - The start of an address tells you how far it can reach

              ### Example
              A laptop on a home network may have a link-local `fe80:...` address for local chat, a global `2001:...` address from the internet provider, and an extra temporary global address it uses for visiting websites, which helps privacy.

              ### Go deeper
              The full list of address blocks and how devices find each other is in [IPv6 in depth](/roadmaps/networking/ipv6-in-depth) on the Networking roadmap.
            resources:
              - { label: "IPv6 address (Wikipedia)", url: "https://en.wikipedia.org/wiki/IPv6_address", kind: article }
              - { label: "RFC 4291: IPv6 addressing", url: "https://www.rfc-editor.org/rfc/rfc4291", kind: docs }
              - { label: "RFC 4193: Unique Local IPv6 Unicast Addresses", url: "https://www.rfc-editor.org/rfc/rfc4193", kind: docs }
              - { label: "IPv6 Special-Purpose Address Space (IANA)", url: "https://www.iana.org/assignments/iana-ipv6-special-registry/iana-ipv6-special-registry.xhtml", kind: docs }
              - { label: "IPv6 address types: unicast, multicast, anycast, link local (Networking with H)", url: "https://www.youtube.com/watch?v=LU9Dz6WF40A", kind: video }
              - { label: "IPv6 unique local addresses (Wendell Odom)", url: "https://www.youtube.com/watch?v=LOHq7XBnhbk", kind: video }
              - { label: "IPv6 link-local address (Rick Graziani)", url: "https://www.youtube.com/watch?v=Ln7D-irXnX0", kind: video }
              - { label: "RFC 4007: IPv6 scoped address architecture", url: "https://www.rfc-editor.org/rfc/rfc4007", kind: docs }
              - { label: "Unique local address (Wikipedia)", url: "https://en.wikipedia.org/wiki/Unique_local_address", kind: article }
              - { label: "IANA IPv6 address space registry", url: "https://www.iana.org/assignments/ipv6-address-space/ipv6-address-space.xhtml", kind: docs }

      - id: packets
        title: Packets
        summary: Data travels in small chunks with a header that says where each chunk is going.
        lessons:
          - id: why-packets
            title: Why data is split into packets
            summary: "Data on the internet is cut into small pieces called packets. That lets millions of people share the same cables, and lets a lost piece be resent on its own."
            learn:
              - "What a packet is"
              - "Why the internet does not reserve a line for each conversation"
              - "Why packets can arrive out of order and still work"
            body: |
              Everything you send on the internet, a photo, a message, a video call, is cut into small pieces called **packets**. Each packet carries a label with its destination and travels on its own, like a book posted as a stack of numbered postcards.

              Old phone networks worked differently. A call reserved a whole line from end to end, and that line sat idle whenever nobody spoke. This is **circuit switching**. The internet uses **packet switching**: packets from many people share the same cables, filling the gaps, which is far more efficient.

              ### Key ideas
              - Many people share one cable, because packets from different conversations take turns
              - Each packet finds its own way, so pieces of one message can take different routes
              - Packets may arrive out of order, and the receiving device puts them back in order
              - If one packet is lost, only that piece is sent again, not the whole file
              - One big download does not block everyone else on the line

              ### Example
              A 5 MB photo becomes a few thousand packets of about 1,500 bytes each. If three go missing on the way, only those three are resent, and you never notice.

              ### Why it matters
              Packets are why a video call stutters instead of hanging up when the network is busy: a few pieces arrive late, but the call carries on.
            resources:
              - { label: "What is a packet? (Cloudflare)", url: "https://www.cloudflare.com/learning/network-layer/what-is-a-packet/", kind: article }
              - { label: "Packet switching (Wikipedia)", url: "https://en.wikipedia.org/wiki/Packet_switching", kind: article }
              - { label: "Circuit switching vs packet switching (PowerCert)", url: "https://www.youtube.com/watch?v=G7n8thqwO2c", kind: video }
              - { label: "The internet: packets, routing and reliability (CodeAI)", url: "https://www.youtube.com/watch?v=AYdF7b3nMto", kind: video }
              - { label: "Building blocks of TCP (High Performance Browser Networking)", url: "https://hpbn.co/building-blocks-of-tcp/", kind: article }
              - { label: "Circuit switching (Wikipedia)", url: "https://en.wikipedia.org/wiki/Circuit_switching", kind: article }
          - id: headers-and-payload
            title: "The label and the contents of a packet"
            summary: "Each packet has a label (the header) that says where it is going, and the contents (the payload) it carries. Data is wrapped in several labels, like envelopes inside envelopes."
            learn:
              - "The difference between the header and the payload"
              - "Why data gets wrapped several times"
              - "How packets avoid circling the internet forever"
            body: |
              A packet has two parts. The **header** is the label: who it is from, where it is going and a few handling notes. The **payload** is the contents: a slice of your photo, email or web page.

              Data is wrapped more than once on its way out, like a letter put in an envelope, then in a courier bag, then in a mail sack. Each wrapping adds its own label for a different job. This is called **encapsulation**. The receiving device unwraps the layers in reverse order.

              ### Key ideas
              - The outer label carries the sender's and receiver's IP addresses, so routers can deliver it
              - Another label says which program on the device it is for, and keeps the pieces in order
              - Each label is used by a different part of the network, and the others ignore it
              - Every packet carries a hop counter called **TTL** (time to live). Each router it passes takes one off, and at zero the packet is thrown away, so a lost packet cannot circle the internet forever

              ### Example
              When you load a web page, the page request is wrapped with a label for your browser's connection, then with an IP label carrying the addresses, then with a label for the hop across your Wi-Fi to the router. At the router the last wrapping is replaced for the next hop, but the IP label travels all the way.

              ### Go deeper
              Seeing real headers with capture tools is covered in [Packet capture](/roadmaps/networking/packet-capture) on the Networking roadmap.
            resources:
              - { label: "What is a packet? (Cloudflare)", url: "https://www.cloudflare.com/learning/network-layer/what-is-a-packet/", kind: article }
              - { label: "Wireshark (packet capture tool)", url: "https://www.wireshark.org/", kind: tool }
              - { label: "Time to live (Wikipedia)", url: "https://en.wikipedia.org/wiki/Time_to_live", kind: article }
              - { label: "Encapsulation (networking) (Wikipedia)", url: "https://en.wikipedia.org/wiki/Encapsulation_(networking)", kind: article }
              - { label: "IPv4 header, Free CCNA day 10 (Jeremy's IT Lab)", url: "https://www.youtube.com/watch?v=aQB22y4liXA", kind: video }
              - { label: "Network fundamentals: IPv4 packet header (TechKnowSurge)", url: "https://www.youtube.com/watch?v=IozUoCVbLeI", kind: video }
              - { label: "Wireshark user's guide (Wireshark)", url: "https://www.wireshark.org/docs/wsug_html_chunked/", kind: docs }
              - { label: "IPv4 header (Wikipedia)", url: "https://en.wikipedia.org/wiki/Internet_Protocol_version_4#Header", kind: article }
              - { label: "Wireshark sample captures (Wireshark wiki)", url: "https://wiki.wireshark.org/SampleCaptures", kind: tool }
              - { label: "Network layers model (Computerphile)", url: "https://www.youtube.com/watch?v=eelvWAURfdI", kind: video }

      - id: ports
        title: Ports
        summary: One address, many programs. Ports tell the machine which program a packet is for.
        lessons:
          - id: well-known-ports
            title: Well-known ports
            summary: "One computer runs many programs, and a port number says which program a message is for. A few standard numbers come up all the time."
            learn:
              - "What a port is"
              - "The standard ports for websites"
              - "A few other common services and their numbers"
              - "Why standard numbers save guesswork"
            body: |
              A computer runs many programs at once. When a message arrives, how does it know which program it is for? By a **port** number. If the IP address is the street address of an office building, the port is the room number inside it.

              Ports go from 0 to 65535. The lower numbers, up to 1023, are **well-known ports**, set aside for standard services. A few appear everywhere.

              | Port | Service |
              |---|---|
              | **80** | Websites without encryption (HTTP) |
              | **443** | Secure websites (HTTPS, the padlock) |
              | **53** | DNS, the internet's phone book |
              | **22** | SSH, remote login for administrators |

              Databases have their own usual numbers too, such as 5432 for PostgreSQL and 3306 for MySQL.

              ### Key ideas
              - The IP address finds the machine, the port finds the program
              - A service can run on any port, but standard numbers mean nobody has to guess
              - Your browser uses port 443 for secure sites without you typing it

              ### Example
              Opening `https://harun.dev` quietly connects to port 443. A link like `https://harun.dev:8443` points at a different room in the same building, and a different program may answer there.
            resources:
              - { label: "What is a computer port? (Cloudflare)", url: "https://www.cloudflare.com/learning/network-layer/what-is-a-computer-port/", kind: article }
              - { label: "List of TCP and UDP port numbers (Wikipedia)", url: "https://en.wikipedia.org/wiki/List_of_TCP_and_UDP_port_numbers", kind: article }
              - { label: "Service Name and Transport Protocol Port Number Registry (IANA)", url: "https://www.iana.org/assignments/service-names-port-numbers/service-names-port-numbers.xhtml", kind: docs }
              - { label: "Network ports explained (PowerCert)", url: "https://www.youtube.com/watch?v=g2fT-g9PX9o", kind: video }
              - { label: "Common TCP and UDP ports (Professor Messer)", url: "https://www.youtube.com/watch?v=MTPTow2PTfY", kind: video }
              - { label: "TCP vs UDP comparison (PowerCert)", url: "https://www.youtube.com/watch?v=uwoD5YsGACg", kind: video }
              - { label: "RFC 6335: IANA procedures for port numbers", url: "https://www.rfc-editor.org/rfc/rfc6335", kind: docs }
              - { label: "Port (computer networking) (Wikipedia)", url: "https://en.wikipedia.org/wiki/Port_(computer_networking)", kind: article }
          - id: source-and-destination-ports
            title: "Ports on both ends of a connection"
            summary: "Every connection has a port at each end. The server uses a fixed, well-known one, and your device picks a temporary one so replies come back to the right place."
            learn:
              - "Why both sides of a connection have a port"
              - "Why your device picks temporary port numbers"
              - "How the server tells many connections apart"
            body: |
              Every message carries two port numbers. The **destination port** says which program on the server it is for, for example 443 for a secure website. The **source port** says which program on your device sent it, so the reply comes back to the right place.

              The server's port is fixed and well known. Your device's port is picked fresh for each connection from a range of high numbers. These short-lived numbers are called **ephemeral ports**, like a ticket number at a deli counter.

              ### Key ideas
              - Your device picks a random high port number for each new connection
              - The server sends its replies back to that number
              - A connection is identified by four things: your address, your port, the server's address and the server's port
              - Two browser tabs open to the same site look different to the server because their port numbers differ
              - There is a limited supply of temporary ports, so a very busy machine can run out

              ### Example
              Your laptop at `10.0.0.5` opens a site from port 51234 to the server's port 443. A second tab uses port 51235 to the same server. The server sees two separate conversations and keeps their replies apart.

              ### Go deeper
              How connections are set up and tracked is in [Transport in depth](/roadmaps/networking/transport-in-depth) on the Networking roadmap.
            resources:
              - { label: "What is a computer port? (Cloudflare)", url: "https://www.cloudflare.com/learning/network-layer/what-is-a-computer-port/", kind: article }
              - { label: "Ephemeral port (Wikipedia)", url: "https://en.wikipedia.org/wiki/Ephemeral_port", kind: article }
              - { label: "How to stop running out of ephemeral ports (Cloudflare)", url: "https://blog.cloudflare.com/how-to-stop-running-out-of-ephemeral-ports-and-start-to-love-long-lived-connections/", kind: article }
              - { label: "Sessions, connections, sockets and ephemeral ports (Sunny Classroom)", url: "https://www.youtube.com/watch?v=KGmateiteUc", kind: video }
              - { label: "Network ports explained (PowerCert)", url: "https://www.youtube.com/watch?v=g2fT-g9PX9o", kind: video }
              - { label: "RFC 6056: Recommendations for transport-protocol port randomization", url: "https://www.rfc-editor.org/rfc/rfc6056", kind: docs }
              - { label: "Network socket (Wikipedia)", url: "https://en.wikipedia.org/wiki/Network_socket", kind: article }
              - { label: "Beej's guide to network programming", url: "https://beej.us/guide/bgnet/", kind: course }
              - { label: "ss(8) Linux manual page (man7.org)", url: "https://man7.org/linux/man-pages/man8/ss.8.html", kind: docs }
          - id: firewalls-and-ports
            title: Why firewalls care about ports
            summary: "A firewall is a gatekeeper that decides which traffic may pass, mostly by checking port numbers. Opening a port decides which services the world can reach."
            learn:
              - "What a firewall does"
              - "Incoming vs outgoing rules"
              - "Why you open only the ports you need"
            body: |
              A **firewall** is a gatekeeper for network traffic. It checks each message against a list of rules and lets it through or blocks it. Most rules look at the address and the port, so ports decide which services the outside world can reach.

              Think of a building with a security desk. The web shop on the ground floor (port 443) is open to the public. The records room (a database) is staff only, and the door stays locked.

              Rules work by direction. **Inbound** rules control traffic coming in. **Outbound** rules control traffic going out. Most firewalls remember conversations you started, so replies to your own requests are let back in automatically.

              ### Key ideas
              - Open only the ports you actually serve, such as 443 for a website
              - Block everything else by default
              - Never leave a database open to the whole internet
              - Limit sensitive doors to known people, for example only your office's address
              - Your home router already has a firewall that blocks unasked-for incoming traffic

              ### Common mistakes
              - Opening a port "just to test" and forgetting to close it
              - Letting the whole internet reach a remote login port when only you need it
              - Confusing a program waiting on a port with the firewall allowing traffic to it. Both must say yes

              ### Go deeper
              How firewalls are set up and run is in [Firewalls](/roadmaps/networking/firewalls) on the Networking roadmap.
            resources:
              - { label: "What is a firewall? (Cloudflare)", url: "https://www.cloudflare.com/learning/security/what-is-a-firewall/", kind: article }
              - { label: "Firewall (computing) (Wikipedia)", url: "https://en.wikipedia.org/wiki/Firewall_(computing)", kind: article }
              - { label: "What is a firewall? (PowerCert)", url: "https://www.youtube.com/watch?v=kDEX1HXybrU", kind: video }
              - { label: "NAT and firewall explained (IBM Technology)", url: "https://www.youtube.com/watch?v=2llWuivdS7w", kind: video }
              - { label: "Firewall fundamentals explained (Antisyphon Training)", url: "https://www.youtube.com/watch?v=K4ilFsm2GvA", kind: video }
              - { label: "Nmap reference guide: port scanning basics (nmap.org)", url: "https://nmap.org/book/man-port-scanning-basics.html", kind: docs }
              - { label: "Security groups for your VPC (AWS docs)", url: "https://docs.aws.amazon.com/vpc/latest/userguide/vpc-security-groups.html", kind: docs }
              - { label: "UFW, uncomplicated firewall (Ubuntu docs)", url: "https://wiki.ubuntu.com/UFW", kind: docs }

      - id: client-server
        title: Clients and servers
        summary: Most of the web is a client asking and a server answering. Know who does what.
        lessons:
          - id: request-response
            title: Request and response
            summary: "The client asks and the server answers. Almost everything on the web follows this simple shape."
            learn:
              - "What a client and a server are"
              - "Who starts the conversation"
              - "Why a server forgets you between requests"
            body: |
              Most of the web follows one simple pattern. The **client**, your browser or a phone app, starts by sending a **request**. The **server**, a computer somewhere running the website, sends back a **response**. The server does not send anything unasked.

              It is like ordering in a restaurant. You ask for a dish, the kitchen sends it out. The kitchen does not start cooking for you until you order.

              Websites, DNS lookups and most apps work this way. A browser asks for a page and gets back the page. A weather app asks for today's forecast and gets back the numbers.

              ### Key ideas
              - The client always starts the conversation
              - Each request carries everything the server needs to answer it
              - The web's main language, **HTTP**, is **stateless**: the server forgets you between requests
              - To remember you, for example to keep you logged in, sites use **cookies** or tokens that your browser sends with every request
              - Every response comes with a status code, such as 200 for "OK" and 404 for "not found"

              ### Example
              You click a link to `harun.dev/blog`. Your browser sends a request asking for the blog page. The server replies "200 OK" with the page, and your browser draws it.

              ### In practice
              In most browsers, open the developer tools and the Network tab, then reload a page. Every line is one request and its response.
            resources:
              - { label: "An overview of HTTP (MDN)", url: "https://developer.mozilla.org/en-US/docs/Web/HTTP/Overview", kind: docs }
              - { label: "Client–server model (Wikipedia)", url: "https://en.wikipedia.org/wiki/Client%E2%80%93server_model", kind: article }
              - { label: "HTTP messages (MDN)", url: "https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/Messages", kind: docs }
              - { label: "The client server model (The TechCave)", url: "https://www.youtube.com/watch?v=L5BlpPU_muY", kind: video }
              - { label: "RFC 9110: HTTP semantics", url: "https://www.rfc-editor.org/rfc/rfc9110", kind: docs }
              - { label: "HTTP, the protocol every web developer must know (Julia Evans, wizardzines)", url: "https://wizardzines.com/zines/http/", kind: article }
              - { label: "Learn HTTP request and response with curl (Everything curl)", url: "https://everything.curl.dev/http/", kind: docs }
              - { label: "httpbin: HTTP request and response service", url: "https://httpbin.org/", kind: tool }
              - { label: "What is the client-server model? (Be A Better Dev)", url: "https://www.youtube.com/watch?v=-dSXvLAwXO0", kind: video }
          - id: client-vs-server-side
            title: Client-side vs server-side work
            summary: "Some work happens on your own device, in the browser, and some on the website's computers. Knowing which explains a lot about speed and security."
            learn:
              - "What runs on your device"
              - "What runs on the website's servers"
              - "Why important checks must happen on the server"
            body: |
              A website's work happens in two places. The **client side** is your own device: the browser or app in front of you. The **server side** is the computers the website owner runs.

              Client-side code draws the page, reacts to your clicks and animates menus. Server-side code reads the database, checks who you are, takes payments and builds the answers.

              Think of a shop. The shop window and the till display are on your side of the counter. The stockroom, the safe and the price list are behind the counter, where customers cannot touch them.

              ### Key ideas
              - Anything running on your device can be seen and changed by you, so the server cannot trust it
              - Passwords, secret keys, permission checks and prices must be handled on the server
              - Client-side work feels instant, since a click does not wait for the network
              - Server-side work can use data and computing power your device does not have
              - Most sites split the job: the server sends the data, your browser shows it

              ### Common mistakes
              - Checking a price or a permission only in the browser, where a user can change it
              - Putting a secret key in the website's code, where anyone can read it

              ### Example
              An online shop shows "Total: 20 dollars" in your browser. When you pay, the server works the total out again from its own price list, so editing the page cannot change what you are charged.
            resources:
              - { label: "Client-side vs server-side (Cloudflare)", url: "https://www.cloudflare.com/learning/serverless/glossary/client-side-vs-server-side/", kind: article }
              - { label: "How the web works (MDN)", url: "https://developer.mozilla.org/en-US/docs/Learn_web_development/Getting_started/Web_standards/How_the_web_works", kind: docs }
              - { label: "Server-side rendering vs client-side rendering, pros and cons (Smoljames)", url: "https://www.youtube.com/watch?v=ObrSuDYMl1s", kind: video }
              - { label: "Rendering on the web (web.dev)", url: "https://web.dev/articles/rendering-on-the-web", kind: article }
              - { label: "Introduction to the server side (MDN)", url: "https://developer.mozilla.org/en-US/docs/Learn_web_development/Extensions/Server-side/First_steps/Introduction", kind: docs }
              - { label: "What is JavaScript? client-side scripting (MDN)", url: "https://developer.mozilla.org/en-US/docs/Learn_web_development/Core/Scripting/What_is_JavaScript", kind: docs }
              - { label: "Client-server overview (MDN)", url: "https://developer.mozilla.org/en-US/docs/Learn_web_development/Extensions/Server-side/First_steps/Client-Server_overview", kind: docs }
              - { label: "Server-side rendering vs client-side rendering (Synipher)", url: "https://www.youtube.com/watch?v=rNVcZklcmqU", kind: video }
          - id: reverse-proxies
            title: Proxies and reverse proxies
            optional: true
            summary: "A proxy is a go-between that passes requests along for someone else. Most big websites sit behind one."
            learn:
              - "What a proxy is"
              - "A proxy that works for users vs one that works for a website"
              - "Why most sites sit behind one"
            body: |
              A **proxy** is a go-between. Instead of talking to each other directly, the two sides talk through it, like using a receptionist to pass on messages.

              There are two kinds, depending on whose side it is on:

              | Kind | Works for | Used for |
              |---|---|---|
              | **Forward proxy** | The users | A company filtering or logging staff web traffic. VPNs work a bit like this |
              | **Reverse proxy** | The website | Standing in front of the website's servers and handling visitors first |

              ### Key ideas
              - A forward proxy hides or controls the users
              - A reverse proxy hides and protects the website's servers
              - Most sites sit behind a reverse proxy, often a CDN (content delivery network) or a load balancer
              - It can keep copies of pages to answer faster, share visitors across many servers and block attacks
              - The real servers behind it never have to be reachable from the internet

              ### Example
              A request to `harun.dev` reaches Cloudflare first. Cloudflare answers from its saved copy, or passes the request to the real server, which stays hidden from visitors.

              ### Go deeper
              Spreading traffic across servers is covered in [Load balancers](/roadmaps/networking/load-balancers) on the Networking roadmap.
            resources:
              - { label: "What is a reverse proxy? (Cloudflare)", url: "https://www.cloudflare.com/learning/cdn/glossary/reverse-proxy/", kind: article }
              - { label: "Proxy servers and tunneling (MDN)", url: "https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/Proxy_servers_and_tunneling", kind: docs }
              - { label: "Reverse proxy (Wikipedia)", url: "https://en.wikipedia.org/wiki/Reverse_proxy", kind: article }
              - { label: "Proxy vs reverse proxy, explained by example (Hussein Nasser)", url: "https://www.youtube.com/watch?v=ozhe__GdWC8", kind: video }
              - { label: "Proxy vs reverse proxy, real-world examples (ByteByteGo)", url: "https://www.youtube.com/watch?v=4NB0NDtOwIQ", kind: video }
              - { label: "Load balancer vs reverse proxy (Hussein Nasser)", url: "https://www.youtube.com/watch?v=S8J2fkN2FeI", kind: video }
              - { label: "NGINX reverse proxy (NGINX docs)", url: "https://docs.nginx.com/nginx/admin-guide/web-server/reverse-proxy/", kind: docs }
              - { label: "What is a reverse proxy? (F5 glossary)", url: "https://www.f5.com/glossary/reverse-proxy", kind: article }
              - { label: "Caddy reverse_proxy directive (Caddy docs)", url: "https://caddyserver.com/docs/caddyfile/directives/reverse_proxy", kind: docs }

      - id: dns-basics
        title: DNS
        summary: How a name like harun.dev turns into an IP address before anything else can happen.
        lessons:
          - id: dns-resolution
            title: How a lookup works
            summary: "To find a website's address, a helper server asks a chain of other servers, from the top of the internet's naming tree down, until it gets the answer."
            learn:
              - "What DNS does"
              - "The helper that asks on your behalf"
              - "The chain of servers from the top down to the answer"
              - "Why most lookups are almost instant"
            body: |
              People remember names, computers need numbers. **DNS** (Domain Name System) is the internet's phone book: it turns a name like `harun.dev` into an IP address.

              Your device asks a helper called a **recursive resolver**, usually run by your internet provider or a public service such as `1.1.1.1`. If the helper does not already know, it asks around for you, a bit like a librarian finding a book:

              1. A **root server** says: "For `.dev` names, ask the `.dev` servers"
              2. The **TLD server** (top-level domain, here `.dev`) says: "For `harun.dev`, ask these servers"
              3. The **authoritative server** for `harun.dev` gives the real answer: the address

              The helper then passes the answer back to you and remembers it for next time.

              ### Key ideas
              - Resolver: does the asking for you and remembers answers
              - Root servers: know where each ending (`.com`, `.dev`, `.uk`) is handled
              - TLD servers: know who answers for each domain under that ending
              - Authoritative servers: hold the domain owner's actual records
              - Because answers are remembered, most lookups take a few milliseconds or none at all

              ### In practice
              Many routers and phones let you choose your DNS service in the network settings. That is the resolver your device asks.
            resources:
              - { label: "What is DNS? (Cloudflare)", url: "https://www.cloudflare.com/learning/dns/what-is-dns/", kind: article }
              - { label: "DNS server types (Cloudflare)", url: "https://www.cloudflare.com/learning/dns/dns-server-types/", kind: article }
              - { label: "How DNS works (comic)", url: "https://howdns.works/", kind: article }
              - { label: "RFC 1034: Domain names, concepts and facilities", url: "https://www.rfc-editor.org/rfc/rfc1034", kind: docs }
              - { label: "Domain Name System (Wikipedia)", url: "https://en.wikipedia.org/wiki/Domain_Name_System", kind: article }
              - { label: "How a DNS server works (PowerCert)", url: "https://www.youtube.com/watch?v=mpQZVYPuDGU", kind: video }
              - { label: "What is DNS? and how it makes the internet work (NetworkChuck)", url: "https://www.youtube.com/watch?v=NiQTs9DbtW4", kind: video }
              - { label: "dig web interface, trace a lookup (Google Admin Toolbox)", url: "https://toolbox.googleapps.com/apps/dig/", kind: tool }
              - { label: "Root servers (root-servers.org)", url: "https://root-servers.org/", kind: tool }
              - { label: "A toy DNS resolver (Julia Evans)", url: "https://jvns.ca/blog/2022/02/01/a-dns-resolver-in-80-lines-of-go/", kind: article }
              - { label: "DNS lookup and record browser (nslookup.io)", url: "https://www.nslookup.io/", kind: tool }
          - id: dns-records
            title: Record types
            summary: "A domain's DNS settings are a short list of records. Each one tells the world one thing, such as where the website or the email lives."
            learn:
              - "What a DNS record is"
              - "The records for websites and email"
              - "Records used to prove you own a domain"
              - "How a domain points to its DNS provider"
            body: |
              A domain's DNS settings are a list of **records**, like the entries on a business card. Each one answers one question about the name. These are the ones you will meet most often, for example when you set up a website or email with a domain you bought.

              | Record | Answers the question | Example |
              |---|---|---|
              | **A** | What is the IPv4 address? | `harun.dev` is at `203.0.113.10` |
              | **AAAA** | What is the IPv6 address? | Same idea, for IPv6 |
              | **CNAME** | Is this name an alias? | `www.harun.dev` is just another name for `harun.dev` |
              | **MX** | Where does email for this domain go? | To the mail provider's servers |
              | **TXT** | Any notes? | Proofs that you own the domain, email anti-spoofing rules |
              | **NS** | Who runs DNS for this domain? | The name servers of your DNS provider |

              ### Key ideas
              - One domain usually has several records, each for a different job
              - **NS** records are how the internet knows where to look: the `.dev` registry points to your DNS provider, and your provider holds the rest
              - Email services and tools often ask you to add a **TXT** record to prove you control the domain
              - A CNAME cannot be used on the bare domain itself alongside other records

              ### Example
              When you sign up for an email service, it asks you to add MX records pointing to its servers and a TXT record or two. Until you do, mail to your domain has nowhere to go.

              ### Go deeper
              How the email records work together is in [How email works](/roadmaps/networking/how-email-works) on the Networking roadmap.
            resources:
              - { label: "DNS records (Cloudflare)", url: "https://www.cloudflare.com/learning/dns/dns-records/", kind: article }
              - { label: "Mess With DNS (hands-on)", url: "https://messwithdns.net/", kind: tool }
              - { label: "DNS records explained (PowerCert)", url: "https://www.youtube.com/watch?v=HnUDtycXSNE", kind: video }
              - { label: "What are DNS zones and records? (IBM Technology)", url: "https://www.youtube.com/watch?v=U-i_UDDYLxY", kind: video }
              - { label: "RFC 1035: Domain names, implementation and specification", url: "https://www.rfc-editor.org/rfc/rfc1035", kind: docs }
              - { label: "IANA DNS resource record types registry", url: "https://www.iana.org/assignments/dns-parameters/dns-parameters.xhtml", kind: docs }
              - { label: "List of DNS record types (Wikipedia)", url: "https://en.wikipedia.org/wiki/List_of_DNS_record_types", kind: article }
              - { label: "Route 53 supported DNS record types (AWS docs)", url: "https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/ResourceRecordTypes.html", kind: docs }
          - id: dns-ttl-caching
            title: "Why DNS changes take time (TTL and caching)"
            summary: "DNS answers are remembered for a set time at every step, which makes lookups fast but means a change can take a while to reach everyone."
            learn:
              - "What TTL means"
              - "Why a DNS change does not show up everywhere at once"
              - "How to plan a change so it switches over quickly"
            body: |
              Each DNS record comes with a **TTL** (time to live): a number of seconds saying how long others may remember the answer. Resolvers, your computer and your browser all keep these remembered answers, called a **cache**.

              It is like a printed phone book. Everyone looks up numbers quickly in their own copy, but if a shop changes its number, people keep calling the old one until they get a new copy.

              Caching makes DNS fast and keeps name servers from being swamped. It is also why a change does not show up everywhere at once: some places still hold the old answer until its TTL runs out.

              ### Key ideas
              - A TTL of 300 means people may see the old answer for up to 5 minutes
              - A TTL of 86400 means up to a whole day
              - A long TTL is fast and light on servers, but slow to change
              - A short TTL changes quickly, but means more lookups
              - Before moving a site, lower the TTL a day or two ahead, make the change, then raise it again

              ### Common mistakes
              - Changing a record and expecting everyone to see it instantly
              - Lowering the TTL on the day of the move. That is too late: the old, long TTL is already remembered
              - Forgetting that your own computer and browser keep their own copy. Restarting the browser can help when testing
            resources:
              - { label: "What is time-to-live (TTL)? (Cloudflare)", url: "https://www.cloudflare.com/learning/cdn/glossary/time-to-live-ttl/", kind: article }
              - { label: "TTL and caching on resolving name servers (DNS Made Easy)", url: "https://www.youtube.com/watch?v=1qFNBxkAOLA", kind: video }
              - { label: "What is DNS TTL? (DNSimple)", url: "https://www.youtube.com/watch?v=lZXu5ymxeks", kind: video }
              - { label: "RFC 2308: Negative caching of DNS queries", url: "https://www.rfc-editor.org/rfc/rfc2308", kind: docs }
              - { label: "RFC 8767: Serving stale data to improve DNS resiliency", url: "https://www.rfc-editor.org/rfc/rfc8767", kind: docs }
              - { label: "What happens when you update a DNS record (Julia Evans)", url: "https://jvns.ca/blog/2021/12/06/dns-doesn-t-propagate/", kind: article }
              - { label: "Purge Google Public DNS cache (Google)", url: "https://dns.google/cache", kind: tool }
          - id: dns-security
            title: DNSSEC and encrypted DNS
            optional: true
            summary: "Ordinary DNS lookups can be faked or read by others on the network. DNSSEC proves answers are genuine, and encrypted DNS keeps your lookups private."
            learn:
              - "The two weaknesses of ordinary DNS"
              - "What DNSSEC proves and what it does not"
              - "How encrypted DNS keeps lookups private"
              - "Who can still see your lookups"
            body: |
              Ordinary DNS has two weaknesses. Answers can be **faked**, sending you to the wrong place. And lookups travel as plain text, so anyone on the same network, such as a cafe Wi-Fi, can see which sites you are looking up.

              Two separate fixes deal with each problem.

              **DNSSEC** adds a digital signature to DNS answers, like a tamper-evident seal on a parcel. Your resolver can check that the answer really came from the domain owner and was not changed. It proves the answer is genuine. It does not hide anything.

              **Encrypted DNS** wraps your lookups in encryption between your device and your resolver, like a sealed envelope instead of a postcard. Others on the network cannot read or change them. It comes in two forms: **DNS over HTTPS (DoH)** and **DNS over TLS (DoT)**.

              ### Key ideas
              - DNSSEC: proves answers are real, but keeps nothing private
              - DoH and DoT: keep lookups private on the way, but do not prove the domain's records are real
              - The two work well together
              - The resolver you choose still sees every lookup, so pick one you trust

              ### In practice
              Most modern browsers and phones have a "secure DNS" or "private DNS" setting. Turning it on uses encrypted DNS.

              ### Go deeper
              The encryption that DoH and DoT rely on is explained in [TLS in depth](/roadmaps/networking/tls-in-depth) on the Networking roadmap.
            resources:
              - { label: "How DNSSEC works (Cloudflare)", url: "https://www.cloudflare.com/learning/dns/dnssec/how-dnssec-works/", kind: article }
              - { label: "DNS over TLS vs DNS over HTTPS (Cloudflare)", url: "https://www.cloudflare.com/learning/dns/dns-over-tls/", kind: article }
              - { label: "RFC 1035: DNS", url: "https://www.rfc-editor.org/rfc/rfc1035", kind: docs }
              - { label: "DNSSEC (Wikipedia)", url: "https://en.wikipedia.org/wiki/Domain_Name_System_Security_Extensions", kind: article }
              - { label: "DNS Encryption Explained (Cloudflare)", url: "https://blog.cloudflare.com/dns-encryption-explained/", kind: article }
              - { label: "RFC 8484: DNS Queries over HTTPS (DoH)", url: "https://www.rfc-editor.org/rfc/rfc8484", kind: docs }
              - { label: "What is DNSSEC? (IBM Technology)", url: "https://www.youtube.com/watch?v=Fk2oejzgSVQ", kind: video }
              - { label: "DNS over HTTPS in 2 minutes (Hussein Nasser)", url: "https://www.youtube.com/watch?v=flnw78uhFkE", kind: video }
              - { label: "DNS encryption explained: DoT and DoH (Christian Lempa)", url: "https://www.youtube.com/watch?v=6hLHMA_tJ8k", kind: video }
              - { label: "RFC 7858: DNS over TLS", url: "https://www.rfc-editor.org/rfc/rfc7858", kind: docs }
              - { label: "DNSViz: visualise a domain's DNSSEC chain", url: "https://dnsviz.net/", kind: tool }
              - { label: "DNSSEC analyzer (Verisign Labs)", url: "https://dnssec-analyzer.verisignlabs.com/", kind: tool }

      - id: http-basics
        title: HTTP
        summary: The language browsers and servers speak. Methods, status codes and headers.
        lessons:
          - id: http-methods
            title: Methods
            summary: "Every web request starts with a verb that says what you want: read something, send something, change it or delete it."
            learn:
              - "HTTP is the language browsers and websites use to talk"
              - "GET reads, POST sends something new"
              - "PUT and PATCH change things, DELETE removes them"
              - "Why some requests are safe to repeat and others are not"
            body: |
              **HTTP** is the language your browser and a website use to talk. Every message your browser sends starts with a **method**: a verb that says what it wants to do.

              Think of a library desk. You can ask to read a book, hand in a new one, swap one for a newer edition, fix a page, or ask them to throw one away.

              ### Key ideas
              - **GET**: "show me this". Opening a page or an image is a GET. It should never change anything
              - **POST**: "here is something new". Sending a form, posting a comment or placing an order
              - **PUT**: "replace this with my version"
              - **PATCH**: "change just this part", like updating only your phone number
              - **DELETE**: "remove this"

              ### Safe to repeat?
              Some requests give the same result no matter how many times you send them. Reading a page twice changes nothing. Deleting the same post twice still leaves it deleted. These are safe to retry.

              A POST is different. Sending "place my order" twice can create two orders.

              ### Example
              You press "Pay" and the page hangs. If you press it again, a well-built shop recognises the repeat and charges you once. A badly built one charges you twice. Good shops attach a unique tag to each order so the second press is spotted.

              ### Why it matters
              When an app is slow, it retries. Knowing which actions are safe to repeat is how sites avoid double charges and duplicate posts.
            resources:
              - { label: "HTTP request methods (MDN)", url: "https://developer.mozilla.org/en-US/docs/Web/HTTP/Methods", kind: docs }
              - { label: "Idempotent (MDN)", url: "https://developer.mozilla.org/en-US/docs/Glossary/Idempotent", kind: docs }
              - { label: "Safe (HTTP methods) (MDN)", url: "https://developer.mozilla.org/en-US/docs/Glossary/Safe/HTTP", kind: docs }
              - { label: "HTTP request methods: GET, POST, PUT, DELETE (Curious Code)", url: "https://www.youtube.com/watch?v=tkfVQK6UxDI", kind: video }
              - { label: "RFC 9110 section 9: methods", url: "https://www.rfc-editor.org/rfc/rfc9110#name-methods", kind: docs }
              - { label: "RFC 5789: PATCH method for HTTP", url: "https://www.rfc-editor.org/rfc/rfc5789", kind: docs }
              - { label: "IANA HTTP method registry", url: "https://www.iana.org/assignments/http-methods/http-methods.xhtml", kind: docs }
              - { label: "HTTP request methods with curl (Everything curl)", url: "https://everything.curl.dev/http/modify/method.html", kind: docs }
              - { label: "httpbin: try each method", url: "https://httpbin.org/", kind: tool }
          - id: http-status-codes
            title: Status codes
            summary: "Every reply from a website comes with a three-digit number that says how things went, like 200 for OK or 404 for not found."
            learn:
              - "The first digit tells you the kind of answer"
              - "2xx worked, 3xx look elsewhere, 4xx your mistake, 5xx the site's mistake"
              - "The famous ones: 200, 301, 404, 500"
              - "Why 401 and 403 are different"
            body: |
              Every reply from a website starts with a three-digit **status code**. It is the site's short answer to "how did that go?". You rarely see it, but when a page breaks, it is the first clue.

              The first digit tells you the kind of answer, a bit like the colour of a traffic light.

              | Starts with | Meaning | Everyday version |
              |---|---|---|
              | 2 | Success | "Here you go" |
              | 3 | Redirect | "That moved, look over there" |
              | 4 | Client error | "Your request was wrong" |
              | 5 | Server error | "Sorry, we broke" |

              ### Key ideas
              - **200 OK**: everything worked. Most pages you open return this
              - **301**: the page moved for good. Search engines update their links to the new address
              - **302**: the page moved for now
              - **404 Not Found**: there is nothing at this address. A typo or a deleted page
              - **429**: you are asking too often, slow down
              - **500**: the website itself crashed while handling a valid request
              - **502** and **504**: a middleman server could not get an answer from the site behind it

              ### 401 vs 403
              **401** means "who are you?": you are not logged in. **403** means "I know who you are, but you are not allowed". Like a building where 401 is having no badge and 403 is having a badge that does not open this door.

              ### Example
              A broken link on a blog shows a 404 page. If the whole site shows an error page during a sale, that is usually a 5xx: the servers could not keep up.

              ### Common mistakes
              - Showing an error message on a page that still reports 200, so tools think all is well
              - Using a temporary redirect for a page that moved for good
            resources:
              - { label: "HTTP response status codes (MDN)", url: "https://developer.mozilla.org/en-US/docs/Web/HTTP/Status", kind: docs }
              - { label: "Redirections in HTTP (MDN)", url: "https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/Redirections", kind: docs }
              - { label: "HTTP Status Code Registry (IANA)", url: "https://www.iana.org/assignments/http-status-codes/http-status-codes.xhtml", kind: docs }
              - { label: "HTTP status codes explained in 5 minutes (ByteByteGo)", url: "https://www.youtube.com/watch?v=qmpUfWN7hh4", kind: video }
              - { label: "Learn HTTP status codes in 10 minutes (Web Dev Simplified)", url: "https://www.youtube.com/watch?v=wJa5CTIFj7U", kind: video }
              - { label: "RFC 9110 section 15: status codes", url: "https://www.rfc-editor.org/rfc/rfc9110#name-status-codes", kind: docs }
              - { label: "HTTP status dogs and cats (http.cat)", url: "https://http.cat/", kind: tool }
              - { label: "List of HTTP status codes (Wikipedia)", url: "https://en.wikipedia.org/wiki/List_of_HTTP_status_codes", kind: article }
          - id: http-headers-cookies
            title: Headers and cookies
            summary: "Headers are short notes attached to every web request and reply. Cookies are the notes that let a website remember you."
            learn:
              - "Headers carry extra information with each request and reply"
              - "The web forgets you between clicks"
              - "Cookies are how a site remembers you are logged in"
              - "Cookie settings that keep them safe"
            body: |
              Every web request and reply carries a few short notes called **headers**. They travel before the actual content, like the details on the outside of an envelope: who it is for, what is inside, how long to keep it.

              ### Key ideas
              - Your browser's headers say which site it wants, which browser you use, which languages you prefer, and what kinds of files it can handle
              - The website's headers say what type of content it is sending (a page, an image), how long it may be kept, and where to go next if the page moved
              - You never type them. The browser and the site add them for you

              ### Cookies: how a site remembers you
              On its own, the web has no memory. Each click is a fresh request, and the site does not know it came from the same person.

              A **cookie** fixes that. When you log in, the site hands your browser a small ticket, like a cloakroom ticket. Your browser shows that ticket on every later visit, and the site knows it is you.

              ### Keeping cookies safe
              Sites can set rules on each cookie:
              - Hide it from scripts on the page, so a malicious script cannot steal it
              - Only send it over a secure HTTPS connection
              - Do not send it when another website triggers the request, which blocks a common trick that makes you act without knowing
              - Expire it after a set time, so an old login stops working

              ### Example
              You log into a shop, close the tab and come back an hour later. You are still logged in, because your browser kept the cookie and sent it back.

              ### In practice
              In most browsers you can view and delete the cookies a site has stored under Settings, Privacy. Deleting them logs you out.
            resources:
              - { label: "HTTP headers (MDN)", url: "https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers", kind: docs }
              - { label: "Using HTTP cookies (MDN)", url: "https://developer.mozilla.org/en-US/docs/Web/HTTP/Cookies", kind: docs }
              - { label: "RFC 6265: HTTP State Management Mechanism", url: "https://www.rfc-editor.org/rfc/rfc6265", kind: docs }
              - { label: "HTTP cookies crash course (Hussein Nasser)", url: "https://www.youtube.com/watch?v=sovAIX4doOE", kind: video }
              - { label: "HTTP headers and cookies (Zach Gollwitzer)", url: "https://www.youtube.com/watch?v=DxeSGUM16_4", kind: video }
              - { label: "Set-Cookie header reference (MDN)", url: "https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Headers/Set-Cookie", kind: docs }
              - { label: "SameSite cookies explained (web.dev)", url: "https://web.dev/articles/samesite-cookies-explained", kind: article }
              - { label: "IANA HTTP field name registry", url: "https://www.iana.org/assignments/http-fields/http-fields.xhtml", kind: docs }
              - { label: "Cookies, sessions and tokens (Valentin Despa)", url: "https://www.youtube.com/watch?v=GhrvZ5nUWNg", kind: video }
          - id: http-caching
            title: HTTP caching
            optional: true
            summary: "Caching lets your browser and other servers keep a copy of a file so they do not have to download it again."
            learn:
              - "What a cache is and why it saves time"
              - "The website decides how long a copy stays fresh"
              - "Checking whether a copy is still current"
              - "Why some pages must never be cached"
            body: |
              A **cache** is a stored copy you can reuse. Instead of asking a website for the same logo on every page, your browser keeps the logo and uses its copy. Pages load faster and less data is sent.

              Think of milk in your fridge. You do not go to the shop every time you want a glass. You check the date, and only go out when it has gone off.

              ### Key ideas
              - The website labels each file with how long a copy stays **fresh**, for example one hour or one year
              - While a copy is fresh, the browser uses it without asking
              - When it goes stale, the browser can ask "has this changed?" by sending a short fingerprint of its copy. If nothing changed, the site answers "still good" with no file attached. That is much quicker than downloading it again
              - The site can also say "do not keep this at all". Bank statements and other private pages use this
              - Some copies may only be kept in your own browser. Others may also be kept by shared servers such as a CDN (more on CDNs later)

              ### Example
              The first time you open a news site, it downloads its logo, fonts and styles. On the next page, those come from your cache and only the new article is fetched. That is why the second page feels faster.

              ### In practice
              Sites often put a fingerprint in a file's name, so a changed file gets a new name. Those files can be cached for a year, because any update arrives under a new name. The page itself gets a short lifetime so news and changes show up quickly.

              ### Common mistakes
              - Caching a private page, so one person might see another person's details
              - Caching a page for too long, so visitors keep seeing the old version
            resources:
              - { label: "HTTP caching (MDN)", url: "https://developer.mozilla.org/en-US/docs/Web/HTTP/Caching", kind: docs }
              - { label: "RFC 9110: HTTP semantics", url: "https://www.rfc-editor.org/rfc/rfc9110", kind: docs }
              - { label: "Prevent unnecessary network requests with the HTTP Cache (web.dev)", url: "https://web.dev/articles/http-cache", kind: article }
              - { label: "HTTP conditional requests (MDN)", url: "https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/Conditional_requests", kind: docs }
              - { label: "RFC 9111: HTTP Caching", url: "https://www.rfc-editor.org/rfc/rfc9111", kind: docs }
              - { label: "Deep dive into HTTP caching: cache-control, ETag (Software Developer Diaries)", url: "https://www.youtube.com/watch?v=Cy2ZJOBgk84", kind: video }
              - { label: "HTTP caching with ETags (Hussein Nasser)", url: "https://www.youtube.com/watch?v=TgZnpp5wJWU", kind: video }
              - { label: "Caching tutorial for web authors (Mark Nottingham)", url: "https://www.mnot.net/cache_docs/", kind: article }
              - { label: "Cache-Control header reference (MDN)", url: "https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Headers/Cache-Control", kind: docs }
              - { label: "REDbot: lint a URL's caching headers", url: "https://redbot.org/", kind: tool }
              - { label: "Cache-Control for civilians (Harry Roberts, CSS Wizardry)", url: "https://csswizardry.com/2019/03/cache-control-for-civilians/", kind: article }

      - id: how-a-page-loads
        title: What happens when you open a website
        summary: Put it all together, from typing a URL to pixels on screen.
        lessons:
          - id: url-to-response
            title: From URL to response
            summary: "Between pressing Enter and seeing a page, your browser finds the server, connects to it securely and asks for the page."
            learn:
              - "Looking up the address with DNS"
              - "Opening a connection to the server"
              - "Setting up encryption"
              - "Asking for the page and getting the reply"
              - "Why distance makes each step slower"
            body: |
              When you type a web address and press Enter, several things happen before the first piece of the page arrives. Each step is quick, but they add up.

              It is like visiting a friend: look up the address, travel there, knock, agree on how to talk privately, then ask your question.

              ### Key ideas
              1. **DNS lookup**: the browser turns the name (like harun.dev) into an **IP address**, the server's number on the internet. If it looked it up recently, it skips this
              2. **Connect**: the browser and the server say hello and agree to talk. This uses **TCP**, the part of the internet that makes delivery reliable
              3. **Secure the line**: for HTTPS, they agree on a secret key and the browser checks the site's certificate (its ID card). This is **TLS**
              4. **Ask**: the browser sends its request for the page, with its headers and cookies
              5. **Answer**: the server replies with a status code, headers and the page itself

              ### Why distance matters
              Each step needs at least one message there and back, called a **round trip**. Even at the speed of light, a trip across an ocean takes tens of milliseconds. A **CDN** helps by answering from a server near you.

              ### Example
              If one round trip to a server takes 100 milliseconds, the lookup, connection and security steps can cost about 300 milliseconds before your request is even sent. On later pages the browser reuses the same connection, so most of that cost disappears.

              ### Go deeper
              The technical detail is in [Transport in depth](/roadmaps/networking/transport-in-depth) and [TLS in depth](/roadmaps/networking/tls-in-depth) on the Networking roadmap.
            resources:
              - { label: "What happens when... (GitHub)", url: "https://github.com/alex/what-happens-when", kind: article }
              - { label: "High Performance Browser Networking (free book)", url: "https://hpbn.co/", kind: course }
              - { label: "Time to First Byte (web.dev)", url: "https://web.dev/articles/ttfb", kind: article }
              - { label: "Primer on Latency and Bandwidth (HPBN)", url: "https://hpbn.co/primer-on-latency-and-bandwidth/", kind: article }
              - { label: "What happens when you type a URL into your browser? (ByteByteGo)", url: "https://www.youtube.com/watch?v=AlkDbnbv7dk", kind: video }
              - { label: "What happens when you type a URL and press Enter? (Scott Hanselman)", url: "https://www.youtube.com/watch?v=vvpCnjyjTuU", kind: video }
              - { label: "Populating the page: how browsers work (MDN)", url: "https://developer.mozilla.org/en-US/docs/Web/Performance/Guides/How_browsers_work", kind: docs }
              - { label: "Inside look at modern web browser, part 2: navigation (Chrome for Developers)", url: "https://developer.chrome.com/blog/inside-browser-part2", kind: article }
              - { label: "Primer on web performance (High Performance Browser Networking)", url: "https://hpbn.co/primer-on-web-performance/", kind: article }
          - id: browser-rendering
            title: How the browser renders the page
            summary: "Once the page arrives, the browser reads it, fetches the styles and scripts it needs, works out where everything goes and draws it."
            learn:
              - "The browser reads the page into a structure"
              - "Styles must arrive before anything is drawn"
              - "Layout works out sizes and positions, paint draws them"
              - "Why some files hold up the page"
            body: |
              The page that arrives is just text with instructions. The browser has to turn it into what you see. Think of building flat-pack furniture: read the instructions, gather the parts, work out where each piece goes, then put it together.

              ### The steps
              1. **Read the page**: the browser goes through the HTML (the page's structure: headings, paragraphs, images) and builds a tree of everything on it
              2. **Get the styles**: it downloads the CSS, which says colours, fonts and sizes
              3. **Layout**: it works out how big each box is and where it sits on your screen
              4. **Paint**: it draws the pixels

              ### Key ideas
              - The browser waits for the styles before drawing anything. Otherwise you would see an ugly unstyled page flash first
              - Scripts (JavaScript, the code that makes pages interactive) can pause the reading while they download and run, unless the site marks them to load in the background
              - Images load without stopping the page, but if the site did not reserve space for them, text jumps when they appear
              - Custom fonts can make text briefly invisible or switch style as they arrive

              ### Example
              You open an article and start reading, then the text jumps down because an advert or image loaded above it. That is a layout shift. Good sites reserve the space in advance.

              ### Why it matters
              A page can arrive fast and still feel slow if big styles or scripts hold up the drawing. Fast sites keep the first things you see small and load the rest after.
            resources:
              - { label: "How browsers work (MDN)", url: "https://developer.mozilla.org/en-US/docs/Web/Performance/How_browsers_work", kind: docs }
              - { label: "Critical rendering path (MDN)", url: "https://developer.mozilla.org/en-US/docs/Web/Performance/Guides/Critical_rendering_path", kind: docs }
              - { label: "Critical Rendering Path (web.dev)", url: "https://web.dev/articles/critical-rendering-path", kind: article }
              - { label: "Inside look at modern web browser, part 3: rendering (Chrome for Developers)", url: "https://developer.chrome.com/blog/inside-browser-part3", kind: article }
              - { label: "How browsers work (Tali Garsiel and Paul Irish, web.dev)", url: "https://web.dev/articles/howbrowserswork", kind: article }
              - { label: "Render-tree construction, layout and paint (web.dev)", url: "https://web.dev/articles/critical-rendering-path/render-tree-construction", kind: article }
              - { label: "Layout and paint, critical rendering path (Udacity)", url: "https://www.youtube.com/watch?v=CHwwSgKfXDE", kind: video }
              - { label: "Rendering performance (web.dev)", url: "https://web.dev/articles/rendering-performance", kind: article }
          - id: measuring-page-load
            title: Measuring a page load
            optional: true
            summary: "Your browser has a built-in tool that shows every file a page loads and how long each step took."
            learn:
              - "The network view and its waterfall chart"
              - "The steps behind each request"
              - "Telling a slow server from a big file"
              - "Testing like a first-time visitor"
            body: |
              Every modern browser has developer tools with a **Network** view. It lists every file a page loads, with a bar showing when each one started and finished. Because the bars cascade down the screen, this chart is called a **waterfall**.

              You do not need to be a developer to try it. In Chrome, Edge or Firefox, right-click a page, choose Inspect, open the Network tab and reload. Click any file to see where its time went.

              ### Key ideas
              - **DNS lookup**: finding the server's address
              - **Connecting** and **TLS**: opening a secure connection
              - **Waiting**: time until the first bit of the answer comes back. This includes the time the server spends thinking. It is often called **time to first byte**
              - **Download**: time to receive the whole file
              - A long wait points to a slow server. A long download points to a big file or a slow connection
              - Bars that start late usually had to wait for an earlier file

              ### Example
              A page takes four seconds. The waterfall shows the HTML waited three seconds before anything came back, while the images were quick. The problem is the server, not the images.

              ### Common mistakes
              - Testing with files already in your cache, then wondering why new visitors are slower. Tick "Disable cache" in the Network view and reload
              - Looking only at the total time instead of the one step that takes longest

              ### In practice
              Free public tools such as PageSpeed Insights run the same kind of test from outside and explain the results in plain words.
            resources:
              - { label: "Chrome DevTools: Network panel", url: "https://developer.chrome.com/docs/devtools/network", kind: docs }
              - { label: "High Performance Browser Networking (free book)", url: "https://hpbn.co/", kind: course }
              - { label: "Network features reference (Chrome DevTools)", url: "https://developer.chrome.com/docs/devtools/network/reference", kind: docs }
              - { label: "Inspect network activity, DevTools 101 (Chrome for Developers)", url: "https://www.youtube.com/watch?v=e1gAyQuIFQo", kind: video }
              - { label: "Demystifying the browser networking tab (Hussein Nasser)", url: "https://www.youtube.com/watch?v=LBgfSwX4GDI", kind: video }
              - { label: "Core Web Vitals (web.dev)", url: "https://web.dev/articles/vitals", kind: article }
              - { label: "Navigation timing API (MDN)", url: "https://developer.mozilla.org/en-US/docs/Web/API/Performance_API/Navigation_timing", kind: docs }
              - { label: "PageSpeed Insights (Google)", url: "https://pagespeed.web.dev/", kind: tool }
              - { label: "Resource timing API (MDN)", url: "https://developer.mozilla.org/en-US/docs/Web/API/Performance_API/Resource_timing", kind: docs }

  - level: intermediate
    title: How the pieces fit
    topics:
      - id: osi-model
        title: The 7 OSI layers
        summary: "A simple map that splits networking into layers, from cables and radio at the bottom to apps at the top, and the four-layer version the internet actually uses."
        lessons:
          - id: osi-seven-layers
            title: What each layer does
            summary: "The OSI model splits networking into seven layers, from cables and radio at the bottom to apps at the top. It is a map for talking about where a problem sits."
            learn:
              - "Why networking is split into layers"
              - "What each of the seven layers does, in one line"
              - "Where Wi-Fi, IP, TCP and HTTP fit"
              - "How a message travels down and back up"
            body: |
              Networking does many jobs at once: send signals down a cable, find the way across the world, make sure nothing is lost, and speak the app's language. The **OSI model** splits those jobs into seven **layers**. Each layer does one job and relies on the one below.

              It is a map, not a machine. People use it so they can say exactly where a problem is.

              Think of sending a parcel. You write the letter (the app), put it in an envelope with an address, the courier plans the route, and a van drives it on real roads. Each person only cares about their own part.

              ### The seven layers
              1. **Physical**: the actual signals: electricity in copper, light in fibre, radio waves for Wi-Fi
              2. **Data link**: getting data between devices on the same local network, like your laptop and your home router (Ethernet, Wi-Fi)
              3. **Network**: addresses and routes across many networks. This is where **IP addresses** live
              4. **Transport**: delivering data between two programs, reliably or quickly. This is **TCP** and **UDP**
              5. **Session**: starting, keeping and ending a conversation
              6. **Presentation**: the format of the data, plus encryption and compression
              7. **Application**: what your app speaks, like **HTTP** for the web or **DNS** for names

              ### Example
              When you open a web page, your request starts at the top as HTTP. Each layer wraps it with what it needs, like putting a letter in an envelope and the envelope in a sack. At the bottom it travels as signals. The other side unwraps it layer by layer, back up to the website.

              ### Why it matters
              When something breaks, layers help you narrow it down. "The Wi-Fi is down" is a low layer. "The site shows an error" is the top layer.

              In real life, layers 5 to 7 often blur together.
            resources:
              - { label: "What is the OSI model? (Cloudflare)", url: "https://www.cloudflare.com/learning/ddos/glossary/open-systems-interconnection-model-osi/", kind: article }
              - { label: "OSI model (Wikipedia)", url: "https://en.wikipedia.org/wiki/OSI_model", kind: article }
              - { label: "The OSI model, a practical view (Practical Networking)", url: "https://www.practicalnetworking.net/series/packet-traveling/osi-model/", kind: article }
              - { label: "OSI Model: A Practical Perspective (Practical Networking)", url: "https://www.youtube.com/watch?v=LkolbURrtTs", kind: video }
              - { label: "OSI layers 5, 6 and 7, what they actually do (Practical Networking)", url: "https://www.youtube.com/watch?v=2iFFRqzX3yE", kind: video }
              - { label: "Protocol layering (Computer Networks: A Systems Approach)", url: "https://book.systemsapproach.org/foundation/architecture.html", kind: course }
              - { label: "Networking zine (Julia Evans, wizardzines)", url: "https://wizardzines.com/zines/networking/", kind: article }
          - id: tcp-ip-model
            title: OSI vs the TCP/IP model
            summary: "The internet actually runs on a simpler four-layer model called TCP/IP, but people still use the OSI layer numbers as shorthand."
            learn:
              - "The four TCP/IP layers"
              - "How they line up with the seven OSI layers"
              - "What people mean by layer 3, layer 4 and layer 7"
            body: |
              The seven-layer OSI model is a teaching map. The internet you use every day was built on a simpler four-layer design called the **TCP/IP model**, named after its two most important parts.

              ### The four layers
              | TCP/IP layer | What it does | Matches OSI |
              |---|---|---|
              | Link | Signals and the local network: Ethernet, Wi-Fi | 1 and 2 |
              | Internet | Addresses and routes: IP | 3 |
              | Transport | Delivery between programs: TCP and UDP | 4 |
              | Application | What apps speak: HTTP, DNS and more | 5 to 7 |

              ### Why people still say "layer 4" and "layer 7"
              Engineers kept the OSI numbers as handy shorthand. You will hear them in product names and in meetings.
              - A **layer 3** device, like a router, looks only at IP addresses and passes traffic along
              - A **layer 4** device sees addresses and which program the traffic is for, and moves whole connections without reading them
              - A **layer 7** device understands the app's language. It can read which web page you asked for and decide based on that

              ### Example
              "Our web firewall works at layer 7" means it reads web requests and can block a suspicious one. "Block it at layer 3" means block a whole IP address.

              ### Why it matters
              These words come up whenever people buy or discuss network products. Knowing the layers tells you what a product can and cannot see.
            resources:
              - { label: "What is TCP/IP? (Cloudflare)", url: "https://www.cloudflare.com/learning/ddos/glossary/tcp-ip/", kind: article }
              - { label: "Internet protocol suite (Wikipedia)", url: "https://en.wikipedia.org/wiki/Internet_protocol_suite", kind: article }
              - { label: "RFC 1122: Requirements for Internet Hosts, Communication Layers", url: "https://www.rfc-editor.org/rfc/rfc1122", kind: docs }
              - { label: "RFC 1180: A TCP/IP Tutorial", url: "https://www.rfc-editor.org/rfc/rfc1180", kind: docs }
              - { label: "RFC 3439: Some Internet Architectural Guidelines, layering considered harmful", url: "https://www.rfc-editor.org/rfc/rfc3439", kind: docs }
              - { label: "What is TCP/IP and OSI? (NetworkChuck)", url: "https://www.youtube.com/watch?v=CRdL1PcherM", kind: video }
              - { label: "Protocol layering and the internet architecture (Computer Networks: A Systems Approach)", url: "https://book.systemsapproach.org/foundation/architecture.html", kind: course }
              - { label: "Kurose and Ross video lectures (Computer Networking: A Top-Down Approach)", url: "https://gaia.cs.umass.edu/kurose_ross/online_lectures.htm", kind: course }

      - id: tcp-vs-udp
        title: TCP vs UDP
        summary: "Two ways to send data: TCP makes sure everything arrives complete and in order, UDP sends fast and does not wait for stragglers. When each one fits."
        lessons:
          - id: tcp-handshake
            title: The TCP three-way handshake
            summary: "Before two computers exchange data reliably, they greet each other in three quick steps. This handshake makes sure both are ready, but it costs time."
            learn:
              - "What TCP does: reliable, in-order delivery"
              - "The three-step greeting and why it exists"
              - "Why a far-away server makes the first connection slower"
              - "Why reusing a connection makes later pages faster"
            body: |
              Data on the internet travels in small pieces called **packets**, and packets can get lost or arrive out of order. **TCP** is the part of the internet that fixes this. It numbers every piece, resends lost ones and puts them back in order, so the app receives exactly what was sent.

              To do that, both sides need to agree they are talking and where they start counting. That agreement is the **three-way handshake**.

              ### The three steps
              It is like starting a phone call:
              1. You: "Hello, can you hear me?"
              2. Them: "Yes, I hear you. Can you hear me?"
              3. You: "Yes." Now you can talk

              Only after these three messages does any real data flow.

              ### Key ideas
              - The handshake costs one full **round trip**, a message there and back, before any data moves
              - The further away the server, the longer that round trip. Across an ocean it can be well over 100 milliseconds
              - Opening a new connection for every file would waste that time again and again. Browsers keep connections open and reuse them
              - When the conversation ends, each side says goodbye, so both know the call is over

              ### Example
              If a round trip takes 50 milliseconds, a new secure web connection spends 50 milliseconds on this greeting before the encryption setup even begins. On a mobile network with longer delays, that cost grows.

              ### Why it matters
              This is one reason sites use CDNs: a nearby server means a shorter round trip, so the greeting finishes sooner.

              ### Go deeper
              The technical detail is in [Transport in depth](/roadmaps/networking/transport-in-depth) on the Networking roadmap.
            resources:
              - { label: "Building blocks of TCP (High Performance Browser Networking)", url: "https://hpbn.co/building-blocks-of-tcp/", kind: course }
              - { label: "RFC 9293: TCP", url: "https://www.rfc-editor.org/rfc/rfc9293", kind: docs }
              - { label: "Transmission Control Protocol (Wikipedia)", url: "https://en.wikipedia.org/wiki/Transmission_Control_Protocol", kind: article }
              - { label: "TCP handshake (MDN glossary)", url: "https://developer.mozilla.org/en-US/docs/Glossary/TCP_handshake", kind: docs }
              - { label: "TCP three-way handshaking (Wireshark wiki)", url: "https://wiki.wireshark.org/TCP_3_way_handshaking", kind: article }
              - { label: "SYN packet handling in the wild (Cloudflare blog)", url: "https://blog.cloudflare.com/syn-packet-handling-in-the-wild/", kind: article }
              - { label: "RFC 7413: TCP Fast Open", url: "https://www.rfc-editor.org/rfc/rfc7413", kind: docs }
              - { label: "SYN flood attack (Cloudflare)", url: "https://www.cloudflare.com/learning/ddos/syn-flood-ddos-attack/", kind: article }
              - { label: "The TCP 3-way handshake and why backend engineers should understand it (Hussein Nasser)", url: "https://www.youtube.com/watch?v=bW_BILl7n0Y", kind: video }
          - id: udp-use-cases
            title: When UDP wins
            summary: "UDP sends data with no greeting, no resending and no ordering. That makes it the right choice when speed matters more than every piece arriving."
            learn:
              - "What UDP is and what it leaves out"
              - "When late data is worse than lost data"
              - "Why video calls, games and DNS use it"
              - "How newer web traffic builds on it"
            body: |
              **UDP** is TCP's simpler sibling. It just sends each message and hopes it arrives. There is no greeting first, no resending if something is lost, and no putting things back in order.

              If TCP is a tracked parcel with a signature, UDP is shouting across a room. Fast and simple, but if someone misses a word, you do not repeat it.

              ### Key ideas
              - No setup, so the first message goes out straight away
              - No guarantee: the sender does not know whether a message arrived
              - Very little extra data attached to each message
              - Best when late data is useless: video calls, voice calls, live streams and online games
              - **DNS**, the internet's phone book, often uses UDP because a question and answer each fit in a single message
              - **QUIC**, the newer way to carry web traffic (used by HTTP/3), runs on UDP and adds its own reliability on top

              ### Example
              On a video call, a frame from half a second ago is no use any more. Waiting for it to be resent would freeze the picture. It is better to skip it and show the next one. That is why calls use UDP, and why a bad connection makes the picture blocky rather than paused.

              ### TCP vs UDP
              | | TCP | UDP |
              |---|---|---|
              | Setup | Handshake first | None |
              | Lost data | Resent | Gone |
              | Order | Kept | Not kept |
              | Good for | Web pages, email, downloads | Calls, games, live video |

              ### Go deeper
              The technical detail is in [Transport in depth](/roadmaps/networking/transport-in-depth) on the Networking roadmap.
            resources:
