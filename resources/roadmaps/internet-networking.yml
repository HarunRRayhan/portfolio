      - id: ddos
        title: DDoS and how it is stopped
        summary: "Attacks that flood a service with traffic from many machines at once, and how large networks spread out and absorb that flood."
        lessons:
          - id: ddos-attack-types
            title: Volumetric, protocol and application attacks
            summary: "A DDoS attack floods a service from many machines at once. Some attacks clog the line, some wear out the servers, and some swamp the app with fake visitors."
            learn:
              - "What a DDoS attack is"
              - "Attacks that clog the connection"
              - "Attacks that exhaust servers"
              - "Attacks that look like real visitors"
            body: |
              A **DDoS** (distributed denial of service) attack uses many machines at once, often thousands of hijacked computers and gadgets called a **botnet**, to flood a target so real users cannot get through.

              Picture a shop. You can stop customers getting in by jamming the road outside, by tying up the staff with nonsense, or by sending in crowds of fake shoppers. DDoS attacks come in the same three kinds.

              ### The three kinds
              | Kind | What it does | Shop analogy |
              |------|--------------|--------------|
              | **Volumetric** | Sends more traffic than the connection can carry | Jamming the road |
              | **Protocol** | Uses up the servers' memory for half-started conversations | Tying up the staff |
              | **Application** | Sends real-looking requests for heavy pages or searches | Fake shoppers |

              ### Key ideas
              - **Amplification** is a common volumetric trick. The attacker sends small questions to open servers on the internet, pretending to be the victim. The servers send large replies to the victim. A little effort becomes a huge flood
              - A **SYN flood** starts many connections and never finishes them, filling the server's list of conversations. Servers have defences built in for this
              - Application attacks are the hardest to spot, because each request looks like a normal visitor

              ### Why it matters
              Each kind needs a different defence. A firewall at your own building does not help if the road outside is already jammed before the traffic reaches you.

              ### Go deeper
              Rate limiting and web application firewalls are covered in [Firewalls](/roadmaps/networking/firewalls) on the Networking roadmap.
            resources:
              - { label: "What is a DDoS attack? (Cloudflare)", url: "https://www.cloudflare.com/learning/ddos/what-is-a-ddos-attack/", kind: article }
              - { label: "SYN flood attack (Cloudflare)", url: "https://www.cloudflare.com/learning/ddos/syn-flood-ddos-attack/", kind: article }
              - { label: "Denial-of-service attack (Wikipedia)", url: "https://en.wikipedia.org/wiki/Denial-of-service_attack", kind: article }
              - { label: "SYN flood (Wikipedia)", url: "https://en.wikipedia.org/wiki/SYN_flood", kind: article }
