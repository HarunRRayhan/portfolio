slug: internet-networking
title: How the Internet Works
summary: From what a network is to how BGP holds the whole internet together. Learn the layers in order, one topic at a time.
order: 1
category: foundations
updated: '2026-11-15'
icon: globe
color: sky
logos:
  - /images/logos/cloudflare-workers.svg
  - /images/tech/linux.svg

stages:
  - level: beginner
    title: The basics
    topics:
      - id: what-is-a-network
        title: What a network is
        summary: Two or more devices that can send data to each other, and how many small networks join into the internet.
        lessons:
          - id: lan-vs-wan
            title: LAN vs WAN
            summary: The difference between the network in your home or office and the wide-area links that join distant sites.
            learn:
              - What makes a network local
              - What a WAN connects and who runs it
            resources:
              - { label: "What is a LAN? (Cloudflare)", url: "https://www.cloudflare.com/learning/network-layer/what-is-a-lan/", kind: article }
              - { label: "What is a WAN? (Cloudflare)", url: "https://www.cloudflare.com/learning/network-layer/what-is-a-wan/", kind: article }
          - id: network-devices
            title: Routers, switches and modems
            summary: The three boxes that move your traffic, and the job each one does.
            learn:
              - Switches connect devices inside one network
              - Routers move traffic between networks
              - Modems connect you to your ISP
            resources:
              - { label: "What is routing? (Cloudflare)", url: "https://www.cloudflare.com/learning/network-layer/what-is-routing/", kind: article }
              - { label: "Network switch (Wikipedia)", url: "https://en.wikipedia.org/wiki/Network_switch", kind: article }
          - id: network-of-networks
            title: The internet as a network of networks
            summary: There is no single internet owner. It is many independent networks agreeing to carry each other's traffic.
            learn:
              - ISPs and how they connect
              - Why no one company runs the internet
            resources:
              - { label: "What is the Internet? (Cloudflare)", url: "https://www.cloudflare.com/learning/network-layer/what-is-the-internet/", kind: article }
          - id: mac-addresses-and-ethernet
            title: MAC addresses and Ethernet
            optional: true
            summary: How devices on the same local network find each other at the link layer, before IP comes into play.
            learn:
              - What a MAC address is
              - Ethernet frames
              - ARP maps IP addresses to MAC addresses
            resources:
              - { label: "MAC address (Wikipedia)", url: "https://en.wikipedia.org/wiki/MAC_address", kind: article }
              - { label: "Address Resolution Protocol (Wikipedia)", url: "https://en.wikipedia.org/wiki/Address_Resolution_Protocol", kind: article }

      - id: ip-addresses
        title: IP addresses
        summary: Every device on a network needs an address so packets know where to go.
        lessons:
          - id: ipv4-format
            title: The IPv4 address format
            summary: Four numbers from 0 to 255, what they mean and why there are only about 4 billion of them.
            learn:
              - Dotted decimal notation
              - 32 bits and the size of the address space
            resources:
              - { label: "Internet Protocol (Cloudflare)", url: "https://www.cloudflare.com/learning/network-layer/internet-protocol/", kind: article }
              - { label: "RFC 791: Internet Protocol", url: "https://www.rfc-editor.org/rfc/rfc791", kind: docs }
          - id: public-vs-private-ip
            title: Public vs private addresses
            summary: Some address ranges are reserved for private networks and never appear on the public internet.
            learn:
              - The 10/8, 172.16/12 and 192.168/16 ranges
              - Why your laptop's address differs from what websites see
            resources:
              - { label: "What is my IP address? (Cloudflare)", url: "https://www.cloudflare.com/learning/dns/glossary/what-is-my-ip-address/", kind: article }
              - { label: "RFC 1918: private address space", url: "https://www.rfc-editor.org/rfc/rfc1918", kind: docs }
          - id: dhcp
            title: How your device gets an address (DHCP)
            summary: When you join a Wi-Fi network, a DHCP server hands you an address, a gateway and DNS servers.
            learn:
              - Discover, offer, request, acknowledge
              - Leases and renewals
              - What else DHCP hands out
            resources:
              - { label: "Dynamic Host Configuration Protocol (Wikipedia)", url: "https://en.wikipedia.org/wiki/Dynamic_Host_Configuration_Protocol", kind: article }
              - { label: "RFC 2131: DHCP", url: "https://www.rfc-editor.org/rfc/rfc2131", kind: docs }

      - id: packets
        title: Packets
        summary: Data travels in small chunks with a header that says where each chunk is going.
        lessons:
          - id: why-packets
            title: Why data is split into packets
            summary: Packet switching lets many conversations share the same wires, and lets lost pieces be resent alone.
            learn:
              - Packet switching vs circuit switching
              - Packets can take different paths
            resources:
              - { label: "What is a packet? (Cloudflare)", url: "https://www.cloudflare.com/learning/network-layer/what-is-a-packet/", kind: article }
          - id: headers-and-payload
            title: Headers vs payload
            summary: Each layer wraps the data in its own header. Learn to read what an IP header carries.
            learn:
              - Source and destination address
              - TTL and why packets do not loop forever
              - Encapsulation, layer by layer
            resources:
              - { label: "What is a packet? (Cloudflare)", url: "https://www.cloudflare.com/learning/network-layer/what-is-a-packet/", kind: article }
              - { label: "Wireshark (packet capture tool)", url: "https://www.wireshark.org/", kind: tool }
          - id: mtu
            title: MTU and fragmentation
            optional: true
            summary: Every link has a maximum packet size. Packets that are too big get split or dropped, which causes odd bugs.
            learn:
              - The common 1500-byte MTU
              - Fragmentation and path MTU discovery
              - Why VPNs and tunnels lower the MTU
            resources:
              - { label: "What is MTU? (Cloudflare)", url: "https://www.cloudflare.com/learning/network-layer/what-is-mtu/", kind: article }

      - id: ports
        title: Ports
        summary: One address, many programs. Ports tell the machine which program a packet is for.
        lessons:
          - id: well-known-ports
            title: Well-known ports
            summary: The port numbers every engineer should recognise on sight.
            learn:
              - 80 and 443 for HTTP and HTTPS
              - 22 for SSH, 53 for DNS
              - Ports for common databases
            resources:
              - { label: "What is a computer port? (Cloudflare)", url: "https://www.cloudflare.com/learning/network-layer/what-is-a-computer-port/", kind: article }
              - { label: "List of TCP and UDP port numbers (Wikipedia)", url: "https://en.wikipedia.org/wiki/List_of_TCP_and_UDP_port_numbers", kind: article }
          - id: source-and-destination-ports
            title: Source vs destination port
            summary: A connection is identified by two addresses and two ports. The client side picks a random high port.
            learn:
              - Ephemeral ports
              - The connection 4-tuple
            resources:
              - { label: "What is a computer port? (Cloudflare)", url: "https://www.cloudflare.com/learning/network-layer/what-is-a-computer-port/", kind: article }
          - id: firewalls-and-ports
            title: Why firewalls care about ports
            summary: Opening or closing a port decides which services the outside world can reach.
            learn:
              - Inbound vs outbound rules
              - Closing everything you do not serve
            resources:
              - { label: "What is a firewall? (Cloudflare)", url: "https://www.cloudflare.com/learning/security/what-is-a-firewall/", kind: article }

      - id: client-server
        title: Clients and servers
        summary: Most of the web is a client asking and a server answering. Know who does what.
        lessons:
          - id: request-response
            title: Request and response
            summary: The client starts the conversation, the server answers. Almost every protocol you will meet follows this shape.
            learn:
              - Who opens the connection
              - Stateless request and response
            resources:
              - { label: "An overview of HTTP (MDN)", url: "https://developer.mozilla.org/en-US/docs/Web/HTTP/Overview", kind: docs }
          - id: client-vs-server-side
            title: Client-side vs server-side work
            summary: Some work runs in the browser, some on the server. Knowing which is which explains a lot of web behaviour.
            learn:
              - What runs in the browser
              - What must stay on the server
            resources:
              - { label: "Client-side vs server-side (Cloudflare)", url: "https://www.cloudflare.com/learning/serverless/glossary/client-side-vs-server-side/", kind: article }
          - id: reverse-proxies
            title: Proxies and reverse proxies
            optional: true
            summary: Servers that sit in the middle, forwarding requests on behalf of clients or in front of other servers.
            learn:
              - Forward proxy vs reverse proxy
              - Why most sites sit behind one
            resources:
              - { label: "What is a reverse proxy? (Cloudflare)", url: "https://www.cloudflare.com/learning/cdn/glossary/reverse-proxy/", kind: article }

      - id: dns-basics
        title: DNS
        summary: How a name like harun.dev turns into an IP address before anything else can happen.
        lessons:
          - id: dns-resolution
            title: How a lookup works
            summary: A resolver walks from the root to the TLD to the authoritative server to find the answer.
            learn:
              - Recursive resolvers
              - Root, TLD and authoritative servers
            resources:
              - { label: "What is DNS? (Cloudflare)", url: "https://www.cloudflare.com/learning/dns/what-is-dns/", kind: article }
              - { label: "DNS server types (Cloudflare)", url: "https://www.cloudflare.com/learning/dns/dns-server-types/", kind: article }
              - { label: "How DNS works (comic)", url: "https://howdns.works/", kind: article }
          - id: dns-records
            title: Record types
            summary: The records you will set most often and what each one points to.
            learn:
              - A and AAAA
              - CNAME, MX and TXT
              - NS records and delegation
            resources:
              - { label: "DNS records (Cloudflare)", url: "https://www.cloudflare.com/learning/dns/dns-records/", kind: article }
              - { label: "Mess With DNS (hands-on)", url: "https://messwithdns.net/", kind: tool }
          - id: dns-ttl-caching
            title: TTL and caching
            summary: Answers are cached at every step, which is why a DNS change can take time to show up.
            learn:
              - What TTL controls
              - Lowering TTL before a migration
            resources:
              - { label: "What is time-to-live (TTL)? (Cloudflare)", url: "https://www.cloudflare.com/learning/cdn/glossary/time-to-live-ttl/", kind: article }
          - id: dns-security
            title: DNSSEC and encrypted DNS
            optional: true
            summary: Plain DNS can be spoofed and read in transit. DNSSEC signs answers; DoH and DoT encrypt the query.
            learn:
              - What DNSSEC proves and what it does not
              - DNS over HTTPS and DNS over TLS
            resources:
              - { label: "How DNSSEC works (Cloudflare)", url: "https://www.cloudflare.com/learning/dns/dnssec/how-dnssec-works/", kind: article }
              - { label: "DNS over TLS vs DNS over HTTPS (Cloudflare)", url: "https://www.cloudflare.com/learning/dns/dns-over-tls/", kind: article }
              - { label: "RFC 1035: DNS", url: "https://www.rfc-editor.org/rfc/rfc1035", kind: docs }

      - id: http-basics
        title: HTTP
        summary: The language browsers and servers speak. Methods, status codes and headers.
        lessons:
          - id: http-methods
            title: Methods
            summary: GET reads, POST creates, PUT and PATCH update, DELETE removes. And which ones are safe to retry.
            learn:
              - GET, POST, PUT, PATCH, DELETE
              - Safe and idempotent methods
            resources:
              - { label: "HTTP request methods (MDN)", url: "https://developer.mozilla.org/en-US/docs/Web/HTTP/Methods", kind: docs }
          - id: http-status-codes
            title: Status codes
            summary: The three-digit number that says how the request went.
            learn:
              - 2xx success, 3xx redirect
              - 4xx client error, 5xx server error
              - 301 vs 302, 401 vs 403
            resources:
              - { label: "HTTP response status codes (MDN)", url: "https://developer.mozilla.org/en-US/docs/Web/HTTP/Status", kind: docs }
          - id: http-headers-cookies
            title: Headers and cookies
            summary: Headers carry metadata both ways. Cookies are how a stateless protocol remembers you.
            learn:
              - Common request and response headers
              - Set-Cookie and cookie flags
            resources:
              - { label: "HTTP headers (MDN)", url: "https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers", kind: docs }
              - { label: "Using HTTP cookies (MDN)", url: "https://developer.mozilla.org/en-US/docs/Web/HTTP/Cookies", kind: docs }
          - id: http-caching
            title: HTTP caching
            optional: true
            summary: Cache-Control and ETags let browsers and CDNs reuse responses instead of asking again.
            learn:
              - Cache-Control directives
              - ETags and conditional requests
            resources:
              - { label: "HTTP caching (MDN)", url: "https://developer.mozilla.org/en-US/docs/Web/HTTP/Caching", kind: docs }
              - { label: "RFC 9110: HTTP semantics", url: "https://www.rfc-editor.org/rfc/rfc9110", kind: docs }

      - id: how-a-page-loads
        title: What happens when you open a website
        summary: Put it all together, from typing a URL to pixels on screen.
        lessons:
          - id: url-to-response
            title: From URL to response
            summary: The full chain of steps before the first byte of HTML arrives.
            learn:
              - DNS lookup
              - TCP connect and TLS handshake
              - HTTP request and response
            resources:
              - { label: "What happens when... (GitHub)", url: "https://github.com/alex/what-happens-when", kind: article }
              - { label: "High Performance Browser Networking (free book)", url: "https://hpbn.co/", kind: course }
          - id: browser-rendering
            title: How the browser renders the page
            summary: Parsing HTML, fetching CSS and scripts, building the page and painting it.
            learn:
              - Parsing, the DOM and the CSSOM
              - Layout and paint
              - Why some resources block rendering
            resources:
              - { label: "How browsers work (MDN)", url: "https://developer.mozilla.org/en-US/docs/Web/Performance/How_browsers_work", kind: docs }
          - id: measuring-page-load
            title: Measuring a page load
            optional: true
            summary: Use the browser's network tab to see each step and where the time goes.
            learn:
              - Reading a waterfall
              - DNS, connect, TLS and wait times
            resources:
              - { label: "Chrome DevTools: Network panel", url: "https://developer.chrome.com/docs/devtools/network", kind: docs }
              - { label: "High Performance Browser Networking (free book)", url: "https://hpbn.co/", kind: course }

  - level: intermediate
    title: How the pieces fit
    topics:
      - id: osi-model
        title: The 7 OSI layers
        summary: A shared map of networking, from cables (layer 1) to apps (layer 7), and the TCP/IP model used in practice.
        lessons:
          - id: osi-seven-layers
            title: What each layer does
            summary: Physical, data link, network, transport, session, presentation and application, one sentence each.
            learn:
              - The job of each of the 7 layers
              - Where common protocols sit
            resources:
              - { label: "What is the OSI model? (Cloudflare)", url: "https://www.cloudflare.com/learning/ddos/glossary/open-systems-interconnection-model-osi/", kind: article }
          - id: tcp-ip-model
            title: OSI vs the TCP/IP model
            summary: The real internet uses a simpler four-layer model. Learn how the two map onto each other.
            learn:
              - The four TCP/IP layers
              - Why engineers still say "layer 4" and "layer 7"
            resources:
              - { label: "What is TCP/IP? (Cloudflare)", url: "https://www.cloudflare.com/learning/ddos/glossary/tcp-ip/", kind: article }
          - id: icmp-and-diagnostics
            title: ICMP, ping and traceroute
            optional: true
            summary: The network layer's own messages, and the two tools that use them to debug connectivity.
            learn:
              - What ICMP carries
              - How ping and traceroute work
            resources:
              - { label: "What is ICMP? (Cloudflare)", url: "https://www.cloudflare.com/learning/ddos/glossary/internet-control-message-protocol-icmp/", kind: article }
              - { label: "Traceroute (Wikipedia)", url: "https://en.wikipedia.org/wiki/Traceroute", kind: article }

      - id: tcp-vs-udp
        title: TCP vs UDP
        summary: Reliable, ordered delivery vs fast, fire-and-forget. When each one wins.
        lessons:
          - id: tcp-handshake
            title: The TCP three-way handshake
            summary: SYN, SYN-ACK, ACK. How a connection starts, and what that costs in round trips.
            learn:
              - The handshake step by step
              - Closing a connection
              - Why latency hurts new connections
            resources:
              - { label: "Building blocks of TCP (High Performance Browser Networking)", url: "https://hpbn.co/building-blocks-of-tcp/", kind: course }
              - { label: "RFC 9293: TCP", url: "https://www.rfc-editor.org/rfc/rfc9293", kind: docs }
          - id: tcp-reliability
            title: Retransmission and congestion control
            summary: How TCP notices lost packets, resends them and slows down when the network is full.
            learn:
              - Acknowledgements and retransmits
              - Slow start and congestion windows
            resources:
              - { label: "Building blocks of TCP (High Performance Browser Networking)", url: "https://hpbn.co/building-blocks-of-tcp/", kind: course }
              - { label: "RFC 5681: TCP congestion control", url: "https://www.rfc-editor.org/rfc/rfc5681", kind: docs }
          - id: udp-use-cases
            title: When UDP wins
            summary: No handshake and no resends. Why DNS, games, video calls and QUIC use UDP.
            learn:
              - What UDP leaves out
              - Apps that prefer late data to no data
            resources:
              - { label: "What is UDP? (Cloudflare)", url: "https://www.cloudflare.com/learning/ddos/glossary/user-datagram-protocol-udp/", kind: article }
              - { label: "Building blocks of UDP (High Performance Browser Networking)", url: "https://hpbn.co/building-blocks-of-udp/", kind: course }
          - id: socket-programming
            title: Socket programming
            optional: true
            summary: Write a tiny TCP client and server yourself to see the handshake and ports in action.
            learn:
              - Sockets, bind, listen, accept, connect
              - Reading and writing bytes
            resources:
              - { label: "Beej's Guide to Network Programming", url: "https://beej.us/guide/bgnet/", kind: course }

      - id: tls-https
        title: TLS and HTTPS
        summary: How a browser and a server agree on keys and prove who they are before sending anything private.
        lessons:
          - id: tls-handshake
            title: The TLS handshake
            summary: Client and server agree on a cipher and a shared key in one round trip with TLS 1.3.
            learn:
              - Client hello and server hello
              - Key exchange
            resources:
              - { label: "What happens in a TLS handshake? (Cloudflare)", url: "https://www.cloudflare.com/learning/ssl/what-happens-in-a-tls-handshake/", kind: article }
              - { label: "The Illustrated TLS 1.3 Connection", url: "https://tls13.xargs.org/", kind: article }
          - id: certificates-and-cas
            title: Certificates and certificate authorities
            summary: A certificate proves a server owns a name. A chain of trust ends at a CA your device already trusts.
            learn:
              - What a certificate contains
              - Certificate chains and root CAs
              - Free certificates with Let's Encrypt
            resources:
              - { label: "What is HTTPS? (Cloudflare)", url: "https://www.cloudflare.com/learning/ssl/what-is-https/", kind: article }
              - { label: "How Let's Encrypt works", url: "https://letsencrypt.org/how-it-works/", kind: docs }
          - id: tls-versions
            title: TLS 1.3 vs older versions
            optional: true
            summary: What changed in TLS 1.3, and why old versions should be turned off.
            learn:
              - Fewer round trips
              - Removed weak ciphers
            resources:
              - { label: "Why use TLS 1.3? (Cloudflare)", url: "https://www.cloudflare.com/learning/ssl/why-use-tls-1.3/", kind: article }
              - { label: "RFC 8446: TLS 1.3", url: "https://www.rfc-editor.org/rfc/rfc8446", kind: docs }
          - id: private-cas
            title: Private certificate authorities
            optional: true
            summary: Internal services can use certificates from your own CA, as long as every client trusts it.
            learn:
              - When a private CA makes sense
              - Watching certificate expiry
            resources:
              - post: agentcore-gateway-private-ca-without-the-alb
              - { label: "What is an SSL certificate? (Cloudflare)", url: "https://www.cloudflare.com/learning/ssl/what-is-an-ssl-certificate/", kind: article }

      - id: subnets-cidr
        title: Subnets and CIDR
        summary: Splitting address space into smaller networks, and reading notation like 10.0.0.0/16.
        lessons:
          - id: subnet-masks
            title: Subnet masks
            summary: The mask says which part of the address names the network and which part names the host.
            learn:
              - Network and host bits
              - 255.255.255.0 as a /24
            resources:
              - { label: "What is a subnet? (Cloudflare)", url: "https://www.cloudflare.com/learning/network-layer/what-is-a-subnet/", kind: article }
          - id: cidr-notation
            title: CIDR notation
            summary: Read a /16 or a /28 and know how many addresses it holds.
            learn:
              - Prefix length
              - Counting addresses in a block
            resources:
              - { label: "Subnet calculator", url: "https://www.subnet-calculator.com/cidr.php", kind: tool }
              - { label: "RFC 4632: CIDR", url: "https://www.rfc-editor.org/rfc/rfc4632", kind: docs }
          - id: planning-vpc-subnets
            title: Planning subnets for a VPC
            summary: Pick ranges that leave room to grow and do not clash with other networks you will connect to.
            learn:
              - Public and private subnets per zone
              - Avoiding overlapping ranges
            resources:
              - { label: "VPC CIDR blocks (AWS docs)", url: "https://docs.aws.amazon.com/vpc/latest/userguide/vpc-cidr-blocks.html", kind: docs }

      - id: nat
        title: NAT
        summary: How a whole house or office shares one public IP address.
        lessons:
          - id: source-nat
            title: Source NAT and port mapping
            summary: The router rewrites your private address to its public one and remembers which port belongs to whom.
            learn:
              - The NAT translation table
              - Port address translation
            resources:
              - { label: "Network address translation (Wikipedia)", url: "https://en.wikipedia.org/wiki/Network_address_translation", kind: article }
              - { label: "RFC 3022: traditional NAT", url: "https://www.rfc-editor.org/rfc/rfc3022", kind: docs }
          - id: nat-inbound
            title: Why NAT breaks inbound connections
            summary: Nobody outside can start a connection to a device behind NAT, unless you forward a port or punch a hole.
            learn:
              - Port forwarding
              - NAT traversal for peer-to-peer apps
            resources:
              - { label: "Network address translation (Wikipedia)", url: "https://en.wikipedia.org/wiki/Network_address_translation", kind: article }
          - id: cloud-nat-gateways
            title: NAT gateways in the cloud
            optional: true
            summary: Private servers in a cloud network use a NAT gateway to reach the internet, and it is billed per gigabyte.
            learn:
              - Outbound-only access for private subnets
              - Why NAT gateway traffic gets expensive
            resources:
              - { label: "NAT gateways (AWS docs)", url: "https://docs.aws.amazon.com/vpc/latest/userguide/vpc-nat-gateway.html", kind: docs }

      - id: routing
        title: Routing
        summary: How each router picks the next hop, and how packets cross many networks to reach you.
        lessons:
          - id: routing-tables
            title: Routing tables and default routes
            summary: Each router looks up the destination and sends the packet to the most specific match.
            learn:
              - Longest prefix match
              - The default route
            resources:
              - { label: "What is routing? (Cloudflare)", url: "https://www.cloudflare.com/learning/network-layer/what-is-routing/", kind: article }
          - id: hops-and-traceroute
            title: Hops and traceroute
            summary: See every router your packets pass through on their way to a server.
            learn:
              - Reading traceroute output
              - Why some hops show as stars
            resources:
              - { label: "Traceroute (Wikipedia)", url: "https://en.wikipedia.org/wiki/Traceroute", kind: article }
          - id: static-vs-dynamic-routing
            title: Static vs dynamic routing
            optional: true
            summary: Routes typed in by hand vs routes learned from protocols like OSPF and BGP.
            learn:
              - When static routes are enough
              - Interior vs exterior routing protocols
            resources:
              - { label: "What is routing? (Cloudflare)", url: "https://www.cloudflare.com/learning/network-layer/what-is-routing/", kind: article }

      - id: cdns
        title: CDNs
        summary: Copies of content close to users so pages load fast and origins stay calm.
        lessons:
          - id: edge-caching
            title: Edge caching and cache keys
            summary: A CDN stores responses at the edge and decides what counts as "the same request" with a cache key.
            learn:
              - Cache hits and misses
              - What goes into a cache key
            resources:
              - { label: "What is a CDN? (Cloudflare)", url: "https://www.cloudflare.com/learning/cdn/what-is-a-cdn/", kind: article }
              - { label: "What is caching? (Cloudflare)", url: "https://www.cloudflare.com/learning/cdn/what-is-caching/", kind: article }
          - id: cdn-setup
            title: Putting a CDN in front of an app
            summary: Point your domain at the CDN, set the origin and choose what gets cached.
            learn:
              - Origins and distributions
              - Caching static files first
            resources:
              - post: add-cloudfront-cdn-distribution-to-wordpress-application-hosted-on-amazon-lightsail
              - { label: "What is Amazon CloudFront? (AWS docs)", url: "https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/Introduction.html", kind: docs }
          - id: purging-and-shielding
            title: Purging, TTLs and origin shielding
            optional: true
            summary: Keep cached content fresh and stop a cache miss storm from hammering your origin.
            learn:
              - Purging by URL or prefix
              - Origin shield as a second cache layer
            resources:
              - { label: "What is time-to-live (TTL)? (Cloudflare)", url: "https://www.cloudflare.com/learning/cdn/glossary/time-to-live-ttl/", kind: article }
              - { label: "Using Origin Shield (AWS docs)", url: "https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/origin-shield.html", kind: docs }

      - id: load-balancers
        title: Load balancers
        summary: Spreading traffic over many servers, and the algorithms that decide who gets the next request.
        lessons:
          - id: l4-vs-l7
            title: Layer 4 vs layer 7 load balancing
            summary: Balance raw TCP connections, or read each HTTP request and route on its path or headers.
            learn:
              - What each layer can see
              - TLS termination at the load balancer
            resources:
              - { label: "What is load balancing? (Cloudflare)", url: "https://www.cloudflare.com/learning/performance/what-is-load-balancing/", kind: article }
              - post: add-lightsail-load-balancer-to-application-hosted-in-amazon-lightsail-instances
          - id: lb-algorithms
            title: Balancing algorithms
            summary: Round robin, least connections, hashing and more, and when each one fits.
            learn:
              - Round robin and weighted round robin
              - Least connections
              - IP hash and consistent hashing
            resources:
              - post: eight-load-balancer-algorithms
              - { label: "Types of load balancing algorithms (Cloudflare)", url: "https://www.cloudflare.com/learning/performance/types-of-load-balancing-algorithms/", kind: article }
          - id: health-checks
            title: Health checks
            summary: The load balancer keeps asking each server if it is alive and stops sending traffic to the ones that fail.
            learn:
              - Active health checks
              - What a good health endpoint checks
            resources:
              - { label: "Target group health checks (AWS docs)", url: "https://docs.aws.amazon.com/elasticloadbalancing/latest/application/target-group-health-checks.html", kind: docs }
          - id: consistent-hashing
            title: Consistent hashing
            optional: true
            summary: Spread keys over servers so adding or removing one only moves a small share of them.
            learn:
              - The hash ring
              - Why caches and sticky routing use it
            resources:
              - { label: "Consistent hashing (Wikipedia)", url: "https://en.wikipedia.org/wiki/Consistent_hashing", kind: article }

  - level: advanced
    title: How the internet holds together
    topics:
      - id: autonomous-systems
        title: Autonomous systems
        summary: The internet is about 100,000 networks, each run by someone, each with its own number.
        lessons:
          - id: what-is-an-asn
            title: What an AS and an ASN are
            summary: An autonomous system is one network under one routing policy, identified by a number.
            learn:
              - Who gets an ASN
              - Looking up the AS behind an IP
            resources:
              - { label: "What is an autonomous system? (Cloudflare)", url: "https://www.cloudflare.com/learning/network-layer/what-is-an-autonomous-system/", kind: article }
              - { label: "Hurricane Electric BGP Toolkit", url: "https://bgp.he.net/", kind: tool }
          - id: transit-vs-peering
            title: Transit vs peering
            summary: Networks either pay someone to carry their traffic everywhere, or swap traffic with each other for free.
            learn:
              - Paid transit
              - Settlement-free peering
              - Tier 1 networks
            resources:
              - { label: "What is an autonomous system? (Cloudflare)", url: "https://www.cloudflare.com/learning/network-layer/what-is-an-autonomous-system/", kind: article }
              - { label: "Peering (Wikipedia)", url: "https://en.wikipedia.org/wiki/Peering", kind: article }

      - id: bgp
        title: BGP
        summary: The protocol networks use to tell each other which addresses they can reach. The internet's routing map.
        lessons:
          - id: bgp-announcements
            title: How BGP announcements spread
            summary: Each network announces its prefixes to neighbours, who pass them on with their own AS added to the path.
            learn:
              - Prefixes and the AS path
              - Sessions between neighbours
            resources:
              - { label: "What is BGP? (Cloudflare)", url: "https://www.cloudflare.com/learning/security/glossary/what-is-bgp/", kind: article }
          - id: bgp-path-selection
            title: Path selection
            summary: When a router hears many routes to the same prefix, it picks one by a fixed list of rules.
            learn:
              - Local preference and AS path length
              - Why the shortest path is not always chosen
            resources:
              - { label: "What is BGP? (Cloudflare)", url: "https://www.cloudflare.com/learning/security/glossary/what-is-bgp/", kind: article }
              - { label: "RFC 4271: BGP-4", url: "https://www.rfc-editor.org/rfc/rfc4271", kind: docs }
          - id: bgp-hijacks-rpki
            title: Hijacks, route leaks and RPKI
            summary: BGP trusts what neighbours say. Learn how that goes wrong and how RPKI signs who may announce what.
            learn:
              - BGP hijacks and route leaks
              - Route origin validation with RPKI
            resources:
              - { label: "What is BGP hijacking? (Cloudflare)", url: "https://www.cloudflare.com/learning/security/glossary/bgp-hijacking/", kind: article }
              - { label: "Is BGP safe yet? (Cloudflare)", url: "https://isbgpsafeyet.com/", kind: tool }
          - id: bgp-rfc
            title: Reading the BGP-4 spec
            optional: true
            summary: Go to the source. The message types, the state machine and the decision process in the RFC.
            learn:
              - OPEN, UPDATE, KEEPALIVE and NOTIFICATION
              - The BGP finite state machine
            resources:
              - { label: "RFC 4271: BGP-4", url: "https://www.rfc-editor.org/rfc/rfc4271", kind: docs }
              - { label: "RFC 6811: BGP prefix origin validation", url: "https://www.rfc-editor.org/rfc/rfc6811", kind: docs }

      - id: internet-exchange-points
        title: Internet exchange points
        summary: The buildings where networks plug into each other directly.
        lessons:
          - id: why-ixps
            title: Why IXPs make traffic cheaper and faster
            summary: Connecting at one shared place lets networks skip paid transit and shorten paths.
            learn:
              - The shared switching fabric
              - Local traffic staying local
            resources:
              - { label: "What is an IXP? (Cloudflare)", url: "https://www.cloudflare.com/learning/cdn/glossary/internet-exchange-point-ixp/", kind: article }
          - id: public-vs-private-peering
            title: Public vs private peering
            summary: Peering over the shared IXP fabric vs a direct cable between two networks.
            learn:
              - Route servers at an IXP
              - Private network interconnects
            resources:
              - { label: "Internet exchange point (Wikipedia)", url: "https://en.wikipedia.org/wiki/Internet_exchange_point", kind: article }
              - { label: "PeeringDB", url: "https://www.peeringdb.com/", kind: tool }

      - id: anycast
        title: Anycast
        summary: One IP address announced from many places, so users reach the closest one.
        lessons:
          - id: anycast-vs-unicast
            title: Anycast vs unicast
            summary: Unicast is one address, one place. Anycast is one address announced from many places at once.
            learn:
              - How BGP makes anycast work
              - What "closest" really means
            resources:
              - { label: "What is an anycast network? (Cloudflare)", url: "https://www.cloudflare.com/learning/cdn/glossary/anycast-network/", kind: article }
          - id: anycast-in-practice
            title: How DNS and CDNs use anycast
            summary: Root DNS servers, public resolvers and CDNs all use anycast for speed and resilience.
            learn:
              - Anycast DNS
              - Failover by withdrawing a route
            resources:
              - { label: "What is an anycast network? (Cloudflare)", url: "https://www.cloudflare.com/learning/cdn/glossary/anycast-network/", kind: article }
              - { label: "Cloudflare blog", url: "https://blog.cloudflare.com/", kind: article }

      - id: ipv6
        title: IPv6
        summary: 128-bit addresses, why we ran out of IPv4, and how both run side by side.
        lessons:
          - id: ipv6-addresses
            title: The IPv6 address format
            summary: Eight groups of hex digits, shortening rules and the common prefixes.
            learn:
              - Reading and shortening addresses
              - Link-local and global addresses
            resources:
              - { label: "IPv6 (Wikipedia)", url: "https://en.wikipedia.org/wiki/IPv6", kind: article }
              - { label: "RFC 4291: IPv6 addressing", url: "https://www.rfc-editor.org/rfc/rfc4291", kind: docs }
          - id: dual-stack
            title: Dual stack
            summary: Running IPv4 and IPv6 at the same time, and how clients pick one.
            learn:
              - A and AAAA records together
              - Happy Eyeballs
            resources:
              - { label: "RFC 8305: Happy Eyeballs v2", url: "https://www.rfc-editor.org/rfc/rfc8305", kind: docs }
          - id: ipv6-no-nat
            title: No NAT by default
            optional: true
            summary: With enough addresses for everything, IPv6 drops NAT, so firewalls do the protecting.
            learn:
              - Global addresses on every device
              - Firewalling without NAT
            resources:
              - { label: "RFC 8200: IPv6", url: "https://www.rfc-editor.org/rfc/rfc8200", kind: docs }

      - id: quic-http3
        title: QUIC and HTTP/3
        summary: HTTP over UDP, with TLS built in and no head-of-line blocking.
        lessons:
          - id: http2-and-hol-blocking
            title: What was wrong with TCP for the web
            summary: HTTP/2 put many requests on one TCP connection, so one lost packet stalls them all.
            learn:
              - HTTP/1.1 vs HTTP/2
              - Head-of-line blocking
            resources:
              - { label: "HTTP/2 vs HTTP/1.1 (Cloudflare)", url: "https://www.cloudflare.com/learning/performance/http2-vs-http1.1/", kind: article }
          - id: quic-streams
            title: How QUIC streams work
            summary: QUIC runs over UDP with independent streams and TLS 1.3 inside the handshake.
            learn:
              - Independent streams
              - Faster connection setup
            resources:
              - { label: "What is HTTP/3? (Cloudflare)", url: "https://www.cloudflare.com/learning/performance/what-is-http3/", kind: article }
              - { label: "RFC 9000: QUIC", url: "https://www.rfc-editor.org/rfc/rfc9000", kind: docs }
          - id: connection-migration
            title: Connection migration
            optional: true
            summary: A QUIC connection survives a change of IP, such as moving from Wi-Fi to mobile data.
            learn:
              - Connection IDs
              - Why TCP cannot do this
            resources:
              - { label: "RFC 9000: QUIC", url: "https://www.rfc-editor.org/rfc/rfc9000", kind: docs }
              - { label: "RFC 9114: HTTP/3", url: "https://www.rfc-editor.org/rfc/rfc9114", kind: docs }

      - id: ddos
        title: DDoS and how it is stopped
        summary: Floods of traffic at every layer, and how edge networks soak them up.
        lessons:
          - id: ddos-attack-types
            title: Volumetric, protocol and application attacks
            summary: Attacks that fill the pipe, exhaust connection state, or overload the app with real-looking requests.
            learn:
              - Amplification attacks
              - SYN floods
              - Layer 7 floods
            resources:
              - { label: "What is a DDoS attack? (Cloudflare)", url: "https://www.cloudflare.com/learning/ddos/what-is-a-ddos-attack/", kind: article }
              - { label: "SYN flood attack (Cloudflare)", url: "https://www.cloudflare.com/learning/ddos/syn-flood-ddos-attack/", kind: article }
          - id: rate-limiting-and-wafs
            title: Rate limiting and WAFs
            summary: Block and slow abusive traffic before it reaches your app.
            learn:
              - Rate limits per IP or key
              - Managed WAF rules and bot control
            resources:
              - post: aws-waf-cloudfront-solo-dev
              - { label: "What is rate limiting? (Cloudflare)", url: "https://www.cloudflare.com/learning/bots/what-is-rate-limiting/", kind: article }
          - id: anycast-ddos
            title: Why anycast helps
            optional: true
            summary: Spreading one address across many data centres splits an attack into many small ones.
            learn:
              - Absorbing traffic at the edge
              - Hiding the origin
            resources:
              - { label: "What is an anycast network? (Cloudflare)", url: "https://www.cloudflare.com/learning/cdn/glossary/anycast-network/", kind: article }
