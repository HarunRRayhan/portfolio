              - { label: "Starlink network update and performance (Starlink)", url: "https://starlink.com/updates/network-update", kind: docs }
              - { label: "A transport protocol's view of Starlink (APNIC blog)", url: "https://blog.apnic.net/2024/05/17/a-transport-protocols-view-of-starlink/", kind: article }
              - { label: "Starlink satellite map (satellitemap.space)", url: "https://satellitemap.space/", kind: tool }
          - id: viasat-vs-starlink
            title: Viasat vs Starlink, and why Starlink feels faster
            summary: "The two side by side. Starlink wins mostly on delay, because its satellites are about 65 times closer, and it has far more capacity in orbit."
            learn:
              - "A side-by-side comparison of high and low orbit service"
              - "The four reasons Starlink feels faster"
              - "Where Viasat still makes sense"
            body: |
              | | Viasat (high orbit) | Starlink (low orbit) |
              |---|---|---|
              | Height | 35,786 km | about 550 km |
              | Round-trip delay | 600 ms or more | 25 to 60 ms |
              | Typical download | 25 to 150 Mbps | 50 to 250 Mbps |
              | Satellites | a handful, very large | thousands, small |
              | Dish | fixed, pointed once | flat, aims itself electronically |
              | Area each satellite covers | about a third of Earth | a small area, moving |
              | Near the poles | poor | covered |
              | Upgrades | a new satellite every few years | launches every few days |

              ### Why Starlink is faster
              1. **Distance.** 35,786 ÷ 550 is about 65. Starlink's satellites are about 65 times closer, so the round trip drops from about half a second to tens of milliseconds. This is the biggest difference you feel
              2. **Delay adds up.** Opening a web page takes several back-and-forth exchanges: finding the site's address, opening a connection, setting up encryption, then asking for the page. At 600 ms each, that is two to three seconds before anything appears. At 40 ms it is under a fifth of a second
              3. **More capacity in orbit.** Thousands of satellites, each with many beams over small areas, add up to far more than a few high-orbit satellites, so each user has more to share
              4. **Faster upgrades.** SpaceX launches new satellite versions constantly. A high-orbit operator gets one new design every few years

              The speed number is the smallest part of the gap. A 100 Mbps Viasat plan and a 100 Mbps Starlink plan download a big file at a similar speed, but anything interactive, like browsing or calls, feels completely different.

              ### Where high orbit still makes sense
              - Wide coverage with few satellites, such as aircraft and ships over oceans
              - Sending the same thing to everyone, such as satellite TV
              - Places where Starlink is not licensed

              ### Both lose to fiber
              Fiber gives 1 to 10 ms of delay, gigabit speeds both ways, no weather problems and no sharing a beam with a whole region. Satellite is for places fiber cannot reach.
