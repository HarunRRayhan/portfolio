      - id: tls-https
        title: TLS and HTTPS
        summary: "What the padlock means: how your browser and a website set up a private connection and how the site proves it is who it says it is."
        lessons:
          - id: tls-handshake
            title: The TLS handshake
            summary: "Before a secure site sends anything private, your browser and the server agree on a secret key and the server proves who it is. This is the TLS handshake."
            learn:
              - "What TLS and HTTPS are"
              - "What the padlock in your browser means"
              - "How two strangers agree on a secret in public"
              - "Why old recorded traffic stays safe"
            body: |
              **HTTPS** is the web with a lock on it. The S stands for secure, and the lock is a technology called **TLS**. It does two jobs: it scrambles your data so no one in between can read it, and it proves you are talking to the real website.

              When you see the padlock next to the address, the handshake worked. Your passwords, card details and messages travel scrambled.

              ### What the handshake does
              Before any page is sent, the browser and the server have a short exchange:
              1. **Browser**: "Hello. Here are the ways of encrypting I support, and my half of a key"
              2. **Server**: "Let's use this one. Here is my half of the key, my certificate (my ID card), and proof that it really is mine"
              3. Both sides combine the halves into the same secret key. From then on, everything is scrambled with it

              With the current version of TLS, this takes one round trip.

              ### Key ideas
              - The clever part: the two halves can be sent in the open, yet someone watching cannot work out the secret from them
              - A fresh secret is made for every visit. Even if the server's long-term key leaks years later, recorded old traffic stays unreadable. This is called **forward secrecy**
              - The certificate is what proves the server is really that website
              - After the handshake, encryption is very fast, so HTTPS barely slows browsing

              ### Example
              On café Wi-Fi, anyone on the same network could try to watch your traffic. With HTTPS they can see which site you visit, but not the pages, passwords or messages.

              ### Common mistakes
              - Thinking the padlock means a site is honest. It only means the connection is private and the name matches. Scam sites can have padlocks too

              ### Go deeper
              The technical detail is in [TLS in depth](/roadmaps/networking/tls-in-depth) on the Networking roadmap.
            resources:
              - { label: "What happens in a TLS handshake? (Cloudflare)", url: "https://www.cloudflare.com/learning/ssl/what-happens-in-a-tls-handshake/", kind: article }
              - { label: "The Illustrated TLS 1.3 Connection", url: "https://tls13.xargs.org/", kind: article }
              - { label: "RFC 8446: The Transport Layer Security (TLS) Protocol Version 1.3", url: "https://www.rfc-editor.org/rfc/rfc8446", kind: docs }
              - { label: "Transport Layer Security (High Performance Browser Networking)", url: "https://hpbn.co/transport-layer-security-tls/", kind: course }
              - { label: "TLS handshake explained (Computerphile)", url: "https://www.youtube.com/watch?v=86cQJ0MMses", kind: video }
              - { label: "TLS handshake, everything that happens when you visit an HTTPS site (Practical Networking)", url: "https://www.youtube.com/watch?v=ZkL10eoG1PY", kind: video }
              - { label: "Transport Layer Security (MDN)", url: "https://developer.mozilla.org/en-US/docs/Web/Security/Transport_Layer_Security", kind: docs }
              - { label: "How HTTPS works, an illustrated comic (howhttps.works)", url: "https://howhttps.works/", kind: article }
              - { label: "SSL Server Test (Qualys SSL Labs)", url: "https://www.ssllabs.com/ssltest/", kind: tool }
          - id: certificates-and-cas
            title: Certificates and certificate authorities
            summary: "A certificate is a website's ID card. It proves the server you reached really belongs to that name, and it is vouched for by an organisation your device already trusts."
            learn:
              - "What a certificate proves"
              - "Who issues certificates and why your device trusts them"
              - "How the chain of trust works"
              - "Why browsers show warnings, and free certificates from Let's Encrypt"
            body: |
              A **certificate** is a website's ID card. It says "this server really is harun.dev" and carries the key the server uses to set up the secure connection.

              Like a passport, it is only worth something because a trusted body issued it. For websites, that body is a **certificate authority (CA)**: an organisation that checks you really control a domain before signing your certificate.

              ### What is on it
              - The website names it covers
              - The key used to set up encryption
              - Who issued it
              - The dates it is valid between
              - The issuer's signature, which cannot be forged

              ### The chain of trust
              Your phone and computer come with a built-in list of **root CAs** they trust. Root CAs rarely sign websites directly. Instead they vouch for a middle authority, which signs the website. Your browser follows the chain: website, middle authority, root. If it ends at a root on the list, the padlock appears.

              It is like a reference: you trust a stranger because a friend you trust vouches for them.

              ### Key ideas
              - **Let's Encrypt** is a free CA, and renewing can be fully automatic. It is a big reason most of the web now uses HTTPS
              - A browser warning appears if a certificate has expired, is for a different name, or was signed by someone not on the trusted list
              - A certificate proves the name, not that the business is honest

              ### In practice
              Click the padlock in your browser's address bar and open the certificate details. You can see who it was issued to, who issued it and when it expires.

              ### Common mistakes
              - Clicking past a certificate warning. On a real site, it may mean someone is in the middle
              - Site owners renewing by hand and forgetting, so the site suddenly shows warnings

              ### Go deeper
              The technical detail is in [TLS in depth](/roadmaps/networking/tls-in-depth) on the Networking roadmap.
            resources:
              - { label: "What is HTTPS? (Cloudflare)", url: "https://www.cloudflare.com/learning/ssl/what-is-https/", kind: article }
              - { label: "How Let's Encrypt works", url: "https://letsencrypt.org/how-it-works/", kind: docs }
              - { label: "Public key certificate (Wikipedia)", url: "https://en.wikipedia.org/wiki/Public_key_certificate", kind: article }
              - { label: "Chain of trust and root certificates (Let's Encrypt)", url: "https://letsencrypt.org/certificates/", kind: docs }
              - { label: "RFC 8555: ACME, Automatic Certificate Management Environment", url: "https://www.rfc-editor.org/rfc/rfc8555", kind: docs }
              - { label: "How Certificate Transparency works (certificate.transparency.dev)", url: "https://certificate.transparency.dev/", kind: article }
              - { label: "crt.sh: search Certificate Transparency logs", url: "https://crt.sh/", kind: tool }
              - { label: "Certificates and certificate authorities explained (Hussein Nasser)", url: "https://www.youtube.com/watch?v=x_I6Qc35PuQ", kind: video }
              - { label: "badssl.com: test pages for broken and odd certificates", url: "https://badssl.com/", kind: tool }

      - id: cdns
        title: CDNs
        summary: Copies of content close to users so pages load fast and origins stay calm.
        lessons:
          - id: edge-caching
            title: Edge caching and cache keys
            summary: "A CDN keeps copies of a website on servers around the world, so you are served from one nearby instead of from far away."
            learn:
              - "What a CDN and edge servers are"
              - "Why a nearby copy makes sites faster"
              - "Hits and misses"
              - "How the CDN decides two requests are the same"
            body: |
              A **CDN** (content delivery network) is a network of servers spread around the world, often in hundreds of cities. These are called **edge** servers. They keep copies of a website's files, and each visitor is sent to one close by.

              Think of a popular book. Instead of everyone travelling to one central library, every town has a branch with copies on the shelf.

              ### Why it is faster
              Data cannot travel faster than light, and every connection needs several round trips. A server in your own city answers in a few milliseconds. One on another continent might take a hundred times longer. A CDN cuts the distance.

              It also protects the website's own server, called the **origin**. If a million people want the same image, the CDN serves it and the origin barely notices.

              ### Key ideas
              - A **hit**: the nearby server already has a fresh copy and answers at once
              - A **miss**: it does not, so it fetches from the origin, then keeps a copy for the next person
              - The CDN needs a rule for when two requests count as the same. This is the **cache key**, usually the site name and the full address of the page
              - Anything that makes addresses look different, even for the same file, means more misses

              ### Example
              A video goes viral. The first viewer in London causes a miss. Everyone else in London after that gets a hit from a server in London.

              ### Common mistakes
              - Caching personal pages, so one person sees another person's account
              - Tracking tags added to links (like the ones newsletters add) making every visit look like a new page, so the cache rarely hits
            resources:
              - { label: "What is a CDN? (Cloudflare)", url: "https://www.cloudflare.com/learning/cdn/what-is-a-cdn/", kind: article }
              - { label: "What is caching? (Cloudflare)", url: "https://www.cloudflare.com/learning/cdn/what-is-caching/", kind: article }
              - { label: "Content delivery network (Wikipedia)", url: "https://en.wikipedia.org/wiki/Content_delivery_network", kind: article }
              - { label: "Cache Keys (Cloudflare docs)", url: "https://developers.cloudflare.com/cache/how-to/cache-keys/", kind: docs }
              - { label: "Understand the cache key (AWS)", url: "https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/understanding-the-cache-key.html", kind: docs }
              - { label: "HTTP caching (MDN)", url: "https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/Caching", kind: docs }
              - { label: "RFC 9111: HTTP Caching", url: "https://www.rfc-editor.org/rfc/rfc9111", kind: docs }
              - { label: "Vary header (MDN)", url: "https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Headers/Vary", kind: docs }
              - { label: "Default cache behavior (Cloudflare docs)", url: "https://developers.cloudflare.com/cache/concepts/default-cache-behavior/", kind: docs }
              - { label: "What is a CDN? How does it work? (ByteByteGo)", url: "https://www.youtube.com/watch?v=RI9np1LWzqw", kind: video }
          - id: cdn-setup
            title: Putting a CDN in front of an app
            summary: "To use a CDN, a website sends its visitors to the CDN first and tells the CDN where the real server is."
            learn:
              - "How visitors get sent to the CDN"
              - "The origin: the website's real server"
              - "Start by caching images, styles and scripts"
              - "Keep the real server hidden behind the CDN"
            body: |
              Putting a CDN in front of a website is mostly about changing directions. Visitors are sent to the CDN instead of straight to the website's own server. The CDN then fetches from that server when it needs to.

              It is like a shop opening a front counter. Customers talk to the counter staff, who fetch things from the stockroom only when the counter runs out.

              ### How it works
              - The site owner changes the site's **DNS** entry, its listing in the internet's phone book, so the name now points to the CDN
              - The owner tells the CDN where the **origin** is: the real server, or a storage space holding the files
              - From then on, visitors reach the CDN, and the CDN reaches the origin

              ### Key ideas
              - Start by caching **static files**: images, fonts, styles and scripts. They are the same for everyone, so they are safe and give the biggest win
              - Be careful with the pages themselves and anything personal. Keep those uncached or cached only briefly until you are sure
              - Use HTTPS for both legs: visitor to CDN, and CDN to origin
              - Make sure the origin only accepts traffic from the CDN. Otherwise people can go around it, skipping its speed and protection

              ### Example
              A small business site hosted in one city feels slow for visitors abroad. After adding a CDN, its images and styles come from servers near each visitor, and the page feels much faster everywhere.

              ### In practice
              Many CDNs, such as Cloudflare, have a free tier and a setup wizard that walks you through the DNS change.
            resources:
              - { label: "Content delivery networks (web.dev)", url: "https://web.dev/articles/content-delivery-networks", kind: article }
              - { label: "Get started with Cloudflare Cache (Cloudflare docs)", url: "https://developers.cloudflare.com/cache/get-started/", kind: docs }
              - { label: "Get started with a standard CloudFront distribution (AWS docs)", url: "https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/GettingStarted.SimpleDistribution.html", kind: docs }
              - { label: "What is Azure Front Door? (Microsoft Learn)", url: "https://learn.microsoft.com/en-us/azure/frontdoor/front-door-overview", kind: docs }
              - { label: "Prevent unnecessary network requests with the HTTP cache (web.dev)", url: "https://web.dev/articles/http-cache", kind: article }
              - { label: "CDN, Content Delivery Network, explained (PowerCert)", url: "https://www.youtube.com/watch?v=nhhfSBm6v4A", kind: video }
              - post: add-cloudfront-cdn-distribution-to-wordpress-application-hosted-on-amazon-lightsail
              - { label: "What is Amazon CloudFront? (AWS docs)", url: "https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/Introduction.html", kind: docs }
              - { label: "Cloud CDN overview (Google Cloud)", url: "https://cloud.google.com/cdn/docs/overview", kind: docs }
          - id: purging-and-shielding
            title: Purging, TTLs and origin shielding
            optional: true
            summary: "When a site changes, old copies on the CDN must be cleared out. A middle layer of cache stops all those servers from rushing the real server at once."
            learn:
              - "Why cached copies go out of date"
              - "Clearing copies: one page, a group, or everything"
              - "Naming files so they never need clearing"
              - "How a shield layer protects the real server"
            body: |
              A CDN keeps copies so it can answer fast. The catch: when the website changes, those copies are out of date. Someone has to clear them out.

              ### Purging
              **Purging** tells the CDN to throw away its copies, so the next visitor gets a fresh one from the real server (the **origin**). You can purge one page, a group of pages, or everything.

              Purging everything sounds tidy, but it means every edge server around the world asks the origin at the same moment. A small server can buckle under that sudden rush. Clearing only what changed is better.

              ### Avoiding the problem
              - Give copies a sensible lifetime, so old ones expire on their own
              - Put a fingerprint in each file's name, so a changed file gets a new name. Then the old copy simply stops being used and nothing needs purging

              ### Shielding
              An **origin shield** (also called tiered cache) adds a middle layer. Edge servers that miss ask the shield first, and only the shield goes to the origin.

              Think of a chain of shops. Instead of every branch phoning the factory, they all call one regional warehouse, and only the warehouse calls the factory.

              ### Key ideas
              - Clear only what changed, not everything
              - Fingerprinted file names need no clearing
              - A shield turns many identical requests into one request to the origin
              - It protects the origin from a **miss storm**: a flood of misses right after a purge or when a cache starts empty
              - The trade-off: a miss takes a little longer, and it may cost extra

              ### Example
              A news site corrects a headline and clears just that article. Readers see the fix within seconds, and the rest of the site keeps serving from the cache.
            resources:
              - { label: "What is time-to-live (TTL)? (Cloudflare)", url: "https://www.cloudflare.com/learning/cdn/glossary/time-to-live-ttl/", kind: article }
              - { label: "Using Origin Shield (AWS docs)", url: "https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/origin-shield.html", kind: docs }
              - { label: "Purge cache (Cloudflare docs)", url: "https://developers.cloudflare.com/cache/how-to/purge-cache/", kind: docs }
              - { label: "Tiered Cache (Cloudflare docs)", url: "https://developers.cloudflare.com/cache/how-to/tiered-cache/", kind: docs }
              - { label: "Invalidate files to remove content (CloudFront docs)", url: "https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/Invalidation.html", kind: docs }
              - { label: "Manage how long content stays in the cache (CloudFront docs)", url: "https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/Expiration.html", kind: docs }
              - { label: "Shielding (Fastly docs)", url: "https://www.fastly.com/documentation/guides/concepts/shielding/", kind: docs }
              - { label: "RFC 5861: stale-while-revalidate and stale-if-error", url: "https://www.rfc-editor.org/rfc/rfc5861", kind: docs }
              - { label: "Cache-Control header (MDN)", url: "https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Headers/Cache-Control", kind: docs }
              - { label: "CloudFront caching behaviors: cache keys, TTL and Origin Shield (CloudWolf AWS)", url: "https://www.youtube.com/watch?v=rrpREiIAcHE", kind: video }

      - id: autonomous-systems
        title: Autonomous systems
        summary: The internet is about 100,000 networks, each run by someone, each with its own number.
        lessons:
          - id: what-is-an-asn
            title: What an AS and an ASN are
            summary: "The internet is not one network. It is tens of thousands of separate networks, each run by someone and each known by its own number."
            learn:
              - "What an autonomous system is"
              - "Who runs one, from your ISP to a cloud provider"
              - "Why each one gets a number (an ASN)"
              - "How to see which network owns an address"
            body: |
              The word "internet" means "between networks". There is no single company that runs it. It is a patchwork of separate networks that agree to connect.

              Each of those networks is called an **autonomous system (AS)**. "Autonomous" because one organisation runs it and decides its own rules for where traffic goes. Your home ISP is one. So are Google, Amazon, your mobile carrier, many universities and big banks. About 80,000 of them show up in the internet's global map of routes.

              Think of them as countries on a map. Each has its own government and its own roads, and border crossings where it meets its neighbours.

              ### Key ideas
              - Every AS has an **ASN** (autonomous system number), like a country code. Cloudflare is AS13335, for example
              - Numbers are handed out by five **regional internet registries**, one for each part of the world (for example RIPE NCC for Europe, ARIN for North America)
              - Usually only organisations that connect to more than one provider need their own ASN. A small business just uses its ISP's
              - Every public IP address belongs to a block that some AS tells the rest of the internet it can reach

              ### Example
              When you open a website, your request leaves your ISP's network, may cross one or two other networks, and arrives at the network that hosts the site. Each of those is a separate AS with its own number.

              ### Try it
              Search for a free lookup site such as bgp.he.net, type in an IP address like 1.1.1.1, and it shows the network that owns it, its ASN and its neighbours.

              ### Go deeper
              The technical detail is in [BGP in depth](/roadmaps/networking/bgp-in-depth) on the Networking roadmap.
            resources:
              - { label: "What is an autonomous system? (Cloudflare)", url: "https://www.cloudflare.com/learning/network-layer/what-is-an-autonomous-system/", kind: article }
              - { label: "Hurricane Electric BGP Toolkit", url: "https://bgp.he.net/", kind: tool }
              - { label: "Autonomous system (Internet) (Wikipedia)", url: "https://en.wikipedia.org/wiki/Autonomous_system_(Internet)", kind: article }
              - { label: "Autonomous System Numbers (ARIN)", url: "https://www.arin.net/resources/guide/asn/", kind: docs }
              - { label: "RFC 1930: Guidelines for creation, selection and registration of an AS", url: "https://www.rfc-editor.org/rfc/rfc1930", kind: docs }
              - { label: "RFC 6793: BGP support for four-octet AS numbers", url: "https://www.rfc-editor.org/rfc/rfc6793", kind: docs }
              - { label: "Autonomous System Numbers registry (IANA)", url: "https://www.iana.org/assignments/as-numbers/as-numbers.xhtml", kind: docs }
              - { label: "AS Numbers (RIPE NCC)", url: "https://www.ripe.net/manage-ips-and-asns/as-numbers/", kind: docs }
              - { label: "AS Rank: ranking networks by customer cone (CAIDA)", url: "https://asrank.caida.org/", kind: tool }
              - { label: "32-bit ASN allocation report (Geoff Huston, potaroo)", url: "https://www.potaroo.net/tools/asn32/", kind: tool }
          - id: transit-vs-peering
            title: Transit vs peering
            summary: "Networks reach the rest of the internet in two ways: they pay a bigger network to carry their traffic, or they agree to swap traffic directly, often for free."
            learn:
              - "Transit: paying for access to everywhere"
              - "Peering: swapping traffic directly with another network"
              - "What makes a Tier 1 network special"
              - "Why most networks use both"
            body: |
              No network connects to everyone by itself. So networks make deals with each other, and those deals come in two kinds.

              **Transit** is paid. A smaller network pays a larger one to carry its traffic to the whole internet, and to bring the whole internet's traffic back. It is like a small shop paying a courier company that can deliver anywhere in the world.

              **Peering** is a swap. Two networks agree to pass traffic directly between their own customers. When both sides gain about equally, nobody pays. This is called **settlement-free** peering. It is like two neighbouring shops agreeing to deliver each other's parcels on the same street, with no courier in between.

              ### Key ideas
              - Transit: you pay, and you can reach everything
              - Peering: you reach only the other network and its customers, usually for free
              - Peering is cheaper and often a shorter, faster path
              - A **Tier 1** network is so big and well connected that it can reach every other network through peering alone. It never has to buy transit
              - Most networks mix the two: peer where it is cheap, buy transit for the rest

              ### Example
              A small ISP buys transit from a large carrier so its customers can reach any site. It also peers directly with a big video service, because so much of its customers' traffic is video. That video now arrives faster and costs the ISP nothing extra.

              ### Why it matters
              These business deals shape the path your data takes. Traffic between two networks in the same city can still travel far away if they have no direct deal.

              ### Go deeper
              The technical detail is in [BGP in depth](/roadmaps/networking/bgp-in-depth) on the Networking roadmap.
            resources:
              - { label: "What is an autonomous system? (Cloudflare)", url: "https://www.cloudflare.com/learning/network-layer/what-is-an-autonomous-system/", kind: article }
              - { label: "Peering (Wikipedia)", url: "https://en.wikipedia.org/wiki/Peering", kind: article }
              - { label: "Tier 1 network (Wikipedia)", url: "https://en.wikipedia.org/wiki/Tier_1_network", kind: article }
              - { label: "PeeringDB", url: "https://www.peeringdb.com/", kind: tool }
              - { label: "Internet transit (Wikipedia)", url: "https://en.wikipedia.org/wiki/Internet_transit", kind: article }
              - { label: "The relative cost of bandwidth around the world (Cloudflare)", url: "https://blog.cloudflare.com/the-relative-cost-of-bandwidth-around-the-world/", kind: article }
              - { label: "AS Rank: who buys transit from whom (CAIDA)", url: "https://asrank.caida.org/", kind: tool }
              - { label: "Tutorial: A Complete Guide To Peering (NANOG)", url: "https://www.youtube.com/watch?v=kJW4OpBI2zI", kind: video }
              - { label: "Architecting Robust BGP Routing Policies (NANOG)", url: "https://www.youtube.com/watch?v=_wRvNINnSQg", kind: video }

      - id: bgp
        title: BGP
        summary: "The system big networks use to tell each other which addresses they can reach. It is the internet's shared, constantly updated map of routes."
        lessons:
          - id: bgp-announcements
            title: How BGP announcements spread
            summary: "Networks tell their neighbours which addresses they can reach, and each neighbour passes the news on. That is BGP, and it is how the internet builds its map."
            learn:
              - "What BGP is for"
              - "How an announcement spreads from network to network"
              - "What the path list shows"
              - "What happens when a route disappears"
            body: |
              Your ISP has to know how to reach every address on the internet. Nobody hands it a complete map. Instead, the map is built by gossip.

              That gossip system is **BGP** (Border Gateway Protocol). Each network tells its direct neighbours, "I can reach these addresses." Those neighbours pass the news on to their own neighbours, and so on, until almost every network on the internet has heard it.

              The addresses are announced in blocks called **prefixes**, such as all addresses starting with 203.0.113. One announcement covers the whole block.

              ### Key ideas
              - Each time an announcement passes through a network, that network adds its own number to a list called the **AS path**. The list shows which networks the traffic would cross
              - A network that sees its own number already in the list ignores it. That stops traffic going round in circles
              - Each network chooses which routes to accept and pass on, based on its own business deals
              - When a network can no longer reach a block, it sends a **withdrawal**, which spreads the same way

              ### Example
              Imagine a message passed from village to village: "The bakery is this way, via villages C, B and A." Each village adds its own name before passing it on. A traveller can follow the chain back to the bakery, and can tell how many villages lie in between.

              ### A real outage
              On 4 October 2021, Facebook, Instagram and WhatsApp disappeared for about six hours. A command run during routine maintenance cut the links between Facebook's data centres. Facebook's own DNS servers (the ones that tell the world where facebook.com lives) saw that and stopped announcing their addresses through BGP. To the rest of the internet, those servers simply vanished, so no one could even look up the sites. Engineers also lost their remote tools and had to fix it on site.

              ### Go deeper
              The technical detail is in [BGP in depth](/roadmaps/networking/bgp-in-depth) on the Networking roadmap.
            resources:
              - { label: "What is BGP? (Cloudflare)", url: "https://www.cloudflare.com/learning/security/glossary/what-is-bgp/", kind: article }
              - { label: "Border Gateway Protocol (Wikipedia)", url: "https://en.wikipedia.org/wiki/Border_Gateway_Protocol", kind: article }
              - { label: "RFC 4271: A Border Gateway Protocol 4 (BGP-4)", url: "https://www.rfc-editor.org/rfc/rfc4271", kind: docs }
              - { label: "Tutorial: BGP 101 (NANOG)", url: "https://www.youtube.com/watch?v=tKcPNgKJBkA", kind: video }
              - { label: "Understanding how Facebook disappeared from the Internet (Cloudflare)", url: "https://blog.cloudflare.com/october-2021-facebook-outage/", kind: article }
              - { label: "More details about the October 4 outage (Meta Engineering)", url: "https://engineering.fb.com/2021/10/05/networking-traffic/outage-details/", kind: article }
              - { label: "Why was Facebook down for five hours? (Ben Eater)", url: "https://www.youtube.com/watch?v=-wMU8vmfaYo", kind: video }
              - { label: "BGPlay: replay prefix announcements over time (RIPEstat)", url: "https://stat.ripe.net/widget/bgplay", kind: tool }
              - { label: "Routing Information Service collectors (RIPE NCC)", url: "https://www.ripe.net/analyse/internet-measurements/routing-information-service-ris/", kind: docs }
          - id: bgp-hijacks-rpki
            title: Hijacks, route leaks and RPKI
            summary: "BGP mostly believes what neighbours say. When a network announces addresses it does not own, traffic goes to the wrong place. RPKI is a signed record of who may announce what."
            learn:
              - "Why BGP is built on trust"
              - "What a hijack and a route leak are"
              - "Real incidents that took sites offline"
              - "How RPKI helps, and where it stops"
            body: |
              BGP was designed when the internet was a small club of people who trusted each other. A network can announce almost any block of addresses, and its neighbours often accept it.

              That leaves two ways for things to go wrong:
              - A **hijack**: a network announces addresses it does not own, by mistake or on purpose. Traffic for those addresses flows to it instead
              - A **route leak**: a network passes routes on to neighbours it should not, often because a filter was set up wrong. Traffic takes a strange detour, sometimes through a network too small to carry it

              It is like someone putting up fake road signs. Drivers follow them in good faith and end up in the wrong town.

              ### Real incidents
              - In 2008 a Pakistani ISP took YouTube offline for hours worldwide by announcing YouTube's addresses
              - In 2018 attackers hijacked traffic for an Amazon DNS service to steal cryptocurrency
              - In 2019 a leak sent a big share of traffic through a small network and caused outages

              ### Key ideas
              - **RPKI** lets the owner of an address block publish a signed record (called a **ROA**) that says which network is allowed to announce it
              - Networks that check these records reject announcements that do not match. This is called **route origin validation**
              - RPKI checks who started the route, not every network along the way
              - It only protects traffic as far as networks actually turn it on

              ### Why it matters
              A hijack can take a well-run site offline without touching its servers at all. The weak point is the map, not the building.

              ### Go deeper
              The technical detail is in [BGP in depth](/roadmaps/networking/bgp-in-depth) on the Networking roadmap.
            resources:
              - { label: "What is BGP hijacking? (Cloudflare)", url: "https://www.cloudflare.com/learning/security/glossary/bgp-hijacking/", kind: article }
              - { label: "Is BGP safe yet? (Cloudflare)", url: "https://isbgpsafeyet.com/", kind: tool }
              - { label: "BGP hijacking (Wikipedia)", url: "https://en.wikipedia.org/wiki/BGP_hijacking", kind: article }
              - { label: "Resource Public Key Infrastructure (Wikipedia)", url: "https://en.wikipedia.org/wiki/Resource_Public_Key_Infrastructure", kind: article }
              - { label: "YouTube hijacking: a RIPE NCC RIS case study (RIPE NCC)", url: "https://www.ripe.net/publications/news/industry-developments/youtube-hijacking-a-ripe-ncc-ris-case-study", kind: article }
              - { label: "How Verizon and a BGP optimizer knocked large parts of the Internet offline (Cloudflare)", url: "https://blog.cloudflare.com/how-verizon-and-a-bgp-optimizer-knocked-large-parts-of-the-internet-offline-today/", kind: article }
              - { label: "A brief history of the Internet's biggest BGP incidents (Kentik)", url: "https://www.kentik.com/blog/a-brief-history-of-the-internets-biggest-bgp-incidents/", kind: article }
              - { label: "RPKI: the required cryptographic upgrade to BGP routing (Cloudflare)", url: "https://blog.cloudflare.com/rpki/", kind: article }
              - { label: "Mutually Agreed Norms for Routing Security (MANRS)", url: "https://manrs.org/", kind: docs }
              - { label: "Tutorial: RPKI-Based BGP Origin Validation Workshop (NANOG)", url: "https://www.youtube.com/watch?v=Pxsk5stzJCs", kind: video }

      - id: internet-exchange-points
        title: Internet exchange points
        summary: The buildings where networks plug into each other directly.
        lessons:
          - id: why-ixps
            title: Why IXPs make traffic cheaper and faster
            summary: "An internet exchange point is a building where many networks plug into the same equipment and swap traffic directly. That makes the internet cheaper and faster."
            learn:
              - "What happens inside an exchange point"
              - "How it saves networks money"
              - "Why local traffic should stay local"
              - "Who joins and why"
            body: |
              An **internet exchange point (IXP)** is a building, or a group of buildings, full of network switches where many networks plug in and swap traffic directly. Famous ones include DE-CIX in Frankfurt, AMS-IX in Amsterdam and LINX in London.

              Think of it as a big train station where many rail companies share the platforms. Passengers change trains right there, instead of travelling to another city just to switch lines.

              Without an IXP, two networks in the same city might send traffic to each other through a paid provider in another country. With one, they plug into the same switch and the traffic stays in town.

              ### Key ideas
              - Each member rents a port on a shared set of switches, called the **switching fabric**
              - Traffic swapped at the IXP skips paid transit, which saves money
              - Shorter paths mean less delay, so pages and calls feel quicker
              - Local traffic stays local, so a broken undersea cable hurts less
              - Most IXPs are run as non-profits or co-ops by their members
              - Content networks and CDNs join to be close to many ISPs at once

              ### Example
              A Kenyan ISP and a local news site both join a local IXP. Readers in Nairobi now get the news site from across town, instead of over a long link to Europe and back.

              ### Try it
              Public directories such as PeeringDB list exchange points and the networks that join them. Look up the one nearest to you.
            resources:
              - { label: "What is an IXP? (Cloudflare)", url: "https://www.cloudflare.com/learning/cdn/glossary/internet-exchange-point-ixp/", kind: article }
              - { label: "Internet exchange point (Wikipedia)", url: "https://en.wikipedia.org/wiki/Internet_exchange_point", kind: article }
              - { label: "Internet Exchange Map (TeleGeography)", url: "https://www.internetexchangemap.com/", kind: tool }
              - { label: "An Introduction to IXPs and Peering (LINX)", url: "https://www.youtube.com/watch?v=hJU3f6Ez52Q", kind: video }
              - { label: "Internet Exchange Points (Internet Society)", url: "https://www.internetsociety.org/issues/ixps/", kind: article }
              - { label: "European Internet Exchange Association (Euro-IX)", url: "https://www.euro-ix.net/", kind: docs }
              - { label: "Internet Exchange Directory (PCH)", url: "https://www.pch.net/ixp/dir", kind: tool }
              - { label: "PeeringDB: who is present at which IXP", url: "https://www.peeringdb.com/", kind: tool }
              - { label: "What is an Internet Exchange? (Iron Mountain Data Centers)", url: "https://www.youtube.com/watch?v=gUZF23RC8wM", kind: video }
          - id: public-vs-private-peering
            title: Public vs private peering
            summary: "Networks can swap traffic over the shared equipment at an exchange point, or run a private cable straight between them. Big flows get a private cable."
            learn:
              - "Peering over a shared exchange"
              - "Route servers: one connection, many partners"
              - "Private cables between two networks"
              - "Why big networks use both"
            body: |
              Once two networks agree to peer, they still have to connect. There are two ways.

              **Public peering** happens over the shared switches at an IXP. One port at the exchange lets a network reach many others. It is like a shared office mailroom: one desk, many partners.

              **Private peering**, also called a private network interconnect (PNI), is a dedicated cable between two networks, usually in the same building. It is like a private road between two warehouses: only their trucks use it.

              ### Key ideas
              - Public peering is cheap and flexible. Adding a new partner is quick, but the shared equipment can get busy
              - Many IXPs run a **route server**, a helper that lets a network exchange routes with many members through one connection instead of one per partner
              - Private peering gives dedicated capacity and more control, but needs a cable and ports for each partner
              - Large networks use private links for their biggest flows and public peering for the long tail of small partners
              - Partners sign agreements, and public peering directories help them find each other

              ### Example
              A video streaming service sends huge amounts of traffic to one big ISP, so the two run a private cable. For hundreds of smaller ISPs, it uses the shared exchange instead.

              ### Why it matters
              When a streaming service and an ISP argue over a peering deal, the link between them can fill up, and viewers see buffering even though both networks are fine on their own.
            resources:
              - { label: "Internet exchange point (Wikipedia)", url: "https://en.wikipedia.org/wiki/Internet_exchange_point", kind: article }
              - { label: "PeeringDB", url: "https://www.peeringdb.com/", kind: tool }
              - { label: "The IXP Database (Euro-IX)", url: "https://ixpdb.euro-ix.net/", kind: tool }
              - { label: "Tutorial: A Complete Guide To Peering (NANOG)", url: "https://www.youtube.com/watch?v=kJW4OpBI2zI", kind: video }
              - { label: "RFC 7947: Internet Exchange BGP Route Server", url: "https://www.rfc-editor.org/rfc/rfc7947", kind: docs }
              - { label: "RFC 7948: Internet Exchange BGP Route Server Operations", url: "https://www.rfc-editor.org/rfc/rfc7948", kind: docs }
              - { label: "MANRS for IXPs (MANRS)", url: "https://www.manrs.org/ixps/", kind: docs }
              - { label: "Colocation centre and cross-connects (Wikipedia)", url: "https://en.wikipedia.org/wiki/Colocation_centre", kind: article }

      - id: anycast
        title: Anycast
        summary: One IP address announced from many places, so users reach the closest one.
        lessons:
          - id: anycast-vs-unicast
            title: Anycast vs unicast
            summary: "Normally an address points to one place. With anycast, the same address is announced from many places at once, and each user is sent to a nearby one."
            learn:
              - "One address, one place (unicast)"
              - "One address, many places (anycast)"
              - "How the internet picks a location"
              - "Why nearest is not always nearest"
            body: |
              With **unicast**, which is how most of the internet works, an IP address belongs to one place. Every message sent to it ends up at the same machine.

              With **anycast**, the same address is announced from many locations at once. Each location tells the internet's routing system (BGP) "this address is here". Each network then sends traffic to the location that looks best from where it sits, which is usually a nearby one.

              Think of a national emergency phone number. Everyone dials the same three digits, but your call is answered by a local centre, not one office for the whole country.

              ### Key ideas
              - Unicast: one address, one destination
              - Anycast: one address, many destinations, and the network picks one for you
              - Different networks see different best routes, which is what spreads users across locations
              - "Closest" means closest by the rules networks use to choose routes, not always the shortest distance on a map or the quickest reply
              - Routes can change in the middle of a conversation, so anycast suits quick question and answer services best, or needs extra care for long ones

              ### Example
              1.1.1.1 is a public DNS service that uses anycast. Someone in Tokyo and someone in London type the same address, and each reaches a data centre near them.

              ### Go deeper
              The technical detail is in [BGP in depth](/roadmaps/networking/bgp-in-depth) on the Networking roadmap.
            resources:
              - { label: "What is an anycast network? (Cloudflare)", url: "https://www.cloudflare.com/learning/cdn/glossary/anycast-network/", kind: article }
              - { label: "Anycast (Wikipedia)", url: "https://en.wikipedia.org/wiki/Anycast", kind: article }
              - { label: "A Brief Primer on Anycast (Cloudflare)", url: "https://blog.cloudflare.com/a-brief-anycast-primer/", kind: article }
              - { label: "RFC 1546: Host Anycasting Service", url: "https://www.rfc-editor.org/rfc/rfc1546", kind: docs }
              - { label: "RFC 4786: Operation of Anycast Services", url: "https://www.rfc-editor.org/rfc/rfc4786", kind: docs }
              - { label: "RFC 7094: Architectural Considerations of IP Anycast", url: "https://www.rfc-editor.org/rfc/rfc7094", kind: docs }
              - { label: "Unicast (Wikipedia)", url: "https://en.wikipedia.org/wiki/Unicast", kind: article }
              - { label: "What is BGP Anycast? (NetActuate)", url: "https://www.youtube.com/watch?v=u9S5e71hoWg", kind: video }
              - { label: "One IP to all servers? Anycast vs Unicast (Piyush Garg)", url: "https://www.youtube.com/watch?v=jIHvQ-236OY", kind: video }
          - id: anycast-in-practice
            title: How DNS and CDNs use anycast
            summary: "DNS servers, public resolvers and CDNs use anycast so users everywhere get a fast answer, and so one broken site does not take the service down."
            learn:
              - "Why DNS loves anycast"
              - "How CDNs serve one address from many cities"
              - "Automatic failover when a site goes dark"
              - "What can go wrong"
            body: |
              Anycast shows up wherever a service wants to be fast everywhere and hard to knock over, while keeping one simple address.

              **DNS**, the internet's phone book, is the classic case. The root servers at the top of DNS and big public resolvers all use anycast. A DNS question is usually a single short message, so it does not matter if the next question lands at a different site.

              **CDNs** (networks of servers that keep copies of websites near users) use it too. One address serves visitors from the nearest data centre, and an attack on that address gets spread across many sites.

              ### Key ideas
              - Users worldwide get a quick answer from a site near them
              - **Failover** is automatic: if a site breaks or goes down for maintenance, it stops announcing the address, and traffic flows to the next nearest site
              - More sites mean more total capacity and better spread of load
              - Longer connections, like loading a web page, also work over anycast when routes stay stable or the service is built to handle a switch

              ### Example
              A chain of petrol stations shares one phone number. If one station closes for the night, calls simply go to the next one open. Callers never need a new number.

              ### Common mistakes
              - Assuming each user is served by the nearest site on a map
              - Forgetting that every site needs the same data and settings
              - Switching a site off without checking that the others can take its users

              ### Go deeper
              How networks announce and withdraw routes is covered in [BGP in depth](/roadmaps/networking/bgp-in-depth) on the Networking roadmap.
            resources:
              - { label: "What is an anycast network? (Cloudflare)", url: "https://www.cloudflare.com/learning/cdn/glossary/anycast-network/", kind: article }
              - { label: "Cloudflare blog", url: "https://blog.cloudflare.com/", kind: article }
              - { label: "RFC 4786: Operation of Anycast Services", url: "https://www.rfc-editor.org/rfc/rfc4786", kind: docs }
              - { label: "Cloudflare servers don't own IPs anymore (Cloudflare)", url: "https://blog.cloudflare.com/cloudflare-servers-dont-own-ips-anymore/", kind: article }
              - { label: "Root server instances map (root-servers.org)", url: "https://root-servers.org/", kind: tool }
              - { label: "Root name server (Wikipedia)", url: "https://en.wikipedia.org/wiki/Root_name_server", kind: article }
              - { label: "RFC 3258: Distributing authoritative name servers via shared unicast addresses", url: "https://www.rfc-editor.org/rfc/rfc3258", kind: docs }
              - { label: "RFC 7094: Architectural Considerations of IP Anycast", url: "https://www.rfc-editor.org/rfc/rfc7094", kind: docs }
              - { label: "Announcing 1.1.1.1 (Cloudflare)", url: "https://blog.cloudflare.com/announcing-1111/", kind: article }
              - { label: "Google Public DNS FAQ (Google)", url: "https://developers.google.com/speed/public-dns/faq", kind: docs }

      - id: ipv6
        title: IPv6 in practice
        summary: Running IPv6 next to IPv4, how clients choose between them, and protecting a network without NAT.
        lessons:
          - id: dual-stack
            title: Dual stack
            summary: "Most of the internet runs the old IPv4 and the new IPv6 side by side. Your device quietly tries both and uses whichever answers first."
            learn:
              - "What dual stack means"
              - "How one name can point to two kinds of address"
              - "Happy Eyeballs: how your device picks"
              - "Mistakes that leave one side open"
            body: |
              The internet is slowly moving from **IPv4**, the original address system that ran out of addresses, to **IPv6**, which has vastly more. The move cannot happen overnight, so most networks do both at once. This is called **dual stack**.

              It is like a building with two entrances during a renovation. Old and new visitors both get in, through whichever door works.

              When you look up a website name, DNS can return two answers: an **A** record with an IPv4 address and an **AAAA** record with an IPv6 address. A device that speaks both gets both and has to choose.

              ### Key ideas
              - Websites publish both kinds of address together
              - **Happy Eyeballs** is the trick devices use to choose. The device tries IPv6 first. If it does not connect within a fraction of a second, it tries IPv4 at the same time and uses whichever succeeds first
              - So a broken IPv6 path costs a tiny delay instead of a long wait
              - Both sides need the same care: security, monitoring and limits

              ### Try it
              Open your phone or laptop network settings and look at the connection details. If you see an IPv6 address alongside the IPv4 one, your connection is dual stack.

              ### Common mistakes
              - Publishing an IPv6 address for a server that is not really listening on IPv6
              - Firewall rules written for IPv4 only, leaving the IPv6 door wide open
              - Logs and rate limits that only understand IPv4 addresses

              ### Go deeper
              The technical detail is in [IPv6 in depth](/roadmaps/networking/ipv6-in-depth) on the Networking roadmap.
            resources:
              - { label: "RFC 8305: Happy Eyeballs v2", url: "https://www.rfc-editor.org/rfc/rfc8305", kind: docs }
              - { label: "IPv6 adoption statistics (Google)", url: "https://www.google.com/intl/en/ipv6/statistics.html", kind: tool }
              - { label: "Dual-stack (Wikipedia)", url: "https://en.wikipedia.org/wiki/Dual-stack", kind: article }
              - { label: "Happy Eyeballs (Wikipedia)", url: "https://en.wikipedia.org/wiki/Happy_Eyeballs", kind: article }
              - { label: "RFC 4213: Basic transition mechanisms for IPv6 hosts and routers", url: "https://www.rfc-editor.org/rfc/rfc4213", kind: docs }
              - { label: "RFC 6724: Default address selection for IPv6", url: "https://www.rfc-editor.org/rfc/rfc6724", kind: docs }
              - { label: "RFC 6555: Happy Eyeballs (v1)", url: "https://www.rfc-editor.org/rfc/rfc6555", kind: docs }
              - { label: "Test your IPv6 connectivity (test-ipv6.com)", url: "https://test-ipv6.com/", kind: tool }
              - { label: "IPv6 capability measurement by country (APNIC Labs)", url: "https://stats.labs.apnic.net/ipv6", kind: tool }
              - { label: "IPv4/IPv6 Dual-Stack on Abilene (NANOG)", url: "https://www.youtube.com/watch?v=dTEjQSViynk", kind: video }
          - id: ipv6-no-nat
            title: No NAT by default
            optional: true
            summary: "IPv6 has enough addresses for every device, so it does not need the address sharing (NAT) that IPv4 uses. A firewall does the protecting instead."
            learn:
              - "Why every device can have its own public address"
              - "Why NAT was never real security"
              - "How a firewall protects you instead"
              - "Privacy with changing addresses"
            body: |
              With IPv4 there are not enough addresses, so your home router uses **NAT** (network address translation): every device in the house shares one public address, and the router keeps track of who asked for what.

              IPv6 has so many addresses that every device can have its own public one. There is no need to share, so **NAT is not part of the design**. Traffic goes straight from your device to its destination with nothing rewritten on the way. That makes video calls, games and other direct connections simpler.

              Think of a block of flats. With NAT, all post goes to one reception desk that hands it out. With IPv6, every flat has its own letterbox on the street. That is only safe if each letterbox has a lock.

              ### Key ideas
              - Every device can have a global address
              - Protection comes from a **firewall**, not from NAT. A home router usually blocks unrequested incoming IPv6 traffic by default
              - A server you do want people to reach needs a firewall rule that lets them in
              - Devices can use **temporary addresses** that change over time, so they are harder to track
              - Private IPv6 ranges exist but are rarely used

              ### Common mistakes
              - Assuming NAT was the security, and leaving devices wide open
              - Blocking all of IPv6's control messages, which breaks IPv6 itself
              - Forgetting the firewall rule for the one service you do want to publish

              ### Go deeper
              The technical detail is in [NAT](/roadmaps/networking/nat) and [Firewalls](/roadmaps/networking/firewalls) on the Networking roadmap.
            resources:
              - { label: "RFC 8200: IPv6", url: "https://www.rfc-editor.org/rfc/rfc8200", kind: docs }
              - { label: "RFC 4890: Recommendations for Filtering ICMPv6 Messages in Firewalls", url: "https://www.rfc-editor.org/rfc/rfc4890", kind: docs }
              - { label: "RFC 4864: Local Network Protection for IPv6", url: "https://www.rfc-editor.org/rfc/rfc4864", kind: docs }
              - { label: "RFC 6092: Simple security in IPv6 customer edge equipment", url: "https://www.rfc-editor.org/rfc/rfc6092", kind: docs }
              - { label: "RFC 7084: Basic requirements for IPv6 customer edge routers", url: "https://www.rfc-editor.org/rfc/rfc7084", kind: docs }
              - { label: "RFC 8981: Temporary address extensions (privacy addresses)", url: "https://www.rfc-editor.org/rfc/rfc8981", kind: docs }
              - { label: "SP 800-119: Guidelines for the Secure Deployment of IPv6 (NIST)", url: "https://csrc.nist.gov/pubs/sp/800/119/final", kind: docs }
              - { label: "IPv6 resources and training (RIPE NCC)", url: "https://www.ripe.net/manage-ips-and-asns/ipv6/", kind: docs }

      - id: quic-http3
        title: QUIC and HTTP/3
        summary: HTTP over UDP, with TLS built in and no head-of-line blocking.
        lessons:
          - id: http2-and-hol-blocking
            title: What was wrong with TCP for the web
            summary: "HTTP/2 loads a whole page over one connection. That is quicker, until one lost packet holds up everything behind it."
            learn:
              - "How browsers loaded pages with HTTP/1.1"
              - "What HTTP/2 changed"
              - "Head-of-line blocking, in plain terms"
              - "Why the fix needed a new transport"
            body: |
              A web page is not one file. It is often dozens: text, images, styles, scripts. How the browser fetches them all matters.

              **HTTP/1.1**, the older version of the web's protocol, asks for one file at a time on each connection. So browsers open several connections to the same site to fetch in parallel.

              **HTTP/2** improved this by sending many requests at once over a single connection, each as its own **stream**. It also shrinks repeated header information. Pages got faster.

              But HTTP/2 runs on **TCP**, the protocol that makes sure data arrives complete and in order. If one packet goes missing, TCP holds back everything after it until the missing piece is resent, even data that belongs to a completely different file. This is **head-of-line blocking**.

              ### Example
              Picture one checkout lane at a supermarket serving fifty shoppers. If one shopper's item will not scan, the whole queue stops, even though everyone else's shopping is fine.

              ### Key ideas
              - HTTP/1.1: one request per connection at a time, so many connections
              - HTTP/2: many streams sharing one connection
              - On a patchy network, one lost packet stalls every stream
              - The problem lives inside TCP, so the fix needed a different transport
              - That is why **HTTP/3** moved to a new transport called QUIC

              ### Why it matters
              Mobile and Wi-Fi networks lose packets often. A page of 50 files can freeze for a moment because of one lost piece.

              ### Go deeper
              The technical detail is in [Transport in depth](/roadmaps/networking/transport-in-depth) on the Networking roadmap.
            resources:
              - { label: "HTTP/2 vs HTTP/1.1 (Cloudflare)", url: "https://www.cloudflare.com/learning/performance/http2-vs-http1.1/", kind: article }
              - { label: "Head-of-line blocking (Wikipedia)", url: "https://en.wikipedia.org/wiki/Head-of-line_blocking", kind: article }
              - { label: "RFC 9113: HTTP/2", url: "https://www.rfc-editor.org/rfc/rfc9113", kind: docs }
              - { label: "HTTP/2 (HPBN)", url: "https://hpbn.co/http2/", kind: article }
              - { label: "Head-of-line blocking in QUIC and HTTP/3: the details (Robin Marx)", url: "https://calendar.perfplanet.com/2020/head-of-line-blocking-in-quic-and-http-3-the-details/", kind: article }
              - { label: "Building blocks of TCP (High Performance Browser Networking)", url: "https://hpbn.co/building-blocks-of-tcp/", kind: article }
              - { label: "Introduction to HTTP/2 (web.dev)", url: "https://web.dev/articles/performance-http2", kind: article }
              - { label: "HTTP/3 explained (Daniel Stenberg)", url: "https://http3-explained.haxx.se/", kind: article }
              - { label: "HTTP/3 and QUIC: solving transport-layer head-of-line blocking (Last Mile Developer)", url: "https://www.youtube.com/watch?v=XMfprDkkLMU", kind: video }
          - id: quic-streams
            title: How QUIC streams work
            summary: "QUIC is a newer way to carry web traffic. It keeps each file in its own lane, so one lost packet only slows that file, and it sets up encryption faster."
            learn:
              - "What QUIC and HTTP/3 are"
              - "Independent lanes for each file"
              - "Faster, always-encrypted setup"
              - "How your browser starts using it"
            body: |
              **QUIC** is a newer transport protocol, designed at Google and now an internet standard. It does the jobs of TCP (reliable delivery) and TLS (encryption) together. **HTTP/3** is the web running on top of QUIC.

              QUIC is built on **UDP**, a simple protocol that routers already carry everywhere. That meant it could be rolled out without replacing equipment across the internet.

              Its key idea is **independent streams**. Each file travels in its own lane with its own ordering. If a packet is lost, only that lane waits for the resend. The others keep moving.

              Back at the supermarket, this is many checkout lanes instead of one. A problem at lane 3 does not stop lane 7.

              ### Key ideas
              - Encryption is set up in the same step as the connection, so there are fewer round trips before data flows
              - A returning visitor can often send data straight away
              - Traffic is always encrypted, including much of the information that TCP leaves visible
              - QUIC lives inside apps and browsers rather than the operating system, so it can be improved and updated faster
              - It rebuilds reliability and congestion control (not overloading the network) itself

              ### Try it
              Most major sites, including Google and YouTube, already serve HTTP/3. Your browser learns that a site supports it from the first visit, then switches to QUIC on later requests. You do not need to do anything.

              ### Go deeper
              The technical detail is in [Transport in depth](/roadmaps/networking/transport-in-depth) and [TLS in depth](/roadmaps/networking/tls-in-depth) on the Networking roadmap.
            resources:
              - { label: "What is HTTP/3? (Cloudflare)", url: "https://www.cloudflare.com/learning/performance/what-is-http3/", kind: article }
              - { label: "RFC 9000: QUIC", url: "https://www.rfc-editor.org/rfc/rfc9000", kind: docs }
              - { label: "The Road to QUIC (Cloudflare)", url: "https://blog.cloudflare.com/the-road-to-quic/", kind: article }
              - { label: "QUIC Working Group (IETF, quicwg.org)", url: "https://quicwg.org/", kind: docs }
              - { label: "RFC 9001: Using TLS to Secure QUIC", url: "https://www.rfc-editor.org/rfc/rfc9001", kind: docs }
              - { label: "RFC 9002: QUIC Loss Detection and Congestion Control", url: "https://www.rfc-editor.org/rfc/rfc9002", kind: docs }
              - { label: "The Illustrated QUIC Connection (quic.xargs.org)", url: "https://quic.xargs.org/", kind: article }
              - { label: "QUIC, a multiplexed transport over UDP (Chromium)", url: "https://www.chromium.org/quic/", kind: docs }
              - { label: "Head-of-line blocking in QUIC and HTTP/3: the details (Robin Marx)", url: "https://calendar.perfplanet.com/2020/head-of-line-blocking-in-quic-and-http-3-the-details/", kind: article }
          - id: connection-migration
            title: Connection migration
            optional: true
            summary: "A QUIC connection can survive your phone switching from Wi-Fi to mobile data, because it is identified by an ID rather than by your address."
            learn:
              - "Why switching networks breaks old connections"
              - "How QUIC uses a connection ID instead"
              - "Safety checks on the new path"
              - "What you notice as a user"
            body: |
              A TCP connection is identified by four things: your IP address and port, and the server's IP address and port. Leave your Wi-Fi and join mobile data, and your IP address changes. To the server, you are now a stranger. Every TCP connection breaks, and apps must reconnect and start again.

              A QUIC connection is identified by a **connection ID** instead, a label carried in every packet. When your phone changes network, it keeps using the same ID from its new address, and the server recognises it. The connection **migrates** to the new network.

              It is like a parcel tracking number. If you move house, the parcel can still find you because it follows the number, not the old street address.

              ### Key ideas
              - QUIC follows the connection ID, not your address
              - A download, video or call can carry on over a network change
              - The server checks the new path first, so nobody can redirect your traffic to themselves
              - The ID can change over time, which makes it harder for others watching the network to track you
              - TCP cannot do this, because its identity is the address itself

              ### Example
              You walk out of the house on a video call. Your phone drops your home Wi-Fi and joins mobile data. A call running over QUIC continues, with at most a short glitch.

              ### Go deeper
              The technical detail is in [Transport in depth](/roadmaps/networking/transport-in-depth) on the Networking roadmap.
            resources:
              - { label: "RFC 9000: QUIC", url: "https://www.rfc-editor.org/rfc/rfc9000", kind: docs }
              - { label: "RFC 9114: HTTP/3", url: "https://www.rfc-editor.org/rfc/rfc9114", kind: docs }
              - { label: "HTTP/3: the past, the present, and the future (Cloudflare)", url: "https://blog.cloudflare.com/http3-the-past-present-and-future/", kind: article }
              - { label: "QUIC (Wikipedia)", url: "https://en.wikipedia.org/wiki/QUIC", kind: article }
              - { label: "RFC 9308: Applicability of the QUIC Transport Protocol", url: "https://www.rfc-editor.org/rfc/rfc9308", kind: docs }
              - { label: "RFC 9312: Manageability of the QUIC Transport Protocol", url: "https://www.rfc-editor.org/rfc/rfc9312", kind: docs }
              - { label: "How Facebook is bringing QUIC to billions (Meta Engineering)", url: "https://engineering.fb.com/2020/10/21/networking-traffic/how-facebook-is-bringing-quic-to-billions/", kind: article }
              - { label: "The QUIC Transport Protocol: Design and Internet-Scale Deployment (Google Research)", url: "https://research.google/pubs/the-quic-transport-protocol-design-and-internet-scale-deployment/", kind: article }
              - { label: "The Illustrated QUIC Connection (quic.xargs.org)", url: "https://quic.xargs.org/", kind: article }
