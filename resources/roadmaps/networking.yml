    topics:
      - id: wifi
        title: "Wi-Fi: how your devices reach the router"
        summary: The radio link inside your home. How 802.11 shares the air, the 2.4, 5 and 6 GHz bands, the Wi-Fi generations, security from WEP to WPA3, and mesh systems.
        lessons:
          - id: how-wifi-works
            title: How Wi-Fi works
            summary: An access point and its devices take turns on one radio channel. SSIDs, BSSIDs, joining a network, and why Wi-Fi speed is really about airtime.
            learn:
              - What 802.11, an access point, an SSID and a BSSID are
              - The steps a device takes to join a network
              - CSMA/CA and why Wi-Fi is half-duplex
              - Airtime, and why one slow device slows everyone
            body: |
              **Wi-Fi** is the brand name for the IEEE **802.11** standards, first published in 1997. It is Ethernet over radio: frames with MAC addresses, sent through the air instead of a cable.

              An **access point** (AP) is the radio that bridges wireless devices onto your wired network. Your home "router" usually contains one.

              - **SSID**: the network name you pick from a list, up to 32 bytes
              - **BSSID**: the MAC address of one AP radio. One SSID can have many BSSIDs: one per band, and one per AP in a mesh

              ### Joining a network
              1. The AP sends a **beacon** about 10 times a second (every 102.4 ms) announcing its SSID and abilities. Devices also send **probe requests** to ask who is there
              2. The device **authenticates** and **associates** with one BSSID
              3. With WPA2 or WPA3, a **4-way handshake** creates the encryption keys
              4. Only then does it ask DHCP for an IP address

              ### Taking turns: CSMA/CA
              Everything on one channel shares the same air, and a radio cannot listen while it transmits. So Wi-Fi is **half-duplex**: one device talks at a time, AP included. It uses **CSMA/CA** (carrier sense multiple access with collision avoidance):

              - Listen first. If the channel is busy, wait
              - When it goes quiet, wait a random **backoff** time, so two waiting devices rarely start together
              - The receiver sends an **ACK** for each frame. No ACK means a collision or noise, so send again

              Two devices that cannot hear each other but both reach the AP are **hidden nodes**. Their frames collide at the AP. RTS/CTS, a short "clear to send" from the AP, reduces this.

              ### Airtime
              Capacity on a channel is measured in **time**, not Mbps. A device far away sends at a low rate and takes much longer to send the same data. One old phone at 6 Mbps uses ten times the airtime of a laptop at 60 Mbps for the same file, and everyone else waits.

              ### In practice
              ```bash
              iw dev wlan0 link                   # Linux: BSSID, signal, rate
              system_profiler SPAirPortDataType   # macOS: channel, signal and noise
              ```

              ### Common mistakes
              - Adding devices as if each gets the full link speed: they share one channel's airtime
              - Thinking a strong AP signal is enough: your phone's weaker transmitter must reach back
