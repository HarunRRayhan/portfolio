          - id: ipv4-multicast-ranges
            title: The IPv4 multicast ranges
            summary: 224.0.0.0/4 split into blocks with different reach, from link-only control traffic to the private 239.0.0.0/8.
            learn:
              - Why multicast exists and what a group address is
              - The local network control block and well-known groups
              - Source-specific (232/8), GLOP (233/8) and administratively scoped (239/8) blocks
              - How TTL and scope keep multicast contained
            body: |
              **Multicast** sends one packet to a group. The sender transmits once, and the network copies the packet only where branches split toward receivers. A thousand viewers of one TV channel cost the sender the same as one.

              A multicast address names a **group**, not a machine. It is only ever a destination. The source address is always the sender's normal unicast address.

              | Block | Name | Reach |
              |---|---|---|
              | `224.0.0.0/24` | Local network control | this link only, never routed, TTL 1 |
              | `224.0.1.0/24` | Internetwork control | may be routed |
              | `232.0.0.0/8` | Source-specific multicast (SSM) | routed, receivers pick the source |
              | `233.0.0.0/8` | GLOP | a /24 per 16-bit AS number |
              | `239.0.0.0/8` | Administratively scoped | inside one organisation, like private space |

              ### Well-known groups on your LAN
              - `224.0.0.1` all hosts, `224.0.0.2` all routers
              - `224.0.0.5` and `224.0.0.6` OSPF routers, `224.0.0.9` RIPv2, `224.0.0.13` PIM
              - `224.0.0.18` VRRP (router failover), `224.0.0.22` IGMPv3 reports
              - `224.0.0.251` mDNS (Bonjour, `printer.local`), `224.0.0.252` LLMNR
              - `224.0.1.1` NTP
              - `239.255.255.250` SSDP, used by UPnP, smart TVs and Chromecast discovery

              ### Key ideas
              - `239.0.0.0/8` is to multicast what `10.0.0.0/8` is to unicast: reuse it freely inside your network, and block it at the border
              - `232.0.0.0/8` needs no shared meeting point because receivers name the exact source they want
              - The TTL field and boundary filters on routers stop groups from leaking farther than intended
              - Multicast normally runs over UDP, since TCP cannot do one-to-many

              ### In practice
              ```bash
              netstat -g        # Linux: groups this host has joined
              tcpdump -n 'net 224.0.0.0/4'
              ```
              On a home network you will see mDNS and SSDP chatter within a minute.
            resources:
              - { label: "IANA IPv4 Multicast Address Space Registry", url: "https://www.iana.org/assignments/multicast-addresses/multicast-addresses.xhtml", kind: docs }
              - { label: "RFC 5771: IANA guidelines for IPv4 multicast address assignments", url: "https://www.rfc-editor.org/rfc/rfc5771", kind: docs }
              - { label: "RFC 2365: Administratively scoped IP multicast", url: "https://www.rfc-editor.org/rfc/rfc2365", kind: docs }
              - { label: "Multicast address (Wikipedia)", url: "https://en.wikipedia.org/wiki/Multicast_address", kind: article }
              - { label: "Multicast explained in 5 minutes (Data Knox)", url: "https://www.youtube.com/watch?v=W5oMvrMRM3Q", kind: video }
              - { label: "RFC 1112: Host extensions for IP multicasting", url: "https://www.rfc-editor.org/rfc/rfc1112", kind: docs }
              - { label: "RFC 6034: Unicast-prefix-based IPv4 multicast addresses", url: "https://www.rfc-editor.org/rfc/rfc6034", kind: docs }
              - { label: "RFC 5110: Overview of the internet multicast routing architecture", url: "https://www.rfc-editor.org/rfc/rfc5110", kind: docs }
              - { label: "IP multicast (Wikipedia)", url: "https://en.wikipedia.org/wiki/IP_multicast", kind: article }
              - { label: "RFC 3180: GLOP addressing in 233/8", url: "https://www.rfc-editor.org/rfc/rfc3180", kind: docs }
          - id: ipv4-multicast-how
            title: How multicast is delivered (IGMP, snooping, PIM)
            summary: Hosts join groups with IGMP, switches listen in with snooping, and routers build delivery trees with PIM.
            learn:
              - Joining and leaving a group with IGMP
              - IGMP snooping and why switches need it
              - PIM sparse mode, rendezvous points and source-specific multicast
              - How a group address maps to an Ethernet MAC address
            body: |
              Multicast needs three pieces: hosts saying which groups they want, switches sending the traffic only to those ports, and routers building a tree from the source to every receiver.

              ![Unicast sends one copy per viewer over the shared link; multicast sends one copy that a router splits toward receivers that joined](/images/roadmaps/internet-networking/multicast-tree.svg)

              ### 1. Hosts join with IGMP
              A host that wants group `239.1.1.1` sends an **IGMP membership report**. The local router asks every so often "who still wants which groups?" and drops a group when nobody answers. IGMPv2 added a fast **leave** message. **IGMPv3** lets a host say "only from this source", which source-specific multicast needs. IPv6 does the same job with MLD.

              ### 2. Switches snoop
              A plain switch treats multicast like broadcast and floods it to every port. With **IGMP snooping**, the switch reads the IGMP messages and forwards each group only to ports that joined. Without it, one 4K IPTV stream can swamp every device on the VLAN.

              ### 3. Routers build trees with PIM
              - **PIM sparse mode**: routers send joins toward a **rendezvous point** (RP), a meeting router that sources and receivers both know. Traffic starts on this shared tree, then routers can switch to the shortest path from the source
              - **Source-specific multicast** (SSM, `232/8`): the receiver names source and group, written (S, G), so routers join straight toward the source and no RP is needed
              - **RPF check**: a router accepts a multicast packet only on the interface that leads back toward the source. That one rule stops loops

              ### MAC address mapping
              Ethernet carries multicast to MAC `01:00:5e` plus the low 23 bits of the group. `239.255.255.250` becomes `01:00:5e:7f:ff:fa`. A group has 28 variable bits, so 32 groups share each MAC address, and the host's IP stack filters the rest.

              ### Why the public internet does not do multicast
              Inter-domain multicast was tried (the MBone in the 1990s), but ISPs had no way to bill it and it was hard to run safely. Today multicast lives inside networks: ISP IPTV, stock exchange market data feeds, OSPF, and mDNS on your LAN. Streaming services reach you with unicast from CDNs instead.
            resources:
              - { label: "Internet Group Management Protocol (Wikipedia)", url: "https://en.wikipedia.org/wiki/Internet_Group_Management_Protocol", kind: article }
              - { label: "IGMP snooping (Wikipedia)", url: "https://en.wikipedia.org/wiki/IGMP_snooping", kind: article }
              - { label: "Protocol Independent Multicast (Wikipedia)", url: "https://en.wikipedia.org/wiki/Protocol_Independent_Multicast", kind: article }
              - { label: "RFC 3376: IGMPv3", url: "https://www.rfc-editor.org/rfc/rfc3376", kind: docs }
              - { label: "RFC 4607: Source-Specific Multicast for IP", url: "https://www.rfc-editor.org/rfc/rfc4607", kind: docs }
              - { label: "RFC 7761: PIM Sparse Mode", url: "https://www.rfc-editor.org/rfc/rfc7761", kind: docs }
              - { label: "Introduction to IGMP snooping (CBT Nuggets)", url: "https://www.youtube.com/watch?v=MLCN3CWQVc0", kind: video }
              - { label: "IGMP, Internet Group Management Protocol (Tall Paul Tech)", url: "https://www.youtube.com/watch?v=MaTkt-wNHRg", kind: video }
              - { label: "Multicast: IGMP snooping (BitsPlease)", url: "https://www.youtube.com/watch?v=fxORfD-OFdM", kind: video }
              - { label: "RFC 4541: Considerations for IGMP and MLD snooping switches", url: "https://www.rfc-editor.org/rfc/rfc4541", kind: docs }
              - { label: "RFC 1112: Host extensions for IP multicasting", url: "https://www.rfc-editor.org/rfc/rfc1112", kind: docs }
              - { label: "Multicast explained in 5 minutes (Data Knox)", url: "https://www.youtube.com/watch?v=W5oMvrMRM3Q", kind: video }
          - id: mtu
            title: MTU and fragmentation
            optional: true
            summary: Every link has a maximum packet size. Packets that are too big get split or dropped, which causes odd bugs.
            learn:
              - The common 1500-byte MTU
              - Fragmentation and path MTU discovery
              - Why VPNs and tunnels lower the MTU
            body: |
              Every link has a maximum packet size, called its **MTU** (maximum transmission unit). For Ethernet it is normally 1500 bytes. A packet bigger than the MTU of a link cannot cross it as it is.

              IPv4 routers can **fragment** a big packet into smaller pieces, which are put together again at the destination. That is slow and fragile, so most traffic avoids it. **Path MTU discovery** finds the smallest MTU on the path: the sender marks packets "do not fragment", and a router that cannot forward one replies with an ICMP message. IPv6 routers never fragment.

              ### Key ideas
              - 1500 bytes is the common Ethernet MTU
              - Fragmentation is expensive, and path MTU discovery avoids it
              - VPNs and tunnels add their own headers, so the usable MTU gets smaller

              ### Common mistakes
              - Blocking all ICMP, so path MTU discovery breaks
              - Odd bug: small requests work, large ones hang. Check for an MTU problem on a VPN or tunnel
            resources:
              - { label: "What is MTU? (Cloudflare)", url: "https://www.cloudflare.com/learning/network-layer/what-is-mtu/", kind: article }
              - { label: "Path MTU Discovery (Wikipedia)", url: "https://en.wikipedia.org/wiki/Path_MTU_Discovery", kind: article }
              - { label: "Path MTU discovery in practice (Cloudflare)", url: "https://blog.cloudflare.com/path-mtu-discovery-in-practice/", kind: article }
              - { label: "MTU and IP fragmentation (Network Direction)", url: "https://www.youtube.com/watch?v=1zKwBWtYFHU", kind: video }
              - { label: "Fragmentation of IPv4 datagram (Gate Smashers)", url: "https://www.youtube.com/watch?v=k8VgrqDOIUo", kind: video }
              - { label: "RFC 1191: Path MTU discovery", url: "https://www.rfc-editor.org/rfc/rfc1191", kind: docs }
              - { label: "RFC 8201: Path MTU discovery for IPv6", url: "https://www.rfc-editor.org/rfc/rfc8201", kind: docs }
              - { label: "RFC 4821: Packetization layer path MTU discovery", url: "https://www.rfc-editor.org/rfc/rfc4821", kind: docs }
              - { label: "Maximum transmission unit (Wikipedia)", url: "https://en.wikipedia.org/wiki/Maximum_transmission_unit", kind: article }

      - id: ipv6-in-depth
        title: IPv6 in depth
        summary: Every special block, how public space is handed out, SLAAC, Neighbor Discovery and multicast scopes.
        lessons:
          - id: ipv6-special-table
            title: The full IPv6 special-purpose table
            optional: true
            summary: Every IPv6 block you will meet in configs and logs, what it is for, and whether it can appear on the public internet.
            learn:
              - The special blocks and what each one means
              - Transition blocks such as NAT64, 6to4 and Teredo
              - Documentation prefixes to use in examples
              - How anycast works in IPv6
            body: |
              IANA keeps a registry of IPv6 blocks with special meaning, just as it does for IPv4. Everything else inside `2000::/3` that an RIR has allocated is ordinary public unicast.

              | Block | Name | Use | On the internet? |
              |---|---|---|---|
              | `::/128` | unspecified | source before an address is known, like `0.0.0.0` | no |
              | `::1/128` | loopback | this machine | no |
              | `::ffff:0:0/96` | IPv4-mapped | how a dual-stack socket shows an IPv4 peer, such as `::ffff:192.0.2.1` | no |
              | `64:ff9b::/96` | NAT64 well-known prefix | IPv6-only clients reaching IPv4 servers | through a NAT64 gateway |
              | `100::/64` | discard-only | send unwanted traffic to nowhere (blackholing) | no |
              | `2000::/3` | global unicast | public addresses | yes |
              | `2001::/32` | Teredo | old tunnelling of IPv6 over IPv4 UDP | mostly gone |
              | `2001:db8::/32` | documentation | examples and docs | no |
              | `3fff::/20` | documentation (2024) | larger examples | no |
              | `2002::/16` | 6to4 | old automatic tunnelling | deprecated |
              | `fc00::/7` | unique local (ULA) | private addresses inside a site, use `fd00::/8` | no |
              | `fe80::/10` | link-local | one link only, on every interface | never forwarded |
              | `ff00::/8` | multicast | groups, with built-in scope | only within its scope |

              ### Key ideas
              - There is **no broadcast** block. "All nodes on this link" is the multicast group `ff02::1`
              - Link-local addresses are not unique across links, so you must name the interface: `ping fe80::1%en0`
              - `fec0::/10` (site-local) appears in old books. It was deprecated in 2004 and replaced by ULA
              - **Anycast** has no prefix of its own. It is a normal unicast address configured on many devices, and routing picks the nearest. Every subnet also has a **subnet-router anycast** address, the prefix with an all-zero interface ID, which reaches any router on that subnet

              ### Common mistakes
              - Using real-looking prefixes in docs instead of `2001:db8::/32`
              - Thinking `::ffff:` addresses mean the traffic is IPv6: the packet on the wire is IPv4
            resources:
              - { label: "IANA IPv6 Special-Purpose Address Registry", url: "https://www.iana.org/assignments/iana-ipv6-special-registry/iana-ipv6-special-registry.xhtml", kind: docs }
              - { label: "IPv6 address (Wikipedia)", url: "https://en.wikipedia.org/wiki/IPv6_address", kind: article }
              - { label: "RFC 6052: IPv6 addressing of IPv4/IPv6 translators (NAT64)", url: "https://www.rfc-editor.org/rfc/rfc6052", kind: docs }
              - { label: "RFC 3849: IPv6 documentation prefix", url: "https://www.rfc-editor.org/rfc/rfc3849", kind: docs }
              - { label: "IANA IPv6 address space registry", url: "https://www.iana.org/assignments/ipv6-address-space/ipv6-address-space.xhtml", kind: docs }
              - { label: "RFC 6890: Special-purpose IP address registries", url: "https://www.rfc-editor.org/rfc/rfc6890", kind: docs }
              - { label: "RFC 4193: Unique local IPv6 unicast addresses", url: "https://www.rfc-editor.org/rfc/rfc4193", kind: docs }
              - { label: "RFC 4291: IPv6 addressing architecture", url: "https://www.rfc-editor.org/rfc/rfc4291", kind: docs }
              - { label: "RFC 9637: Expanding the IPv6 documentation space (3fff::/20)", url: "https://www.rfc-editor.org/rfc/rfc9637", kind: docs }
              - { label: "RFC 6666: Discard prefix for IPv6 (100::/64)", url: "https://www.rfc-editor.org/rfc/rfc6666", kind: docs }
          - id: ipv6-public-allocation
            title: How public IPv6 space is handed out
            summary: Registries give ISPs a /32, sites get a /48 or /56, and every LAN gets a /64. How the bits split and why there are so many.
            learn:
              - The 48 + 16 + 64 bit layout of a global address
              - Who gets a /32, /48, /56 and /64
              - Prefix delegation to home routers
              - The smallest IPv6 route BGP will carry
            body: |
              Public IPv6 addresses come down the same chain as IPv4: **IANA** gives large blocks from `2000::/3` to the five **RIRs**, the RIRs allocate to ISPs and companies, and they assign to customers. The difference is size. Nobody counts single addresses, only prefixes.

              ### The layout of a global address
              | Bits | Part | Chosen by |
              |---|---|---|
              | first 48 | global routing prefix | registry and ISP |
              | next 16 | subnet ID | you, up to 65,536 subnets |
              | last 64 | interface ID | the device (SLAAC) or DHCPv6 |

              ![A 128-bit IPv6 address split into a 48-bit routing prefix, a 16-bit subnet and a 64-bit interface ID, with /32, /48, /56 and /64 boundaries marked](/images/roadmaps/internet-networking/ipv6-layout.svg)

              ### Typical sizes
              - **/32**: a usual first allocation to an ISP. It holds 65,536 /48s
              - **/48**: a site or company. 65,536 subnets
              - **/56**: a common home connection. 256 subnets
              - **/64**: one LAN or VLAN. About 18 quintillion addresses, and always this size, because SLAAC needs a 64-bit interface ID

              ### Prefix delegation
              Your ISP gives your home router a prefix, such as a /56, using **DHCPv6 prefix delegation** (DHCPv6-PD). The router then carves one /64 per network (main Wi-Fi, guest Wi-Fi, IoT) and announces each with router advertisements. No NAT is needed: every device gets a public address, and the router's firewall decides what is allowed in.

              ### Key ideas
              - Most networks accept IPv6 routes in BGP only down to **/48**, the IPv6 version of the IPv4 /24 rule
              - Some ISPs hand out only a /64, which leaves no room for subnets at home. Ask for a /56 or /48
              - Address scanning, routine in IPv4, is useless in IPv6: one /64 is too large to sweep

              ### In practice
              ```bash
              ip -6 addr show scope global      # Linux
              ifconfig en0 | grep inet6         # macOS
              ```
              Addresses starting with `2` or `3` are global. Compare the first 56 or 64 bits on two devices to see the shared prefix.
            resources:
              - { label: "RFC 6177: IPv6 address assignment to end sites", url: "https://www.rfc-editor.org/rfc/rfc6177", kind: docs }
              - { label: "RIPE-690: best current practice for IPv6 prefix assignment", url: "https://www.ripe.net/publications/docs/ripe-690/", kind: docs }
              - { label: "Prefix delegation (Wikipedia)", url: "https://en.wikipedia.org/wiki/Prefix_delegation", kind: article }
              - { label: "IANA IPv6 Global Unicast Address Assignments", url: "https://www.iana.org/assignments/ipv6-unicast-address-assignments/ipv6-unicast-address-assignments.xhtml", kind: docs }
              - { label: "RIPE NCC training material, including IPv6 (RIPE NCC)", url: "https://www.ripe.net/training/in-person-training-courses/material/", kind: course }
              - { label: "How are internet number resources distributed? (RIPE NCC)", url: "https://www.youtube.com/watch?v=XUIPoEhkFTc", kind: video }
              - { label: "RIPEstat: look up any IPv6 prefix", url: "https://stat.ripe.net/", kind: tool }
              - { label: "RFC 3177: original IAB recommendations on IPv6 site allocation", url: "https://www.rfc-editor.org/rfc/rfc3177", kind: docs }
              - { label: "APNIC IPv6 address policy", url: "https://www.apnic.net/community/policy/resources/", kind: docs }
              - { label: "IPv6 subnet calculator (subnetonline)", url: "https://www.subnetonline.com/pages/subnet-calculators/ipv6-subnet-calculator.php", kind: tool }
          - id: slaac
            title: How a device gets an IPv6 address
            summary: Routers announce the network prefix and devices build their own address (SLAAC), with DHCPv6 as the other option.
            learn:
              - Router advertisements and SLAAC
              - DHCPv6
              - Temporary privacy addresses
            body: |
              In IPv6, a device can get an address without a DHCP server. The router sends **Router Advertisements** (RAs) saying "this is the network prefix". The device adds its own 64-bit interface identifier and has a full address. This is **SLAAC** (stateless address autoconfiguration).

              The device also checks that nobody else is using the address before it takes it.

              ### Key ideas
              - Routers announce the prefix, devices build their own address
              - **DHCPv6** is the other option, for sites that want a server to track who has which address
              - RAs can also tell devices about DNS servers and the default router
              - **Temporary privacy addresses** are random and change over time, used for outgoing connections so that your device cannot be tracked by a fixed identifier

              ### Common mistakes
              - Expecting DHCPv6 on every IPv6 network: many use SLAAC only
              - Blocking ICMPv6 on a firewall, which breaks router advertisements and neighbour discovery
            resources:
              - { label: "RFC 4862: stateless address autoconfiguration", url: "https://www.rfc-editor.org/rfc/rfc4862", kind: docs }
              - { label: "RFC 8981: temporary IPv6 addresses", url: "https://www.rfc-editor.org/rfc/rfc8981", kind: docs }
              - { label: "IPv6 stateless address autoconfiguration (Wikipedia)", url: "https://en.wikipedia.org/wiki/Stateless_address_autoconfiguration", kind: article }
              - { label: "RFC 4861: Neighbor Discovery for IP version 6", url: "https://www.rfc-editor.org/rfc/rfc4861", kind: docs }
              - { label: "IPv6 explained: SLAAC and DHCPv6 (OneMarcFifty)", url: "https://www.youtube.com/watch?v=jlG_nrCOmJc", kind: video }
              - { label: "IPv6 and SLAAC, Network+ (Professor Messer)", url: "https://www.youtube.com/watch?v=A6WVj82by3Y", kind: video }
              - { label: "IPv6 stateless addressing: SLAAC, the A-bit and the O-bit (Wendell Odom)", url: "https://www.youtube.com/watch?v=Vm3wm1_oziE", kind: video }
              - { label: "RFC 8415: DHCPv6", url: "https://www.rfc-editor.org/rfc/rfc8415", kind: docs }
              - { label: "RFC 7217: Stable, opaque interface identifiers", url: "https://www.rfc-editor.org/rfc/rfc7217", kind: docs }
              - { label: "RFC 8106: DNS options in router advertisements", url: "https://www.rfc-editor.org/rfc/rfc8106", kind: docs }
          - id: ipv6-neighbor-discovery
            title: Neighbor Discovery, the IPv6 replacement for ARP
            summary: IPv6 finds neighbours, routers and duplicate addresses with ICMPv6 messages sent to multicast groups, not broadcasts.
            learn:
              - The five Neighbor Discovery messages
              - Solicited-node multicast and why it beats ARP broadcast
              - Duplicate address detection
              - RA Guard and other ND security
            body: |
              IPv4 uses ARP broadcasts to find a neighbour's MAC address. IPv6 has no broadcast, so **Neighbor Discovery** (NDP) does the job with ICMPv6 messages sent to multicast groups.

              | ICMPv6 type | Message | Job |
              |---|---|---|
              | 133 | Router Solicitation | "any routers here?" sent to `ff02::2` |
              | 134 | Router Advertisement | prefix, default router, DNS, sent to `ff02::1` |
              | 135 | Neighbor Solicitation | "who has this address?" |
              | 136 | Neighbor Advertisement | "I do, here is my MAC" |
              | 137 | Redirect | "use a better next hop" |

              ### Solicited-node multicast
              A Neighbor Solicitation does not go to everyone. It goes to the target's **solicited-node** group: `ff02::1:ff` plus the last 24 bits of the address. For `2001:db8::abcd:1234` that group is `ff02::1:ffcd:1234`, carried on Ethernet as `33:33:ff:cd:12:34`. Only the few hosts whose addresses end in those 24 bits listen, so other machines' network cards drop the frame without waking the CPU. ARP interrupts every host on the LAN.

              ![ARP broadcasts a request to every host, while IPv6 Neighbor Discovery sends it to a solicited-node multicast group that only the target listens to](/images/roadmaps/internet-networking/neighbor-discovery.svg)

              ### Duplicate address detection
              Before using a new address, a device sends a Neighbor Solicitation for it from `::`. If anyone answers, the address is taken and the device must not use it. This is **DAD**, and it runs for SLAAC addresses as well as manual ones.

              ### Key ideas
              - NDP is ICMPv6, so a firewall that blocks all ICMPv6 breaks IPv6 completely
              - The neighbour cache is the IPv6 ARP table: `ip -6 neigh` on Linux, `ndp -a` on macOS
              - Anyone on the LAN can send a fake Router Advertisement and become everyone's router. Switches with **RA Guard** drop RAs from ports that are not routers
              - **SEND** (secure ND) exists but almost nobody deploys it, so switch features do the protecting

              ### In practice
              ```bash
              ip -6 neigh                           # Linux neighbour cache
              sudo tcpdump -n icmp6                 # watch NS, NA and RA messages
              ```
            resources:
              - { label: "RFC 4861: Neighbor Discovery for IP version 6", url: "https://www.rfc-editor.org/rfc/rfc4861", kind: docs }
              - { label: "Neighbor Discovery Protocol (Wikipedia)", url: "https://en.wikipedia.org/wiki/Neighbor_Discovery_Protocol", kind: article }
              - { label: "Solicited-node multicast address (Wikipedia)", url: "https://en.wikipedia.org/wiki/Solicited-node_multicast_address", kind: article }
              - { label: "RFC 6105: IPv6 Router Advertisement Guard", url: "https://www.rfc-editor.org/rfc/rfc6105", kind: docs }
              - { label: "Neighbor Discovery Protocol (RIPE NCC)", url: "https://www.youtube.com/watch?v=A3LFt7CHpgs", kind: video }
              - { label: "IPv6 Neighbor Discovery Protocol (Sunny Classroom)", url: "https://www.youtube.com/watch?v=a1AQfjWwPaE", kind: video }
              - { label: "Neighbor Discovery Protocol, IPv6's better ARP (Wendell Odom)", url: "https://www.youtube.com/watch?v=crupCqdfmj8", kind: video }
              - { label: "Understanding Neighbor Discovery with Wireshark (Aakif Mairaj Mufti)", url: "https://www.youtube.com/watch?v=L_7SMkADKxU", kind: video }
              - { label: "RFC 4443: ICMPv6", url: "https://www.rfc-editor.org/rfc/rfc4443", kind: docs }
              - { label: "RFC 3971: SEcure Neighbor Discovery (SEND)", url: "https://www.rfc-editor.org/rfc/rfc3971", kind: docs }
          - id: ipv6-multicast
            title: IPv6 multicast and scopes
            summary: Every IPv6 multicast address carries its own scope, from one interface to the whole internet. The format, the well-known groups and MLD.
            learn:
              - The ff, flags and scope fields of a multicast address
              - Scopes from interface-local to global
              - Well-known groups such as ff02::1 and ff02::2
              - MLD, the IPv6 version of IGMP, and Ethernet mapping
            body: |
              IPv6 relies on multicast far more than IPv4, because it has no broadcast. Every multicast address starts with `ff` and then says, inside the address itself, how far it may travel.

              ### The format
              `ff` + 4 flag bits + 4 scope bits + a 112-bit group ID. In `ff02::1`, the flags are `0` (a permanent, well-known group) and the scope is `2` (link-local).

              | Scope | Name | Reach |
              |---|---|---|
              | `1` | interface-local | loopback only, this interface |
              | `2` | link-local | one link, never routed |
              | `4` | admin-local | smallest area an admin sets up |
              | `5` | site-local | one site |
              | `8` | organization-local | many sites of one organisation |
              | `e` | global | the whole internet |

              A router needs no extra boundary lists to stop an `ff05::` packet at the edge of a site: the scope is in the address. Compare IPv4, where `239.0.0.0/8` needs manual filters.

              ### Well-known groups
              - `ff02::1` all nodes, `ff02::2` all routers
              - `ff02::5` and `ff02::6` OSPFv3, `ff02::9` RIPng, `ff02::d` PIM
              - `ff02::16` MLDv2 reports, `ff02::fb` mDNS
              - `ff02::1:2` DHCPv6 servers and relays on the link, `ff05::1:3` all DHCPv6 servers on the site
              - `ff02::1:ffXX:XXXX` solicited-node groups, used by Neighbor Discovery

              ### Flags
              - **T**: 1 means a temporary group, not assigned by IANA
              - **P**: the group is built from a unicast prefix, so every network gets its own unique groups
              - **R**: the rendezvous point address is embedded in the group (embedded RP)
              - Source-specific multicast uses `ff3x::/32`

              ### MLD and Ethernet
              Hosts join groups with **MLD** (Multicast Listener Discovery), carried in ICMPv6. MLDv2 matches IGMPv3 and supports source filters. Switches use **MLD snooping** the way they use IGMP snooping. On Ethernet, a group maps to MAC `33:33` plus its last 32 bits, so `ff02::1` becomes `33:33:00:00:00:01`.
            resources:
              - { label: "RFC 4291: IPv6 addressing (multicast format)", url: "https://www.rfc-editor.org/rfc/rfc4291", kind: docs }
              - { label: "IANA IPv6 Multicast Address Space Registry", url: "https://www.iana.org/assignments/ipv6-multicast-addresses/ipv6-multicast-addresses.xhtml", kind: docs }
              - { label: "Multicast Listener Discovery (Wikipedia)", url: "https://en.wikipedia.org/wiki/Multicast_Listener_Discovery", kind: article }
              - { label: "RFC 3810: MLDv2 for IPv6", url: "https://www.rfc-editor.org/rfc/rfc3810", kind: docs }
              - { label: "RFC 7346: IPv6 multicast address scopes", url: "https://www.rfc-editor.org/rfc/rfc7346", kind: docs }
              - { label: "IPv6 multicast addresses (Rick Graziani)", url: "https://www.youtube.com/watch?v=nTsD9BxmjaQ", kind: video }
              - { label: "What is a solicited-node multicast group? (CBT Nuggets)", url: "https://www.youtube.com/watch?v=lGjJOhv6sck", kind: video }
              - { label: "RFC 3306: Unicast-prefix-based IPv6 multicast addresses", url: "https://www.rfc-editor.org/rfc/rfc3306", kind: docs }
              - { label: "RFC 3956: Embedding the RP address in IPv6 multicast", url: "https://www.rfc-editor.org/rfc/rfc3956", kind: docs }
              - { label: "IPv6 multicast address (Wikipedia)", url: "https://en.wikipedia.org/wiki/Multicast_address#IPv6", kind: article }
              - { label: "RFC 4541: IGMP and MLD snooping switches", url: "https://www.rfc-editor.org/rfc/rfc4541", kind: docs }

      - id: packet-capture
        title: Packet capture and network troubleshooting
        summary: Stop guessing and look at the packets. tcpdump on servers, Wireshark on your desk, and a step-by-step way to find out where a slow or broken request is going wrong.
        lessons:
          - id: tcpdump-basics
            title: Capturing traffic with tcpdump
            summary: tcpdump prints or saves the packets on an interface. The useful part is the BPF filter that picks the few packets you care about.
            learn:
              - The flags you use every time (-i, -n, -c, -w, -r)
              - BPF capture filter syntax with host, net, port, and, or, not
              - Reading tcpdump's TCP flags
              - Saving a capture to open in Wireshark
            body: |
              **tcpdump** captures packets using libpcap. It needs root or the `CAP_NET_RAW` capability. A **capture filter**, written in BPF (Berkeley Packet Filter) syntax, runs in the kernel and keeps only matching packets, so even a busy server stays usable.

              ### Flags you use every time
              | Flag | Does |
              |---|---|
              | `-i eth0` / `-i any` | which interface to listen on |
              | `-n` | no DNS lookups, numeric ports too (older tcpdump needs `-nn` for port numbers) |
              | `-c 100` | stop after 100 packets |
              | `-w file.pcap` | write raw packets to a file instead of printing |
              | `-r file.pcap` | read a saved file |
              | `-A` / `-X` | print payload as ASCII / hex and ASCII |
              | `-v` | more header detail |

              ### Filter examples
              ```
              tcpdump -nn -i any host 203.0.113.10
              tcpdump -nn -i eth0 port 53
              tcpdump -nn -i eth0 'tcp port 443 and not net 10.0.0.0/8'
              tcpdump -nn -i eth0 'src host 10.0.0.5 and (port 80 or port 8080)'
              tcpdump -nn -i eth0 'tcp[tcpflags] & (tcp-syn|tcp-rst) != 0'
              tcpdump -nn -i eth0 icmp
              tcpdump -i eth0 -w /tmp/web.pcap -c 5000 port 443
              ```
              Quote filters that contain brackets or parentheses so the shell leaves them alone.

              ### Reading the output
              ```
              12:00:01.10 IP 10.0.0.5.51544 > 203.0.113.10.443: Flags [S], seq 1000, win 64240, length 0
              12:00:01.12 IP 203.0.113.10.443 > 10.0.0.5.51544: Flags [S.], seq 7000, ack 1001, length 0
              12:00:01.12 IP 10.0.0.5.51544 > 203.0.113.10.443: Flags [.], ack 7001, length 0
              ```
              `[S]` is SYN, `[S.]` is SYN-ACK, `[.]` is ACK, `[P.]` is data with PSH-ACK, `[F.]` is FIN, `[R]` is reset. The time between SYN and SYN-ACK is the network round trip.

              ### Common mistakes
              - Forgetting `-n`, so tcpdump makes DNS queries of its own and floods the output with them
              - Capturing on the wrong interface. Inside containers and VPNs use `-i any` first
              - Leaving a long capture running with no `-c` or filter and filling the disk
            resources:
              - { label: "tcpdump(1) man page (tcpdump.org)", url: "https://www.tcpdump.org/manpages/tcpdump.1.html", kind: docs }
              - { label: "pcap-filter(7): BPF filter syntax (tcpdump.org)", url: "https://www.tcpdump.org/manpages/pcap-filter.7.html", kind: docs }
              - { label: "Let's learn tcpdump (Julia Evans zine)", url: "https://wizardzines.com/zines/tcpdump/", kind: article }
              - { label: "tcpdump is amazing (Julia Evans)", url: "https://jvns.ca/blog/2016/03/16/tcpdump-is-amazing/", kind: article }
              - { label: "tcpdump examples: a tutorial (Daniel Miessler)", url: "https://danielmiessler.com/study/tcpdump/", kind: article }
              - { label: "tcpdump (Wikipedia)", url: "https://en.wikipedia.org/wiki/Tcpdump", kind: article }
              - { label: "tcpdump: traffic capture and analysis (HackerSploit)", url: "https://www.youtube.com/watch?v=1lDfCRM6dWk", kind: video }
          - id: wireshark-filters-streams
            title: Wireshark display filters and following streams
            summary: Wireshark decodes every protocol field and lets you filter on any of them. Learn the filters you need daily, follow a TCP conversation, and read a handshake and a TLS ClientHello.
            learn:
              - Capture filters vs display filters
              - Display filters you will use every day
              - Follow TCP Stream and Conversations
              - Reading a TCP handshake and a TLS ClientHello
            body: |
              Wireshark has two kinds of filter. **Capture filters** use the same BPF syntax as tcpdump and decide what is recorded. **Display filters** use Wireshark's own field syntax and only hide packets on screen. Capture broadly, then narrow with display filters.

              ### Display filters you will use
              | Filter | Shows |
              |---|---|
              | `ip.addr == 10.0.0.5` | traffic to or from one host |
              | `tcp.port == 443` | one TCP port, either direction |
              | `dns` or `http.request` | one protocol, or only HTTP requests |
              | `tcp.flags.syn == 1 && tcp.flags.ack == 0` | new connection attempts |
              | `tcp.analysis.retransmission` | retransmitted segments |
              | `tcp.flags.reset == 1` | resets |
              | `tls.handshake.type == 1` | TLS ClientHello messages |
              | `!(arp or dns or icmp)` | hide the noise |

              Right-click any field in the details pane and pick **Apply as Filter** to build a filter without typing.

              ### Follow a stream
              Right-click a packet, **Follow > TCP Stream**. Wireshark rebuilds the whole conversation in order, client in one colour and server in another, and sets the filter `tcp.stream eq N`. **Statistics > Conversations** lists every flow by bytes, which is the fastest way to find the big or slow one.

              ### Reading a handshake
              Filter on one `tcp.stream` and look at the first packets:
              1. **SYN** from the client, with options like MSS and window scale
              2. **SYN-ACK** from the server. The gap from the SYN is the network round trip
              3. **ACK**, then the first data packet: for HTTPS, the **ClientHello**

              Expand the ClientHello to see the **SNI** (`server_name`, the host name being visited), the TLS versions and cipher suites offered, **ALPN** (`h2`, `http/1.1`) and the key share. The ServerHello picks one of each. From TLS 1.3 on, everything after ServerHello, including the certificate, is encrypted.

              ### Common mistakes
              - Typing tcpdump syntax like `port 443` in the display filter bar
              - Thinking a red retransmission in a busy capture is the cause. Check how many there are and whether they line up with the delay
            resources:
              - { label: "Wireshark User's Guide", url: "https://www.wireshark.org/docs/wsug_html_chunked/", kind: docs }
              - { label: "Building display filter expressions (Wireshark docs)", url: "https://www.wireshark.org/docs/wsug_html_chunked/ChWorkBuildDisplayFilterSection.html", kind: docs }
              - { label: "Following protocol streams (Wireshark docs)", url: "https://www.wireshark.org/docs/wsug_html_chunked/ChAdvFollowStreamSection.html", kind: docs }
              - { label: "Display filter reference (Wireshark)", url: "https://www.wireshark.org/docs/dfref/", kind: docs }
              - { label: "Display filters (Wireshark wiki)", url: "https://wiki.wireshark.org/DisplayFilters", kind: docs }
              - { label: "TCP 3-way handshake (Wireshark wiki)", url: "https://wiki.wireshark.org/TCP_3_way_handshaking", kind: docs }
              - { label: "How I use Wireshark (Julia Evans)", url: "https://jvns.ca/blog/2018/06/19/what-i-use-wireshark-for/", kind: article }
              - { label: "Top 10 Wireshark filters (Chris Greer)", url: "https://www.youtube.com/watch?v=68t07-KOH9Y", kind: video }
              - { label: "How TCP works: the handshake (Chris Greer)", url: "https://www.youtube.com/watch?v=HCHFX5O1IaQ", kind: video }
          - id: wireshark-tls-decryption
            title: Decrypting TLS in Wireshark with SSLKEYLOGFILE
            summary: Modern TLS cannot be decrypted with the server's private key. Instead, ask the client to write its session secrets to a file, and give that file to Wireshark.
            learn:
              - Why a private key alone no longer decrypts TLS
              - Logging secrets with SSLKEYLOGFILE
              - Loading the key log in Wireshark and tshark
              - Keeping key logs safe
            body: |
              With (EC)DHE key exchange, which TLS 1.3 always uses, each session's keys come from a temporary key pair that is thrown away. Having the server's certificate private key is not enough to decrypt a capture. That property is **forward secrecy**.

              What works is a **key log**: the client writes each session's secrets to a file. Browsers built on NSS or BoringSSL (Firefox, Chrome) and curl do this when the `SSLKEYLOGFILE` environment variable is set. The file format was published as RFC 9850 in 2026.

              ### Example
              ```
              export SSLKEYLOGFILE="$HOME/tls-keys.log"
              sudo tcpdump -i any -w /tmp/https.pcap port 443 &
              curl -s https://example.com/ > /dev/null
              ```
              Start the browser from that same shell to capture browser traffic too. Each line of the file looks like `CLIENT_TRAFFIC_SECRET_0 <client random> <secret>`.

              In Wireshark: **Preferences > Protocols > TLS > (Pre)-Master-Secret log filename**, pick the file, and the TLS records turn into readable HTTP/1.1 or HTTP/2. From the command line:
              ```
              tshark -r /tmp/https.pcap -o tls.keylog_file:$HOME/tls-keys.log -Y http2
              editcap --inject-secrets tls,$HOME/tls-keys.log /tmp/https.pcap /tmp/https-keys.pcapng
              ```
              The `editcap` line embeds the secrets in a pcapng file, so a colleague can open it without the separate log.

              ### Key ideas
              - It works only for clients you control. You cannot decrypt someone else's traffic this way
              - QUIC (HTTP/3) is decrypted with the same key log
              - Apps that do not read `SSLKEYLOGFILE` need a library hook or a debugging proxy instead

              ### Common mistakes
              - Setting the variable after the browser is already running. It is read at startup
              - Leaving it set in your shell profile. Anyone with the file can read everything you browsed. Delete it when done
            resources:
              - { label: "TLS (Wireshark wiki): decryption with key log files", url: "https://wiki.wireshark.org/TLS", kind: docs }
              - { label: "RFC 9850: The SSLKEYLOGFILE Format for TLS", url: "https://www.rfc-editor.org/rfc/rfc9850", kind: docs }
              - { label: "editcap man page (Wireshark)", url: "https://www.wireshark.org/docs/man-pages/editcap.html", kind: docs }
              - { label: "tshark man page (Wireshark)", url: "https://www.wireshark.org/docs/man-pages/tshark.html", kind: docs }
              - { label: "RFC 8446: TLS 1.3", url: "https://www.rfc-editor.org/rfc/rfc8446", kind: docs }
              - { label: "How to decrypt HTTPS traffic with Wireshark (Chris Greer)", url: "https://www.youtube.com/watch?v=5qecyZHL-GU", kind: video }
              - { label: "Let's fix a broken TLS handshake with Wireshark (Chris Greer)", url: "https://www.youtube.com/watch?v=m3I-h9uSgj8", kind: video }
          - id: troubleshooting-walkthrough
            title: "A troubleshooting walkthrough: dig, curl -v, mtr and ss"
            optional: true
            summary: A slow or failing request has a few possible causes, DNS, the path, TCP, TLS or the server. Check them in order with four tools before reaching for a packet capture.
            learn:
              - Splitting a request into DNS, connect, TLS and server time
              - Checking DNS with dig
              - Reading mtr without being fooled by ICMP rate limits
              - Inspecting sockets with ss
            body: |
              "The site is slow" is not a diagnosis. Work down the stack and time each step.

              ### 1. DNS
              ```
              dig +short api.example.com
              dig @1.1.1.1 api.example.com    # compare with a public resolver
              ```
              Look at the answer, the TTL and the `Query time`. A wrong or stale answer, or a slow resolver, ends the search here.

              ### 2. Time each phase with curl
              ```
              curl -v -o /dev/null -s https://api.example.com/health
              curl -o /dev/null -s -w 'dns %{time_namelookup} connect %{time_connect} tls %{time_appconnect} ttfb %{time_starttransfer} total %{time_total}\n' https://api.example.com/health
              ```
              `-v` shows the IP it tried, the TLS version, the certificate and every header. The `-w` times are cumulative seconds from the start:

              | Large gap between | Points to |
              |---|---|
              | 0 and `dns` | DNS |
              | `dns` and `connect` | network path or a firewall dropping SYNs |
              | `connect` and `tls` | TLS handshake, OCSP, or a far-away server |
              | `tls` and `ttfb` | the application itself |

              ### 3. The path, with mtr
              ```
              mtr -rwzc 100 api.example.com
              ```
              Read loss and latency at the **last** hop. Loss at a middle hop that does not carry on to later hops is that router rate-limiting replies to probes, not real loss.

              ### 4. Sockets, with ss
              ```
              ss -tlnp                 # what is listening, and which process
              ss -tni dst 203.0.113.10 # rtt, cwnd and retransmits per connection
              ss -s                    # totals, including TIME-WAIT
              ```

              ### Then capture
              If these do not explain it, run tcpdump on both ends during a failing request and compare.

              ### Common mistakes
              - Trusting `ping` alone: ICMP may be blocked or deprioritised while TCP works fine
              - Testing from your laptop when the problem is between two servers
            resources:
              - { label: "curl man page", url: "https://curl.se/docs/manpage.html", kind: docs }
              - { label: "Verbose output (Everything curl)", url: "https://everything.curl.dev/usingcurl/verbose/index.html", kind: docs }
              - { label: "How to use dig (Julia Evans)", url: "https://jvns.ca/blog/2021/12/04/how-to-use-dig/", kind: article }
              - { label: "BIND 9 manual pages, including dig", url: "https://bind9.readthedocs.io/en/latest/manpages.html", kind: docs }
              - { label: "mtr (GitHub)", url: "https://github.com/traviscross/mtr", kind: tool }
              - { label: "Linux mtr command (Red Hat)", url: "https://www.redhat.com/en/blog/linux-mtr-command", kind: article }
              - { label: "ss(8) man page", url: "https://man7.org/linux/man-pages/man8/ss.8.html", kind: docs }
              - { label: "The pocket guide to debugging (Julia Evans zine)", url: "https://wizardzines.com/zines/debugging-guide/", kind: article }

  - level: intermediate
    title: Connecting networks safely
    topics:
      - id: subnets-cidr
        title: Subnets and CIDR
        summary: Splitting address space into smaller networks, and reading notation like 10.0.0.0/16.
        lessons:
          - id: subnet-masks
            title: Subnet masks
            summary: The mask says which part of the address names the network and which part names the host.
            learn:
              - Network and host bits
              - 255.255.255.0 as a /24
            body: |
              An IPv4 address has two parts: a **network** part and a **host** part. The **subnet mask** says where the line between them falls.

              A mask is 32 bits: ones for the network part, zeros for the host part. In dotted form, `255.255.255.0` is 24 ones followed by 8 zeros. A device compares an address against its own network using the mask. If the network parts match, the target is on the same local network. If not, the packet goes to the router.

              ### Key ideas
              - Network bits: identify the subnet
              - Host bits: identify the device within it
              - `255.255.255.0` is the same as `/24`
              - Same network: send directly. Different network: send to the gateway

              ### Example
              `192.168.1.10` with mask `255.255.255.0`: the network is `192.168.1.0` and the host is `.10`. The address `192.168.1.200` is on the same network. `192.168.2.5` is not.
            resources:
              - { label: "What is a subnet? (Cloudflare)", url: "https://www.cloudflare.com/learning/network-layer/what-is-a-subnet/", kind: article }
              - { label: "Subnet (Wikipedia)", url: "https://en.wikipedia.org/wiki/Subnet", kind: article }
              - { label: "RFC 950: Internet Standard Subnetting Procedure", url: "https://www.rfc-editor.org/rfc/rfc950", kind: docs }
              - { label: "Subnetting Mastery (Practical Networking)", url: "https://www.practicalnetworking.net/stand-alone/subnetting-mastery/", kind: course }
              - { label: "What is subnetting? Subnetting Mastery part 1 (Practical Networking)", url: "https://www.youtube.com/watch?v=BWZ-MHIhqjM", kind: video }
              - { label: "Subnet mask explained (PowerCert)", url: "https://www.youtube.com/watch?v=s_Ntt6eTn94", kind: video }
              - { label: "IP subnet calculator (Calculator.net)", url: "https://www.calculator.net/ip-subnet-calculator.html", kind: tool }
              - { label: "IPv4 addressing and subnets (An Introduction to Computer Networks)", url: "https://intronetworks.cs.luc.edu/current/html/ipv4.html", kind: course }
          - id: cidr-notation
            title: CIDR notation
            summary: Read a /16 or a /28 and know how many addresses it holds.
            learn:
              - Prefix length
              - Counting addresses in a block
            body: |
              **CIDR** (Classless Inter-Domain Routing) writes a network as an address plus a **prefix length**: `10.0.0.0/16`. The number after the slash is how many bits belong to the network.

              The rest of the bits are for hosts. A block holds 2 to the power of (32 minus prefix) addresses, so a smaller prefix means a bigger block.

              ### Key ideas
              - `/24` leaves 8 host bits: 256 addresses
              - `/16` leaves 16 host bits: 65,536 addresses
              - `/28` leaves 4 host bits: 16 addresses
              - `/32` is a single address
              - Each step of one bit doubles or halves the size
              - Usually a few addresses in each block are reserved (network, broadcast, and in clouds a few more)

              ### Example
              `10.0.0.0/16` covers `10.0.0.0` to `10.0.255.255`. You could split it into 256 networks of `/24`, such as `10.0.1.0/24`.
            resources:
              - { label: "Subnet calculator", url: "https://www.subnet-calculator.com/cidr.php", kind: tool }
              - { label: "RFC 4632: CIDR", url: "https://www.rfc-editor.org/rfc/rfc4632", kind: docs }
              - { label: "Classless Inter-Domain Routing (Wikipedia)", url: "https://en.wikipedia.org/wiki/Classless_Inter-Domain_Routing", kind: article }
              - { label: "Interactive CIDR and IP range calculator", url: "https://cidr.xyz/", kind: tool }
              - { label: "RFC 1878: Variable Length Subnet Table for IPv4", url: "https://www.rfc-editor.org/rfc/rfc1878", kind: docs }
              - { label: "IPv4 Special-Purpose Address Registry (IANA)", url: "https://www.iana.org/assignments/iana-ipv4-special-registry/iana-ipv4-special-registry.xhtml", kind: docs }
              - { label: "ipcalc: online CIDR and netmask calculator (jodies.de)", url: "https://jodies.de/ipcalc", kind: tool }
              - { label: "What is network CIDR notation? (Justin Garrison)", url: "https://www.youtube.com/watch?v=tpa9QSiiiUo", kind: video }
              - { label: "Drawing the subnetting cheat sheet, part 2 (Practical Networking)", url: "https://www.youtube.com/watch?v=ljS07YTEJ2I", kind: video }
          - id: planning-vpc-subnets
            title: Planning subnets for a VPC
            summary: Pick ranges that leave room to grow and do not clash with other networks you will connect to.
            learn:
              - Public and private subnets per zone
              - Avoiding overlapping ranges
            body: |
              When you create a cloud network (a VPC), you pick one big private block and split it into subnets. The choices are hard to change later, so plan before you build.

              Typically each availability zone gets a **public** subnet (with a route to an internet gateway) and a **private** subnet (no direct inbound access). Spreading subnets over zones keeps the app up when one zone fails.

              ### Key ideas
              - Choose a VPC range big enough to grow, such as a `/16`
              - Use equal-sized subnets per zone and leave unused space for later
              - Keep databases and app servers in private subnets
              - **Do not overlap** ranges with other VPCs, offices or VPNs you may connect to, because overlapping networks cannot be routed
              - Cloud providers reserve a few addresses in every subnet (AWS reserves five)

              ### Example
              `10.0.0.0/16` for the VPC. Public `10.0.0.0/24` and `10.0.1.0/24`, private `10.0.10.0/24` and `10.0.11.0/24`, across two zones.
            resources:
              - { label: "VPC CIDR blocks (AWS docs)", url: "https://docs.aws.amazon.com/vpc/latest/userguide/vpc-cidr-blocks.html", kind: docs }
              - { label: "Subnets for your VPC (AWS)", url: "https://docs.aws.amazon.com/vpc/latest/userguide/configure-subnets.html", kind: docs }
              - { label: "RFC 1918: Address Allocation for Private Internets", url: "https://www.rfc-editor.org/rfc/rfc1918", kind: docs }
              - { label: "What is IPAM? (Amazon VPC IP Address Manager docs)", url: "https://docs.aws.amazon.com/vpc/latest/ipam/what-it-is-ipam.html", kind: docs }
              - { label: "Subnets (Google Cloud VPC docs)", url: "https://cloud.google.com/vpc/docs/subnets", kind: docs }
              - { label: "Plan for IP addressing (Azure Cloud Adoption Framework)", url: "https://learn.microsoft.com/en-us/azure/cloud-adoption-framework/ready/azure-best-practices/plan-for-ip-addressing", kind: docs }
              - { label: "Visual Subnet Calculator: split a range into subnets", url: "https://visualsubnetcalc.com/", kind: tool }
              - { label: "AWS VPC and subnets for beginners (Sam Meech-Ward)", url: "https://www.youtube.com/watch?v=TUTqYEZZUdc", kind: video }

      - id: nat
        title: NAT
        summary: How a whole house or office shares one public IPv4 address, and how gateways connect networks to the internet with IPv4 and IPv6.
        lessons:
          - id: source-nat
            title: Source NAT and port mapping
            summary: The router rewrites your private address to its public one and remembers which port belongs to whom.
            learn:
              - The NAT translation table
              - Port address translation
            body: |
              **Source NAT** lets many private devices share one public IPv4 address. The router rewrites the source address of each outgoing packet from the private address to its own public one.

              Many devices may use the same public address, so the router also changes the source port and records the pair in a **translation table**. This is **port address translation (PAT)**. When a reply comes back to that public address and port, the router looks up the table and sends it to the right device.

              ### Key ideas
              - Outgoing: private IP and port become public IP and a new port
              - Incoming replies are matched against the table and translated back
              - Entries expire after a period without traffic
              - NAT is what kept IPv4 going

              ### Example
              `192.168.1.20:51000` goes out as `203.0.113.5:40001`. The reply to `203.0.113.5:40001` is sent back to `192.168.1.20:51000`.
            resources:
              - { label: "Network address translation (Wikipedia)", url: "https://en.wikipedia.org/wiki/Network_address_translation", kind: article }
              - { label: "RFC 3022: traditional NAT", url: "https://www.rfc-editor.org/rfc/rfc3022", kind: docs }
              - { label: "RFC 2663: IP NAT Terminology and Considerations", url: "https://www.rfc-editor.org/rfc/rfc2663", kind: docs }
              - { label: "RFC 4787: NAT Behavioral Requirements for Unicast UDP", url: "https://www.rfc-editor.org/rfc/rfc4787", kind: docs }
              - { label: "RFC 6598: Shared Address Space for carrier-grade NAT (100.64.0.0/10)", url: "https://www.rfc-editor.org/rfc/rfc6598", kind: docs }
              - { label: "NAT explained, Network Address Translation (PowerCert)", url: "https://www.youtube.com/watch?v=FTUV0t6JaDA", kind: video }
              - { label: "How NAT traversal works, with a NAT primer (Tailscale)", url: "https://tailscale.com/blog/how-nat-traversal-works", kind: article }
          - id: nat-inbound
            title: Why NAT breaks inbound connections
            summary: Nobody outside can start a connection to a device behind NAT, unless you forward a port or punch a hole.
            learn:
              - Port forwarding
              - NAT traversal for peer-to-peer apps
            body: |
              NAT only creates a table entry when a device inside starts a connection. If someone outside tries to connect first, the router has no entry and drops the packet. This makes NAT act like a simple shield, but it breaks servers and peer-to-peer apps at home.

              ### Key ideas
              - **Port forwarding** is a manual rule: traffic arriving at the public address on port X goes to a chosen internal device and port
              - Hosting a game server or a camera at home needs it
              - Two devices that are both behind NAT cannot reach each other directly
              - **NAT traversal** tricks fix this: STUN learns your public address and port, then both sides send packets at the same moment to "punch a hole" (hole punching)
              - When that fails, traffic goes through a **relay** server (TURN)
              - Video calls and games use these techniques (ICE)

              ### Common mistakes
              - Treating NAT as a security feature: use a real firewall
              - Forwarding a port to a device that is not updated
            resources:
              - { label: "Network address translation (Wikipedia)", url: "https://en.wikipedia.org/wiki/Network_address_translation", kind: article }
              - { label: "Hole punching (networking) (Wikipedia)", url: "https://en.wikipedia.org/wiki/Hole_punching_(networking)", kind: article }
              - { label: "Port forwarding (Wikipedia)", url: "https://en.wikipedia.org/wiki/Port_forwarding", kind: article }
              - { label: "RFC 8445: Interactive Connectivity Establishment (ICE)", url: "https://www.rfc-editor.org/rfc/rfc8445", kind: docs }
              - { label: "How NAT traversal works (Tailscale)", url: "https://tailscale.com/blog/how-nat-traversal-works", kind: article }
              - { label: "Peer-to-Peer Communication Across Network Address Translators (Bryan Ford)", url: "https://bford.info/pub/net/p2pnat/", kind: article }
              - { label: "RFC 8489: STUN, Session Traversal Utilities for NAT", url: "https://www.rfc-editor.org/rfc/rfc8489", kind: docs }
              - { label: "RFC 8656: TURN, Traversal Using Relays around NAT", url: "https://www.rfc-editor.org/rfc/rfc8656", kind: docs }
              - { label: "WebRTC connectivity protocols: ICE, STUN, TURN (MDN)", url: "https://developer.mozilla.org/en-US/docs/Web/API/WebRTC_API/Protocols", kind: docs }
              - { label: "Port forwarding explained (PowerCert)", url: "https://www.youtube.com/watch?v=2G1ueMDgwxw", kind: video }
          - id: cloud-nat-gateways
            title: NAT gateways in the cloud
            optional: true
            summary: Private servers in a cloud network use a NAT gateway to reach the internet, and it is billed per gigabyte.
            learn:
              - Outbound-only access for private subnets
              - Why NAT gateway traffic gets expensive
            body: |
              Servers in a private cloud subnet have no public address, but they often need to reach the internet, to download updates or call an API. A **NAT gateway** lets them go out while blocking connections that start outside.

              You put the NAT gateway in a public subnet and point the private subnet's default route at it.

              ### Key ideas
              - Outbound-only access: private servers start connections, the internet cannot
              - Managed NAT gateways are billed per hour and **per gigabyte processed**
              - Traffic to S3 or other cloud services through the NAT gateway adds up quickly
              - Use **VPC endpoints** for cloud services. In AWS, gateway endpoints for S3 and DynamoDB cost nothing extra
              - One NAT gateway per zone avoids cross-zone charges and a single point of failure, but costs more. AWS also offers a regional NAT gateway that spans zones

              ### Common mistakes
              - Pulling large downloads or container images through the NAT gateway every time
              - Using one gateway for all zones, then losing outbound access when that zone fails
            resources:
              - { label: "NAT gateways (AWS docs)", url: "https://docs.aws.amazon.com/vpc/latest/userguide/vpc-nat-gateway.html", kind: docs }
              - { label: "Pricing for NAT gateways (AWS)", url: "https://docs.aws.amazon.com/vpc/latest/userguide/nat-gateway-pricing.html", kind: docs }
              - { label: "Cloud NAT overview (Google Cloud)", url: "https://cloud.google.com/nat/docs/overview", kind: docs }
              - { label: "NAT gateway use cases (AWS docs)", url: "https://docs.aws.amazon.com/vpc/latest/userguide/nat-gateway-scenarios.html", kind: docs }
              - { label: "Compare NAT gateways and NAT instances (AWS docs)", url: "https://docs.aws.amazon.com/vpc/latest/userguide/vpc-nat-comparison.html", kind: docs }
              - { label: "Gateway endpoints for S3 and DynamoDB, skip NAT charges (AWS docs)", url: "https://docs.aws.amazon.com/vpc/latest/privatelink/gateway-endpoints.html", kind: docs }
              - { label: "What is Azure NAT Gateway? (Microsoft Learn)", url: "https://learn.microsoft.com/en-us/azure/nat-gateway/nat-overview", kind: docs }
              - { label: "The AWS Managed NAT Gateway is unpleasant and not recommended (Last Week in AWS)", url: "https://www.lastweekinaws.com/blog/the-aws-managed-nat-gateway-is-unpleasant-and-not-recommended/", kind: article }
              - { label: "Understanding NAT gateways, AWS training (QA)", url: "https://www.youtube.com/watch?v=ujXr0i5EoHE", kind: video }
          - id: internet-gateways
            title: Internet gateways and IPv6 egress
            summary: Public subnets reach the internet through an internet gateway. IPv6 needs no NAT, so private IPv6 subnets use an egress-only internet gateway instead.
            learn:
              - Internet gateway vs NAT gateway
              - Public and private subnets, and their routes
              - Egress-only internet gateways for outbound-only IPv6
            body: |
              A cloud network has no internet access by default. An **internet gateway** attaches the VPC to the internet. A subnet is **public** when its route table sends internet-bound traffic (`0.0.0.0/0`) to the internet gateway, and **private** when it does not.

              A public IPv4 instance needs a public address, and the gateway translates between it and the private one. A **NAT gateway** is different: it is for private subnets to start outbound connections.

              ### Key ideas
              - Internet gateway: two-way access for instances with public addresses
              - NAT gateway: outbound-only access for private IPv4 instances
              - IPv6 addresses are public and need no NAT, so private IPv6 subnets use an **egress-only internet gateway**: it allows outbound and blocks inbound
              - The route table decides which subnet is public or private, not its name

              ### Example
              Public subnet route: `0.0.0.0/0` to the internet gateway. Private subnet route: `0.0.0.0/0` to the NAT gateway, and `::/0` to the egress-only gateway.
            resources:
              - { label: "Internet gateways (AWS docs)", url: "https://docs.aws.amazon.com/vpc/latest/userguide/VPC_Internet_Gateway.html", kind: docs }
              - { label: "Egress-only internet gateways (AWS docs)", url: "https://docs.aws.amazon.com/vpc/latest/userguide/egress-only-internet-gateway.html", kind: docs }
              - { label: "Configure route tables (AWS docs)", url: "https://docs.aws.amazon.com/vpc/latest/userguide/VPC_Route_Tables.html", kind: docs }
              - { label: "Example: private subnets with a NAT gateway (AWS docs)", url: "https://docs.aws.amazon.com/vpc/latest/userguide/vpc-example-private-subnets-nat.html", kind: docs }
              - { label: "IPv6 support for your VPC (AWS docs)", url: "https://docs.aws.amazon.com/vpc/latest/userguide/aws-ipv6-support.html", kind: docs }
              - { label: "RFC 6146: Stateful NAT64", url: "https://www.rfc-editor.org/rfc/rfc6146", kind: docs }
              - { label: "What is IPv6 for Azure Virtual Network? (Microsoft Learn)", url: "https://learn.microsoft.com/en-us/azure/virtual-network/ip-services/ipv6-overview", kind: docs }
              - { label: "AWS Internet Gateway vs NAT Gateway in 3 minutes (DevOps Studio)", url: "https://www.youtube.com/watch?v=2htfhgcySfs", kind: video }

      - id: routing
        title: Routing
        summary: How each router picks the next hop, and how packets cross many networks to reach you.
        lessons:
          - id: routing-tables
            title: Routing tables and default routes
            summary: Each router looks up the destination and sends the packet to the most specific match.
            learn:
              - Longest prefix match
              - The default route
            body: |
              A router keeps a **routing table**: a list of destination networks and where to send packets for each one (the next hop). For every packet it looks up the destination address and forwards it.

              Several entries can match one address. The router picks the most specific one, the one with the **longest prefix**. A `/24` route beats a `/16` route for an address inside both.

              ### Key ideas
              - Each route says: destination prefix, next hop, interface
              - **Longest prefix match** chooses the most specific route
              - The **default route** (`0.0.0.0/0` for IPv4, `::/0` for IPv6) matches everything else. It usually points to the ISP or a gateway
              - Your laptop has a small table too, mostly the local network and a default gateway

              ### Example
              ```
              10.0.0.0/16   via 10.0.0.1
              10.0.5.0/24   via 10.0.5.1
              0.0.0.0/0     via 192.168.1.1
              ```
              A packet for `10.0.5.9` takes the `/24` route. A packet for `8.8.8.8` takes the default route.
            resources:
              - { label: "What is routing? (Cloudflare)", url: "https://www.cloudflare.com/learning/network-layer/what-is-routing/", kind: article }
              - { label: "Routing table (Wikipedia)", url: "https://en.wikipedia.org/wiki/Routing_table", kind: article }
              - { label: "Default route (Wikipedia)", url: "https://en.wikipedia.org/wiki/Default_route", kind: article }
              - { label: "RFC 1812: Requirements for IP Version 4 Routers", url: "https://www.rfc-editor.org/rfc/rfc1812", kind: docs }
              - { label: "ip-route(8): Linux routing table management (man7.org)", url: "https://man7.org/linux/man-pages/man8/ip-route.8.html", kind: docs }
              - { label: "Packet Traveling: how packets move through a network (Practical Networking)", url: "https://www.practicalnetworking.net/series/packet-traveling/packet-traveling/", kind: article }
              - { label: "Routing tables explained (PowerCert)", url: "https://www.youtube.com/watch?v=CGmTvukObOw", kind: video }
              - { label: "Routing table explained (Network Direction)", url: "https://www.youtube.com/watch?v=uKiM9-tGuc4", kind: video }
              - { label: "Virtual network traffic routing (Microsoft Learn)", url: "https://learn.microsoft.com/en-us/azure/virtual-network/virtual-networks-udr-overview", kind: docs }
          - id: hops-and-traceroute
            title: Hops and traceroute
            summary: See every router your packets pass through on their way to a server.
            learn:
              - Reading traceroute output
              - Why some hops show as stars
            body: |
              Each router a packet passes through is a **hop**. `traceroute` (`tracert` on Windows) shows the list of hops between you and a server, with the round-trip time to each.

              It works by sending packets with TTL 1, then 2, then 3. The first router drops the first packet and replies "time exceeded", the second router replies for the second packet, and so on until the target answers.

              ### Key ideas
              - Each line is one hop, with three timing samples
              - Times usually grow with distance, but a single slow hop does not always mean a problem
              - **Stars** (`* * *`) mean no reply came back. Many routers rate-limit or ignore these probes, so the path may be fine
              - The path can differ between runs, and the return path can differ from the forward one

              ### In practice
              ```bash
              traceroute harun.dev
              mtr harun.dev
              ```
              `mtr` repeats the test and shows loss and delay per hop. A real problem shows as loss or delay that continues to all later hops.
            resources:
              - { label: "Traceroute (Wikipedia)", url: "https://en.wikipedia.org/wiki/Traceroute", kind: article }
              - { label: "Traceroute (tracert) explained (PowerCert)", url: "https://www.youtube.com/watch?v=up3bcBLZS74", kind: video }
              - { label: "Day 20: Scapy and traceroute (Julia Evans)", url: "https://jvns.ca/blog/2013/10/31/day-20-scapy-and-traceroute/", kind: article }
              - { label: "MTR: traceroute plus ping in one tool (GitHub)", url: "https://github.com/traviscross/mtr", kind: tool }
              - { label: "RIPE Atlas: traceroute from thousands of probes (RIPE NCC)", url: "https://atlas.ripe.net/", kind: tool }
              - { label: "Looking glass: traceroute from Hurricane Electric routers", url: "https://lg.he.net/", kind: tool }
              - { label: "RFC 792: ICMP, Time Exceeded messages", url: "https://www.rfc-editor.org/rfc/rfc792", kind: docs }
          - id: static-vs-dynamic-routing
            title: Static vs dynamic routing
            optional: true
            summary: Routes typed in by hand vs routes learned from protocols like OSPF and BGP.
            learn:
              - When static routes are enough
              - Interior vs exterior routing protocols
            body: |
              Routes get into a routing table in two ways. A **static route** is typed in by a person and does not change unless they change it. A **dynamic route** is learned from neighbouring routers using a routing protocol, and it updates when the network changes.

              ### Key ideas
              - Static routes are simple and predictable. They are enough for small networks or a single exit
              - They do not adapt: if a link fails, you must fix it by hand
              - Dynamic protocols share changes automatically and can find another path
              - **Interior** protocols such as OSPF run inside one organisation's network
              - **Exterior** protocols such as BGP run between organisations. BGP holds the internet together

              ### Example
              An office with one internet link needs just a default static route to the ISP. A large company with many sites runs OSPF inside, and BGP to its providers.
            resources:
              - { label: "What is routing? (Cloudflare)", url: "https://www.cloudflare.com/learning/network-layer/what-is-routing/", kind: article }
              - { label: "Static routing (Wikipedia)", url: "https://en.wikipedia.org/wiki/Static_routing", kind: article }
              - { label: "Open Shortest Path First (Wikipedia)", url: "https://en.wikipedia.org/wiki/Open_Shortest_Path_First", kind: article }
              - { label: "RFC 2328: OSPF Version 2", url: "https://www.rfc-editor.org/rfc/rfc2328", kind: docs }
              - { label: "RFC 4271: BGP-4", url: "https://www.rfc-editor.org/rfc/rfc4271", kind: docs }
              - { label: "What is BGP? (Cloudflare)", url: "https://www.cloudflare.com/learning/security/glossary/what-is-bgp/", kind: article }
              - { label: "Routing (Computer Networks: A Systems Approach)", url: "https://book.systemsapproach.org/internetworking/routing.html", kind: course }
              - { label: "OSPF overview (Juniper docs)", url: "https://www.juniper.net/documentation/us/en/software/junos/ospf/topics/topic-map/ospf-overview.html", kind: docs }
              - { label: "OSPF explained step by step (CertBros)", url: "https://www.youtube.com/watch?v=kfvJ8QVJscc", kind: video }

      - id: interior-routing
        title: "Interior routing: RIP, OSPF and IS-IS"
        summary: How routers inside one network learn every path without anyone typing static routes. Distance vector vs link state, OSPF in depth with a real FRR config, IS-IS, redistribution and equal-cost multipath.
        lessons:
          - id: distance-vector-vs-link-state
            title: Distance vector vs link state
            summary: Two ways for routers to learn a network. Tell your neighbours what you can reach, or tell everyone what your links look like and let each router draw the map.
            learn:
              - How a distance vector router learns routes from its neighbours
              - How a link-state router builds a full map and runs Dijkstra on it
              - Why link state converges faster and loops less
              - Where each family is still used
            body: |
              Static routes break when a link fails. A routing protocol lets routers find working paths on their own. Inside one organisation these are **interior gateway protocols** (IGPs). They come in two families.

              | | Distance vector | Link state |
              |---|---|---|
              | What a router sends | its whole routing table: "I reach X at cost N" | a description of its own links |
              | Who receives it | direct neighbours only | every router in the area (flooding) |
              | What each router knows | the next hop and the cost, nothing beyond | the full topology of the area |
              | How the best path is found | Bellman-Ford, one hop at a time | Dijkstra's shortest path first (SPF) |
              | Convergence after a failure | slow, can count to infinity | fast, every router recomputes at once |
              | Examples | RIP, Babel | OSPF, IS-IS |

              ### Key ideas
              - Distance vector is "routing by rumour". A router trusts what its neighbour says about networks it cannot see
              - Link state routers all hold the same database, the **LSDB**. Each runs SPF on it with itself as the root
              - When a link fails, link state floods one small update and everyone recomputes. Distance vector waits for timers and neighbours to pass the news along
              - Link state costs more memory and CPU, which stopped mattering decades ago
              - BGP is a **path vector** protocol: distance vector plus the full list of ASes on the path, which stops loops between networks

              ### Example
              Routers A, B and C sit in a line. A loses its link to network N. With distance vector, B may still tell A "I reach N in 2 hops", which was learned from A in the first place. A believes it, and the two raise the count back and forth. Split horizon and poison reverse limit this. Link state has no such problem: A floods "my link to N is down" and every router removes N from its map.

              ### In practice
              New designs use OSPF or IS-IS inside the network and BGP at the edge. Distance vector survives in RIP on old gear and in Babel on mesh and home networks.
            resources:
              - { label: "EGP / IGP, Distance Vector / Link State (Practical Networking)", url: "https://www.youtube.com/watch?v=KjNYEzEBRD8", kind: video }
              - { label: "Distance-vector routing protocol (Wikipedia)", url: "https://en.wikipedia.org/wiki/Distance-vector_routing_protocol", kind: article }
              - { label: "Link-state routing protocol (Wikipedia)", url: "https://en.wikipedia.org/wiki/Link-state_routing_protocol", kind: article }
              - { label: "Dijkstra's algorithm (Wikipedia)", url: "https://en.wikipedia.org/wiki/Dijkstra%27s_algorithm", kind: article }
              - { label: "Bellman-Ford algorithm (Wikipedia)", url: "https://en.wikipedia.org/wiki/Bellman%E2%80%93Ford_algorithm", kind: article }
              - { label: "Count to infinity (Wikipedia)", url: "https://en.wikipedia.org/wiki/Count_to_infinity", kind: article }
              - { label: "Split horizon route advertisement (Wikipedia)", url: "https://en.wikipedia.org/wiki/Split_horizon_route_advertisement", kind: article }
          - id: rip
            title: RIP, and why it is rarely used
            optional: true
            summary: The oldest IGP still around. Hop count as the only metric, a 15-hop limit and slow timers explain why it lost to OSPF.
            learn:
              - How RIP picks routes by hop count
              - The 15-hop limit and the 30-second update timer
              - Split horizon and poison reverse
              - RIPv1, RIPv2 and RIPng
            body: |
              **RIP** (Routing Information Protocol) is a distance vector protocol. Every 30 seconds each router sends its full table to its neighbours. The metric is the **hop count**: the number of routers on the way. The lowest count wins.

              | Version | Addresses | Sends to | Notes |
              |---|---|---|---|
              | RIPv1 (RFC 1058) | IPv4, classful | broadcast | no subnet masks, no authentication |
              | RIPv2 (RFC 2453) | IPv4, CIDR | `224.0.0.9` | carries masks, supports authentication |
              | RIPng (RFC 2080) | IPv6 | `ff02::9`, UDP 521 | IPv6 version of RIPv2 |

              RIPv1 and RIPv2 use UDP port 520.

              ### Key ideas
              - A hop count of **16 means unreachable**. A network more than 15 routers wide cannot use RIP at all
              - **Split horizon**: never advertise a route back out of the interface you learned it on
              - **Poison reverse**: advertise it back, but with metric 16, so the neighbour drops it at once
              - Routes time out after 180 seconds without an update, so a silent failure can take minutes to notice

              ### Why it is rarely used
              - Hop count ignores bandwidth. A path over two 10 Gbps links loses to one hop over a slow WAN link
              - Convergence takes tens of seconds to minutes. OSPF and IS-IS take well under a second when tuned
              - Every router sends its whole table every 30 seconds, even when nothing changed
              - There are no areas, so it does not scale

              ### In practice
              You meet RIP on old routers, in some small embedded gear and in exam questions. FRR still ships `ripd` and `ripngd`, which is handy for labs. For anything new, use OSPF.
            resources:
              - { label: "Networking Basics: How RIP Works (Kevin Wallace)", url: "https://www.youtube.com/watch?v=tZWlRq-iunI", kind: video }
              - { label: "RFC 2453: RIP Version 2", url: "https://www.rfc-editor.org/rfc/rfc2453", kind: docs }
              - { label: "RFC 2080: RIPng for IPv6", url: "https://www.rfc-editor.org/rfc/rfc2080", kind: docs }
              - { label: "RFC 1058: Routing Information Protocol", url: "https://www.rfc-editor.org/rfc/rfc1058", kind: docs }
              - { label: "RIP (FRRouting docs)", url: "https://docs.frrouting.org/en/latest/ripd.html", kind: docs }
              - { label: "Routing Information Protocol (Wikipedia)", url: "https://en.wikipedia.org/wiki/Routing_Information_Protocol", kind: article }
          - id: ospf-fundamentals
            title: "OSPF: areas, LSAs, DR/BDR and cost"
            summary: The link-state IGP most enterprises run. How neighbours form, what each LSA type carries, why areas exist and how cost picks the path.
            learn:
              - Neighbours, adjacencies and the LSDB
              - Area 0, ABRs and ASBRs
              - The main LSA types and who creates them
              - DR/BDR election on shared segments
              - How cost is calculated and why the default is wrong for fast links
            body: |
              **OSPF** (Open Shortest Path First) runs directly on IP as protocol 89. OSPFv2 (RFC 2328) is for IPv4, OSPFv3 (RFC 5340) for IPv6. Routers send **hellos** to `224.0.0.5` every 10 seconds, become neighbours, swap databases and reach the **Full** state. Then every router in an area holds the same LSDB and runs SPF on it.

              ### Areas
              Every SPF run covers one area. Big networks split into areas so a flap in one does not make every router recompute. **Area 0** is the backbone, and every other area must touch it. An **ABR** (area border router) sits in area 0 and another area. An **ASBR** brings in routes from outside OSPF.

              | LSA | Created by | Carries | Floods |
              |---|---|---|---|
              | 1 Router | every router | its own links and their costs | inside its area |
              | 2 Network | the DR | the routers on one shared segment | inside its area |
              | 3 Summary | ABR | prefixes from other areas | into other areas |
              | 4 ASBR summary | ABR | how to reach an ASBR | into other areas |
              | 5 External | ASBR | redistributed routes | everywhere except stub areas |
              | 7 NSSA external | ASBR in an NSSA | external routes in that area | the NSSA, turned into type 5 by the ABR |

              ### DR and BDR
              On a shared Ethernet segment with many routers, a full mesh of adjacencies would flood the same update many times. OSPF elects a **designated router** (DR) and a backup (BDR). Others form full adjacencies only with these two. The highest **priority** wins (default 1, 0 means never), then the highest router ID. The election does not preempt: a better router joining later waits until the DR fails.

              ### Cost
              Cost is **reference bandwidth / interface bandwidth**. The default reference is 100 Mbps, so 100 Mbps, 1 Gbps and 10 Gbps links all cost 1. Raise the reference on every router, or set costs by hand.

              ### Common mistakes
              - Mismatched hello or dead timers, area IDs, MTU or subnet: the neighbour never reaches Full
              - Using a DR on a link between just two routers. Set the network type to point-to-point and skip the election
              - Changing the reference bandwidth on some routers but not all
            resources:
              - { label: "RFC 2328: OSPF Version 2", url: "https://www.rfc-editor.org/rfc/rfc2328", kind: docs }
              - { label: "RFC 5340: OSPF for IPv6", url: "https://www.rfc-editor.org/rfc/rfc5340", kind: docs }
              - { label: "Practical OSPF: OSPF framework and packets (Practical Networking)", url: "https://www.youtube.com/watch?v=_ThYOX1wX_4", kind: video }
              - { label: "OSPF LSA types explained (Practical Networking)", url: "https://www.youtube.com/watch?v=Wf755546JhA", kind: video }
              - { label: "DR and BDR election, Practical OSPF lesson 6 (Practical Networking)", url: "https://www.youtube.com/watch?v=Mi3tNSUjb78", kind: video }
              - { label: "OSPF Explained step by step (CertBros)", url: "https://www.youtube.com/watch?v=kfvJ8QVJscc", kind: video }
              - { label: "OSPF overview (Juniper)", url: "https://www.juniper.net/documentation/us/en/software/junos/ospf/topics/topic-map/ospf-overview.html", kind: docs }
              - { label: "Open Shortest Path First (Wikipedia)", url: "https://en.wikipedia.org/wiki/Open_Shortest_Path_First", kind: article }
          - id: ospf-frr-config
            title: A minimal OSPF setup with FRRouting
            summary: Two Linux routers, one link, a loopback each. The FRR config, the commands to check it and what a healthy result looks like.
            learn:
              - Turning on ospfd in FRR
              - Enabling OSPF per interface and setting the router ID
              - Passive interfaces and point-to-point links
              - Checking neighbours and learned routes with vtysh
            body: |
              **FRRouting** (FRR) is the open source routing suite used on Linux routers, in SONiC, Cumulus and many labs. It runs one daemon per protocol. Enable `ospfd` in `/etc/frr/daemons` (`ospfd=yes`) and restart FRR.

              ### Example
              Router r1 has loopback `10.255.0.1/32`, a link to r2 on `eth1` (`10.0.12.0/31`) and a user LAN on `eth2`. In `/etc/frr/frr.conf`:

              ```
              interface lo
               ip address 10.255.0.1/32
               ip ospf area 0
               ip ospf passive
              !
              interface eth1
               ip address 10.0.12.0/31
               ip ospf area 0
               ip ospf network point-to-point
               ip ospf cost 10
              !
              interface eth2
               ip address 192.168.10.1/24
               ip ospf area 0
               ip ospf passive
              !
              router ospf
               ospf router-id 10.255.0.1
               auto-cost reference-bandwidth 100000
              ```

              r2 gets the same config with its own addresses (`10.0.12.1/31`, router ID `10.255.0.2`).

              ### What each line does
              - `ip ospf area 0` turns OSPF on for that interface. Do not mix this with `network ... area` lines under `router ospf`: FRR does not support both on one router
              - `ip ospf passive` advertises the subnet but sends no hellos, so no one on the user LAN can form an adjacency
              - `network point-to-point` skips the DR election on a two-router link and speeds up convergence
              - A fixed **router ID** keeps the router's identity stable when addresses change
              - The reference bandwidth of 100,000 Mbps makes a 100 Gbps link cost 1, a 10 Gbps link 10

              ### Checking it
              ```bash
              vtysh -c "show ip ospf neighbor"
              vtysh -c "show ip ospf database"
              vtysh -c "show ip route ospf"
              ```
              A healthy neighbour shows state **Full**. r1's table should now have `10.255.0.2/32` and r2's LAN, marked `O`.

              ### Common mistakes
              - Forgetting `ospfd=yes`: the config loads but nothing happens
              - A host firewall dropping IP protocol 89 or multicast `224.0.0.5`
              - Different MTUs on the two ends: the neighbour sticks in ExStart
            resources:
              - { label: "OSPFv2 (FRRouting docs)", url: "https://docs.frrouting.org/en/latest/ospfd.html", kind: docs }
              - { label: "Basic setup and the daemons file (FRRouting docs)", url: "https://docs.frrouting.org/en/latest/setup.html", kind: docs }
              - { label: "VTY shell (FRRouting docs)", url: "https://docs.frrouting.org/en/latest/vtysh.html", kind: docs }
              - { label: "FRR lab example (containerlab)", url: "https://containerlab.dev/lab-examples/frr01/", kind: tool }
              - { label: "containerlab", url: "https://containerlab.dev/", kind: tool }
              - { label: "OSPF configuration and show commands (Practical Networking)", url: "https://www.youtube.com/watch?v=Jgs2-M9-gsI", kind: video }
              - { label: "Free CCNA: OSPF Part 1 (Jeremy's IT Lab)", url: "https://www.youtube.com/watch?v=pvuaoJ9YzoI", kind: video }
          - id: is-is
            title: IS-IS, and why ISPs like it
            optional: true
            summary: The other link-state IGP. It runs below IP, carries IPv4 and IPv6 in one instance and is the usual choice in large provider backbones.
            learn:
              - How IS-IS differs from OSPF in transport and addressing
              - Level 1, level 2 and the NET address
              - Why providers prefer it for large backbones
            body: |
              **IS-IS** (Intermediate System to Intermediate System) was designed for the OSI protocol stack (ISO 10589). RFC 1195 added IPv4, RFC 5308 added IPv6. Like OSPF it floods link-state packets (LSPs) and runs SPF. The differences are in the details, and they suit big networks.

              | | OSPF | IS-IS |
              |---|---|---|
              | Runs on | IP (protocol 89) | directly on layer 2, no IP |
              | IPv4 and IPv6 | two protocols, OSPFv2 and OSPFv3 | one instance carries both |
              | Hierarchy | area 0 plus areas attached to it | level 1 (inside an area) and level 2 (backbone) |
              | Area border | on a router, per interface | on a link, between routers |
              | New features | new LSA types | new TLVs in the same packets |
              | Router address | router ID | NET, for example `49.0001.0100.0000.0001.00` |

              ### Key ideas
              - A router can be **L1**, **L2** or **L1/L2**. The L2 routers form the backbone, which must be contiguous
              - The **NET** holds the area ID (`49.0001`, `49` means private), the system ID (6 bytes, often derived from the loopback IP) and a final `00`
              - Use **wide metrics** (RFC 5305). The old narrow metric caps an interface at 63
              - IS-IS has administrative distance 115 by default, so OSPF (110) wins if both learn a route

              ### Why ISPs like it
              - It does not run on IP, so a host cannot spoof IS-IS packets from across the network
              - One instance and one database for IPv4 and IPv6
              - TLVs made it easy to extend for traffic engineering and segment routing
              - Large single-level designs are common and work well
              - Many provider operators learned on it, and vendor support is mature

              ### In practice
              Inside a company, OSPF and IS-IS both work. Pick the one your team can run at 3 a.m. FRR ships `isisd`.
            resources:
              - { label: "RFC 1195: OSI IS-IS for routing in TCP/IP", url: "https://www.rfc-editor.org/rfc/rfc1195", kind: docs }
              - { label: "RFC 5308: Routing IPv6 with IS-IS", url: "https://www.rfc-editor.org/rfc/rfc5308", kind: docs }
              - { label: "RFC 5305: IS-IS extensions for traffic engineering (wide metrics)", url: "https://www.rfc-editor.org/rfc/rfc5305", kind: docs }
              - { label: "IS-IS (FRRouting docs)", url: "https://docs.frrouting.org/en/latest/isisd.html", kind: docs }
              - { label: "IS-IS routing overview (Juniper)", url: "https://www.juniper.net/documentation/us/en/software/junos/is-is/topics/concept/is-is-routing-overview.html", kind: docs }
              - { label: "Comparing IS-IS and OSPF (NSRC)", url: "https://www.youtube.com/watch?v=GrrrEOyxg30", kind: video }
              - { label: "IS-IS routing protocol fundamentals (Kevin Wallace)", url: "https://www.youtube.com/watch?v=o1k1TlxL5Dk", kind: video }
              - { label: "IS-IS (Wikipedia)", url: "https://en.wikipedia.org/wiki/IS-IS", kind: article }
          - id: redistribution-and-admin-distance
            title: Route redistribution and administrative distance
            summary: When two protocols, or a protocol and a static route, offer the same prefix, the router needs a tie-breaker. And sometimes routes must cross from one protocol into another.
            learn:
              - What administrative distance is and the common defaults
              - How metric differs from distance
              - Redistributing static and connected routes into OSPF
              - How mutual redistribution creates loops
            body: |
              Each protocol picks its own best path with its own **metric**: hop count for RIP, cost for OSPF, path attributes for BGP. These numbers cannot be compared. When two sources offer the same prefix, the router uses **administrative distance** (AD): a fixed trust ranking per source. Lowest wins. Longest prefix match still comes first: a `/24` from RIP beats a `/16` from OSPF.

              | Source | Default AD (FRR and Cisco) |
              |---|---|
              | Connected | 0 |
              | Static | 1 |
              | eBGP | 20 |
              | OSPF | 110 |
              | IS-IS | 115 |
              | RIP | 120 |
              | iBGP | 200 |

              ### Floating static routes
              Give a static route a higher AD than the IGP and it becomes a backup. It is installed only when the dynamic route disappears.
              ```
              ip route 0.0.0.0/0 203.0.113.1 250
              ```

              ### Redistribution
              **Redistribution** copies routes from one source into another protocol. In FRR:
              ```
              router ospf
               redistribute static route-map STATIC-TO-OSPF
               default-information originate
              ```
              Redistributed routes enter OSPF as type 5 external LSAs, and the router becomes an ASBR. `default-information originate` advertises a default route when the router has one, which is how an edge router tells the whole network "the internet is this way".

              ### Common mistakes
              - Redistributing without a route-map. Every static and connected route leaks, including management and lab subnets
              - **Mutual redistribution** at two points (OSPF into BGP and back, on two routers). A route can leave one protocol and come back as an external with a better distance, causing loops. Tag routes when they cross and refuse tagged routes on the way back
              - Redistributing a full BGP table into an IGP. That is about a million routes, and the IGP will fall over
              - Redistributing connected interfaces when `ip ospf passive` would do. Passive keeps them as internal routes with no type 5 flooding
            resources:
              - { label: "Administrative distance (FRRouting zebra docs)", url: "https://docs.frrouting.org/en/latest/zebra.html#administrative-distance", kind: docs }
              - { label: "Route maps (FRRouting docs)", url: "https://docs.frrouting.org/en/latest/routemap.html", kind: docs }
              - { label: "Redistribution into OSPF (FRRouting docs)", url: "https://docs.frrouting.org/en/latest/ospfd.html", kind: docs }
              - { label: "Administrative distance (Wikipedia)", url: "https://en.wikipedia.org/wiki/Administrative_distance", kind: article }
              - { label: "Route redistribution (Wikipedia)", url: "https://en.wikipedia.org/wiki/Route_redistribution", kind: article }
              - { label: "Networking Basics: Administrative Distance (Kevin Wallace)", url: "https://www.youtube.com/watch?v=414sFHcOATc", kind: video }
              - { label: "Route redistribution, theory and configuration (Kevin Wallace)", url: "https://www.youtube.com/watch?v=dUz-CWp_NaA", kind: video }
          - id: ecmp
            title: Equal-cost multipath (ECMP)
            summary: When two or more paths tie on cost, use all of them. How routers split traffic per flow, and why packets of one connection stay on one path.
            learn:
              - How ECMP installs several next hops for one prefix
              - Per-flow hashing and why per-packet splitting is avoided
              - ECMP on Linux and in FRR
              - Where hashing goes wrong
            body: |
              When SPF finds two or more paths with the same total cost, the router can install **all of them** for that prefix. This is **equal-cost multipath** (ECMP). Two 10 Gbps uplinks then carry up to 20 Gbps together, and a failure just removes one next hop.

              ### Per flow, not per packet
              Sending packets round-robin would reorder them, and TCP treats reordering like loss. So routers **hash** fields of each packet and pick a path from the hash. Every packet of one flow gets the same hash and stays on one path.

              | Hash input | Spreads | Note |
              |---|---|---|
              | Source and destination IP (L3) | per host pair | one busy host pair uses one link |
              | 5-tuple: IPs, protocol, ports (L4) | per connection | the usual choice |
              | Inner headers of a tunnel | per inner flow | needed for GRE or IP-in-IP. VXLAN already puts a hash of the inner flow in its outer UDP source port |

              ### Example
              On Linux, one route with two next hops:
              ```bash
              ip route add 10.20.0.0/16 \
                nexthop via 10.0.12.1 dev eth1 \
                nexthop via 10.0.13.1 dev eth2
              sysctl -w net.ipv4.fib_multipath_hash_policy=1
              ```
              Policy `1` hashes on the 5-tuple. The default `0` uses only the addresses. FRR installs ECMP routes on its own when OSPF or IS-IS finds equal costs, up to `maximum-paths`, which defaults to the compile-time limit (256 in the official Debian and RPM packages, 16 in a plain source build). BGP has its own `maximum-paths` setting.

              ### Key ideas
              - Costs must tie exactly. Use the same link speeds and costs on parallel paths
              - One large flow, such as a backup job, still uses only one link. ECMP balances flows, not bytes
              - When a path is added or removed, many flows can rehash onto new paths. Stateful devices in the path then see packets for connections they never saw start
              - Data centre fabrics are built around ECMP: every leaf has equal-cost paths through every spine

              ### Common mistakes
              - Expecting a single file copy to go faster over two links
              - Putting a stateful firewall pair behind ECMP without state sync or symmetric hashing
            resources:
              - { label: "RFC 2992: Analysis of an equal-cost multi-path algorithm", url: "https://www.rfc-editor.org/rfc/rfc2992", kind: docs }
              - { label: "ECMP (FRRouting zebra docs)", url: "https://docs.frrouting.org/en/latest/zebra.html#ecmp", kind: docs }
              - { label: "fib_multipath_hash_policy (Linux IP sysctl docs)", url: "https://docs.kernel.org/networking/ip-sysctl.html", kind: docs }
              - { label: "ip-route(8) man page", url: "https://man.archlinux.org/man/ip-route.8", kind: docs }
              - { label: "RFC 7938: BGP in large-scale data centers (ECMP section)", url: "https://www.rfc-editor.org/rfc/rfc7938", kind: docs }
              - { label: "Equal-cost multi-path routing (Wikipedia)", url: "https://en.wikipedia.org/wiki/Equal-cost_multi-path_routing", kind: article }
              - { label: "Equal-Cost Multi-Path Routing (Palo Alto Networks)", url: "https://www.youtube.com/watch?v=KICp-9yXOT0", kind: video }

      - id: transport-in-depth
        title: TCP, sockets and ICMP in depth
        summary: How TCP recovers lost data and avoids congestion, how programs open sockets, and the ICMP tools for diagnosing a path.
        lessons:
          - id: tcp-reliability
            title: Retransmission and congestion control
            summary: How TCP notices lost packets, resends them and slows down when the network is full.
            learn:
              - Acknowledgements and retransmits
              - Slow start and congestion windows
            body: |
              TCP numbers every byte it sends. The receiver sends **acknowledgements** saying which bytes arrived. If the sender does not get an ACK in time, or sees repeated ACKs for the same spot, it knows data was lost and **retransmits** it.

              TCP also has to avoid flooding the network. It tracks a **congestion window**, the amount of data allowed in flight at once.

              ### Key ideas
              - **Slow start**: begin with a small window and roughly double it each round trip
              - **Congestion avoidance**: after a threshold, grow more slowly
              - On loss, cut the window and grow again. This is how many senders share a link fairly
              - **Flow control** is separate: the receiver's window stops a fast sender from overwhelming a slow receiver
              - Packet loss slows a transfer even when there is spare bandwidth

              ### Why it matters
              A new connection starts slow. That is one more reason to reuse connections and to keep first-page files small.
            resources:
              - { label: "Building blocks of TCP (High Performance Browser Networking)", url: "https://hpbn.co/building-blocks-of-tcp/", kind: course }
              - { label: "RFC 5681: TCP congestion control", url: "https://www.rfc-editor.org/rfc/rfc5681", kind: docs }
              - { label: "TCP congestion control (Wikipedia)", url: "https://en.wikipedia.org/wiki/TCP_congestion_control", kind: article }
              - { label: "RFC 6298: Computing TCP's Retransmission Timer", url: "https://www.rfc-editor.org/rfc/rfc6298", kind: docs }
              - { label: "RFC 9438: CUBIC for Fast and Long-Distance Networks", url: "https://www.rfc-editor.org/rfc/rfc9438", kind: docs }
              - { label: "RFC 2018: TCP Selective Acknowledgment Options", url: "https://www.rfc-editor.org/rfc/rfc2018", kind: docs }
              - { label: "Congestion control (Computer Networks: A Systems Approach)", url: "https://book.systemsapproach.org/congestion.html", kind: course }
              - { label: "BBR: congestion-based congestion control (Google Research)", url: "https://research.google/pubs/bbr-congestion-based-congestion-control-2/", kind: article }
              - { label: "TCP congestion control hands-on with Wireshark (Chris Greer)", url: "https://www.youtube.com/watch?v=IRXP1vJ6-vM", kind: video }
          - id: socket-programming
            title: Socket programming
            optional: true
            summary: Write a tiny TCP client and server yourself to see the handshake and ports in action.
            learn:
              - Sockets, bind, listen, accept, connect
              - Reading and writing bytes
            body: |
              A **socket** is the endpoint a program uses to send and receive data over a network. You can write a working TCP server in a few lines, and it shows what the earlier lessons describe.

              A server **binds** a socket to an address and port, **listens** for incoming connections, and **accepts** each one. A client **connects** to that address. Both then read and write bytes.

              ### Key ideas
              - Server: socket, bind, listen, accept, then read and write
              - Client: socket, connect, then write and read
              - TCP gives a stream of bytes, with no message boundaries, so you must frame your own messages
              - The operating system does the handshake and picks the client's source port

              ### In practice
              ```python
              import socket
              s = socket.socket()
              s.bind(("127.0.0.1", 9000))
              s.listen()
              conn, addr = s.accept()
              print(addr, conn.recv(1024))
              ```
              Run it, then connect with `nc 127.0.0.1 9000` and type a line.
            resources:
              - { label: "Beej's Guide to Network Programming", url: "https://beej.us/guide/bgnet/", kind: course }
              - { label: "Socket Programming HOWTO (Python)", url: "https://docs.python.org/3/howto/sockets.html", kind: docs }
              - { label: "socket(7): Linux socket interface (man7.org)", url: "https://man7.org/linux/man-pages/man7/socket.7.html", kind: docs }
              - { label: "tcp(7): Linux TCP protocol and socket options (man7.org)", url: "https://man7.org/linux/man-pages/man7/tcp.7.html", kind: docs }
              - { label: "net package: Dial and Listen (Go docs)", url: "https://pkg.go.dev/net", kind: docs }
              - { label: "net module: TCP servers and clients (Node.js docs)", url: "https://nodejs.org/api/net.html", kind: docs }
              - { label: "Python socket programming tutorial (Tech With Tim)", url: "https://www.youtube.com/watch?v=3QiPPX-KeSc", kind: video }
          - id: icmp-and-diagnostics
            title: ICMP, ping and traceroute
            optional: true
            summary: The network layer's own messages, and the two tools that use them to debug connectivity.
            learn:
              - What ICMP carries
              - How ping and traceroute work
            body: |
              **ICMP** (Internet Control Message Protocol) is how the network layer reports problems and answers simple questions. It travels inside IP packets and has no ports.

              Common messages include echo request and echo reply, "destination unreachable" and "time exceeded".

              ### Key ideas
              - `ping` sends an echo request and waits for an echo reply, so it shows whether a host is reachable and how long the round trip takes
              - `traceroute` sends packets with a TTL of 1, then 2, then 3, and so on. Each router that drops one sends back a "time exceeded" message, which reveals the path
              - Many hosts and firewalls block or limit ICMP, so a failed ping does not always mean a host is down
              - ICMP is also needed for path MTU discovery

              ### In practice
              ```bash
              ping -c 4 example.com
              traceroute example.com
              ```
            resources:
              - { label: "What is ICMP? (Cloudflare)", url: "https://www.cloudflare.com/learning/ddos/glossary/internet-control-message-protocol-icmp/", kind: article }
              - { label: "Traceroute (Wikipedia)", url: "https://en.wikipedia.org/wiki/Traceroute", kind: article }
              - { label: "Internet Control Message Protocol (Wikipedia)", url: "https://en.wikipedia.org/wiki/Internet_Control_Message_Protocol", kind: article }
              - { label: "RFC 792: Internet Control Message Protocol", url: "https://www.rfc-editor.org/rfc/rfc792", kind: docs }
              - { label: "ICMP parameters registry: types and codes (IANA)", url: "https://www.iana.org/assignments/icmp-parameters/icmp-parameters.xhtml", kind: docs }
              - { label: "RFC 4443: ICMPv6", url: "https://www.rfc-editor.org/rfc/rfc4443", kind: docs }
              - { label: "RFC 1191: Path MTU Discovery", url: "https://www.rfc-editor.org/rfc/rfc1191", kind: docs }
              - { label: "Traceroute (tracert) explained (PowerCert)", url: "https://www.youtube.com/watch?v=up3bcBLZS74", kind: video }
              - { label: "Day 20: Scapy and traceroute (Julia Evans)", url: "https://jvns.ca/blog/2013/10/31/day-20-scapy-and-traceroute/", kind: article }
              - { label: "RIPE Atlas: run ping and traceroute from probes worldwide (RIPE NCC)", url: "https://atlas.ripe.net/", kind: tool }

      - id: tls-in-depth
        title: TLS in depth
        summary: TLS versions and what changed between them, and running your own certificate authority.
        lessons:
          - id: tls-versions
            title: TLS 1.3 vs older versions
            summary: What changed in TLS 1.3, and why old versions should be turned off.
            learn:
              - Fewer round trips
              - Removed weak ciphers
            body: |
              TLS has been revised several times. The versions before 1.2 (SSL 3.0, TLS 1.0 and 1.1) are broken or deprecated and should be off. TLS 1.2 is still widely used. **TLS 1.3** (2018) is the current version.

              ### Key ideas
              - **Fewer round trips**: 1.3 needs one round trip for the handshake, 1.2 needs two. Resumed sessions can be faster
              - **Weak features removed**: static RSA key exchange, old ciphers such as RC4 and CBC modes, SHA-1 and compression are gone
              - **Forward secrecy always**: 1.3 requires an ephemeral key exchange
              - More of the handshake is encrypted, including the certificate
              - Configure servers for 1.2 and 1.3 only

              ### In practice
              ```bash
              curl -v --tlsv1.3 https://harun.dev -o /dev/null
              ```
              Look for the negotiated version in the output. Older clients that only speak TLS 1.0 or 1.1 will fail, which is the point.
            resources:
              - { label: "Why use TLS 1.3? (Cloudflare)", url: "https://www.cloudflare.com/learning/ssl/why-use-tls-1.3/", kind: article }
              - { label: "RFC 8446: TLS 1.3", url: "https://www.rfc-editor.org/rfc/rfc8446", kind: docs }
              - { label: "A Detailed Look at RFC 8446, a.k.a. TLS 1.3 (Cloudflare)", url: "https://blog.cloudflare.com/rfc-8446-aka-tls-1-3/", kind: article }
              - { label: "RFC 8996: Deprecating TLS 1.0 and TLS 1.1", url: "https://www.rfc-editor.org/rfc/rfc8996", kind: docs }
              - { label: "RFC 9325: Recommendations for Secure Use of TLS and DTLS", url: "https://www.rfc-editor.org/rfc/rfc9325", kind: docs }
              - { label: "The Illustrated TLS 1.2 Connection (compare with 1.3)", url: "https://tls12.xargs.org/", kind: article }
              - { label: "Introducing 0-RTT (Cloudflare blog)", url: "https://blog.cloudflare.com/introducing-0-rtt/", kind: article }
              - { label: "SSL Configuration Generator (Mozilla)", url: "https://ssl-config.mozilla.org/", kind: tool }
              - { label: "TLS 1.3 handshake, many changes from prior versions (Practical Networking)", url: "https://www.youtube.com/watch?v=JA0vaIb4158", kind: video }
          - id: private-cas
            title: Private certificate authorities
            optional: true
            summary: Internal services can use certificates from your own CA, as long as every client trusts it.
            learn:
              - When a private CA makes sense
              - Watching certificate expiry
            body: |
              A public CA signs certificates for names on the internet. A **private CA** is one you run yourself, for names that exist only inside your network, such as `db.internal`.

              You create a root key and certificate, then issue certificates to your services from it. A client accepts them only if it trusts your root, so you install the root certificate on every machine or container that needs it.

              ### Key ideas
              - Use a private CA for internal services, service-to-service TLS and mutual TLS
              - Keep the root key offline or in a managed service, and issue from an intermediate
              - Prefer short-lived certificates and automate renewal
              - Distribute the root to every client that needs to trust it
              - Monitor expiry dates, since an expired internal certificate causes outages

              ### Common mistakes
              - Putting the private CA's root into the machines of people outside your organisation
              - No alert on expiry, so the first sign is a production outage
