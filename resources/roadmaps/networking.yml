          - id: wifi-generations
            title: "Wi-Fi generations: 4, 5, 6, 6E and 7"
            summary: Each generation adds wider channels, denser modulation or smarter sharing. The headline speeds, what really changed, and why your laptop gets a fraction of them.
            learn:
              - The standard, year, bands and top rate of each generation
              - MIMO, MU-MIMO, OFDMA and MLO in plain words
              - Why real speeds are far below the box
            body: |
              In 2018 the Wi-Fi Alliance renamed the 802.11 versions with simple numbers.

              | Name | Standard | Year | Bands (GHz) | Top rate | Key features |
              |---|---|---|---|---|---|
              | Wi-Fi 4 | 802.11n | 2009 | 2.4, 5 | 600 Mbps | MIMO, up to 4 streams, 40 MHz |
              | Wi-Fi 5 | 802.11ac | 2013 | 5 | 6.9 Gbps | 80 and 160 MHz, 256-QAM, downlink MU-MIMO |
              | Wi-Fi 6 | 802.11ax | 2019 | 2.4, 5 | 9.6 Gbps | OFDMA, uplink MU-MIMO, 1024-QAM, target wake time |
              | Wi-Fi 6E | 802.11ax | 2021 | adds 6 | 9.6 Gbps | the 6 GHz band |
              | Wi-Fi 7 | 802.11be | 2024 | 2.4, 5, 6 | 46 Gbps | 320 MHz, 4096-QAM, multi-link operation |

              ### The features
              - **MIMO**: several antennas send separate **spatial streams** at once. Each stream adds the same rate again
              - **MU-MIMO**: the AP sends different streams to different devices at the same time
              - **OFDMA**: a channel is cut into small **resource units**, so one transmission can carry data for several devices. It cuts waiting when many devices send small packets
              - **QAM**: more points per symbol means more bits, but needs a cleaner signal, so 4096-QAM only works close to the AP
              - **MLO** (multi-link operation): one device uses 5 and 6 GHz links together, for more speed or a backup when one is busy

              ### Why the box lies
              Top rates assume the maximum streams (8 for Wi-Fi 5 and 6, 16 for Wi-Fi 7), the widest channel and the best signal. Most phones and laptops have **2 streams**:

              | Device, 2 streams | Link rate |
              |---|---|
              | Wi-Fi 5, 80 MHz | 867 Mbps |
              | Wi-Fi 6, 80 MHz | 1.2 Gbps |
              | Wi-Fi 6E, 160 MHz | 2.4 Gbps |

              Then half-duplex sharing, ACKs, retries and other devices take their cut. Close to the AP, expect roughly half to two thirds of the link rate as real throughput. Through two walls, much less. Your internet plan may also be the slower part.

              ### Common mistakes
              - Buying a Wi-Fi 7 router for Wi-Fi 5 devices: they still talk Wi-Fi 5
              - Comparing routers by the sum of all bands ("BE19000"): no single device gets that
