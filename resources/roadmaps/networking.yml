          - id: wifi-bands-channels
            title: Wi-Fi bands, channels and signal strength
            summary: 2.4, 5 and 6 GHz trade range for speed. Channel widths, why 1, 6 and 11, radar channels, and how to read dBm and SNR.
            learn:
              - What the 2.4, 5 and 6 GHz bands are good for
              - Channel widths from 20 to 320 MHz and their cost
              - Overlapping channels, DFS and interference
              - Signal, noise and SNR in dBm
            body: |
              | Band | Range in practice | Channels | Notes |
              |---|---|---|---|
              | **2.4 GHz** | longest, best through walls | 1 to 13 (11 in the US), 5 MHz apart | crowded, shared with Bluetooth and microwave ovens |
              | **5 GHz** | medium | 36 to 165, some need DFS | the everyday fast band |
              | **6 GHz** | shortest | up to 1,200 MHz of spectrum in the US, 500 MHz in Europe | Wi-Fi 6E and 7 only, WPA3 required, no old devices |

              ### Channel width
              A channel can be 20, 40, 80, 160 or 320 MHz wide (320 only in 6 GHz, with Wi-Fi 7). Doubling the width roughly doubles the top speed, but:

              - you get half as many separate channels, so neighbours overlap more
              - a wider channel picks up more noise, so range drops a little

              At 2.4 GHz use 20 MHz. At 5 GHz, 80 MHz is the usual balance. 160 and 320 MHz suit 6 GHz, where there is room.

              ### Why 1, 6 and 11
              2.4 GHz channels are only 5 MHz apart, but each signal is about 20 MHz wide. Channel 3 overlaps 1 and 6. Only **1, 6 and 11** fit side by side without overlap. Two APs on the same channel take turns politely with CSMA/CA. Two on partly overlapping channels cannot decode each other, so each just sees noise, which is worse.

              ### DFS
              Much of 5 GHz (channels 52 to 144) is shared with radar. On these **DFS** channels the AP must listen for radar for at least a minute before using them, and leave at once if radar appears. A router that suddenly changes channel and drops everyone for a minute may have heard radar.

              ### Signal and noise in dBm
              **dBm** is power relative to 1 milliwatt, on a log scale. Every 3 dB is double or half; every 10 dB is ten times. Wi-Fi signals are tiny, so the numbers are negative.

              | Signal | Means |
              |---|---|
              | -30 to -50 dBm | excellent, close to the AP |
              | -67 dBm | a common minimum for calls and video |
              | -75 dBm | slow and unreliable |
              | -90 dBm and below | about the noise floor |

              **SNR** is signal minus noise in dB. At -60 dBm signal and -92 dBm noise, SNR is 32 dB: plenty. Below about 15 dB, rates fall and retries climb.

              ### Common mistakes
              - Setting 2.4 GHz to 40 MHz in a block of flats
              - Turning transmit power to maximum: it raises interference for everyone, and phones still cannot shout back
