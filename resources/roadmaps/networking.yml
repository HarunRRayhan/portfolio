          - id: wifi-security
            title: "Wi-Fi security: WEP to WPA3"
            summary: Radio reaches the street, so Wi-Fi needs encryption. Why WEP fell, how WPA2 personal and enterprise work, what KRACK broke, and what WPA3 and OWE fix.
            learn:
              - Why WEP is broken
              - WPA2-PSK vs WPA2-Enterprise with 802.1X
              - What KRACK was and how it was fixed
              - WPA3-SAE, open networks and OWE
            body: |
              Anyone nearby can record your Wi-Fi frames. Security is about who may join and whether recorded traffic can be read.

              | Mode | Year | How it works | Status |
              |---|---|---|---|
              | **WEP** | 1997 | RC4 with a short shared key and a 24-bit IV | broken since 2001, cracked in minutes |
              | **WPA** (TKIP) | 2003 | stopgap for WEP hardware | deprecated |
              | **WPA2-Personal** (PSK) | 2004 | AES-CCMP, key from a shared passphrase | fine with a long passphrase |
              | **WPA2-Enterprise** (802.1X) | 2004 | 802.1X login per user, checked by a RADIUS server | the standard for offices |
              | **WPA3-Personal** (SAE) | 2018 | password-based key exchange that resists guessing | use it where devices support it |

              ### WPA2-Personal
              The passphrase and the SSID make a master key. Each device runs a **4-way handshake** with the AP to make fresh session keys. The weak spot: anyone who captures one handshake can try passphrase guesses **offline**, as fast as their GPUs allow. A short or common passphrase falls quickly. Anyone who knows the passphrase and records a device's handshake can also decrypt its traffic.

              ### Enterprise and 802.1X
              Each user or device logs in with its own credentials, using **EAP**, checked by a **RADIUS** server. **EAP-TLS** uses certificates; **PEAP** uses a username and password inside TLS. Devices must check the server's certificate, or a fake AP can collect passwords.

              ### KRACK (2017)
              Mathy Vanhoef showed that replaying message 3 of the 4-way handshake made devices **reinstall** a key in use and reset its nonce, so encryption repeated and frames could be decrypted. It was a flaw in the standard, but backward-compatible patches to clients and APs fixed it.

              ### WPA3
              **SAE** (Simultaneous Authentication of Equals) replaces the PSK handshake. A captured exchange gives nothing to guess against offline, and each session has **forward secrecy**. WPA3 also requires protected management frames, which stop forged disconnect frames. The 2019 **Dragonblood** research found side channels and downgrade attacks in early versions and in WPA2/WPA3 transition mode; updates fixed most of them.

              ### Open networks and OWE
              An open café network encrypts nothing. **OWE** (Opportunistic Wireless Encryption, RFC 8110, sold as Wi-Fi Enhanced Open) encrypts each device's traffic with no password. It does not prove the AP is genuine, so an "evil twin" still works.

              ### In practice
              - Use WPA3, or WPA2/WPA3 mixed mode for older devices, with a long random passphrase
              - Turn off **WPS**: its 8-digit PIN can be brute-forced in hours
              - Keep using HTTPS and a VPN on networks you do not control
            resources:
              - { label: "Wi-Fi Protected Access (Wikipedia)", url: "https://en.wikipedia.org/wiki/Wi-Fi_Protected_Access", kind: article }
              - { label: "Wired Equivalent Privacy (Wikipedia)", url: "https://en.wikipedia.org/wiki/Wired_Equivalent_Privacy", kind: article }
              - { label: "KRACK Attacks: Breaking WPA2 (Mathy Vanhoef)", url: "https://www.krackattacks.com/", kind: article }
              - { label: "Dragonblood: Analysing WPA3's Dragonfly Handshake", url: "https://wpa3.mathyvanhoef.com/", kind: article }
              - { label: "IEEE 802.1X (Wikipedia)", url: "https://en.wikipedia.org/wiki/IEEE_802.1X", kind: article }
              - { label: "RFC 8110: Opportunistic Wireless Encryption", url: "https://www.rfc-editor.org/rfc/rfc8110", kind: docs }
              - { label: "Wi-Fi security (Wi-Fi Alliance)", url: "https://www.wi-fi.org/security", kind: docs }
              - { label: "KRACKing WPA2 and Mitigating Future Vulnerabilities (Mathy Vanhoef talk)", url: "https://www.youtube.com/watch?v=KtZ2DnsgBRE", kind: video }
          - id: mesh-and-roaming
            title: Mesh Wi-Fi, roaming and where to put access points
            optional: true
            summary: More access points cover a bigger home, but only if they are linked well and devices move between them. Backhaul, 802.11k, v and r, and placement.
            learn:
              - Wired vs wireless mesh backhaul
              - Why the device, not the AP, decides when to roam
              - 802.11k, 802.11v and 802.11r
              - Practical placement tips
            body: |
              One AP rarely covers a large or multi-floor home. **Mesh** systems add more nodes with one SSID, so devices see a single network.

              ### Backhaul
              Each extra node must reach the main router. That link is the **backhaul**.

              | Backhaul | Effect |
              |---|---|
              | **Ethernet** | best: full speed, no airtime used |
              | **Dedicated radio** (tri-band mesh) | good: one 5 or 6 GHz radio only carries node-to-node traffic |
              | **Shared radio** (dual-band mesh, extenders) | weak: each frame crosses the air twice on the same channel, roughly halving speed per hop |

              Wi-Fi Alliance **EasyMesh** lets nodes from different vendors work together, but most systems still use their own software.

              ### Roaming
              The **device** decides when to leave one AP for another. Many cling to a weak AP long after a better one is close (the "sticky client"). Apple devices, for example, start looking for a better AP when the signal drops below -70 dBm. Three amendments help:

              - **802.11k** (neighbour reports): the AP tells the device which nearby APs and channels to check, so it scans less
              - **802.11v** (BSS transition management): the AP can suggest that a device move to a better AP
              - **802.11r** (fast BSS transition): keys are set up ahead, so a roam takes tens of milliseconds instead of a full handshake. This matters for calls and for 802.1X networks, where a full login can take seconds

              Some old devices fail to join when 802.11r is on. If a printer or smart plug drops off, try turning it off.

              ### Placement
              - Put the main router central and in the open, not in a cupboard or behind the TV
              - Place each node about halfway between the router and the dead zone, where it still gets a strong signal (around -65 dBm or better)
              - Floors and concrete walls block far more than distance does. One node per floor is common
              - Use Ethernet backhaul wherever a cable can reach, even one run
              - Use one SSID for all bands and nodes, so devices can choose

              ### Common mistakes
              - Adding a cheap extender with the same channel: more bars, less speed
              - Placing a node in the dead zone itself, where it has no good link back
            resources:
              - { label: "Wireless mesh network (Wikipedia)", url: "https://en.wikipedia.org/wiki/Wireless_mesh_network", kind: article }
              - { label: "IEEE 802.11r-2008 (Wikipedia)", url: "https://en.wikipedia.org/wiki/IEEE_802.11r-2008", kind: article }
              - { label: "IEEE 802.11k-2008 (Wikipedia)", url: "https://en.wikipedia.org/wiki/IEEE_802.11k-2008", kind: article }
              - { label: "IEEE 802.11v (Wikipedia)", url: "https://en.wikipedia.org/wiki/IEEE_802.11v", kind: article }
              - { label: "Wi-Fi roaming support in Apple devices (Apple)", url: "https://support.apple.com/guide/deployment/wi-fi-roaming-support-dep98f116c0f/web", kind: docs }
              - { label: "Alternative topologies and EasyMesh (Wi-Fi Alliance)", url: "https://www.wi-fi.org/alternative-topologies", kind: docs }
              - { label: "Tech Talk: Mesh and Roaming (EnGenius)", url: "https://www.youtube.com/watch?v=szpNBipgxes", kind: video }
              - { label: "What Is Mesh WiFi? How It Works and Who Needs It (NETGEAR)", url: "https://www.youtube.com/watch?v=UgPD7YuyacA", kind: video }

      - id: switching-vlans
        title: Switching and VLANs
        summary: How an Ethernet switch learns where every device is, how VLANs split one switch into many networks, and how spanning tree stops loops from melting the LAN.
        lessons:
          - id: mac-addresses-and-ethernet
            title: MAC addresses and Ethernet
            optional: true
            summary: How devices on the same local network find each other at the link layer, before IP comes into play.
            learn:
              - What a MAC address is
              - Ethernet frames
              - ARP maps IP addresses to MAC addresses
            body: |
              A **MAC address** is a 48-bit hardware address burned into a network card, written like `3c:22:fb:12:ab:cd`. It names the card on its local network, not the machine on the wider internet.

              On a LAN, data travels in **Ethernet frames**. A frame has a destination MAC, a source MAC, a type field, the payload and a checksum. Switches read the destination MAC to pick an output port.

              IP addresses are used to find a device, but the last step is by MAC. **ARP** (Address Resolution Protocol) asks the local network "who has this IP?" and the owner replies with its MAC.

              ### Key ideas
              - MAC addresses work only inside one local network
              - Frames carry IP packets as their payload
              - ARP maps an IP address to a MAC address
              - Routers rewrite the MAC addresses at every hop, but not the IP addresses

              ### In practice
              ```bash
              arp -a
              ```
              This shows the IP to MAC pairs your machine has learned recently.
            resources:
