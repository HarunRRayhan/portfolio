              - { label: "Everything you should know about certificates and PKI (Smallstep)", url: "https://smallstep.com/blog/everything-pki/", kind: article }
              - { label: "step-ca: open source private CA (Smallstep docs)", url: "https://smallstep.com/docs/step-ca/", kind: docs }
