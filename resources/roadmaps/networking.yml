      - id: firewalls
        title: Firewalls
        summary: How packet filters decide what passes. Stateless vs stateful filtering, connection tracking, a real nftables ruleset, cloud security groups and network ACLs, next-gen firewalls, WAFs and IDS/IPS, and why outbound rules matter as much as inbound.
        lessons:
          - id: stateless-vs-stateful
            title: Stateless vs stateful filtering
            summary: A stateless filter judges every packet alone. A stateful one remembers connections, so replies come back without opening the door to everything.
            learn:
              - How a stateless filter matches each packet on its own
              - Why stateless rules must open return traffic by hand
              - How a stateful firewall uses a connection table
              - Where each kind is still used
            body: |
              A firewall matches packets against rules: source and destination address, protocol, ports, interface. The big difference is whether it **remembers** what it saw before.

              | | Stateless | Stateful |
              |---|---|---|
              | Looks at | each packet alone | each packet plus the connection it belongs to |
              | Return traffic | needs its own rule | allowed because it matches a known connection |
              | Memory | none | one entry per connection |
              | Speed | very fast, easy to do in hardware | fast, but the table can fill up |
              | Examples | router ACLs, AWS network ACLs, switch ACLs | Linux nftables with conntrack, AWS security groups, pfSense, most appliances |

              ### Example
              A web server allows inbound TCP 443. It also needs to reach a package mirror on 443.

              With a **stateless** filter, the reply from the mirror arrives from port 443 to a random high port on the server. You must allow inbound TCP from port 443 to ports 1024 to 65535. That rule also lets in any packet an attacker crafts with source port 443.

              With a **stateful** filter, the outbound connection creates an entry in the table. The reply matches it and is allowed. No inbound rule for high ports is needed.

              ### Key ideas
              - Stateful filtering is the default for hosts, VPCs and office firewalls
              - Stateless filters are still useful at the edge: they drop obvious junk at line rate before it reaches anything with a table
              - A stateful firewall can also drop packets that make no sense, such as a TCP ACK with no matching connection
              - Some setups use both: a stateless ACL on the router, a stateful firewall behind it

              ### Common mistakes
              - Writing stateless rules as if they were stateful, then wondering why replies vanish
              - Opening "all high ports inbound" to fix that, which removes most of the protection
            resources:
              - { label: "Stateful vs Stateless Firewalls (LearnCantrill)", url: "https://www.youtube.com/watch?v=rL4-vbsN35w", kind: video }
              - { label: "Stateful firewall (Wikipedia)", url: "https://en.wikipedia.org/wiki/Stateful_firewall", kind: article }
              - { label: "Firewall (computing) (Wikipedia)", url: "https://en.wikipedia.org/wiki/Firewall_(computing)", kind: article }
              - { label: "What is a firewall? (Cloudflare)", url: "https://www.cloudflare.com/learning/security/what-is-a-firewall/", kind: article }
              - { label: "NIST SP 800-41 Rev. 1: Guidelines on Firewalls and Firewall Policy", url: "https://csrc.nist.gov/pubs/sp/800/41/r1/final", kind: docs }
              - { label: "Compare security groups and network ACLs (AWS)", url: "https://docs.aws.amazon.com/vpc/latest/userguide/infrastructure-security.html", kind: docs }
          - id: connection-tracking
            title: Connection tracking (conntrack)
            summary: The table behind every stateful Linux firewall and every NAT. What the states mean, how to read the table and what happens when it fills up.
            learn:
              - The conntrack states new, established, related and invalid
              - How UDP and ICMP get "connections" too
              - Reading the table with the conntrack tool
              - Table size, timeouts and the "table full" failure
            body: |
              Netfilter, the packet filtering framework in the Linux kernel, keeps a **connection tracking** table. Each entry holds both directions of a flow: the original addresses and ports, and the reply addresses and ports. Firewall rules match on the entry's state, and NAT uses it to rewrite replies.

              | State | Means |
              |---|---|
              | `new` | first packet of a flow not seen before |
              | `established` | packets have been seen in both directions |
              | `related` | a new flow tied to an existing one, such as an ICMP error about it |
              | `invalid` | does not fit any known flow, for example a stray TCP ACK |
              | `untracked` | a rule told conntrack to skip this packet |

              ### Key ideas
              - UDP and ICMP have no handshake, but conntrack still tracks them by addresses, ports and a timeout. A DNS reply is `established` because it matches the query
              - Timeouts are per protocol. An established TCP entry lives 5 days by default. A UDP entry lives 30 seconds, or 120 seconds for a flow that keeps going in both directions
              - The table has a size limit, `nf_conntrack_max`. When it is full, new flows are dropped and the kernel logs `nf_conntrack: table full, dropping packet`
              - Docker, Kubernetes services and any Linux NAT router depend on conntrack

              ### Example
              ```bash
              sudo conntrack -L | head
              tcp 6 431995 ESTABLISHED src=10.0.0.5 dst=203.0.113.10 sport=51834 dport=443 src=203.0.113.10 dst=10.0.0.5 sport=443 dport=51834 [ASSURED] mark=0 use=1
              sudo conntrack -E                # watch entries appear and close
              sysctl net.netfilter.nf_conntrack_count net.netfilter.nf_conntrack_max
              ```
              The first `src/dst` pair is the original direction, the second is the expected reply. `ASSURED` means traffic went both ways, so the entry is kept when the table is under pressure.

              ### Common mistakes
              - Running a busy proxy or DNS server on default limits and losing packets at peak. Watch `nf_conntrack_count` and raise the max
              - Forgetting that NAT needs conntrack too. A full table breaks NAT for new flows, not just filtering
            resources:
              - { label: "Connection tracking system (nftables wiki)", url: "https://wiki.nftables.org/wiki-nftables/index.php/Connection_Tracking_System", kind: docs }
              - { label: "Matching connection tracking metainformation (nftables wiki)", url: "https://wiki.nftables.org/wiki-nftables/index.php/Matching_connection_tracking_stateful_metainformation", kind: docs }
              - { label: "nf_conntrack sysctl reference (Linux kernel docs)", url: "https://docs.kernel.org/networking/nf_conntrack-sysctl.html", kind: docs }
              - { label: "conntrack-tools user manual (netfilter.org)", url: "https://conntrack-tools.netfilter.org/manual.html", kind: docs }
              - { label: "conntrack(8) man page", url: "https://man.archlinux.org/man/conntrack.8", kind: docs }
              - { label: "Netfilter's connection tracking subsystem, Florian Westphal (Netdev 2.1)", url: "https://www.youtube.com/watch?v=mx2X9mZaZ5A", kind: video }
              - { label: "Netfilter (Wikipedia)", url: "https://en.wikipedia.org/wiki/Netfilter", kind: article }
          - id: nftables-ruleset
            title: A minimal server firewall with nftables
            summary: nftables replaced iptables as the Linux packet filter. A complete default-deny ruleset for a server, line by line, and how to load it without locking yourself out.
            learn:
              - Tables, chains, hooks and policies in nftables
              - A default-deny input chain built on conntrack
              - Why ICMP and ICMPv6 must stay open
              - Loading, listing and persisting the ruleset safely
            body: |
              **nftables** is the current Linux firewall. Rules live in **tables**. A table holds **chains**, and a base chain attaches to a netfilter **hook** (`input`, `forward`, `output`, `prerouting`, `postrouting`). Family `inet` covers IPv4 and IPv6 in one table.

              ### Example
              `/etc/nftables.conf` for a server that serves HTTPS and SSH:

              ```
              #!/usr/sbin/nft -f
              flush ruleset

              table inet filter {
                chain input {
                  type filter hook input priority 0; policy drop;
                  ct state established,related accept
                  ct state invalid drop
                  iif "lo" accept
                  meta l4proto { icmp, ipv6-icmp } accept
                  tcp dport 22 ip saddr 198.51.100.7 accept
                  tcp dport { 80, 443 } accept
                }
                chain forward {
                  type filter hook forward priority 0; policy drop;
                }
                chain output {
                  type filter hook output priority 0; policy accept;
                }
              }
              ```

              ### Line by line
              - `policy drop` on input: anything not accepted below is dropped. This is **default deny**
              - `established,related` first: replies to the server's own traffic, and the bulk of packets, match on line one
              - Loopback is always allowed. Local services talk over it
              - **ICMP and ICMPv6** stay open. IPv6 breaks without Neighbor Discovery, and Path MTU discovery needs ICMP "too big" messages
              - SSH only from one admin address. Web ports from anywhere
              - The server does not route, so `forward` drops everything

              ### Loading it safely
              ```bash
              sudo nft -c -f /etc/nftables.conf   # check syntax only
              sudo nft -f /etc/nftables.conf      # apply atomically
              sudo nft list ruleset
              sudo systemctl enable nftables      # load at boot (Debian, Ubuntu)
              ```
              The whole file applies as one transaction, so there is never a half-loaded ruleset. On a remote machine, keep a console open, or schedule a rollback (`sleep 120 && nft flush ruleset`) before you apply.

              ### Common mistakes
              - Dropping all ICMP "for security", then chasing hanging connections
              - Forgetting `flush ruleset`, so each reload appends another copy of every rule to the existing table
              - Allowing SSH from anywhere when a fixed address or a VPN would do
            resources:
              - { label: "Simple ruleset for a server (nftables wiki)", url: "https://wiki.nftables.org/wiki-nftables/index.php/Simple_ruleset_for_a_server", kind: docs }
              - { label: "Quick reference: nftables in 10 minutes (nftables wiki)", url: "https://wiki.nftables.org/wiki-nftables/index.php/Quick_reference-nftables_in_10_minutes", kind: docs }
              - { label: "Configuring chains (nftables wiki)", url: "https://wiki.nftables.org/wiki-nftables/index.php/Configuring_chains", kind: docs }
              - { label: "Netfilter hooks (nftables wiki)", url: "https://wiki.nftables.org/wiki-nftables/index.php/Netfilter_hooks", kind: docs }
              - { label: "nft(8) man page", url: "https://man.archlinux.org/man/nft.8", kind: docs }
              - { label: "nftables (ArchWiki)", url: "https://wiki.archlinux.org/title/Nftables", kind: docs }
              - { label: "RFC 4890: Recommendations for filtering ICMPv6 messages in firewalls", url: "https://www.rfc-editor.org/rfc/rfc4890", kind: docs }
              - { label: "Tutorial: Firewalls with nftables (The Linux Foundation)", url: "https://www.youtube.com/watch?v=EGKhIljDPCw", kind: video }
          - id: iptables-and-frontends
            title: iptables, nftables and the tools on top
            optional: true
            summary: Most guides online still show iptables. How it maps to nftables, what ufw and firewalld do, and why Docker can punch through your firewall.
            learn:
              - iptables tables, chains and the same rule in both syntaxes
              - iptables-nft vs iptables-legacy
              - ufw and firewalld as front ends
              - How Docker published ports bypass host rules
            body: |
              **iptables** was the Linux firewall for about twenty years. It had separate tools for IPv4 (`iptables`), IPv6 (`ip6tables`), ARP and bridges. **nftables** replaced it with one tool, one syntax and atomic updates. On current Debian, Ubuntu, Fedora and RHEL, the `iptables` command is usually **iptables-nft**: iptables syntax that writes nftables rules underneath. `iptables -V` shows `(nf_tables)` or `(legacy)`.

              | Task | iptables | nftables |
              |---|---|---|
              | Default drop | `iptables -P INPUT DROP` | `policy drop;` on the chain |
              | Allow replies | `iptables -A INPUT -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT` | `ct state established,related accept` |
              | Allow HTTPS | `iptables -A INPUT -p tcp --dport 443 -j ACCEPT` | `tcp dport 443 accept` |
              | Show rules | `iptables -S` | `nft list ruleset` |

              `iptables-translate` converts a rule for you:
              ```bash
              iptables-translate -A INPUT -p tcp --dport 22 -j ACCEPT
              nft 'add rule ip filter INPUT tcp dport 22 counter accept'
              ```

              ### Front ends
              - **ufw** (Ubuntu) gives simple commands such as `ufw allow 443/tcp` and generates the rules
              - **firewalld** (Fedora, RHEL) groups interfaces into **zones** and uses nftables as its backend
              - Pick one tool per host. Two tools writing rules at once fight each other

              ### Docker and your firewall
              Docker adds its own rules for published ports in the `nat` and `FORWARD` paths. Traffic to a container is forwarded, not delivered to the host, so it never reaches the host's `INPUT` rules. A port published with `-p 5432:5432` is open to the world even if ufw says it is closed. Fixes:
              - Publish on localhost only: `-p 127.0.0.1:5432:5432`
              - Put your own rules in the `DOCKER-USER` chain, which Docker leaves alone
              - Use a cloud security group in front of the host as well

              ### Common mistakes
              - Mixing `iptables-legacy` and nftables rules on one host: both run, and the result is hard to read
              - Trusting `ufw status` on a Docker host
            resources:
              - { label: "Moving from iptables to nftables (nftables wiki)", url: "https://wiki.nftables.org/wiki-nftables/index.php/Moving_from_iptables_to_nftables", kind: docs }
              - { label: "iptables(8) man page", url: "https://man7.org/linux/man-pages/man8/iptables.8.html", kind: docs }
              - { label: "Packet filtering and firewalls (Docker docs)", url: "https://docs.docker.com/engine/network/packet-filtering-firewalls/", kind: docs }
              - { label: "firewalld documentation", url: "https://firewalld.org/documentation/", kind: docs }
              - { label: "Uncomplicated Firewall (ArchWiki)", url: "https://wiki.archlinux.org/title/Uncomplicated_Firewall", kind: docs }
              - { label: "iptables (ArchWiki)", url: "https://wiki.archlinux.org/title/Iptables", kind: docs }
              - { label: "iptables basics (Julia Evans)", url: "https://jvns.ca/blog/2017/06/07/iptables-basics/", kind: article }
              - { label: "iptables complete guide (HackerSploit)", url: "https://www.youtube.com/watch?v=6Ra17Qpj68c", kind: video }
          - id: security-groups-vs-nacls
            title: Cloud security groups vs network ACLs
            summary: AWS gives you two filters. Stateful security groups on each interface, stateless network ACLs on each subnet. How they differ, how they combine and how GCP and Azure compare.
            learn:
              - Where security groups and network ACLs apply
              - Stateful allow-only rules vs ordered allow and deny rules
              - Why NACLs need ephemeral port rules
              - Referencing one security group from another
              - The equivalents in GCP and Azure
            body: |
              In an AWS VPC a packet to an instance passes two filters: the **network ACL** of the subnet, then the **security group** on the instance's network interface.

              | | Security group | Network ACL |
              |---|---|---|
              | Attached to | a network interface (instance, load balancer, RDS) | a subnet |
              | State | stateful: replies are allowed back | stateless: replies need their own rule |
              | Rules | allow only | allow and deny |
              | Order | all rules checked, any allow wins | numbered, lowest first, first match wins |
              | Default | new group: no inbound, all outbound | default NACL: allow all. A new custom NACL denies all |
              | Source can be | a CIDR or another security group | a CIDR only |

              ### Key ideas
              - Do almost all filtering with security groups. They are stateful and easy to reason about
              - Reference groups instead of addresses: the database group allows 5432 from the `app` group. New app instances are covered automatically
              - Use NACLs for coarse **deny** rules, such as blocking a known bad range for a whole subnet. Security groups cannot deny
              - Because NACLs are stateless, a custom NACL must allow return traffic to **ephemeral ports**. AWS suggests 1024 to 65535, since clients pick different ranges
              - Neither one filters traffic to the Amazon DNS resolver or the instance metadata service

              ### Other clouds
              - **GCP** VPC firewall rules are stateful, set on the VPC network and aimed at instances by network tag or service account. Each rule has a priority and can allow or deny
              - **Azure** network security groups are stateful, attach to a subnet or a NIC, and use priorities from 100 to 4096 with allow and deny

              ### Common mistakes
              - Adding a custom NACL with inbound 443 and forgetting outbound ephemeral ports. The site times out
              - Allowing `0.0.0.0/0` on port 22 in a security group "for now"
              - Debugging a security group when the NACL is the one dropping traffic. VPC Flow Logs show which packets were rejected
            resources:
              - { label: "Security groups (AWS VPC docs)", url: "https://docs.aws.amazon.com/vpc/latest/userguide/vpc-security-groups.html", kind: docs }
              - { label: "Network ACLs (AWS VPC docs)", url: "https://docs.aws.amazon.com/vpc/latest/userguide/vpc-network-acls.html", kind: docs }
              - { label: "Compare security groups and network ACLs (AWS)", url: "https://docs.aws.amazon.com/vpc/latest/userguide/infrastructure-security.html", kind: docs }
              - { label: "Ephemeral ports and network ACLs (AWS)", url: "https://docs.aws.amazon.com/vpc/latest/userguide/nacl-ephemeral-ports.html", kind: docs }
              - { label: "VPC Flow Logs (AWS)", url: "https://docs.aws.amazon.com/vpc/latest/userguide/flow-logs.html", kind: docs }
              - { label: "VPC firewall rules (Google Cloud)", url: "https://cloud.google.com/firewall/docs/firewalls", kind: docs }
              - { label: "Network security groups (Microsoft Azure)", url: "https://learn.microsoft.com/en-us/azure/virtual-network/network-security-groups-overview", kind: docs }
              - { label: "Security groups vs network ACLs in AWS (Tiny Technical Tutorials)", url: "https://www.youtube.com/watch?v=JWoNu2Mtpdg", kind: video }
          - id: ngfw-waf-ids-ips
            title: Next-gen firewalls, WAFs and IDS/IPS
            optional: true
            summary: Port-based filtering cannot see what is inside a connection. What next-gen firewalls, web application firewalls and intrusion detection add, and where each one sits.
            learn:
              - What a next-generation firewall adds over port filtering
              - WAF vs network firewall
              - IDS vs IPS and how they see traffic
              - Common open source and cloud options
            body: |
              A port filter knows that a connection goes to TCP 443. It does not know whether it carries a browser, a tunnel or an SQL injection. Three kinds of device look deeper.

              | | Works at | Looks for | Placement |
              |---|---|---|---|
              | **Next-gen firewall** (NGFW) | layers 3 to 7 | applications, users, threats | inline at the network edge or between zones |
              | **WAF** | HTTP (layer 7) | attacks on web apps: SQL injection, XSS, bad bots | in front of web servers, often in a CDN or load balancer |
              | **IDS** | layers 3 to 7 | known attack patterns and odd behaviour | on a copy of traffic (SPAN port or tap) |
              | **IPS** | layers 3 to 7 | the same as IDS | inline, so it can drop packets |

              ### Next-gen firewalls
              An NGFW is a stateful firewall plus **application identification** ("this is SSH on port 443"), rules by user or group, an IPS engine and often TLS inspection. TLS inspection means the firewall decrypts and re-encrypts traffic, so clients must trust its certificate. Palo Alto, Fortinet and Check Point sell them. OPNsense and pfSense with Suricata cover much of this for free.

              ### WAF vs network firewall
              A network firewall decides **who may connect**. A WAF reads each HTTP request and decides **whether this request is safe**. You need both: a firewall cannot see a malicious query string, and a WAF does nothing for SSH. The **OWASP Core Rule Set** is the common open source WAF rule set. Cloud options include AWS WAF, Azure WAF, Google Cloud Armor and Cloudflare.

              ### IDS vs IPS
              - An **IDS** only alerts, so a false positive costs a look, not an outage
              - An **IPS** blocks, so a bad signature can drop real traffic. Run new rules in alert mode first
              - **Suricata** and **Snort** match signatures and can run either way. **Zeek** writes detailed logs of every connection, DNS query and TLS handshake for later analysis

              ### Common mistakes
              - Buying an NGFW and keeping "allow any any" rules on it
              - Running a WAF in detection mode forever and never reading the alerts
            resources:
              - { label: "Next-generation firewall (Wikipedia)", url: "https://en.wikipedia.org/wiki/Next-generation_firewall", kind: article }
              - { label: "OWASP Core Rule Set", url: "https://coreruleset.org/", kind: tool }
              - { label: "AWS WAF developer guide", url: "https://docs.aws.amazon.com/waf/latest/developerguide/waf-chapter.html", kind: docs }
              - { label: "AWS Network Firewall (Suricata-compatible rules)", url: "https://docs.aws.amazon.com/network-firewall/latest/developerguide/what-is-aws-network-firewall.html", kind: docs }
              - { label: "Suricata documentation", url: "https://docs.suricata.io/en/latest/", kind: docs }
              - { label: "Zeek documentation", url: "https://docs.zeek.org/en/master/", kind: docs }
              - { label: "Snort", url: "https://www.snort.org/", kind: tool }
              - { label: "IDS vs IPS: which to use and when (CBT Nuggets)", url: "https://www.youtube.com/watch?v=wQSd_piqxQo", kind: video }
              - { label: "Web application firewall vs network firewall (House Of Secure Network)", url: "https://www.youtube.com/watch?v=KAt1y4i4OGA", kind: video }
          - id: default-deny-and-egress
            title: Default deny and egress filtering
            summary: Allow what you need and drop the rest, in both directions. Outbound rules stop a compromised host from calling home, spreading or leaking data.
            learn:
              - Why every policy should end in deny
              - What egress filtering stops that inbound rules cannot
              - A practical outbound allow-list for servers
              - Logging drops without drowning in them
            body: |
              **Default deny** means the last rule, or the chain policy, drops everything, and each allowed flow has its own rule. It is the opposite of "allow all, block what is bad", which fails the moment something new and bad appears.

              Most setups apply default deny to **inbound** traffic only and allow all **outbound**. That leaves a big hole. Malware on a server almost always needs to connect out: to fetch its second stage, to reach a command and control server, to send stolen data, or to scan other networks.

              ### What egress filtering stops
              - **Exfiltration**: the database server cannot upload a dump to a random host
              - **Command and control**: a backdoor cannot call home
              - **Abuse of your network**: no outbound SMTP spam or attacks from your IPs
              - **SSRF damage**: an app tricked into fetching URLs can reach only approved places

              ### Example
              | Server | Allowed out | Everything else |
              |---|---|---|
              | Web app | database subnet 5432, internal DNS 53, HTTPS proxy 3128 | drop and log |
              | Database | replication peers, backup bucket endpoint | drop and log |
              | Build runner | package mirrors through the proxy | drop and log |

              In nftables, add `policy drop;` to the output chain and allow `ct state established,related` plus each needed flow. In AWS, remove the default "all outbound" rule from the security group and add specific ones.

              ### Key ideas
              - Send web traffic out through a **proxy** that allows by domain name. IP allow-lists for SaaS and package mirrors break when their addresses change
              - Point hosts at your own DNS resolver and block outbound 53 and 853 elsewhere, or DNS becomes the leak
              - Many clouds already block or limit outbound TCP 25 for this reason
              - Log dropped packets with a rate limit, or a noisy host fills your disk
              - On AWS, require **IMDSv2** so an SSRF bug cannot easily read instance credentials

              ### Common mistakes
              - Allowing outbound 443 to anywhere and calling it egress filtering. Almost all malware speaks HTTPS
              - Rolling out egress rules without logging first. Run in log-only mode for a week to find the real flows
            resources:
              - { label: "Egress filtering (Wikipedia)", url: "https://en.wikipedia.org/wiki/Egress_filtering", kind: article }
              - { label: "NIST SP 800-41 Rev. 1: Guidelines on Firewalls and Firewall Policy", url: "https://csrc.nist.gov/pubs/sp/800/41/r1/final", kind: docs }
              - { label: "MITRE ATT&CK: Exfiltration tactic", url: "https://attack.mitre.org/tactics/TA0010/", kind: docs }
              - { label: "MITRE ATT&CK: Command and Control tactic", url: "https://attack.mitre.org/tactics/TA0011/", kind: docs }
              - { label: "Centralized egress to the internet (AWS whitepaper)", url: "https://docs.aws.amazon.com/whitepapers/latest/building-scalable-secure-multi-vpc-network-infrastructure/centralized-egress-to-internet.html", kind: docs }
              - { label: "Configure the instance metadata service, IMDSv2 (AWS)", url: "https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/configuring-instance-metadata-service.html", kind: docs }
              - { label: "Security group rules (AWS)", url: "https://docs.aws.amazon.com/vpc/latest/userguide/security-group-rules.html", kind: docs }
              - { label: "Simple ruleset for a server (nftables wiki)", url: "https://wiki.nftables.org/wiki-nftables/index.php/Simple_ruleset_for_a_server", kind: docs }
          - id: rate-limiting-and-wafs
            title: Rate limiting and WAFs
            summary: Block and slow abusive traffic before it reaches your app.
            learn:
              - Rate limits per IP or key
              - Managed WAF rules and bot control
            body: |
              You can block and slow bad traffic before it reaches your app. Two tools do most of the work.

              **Rate limiting** caps how many requests a client may send in a time window, such as 100 per minute per IP, per API key, or per user. Extra requests get a `429 Too Many Requests`. It protects login pages, search and APIs from floods and brute-force tries.

              A **WAF** (web application firewall) reads HTTP requests and blocks those that look malicious, such as SQL injection or known exploits. Managed rules are kept up to date by the vendor, and you add your own.

              ### Key ideas
              - Limit by the right key: IP, token or user, and by path
              - Return `429` with a `Retry-After` header
              - Managed WAF rules catch common attacks, and bot control scores or challenges automated clients
              - Test rules in a log-only mode first
              - Rate limits at the edge are cheaper than at the app

              ### Common mistakes
              - Limiting by IP behind a proxy, so everyone shares one limit
              - Turning on blocking rules without testing, which blocks real users
            resources:
              - { label: "Scaling your API with rate limiters (Stripe)", url: "https://stripe.com/blog/rate-limiters", kind: article }
              - { label: "Rate limiting with NGINX (NGINX)", url: "https://blog.nginx.org/blog/rate-limiting-nginx", kind: article }
              - { label: "How we built rate limiting capable of scaling to millions of domains (Cloudflare)", url: "https://blog.cloudflare.com/counting-things-a-lot-of-different-things/", kind: article }
              - { label: "Token bucket (Wikipedia)", url: "https://en.wikipedia.org/wiki/Token_bucket", kind: article }
              - { label: "OWASP ModSecurity Core Rule Set (OWASP CRS)", url: "https://coreruleset.org/", kind: tool }
              - { label: "429 Too Many Requests (MDN)", url: "https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Status/429", kind: docs }
              - post: aws-waf-cloudfront-solo-dev
              - { label: "What is rate limiting? (Cloudflare)", url: "https://www.cloudflare.com/learning/bots/what-is-rate-limiting/", kind: article }
              - { label: "Rate limiting rules (Cloudflare docs)", url: "https://developers.cloudflare.com/waf/rate-limiting-rules/", kind: docs }
              - { label: "Web application firewall (Wikipedia)", url: "https://en.wikipedia.org/wiki/Web_application_firewall", kind: article }

      - id: vpns
        title: VPNs
        summary: What a VPN really protects and what it does not, then the three families that matter in practice, IPsec, WireGuard and TLS-based VPNs, and how sites and clouds are joined with them.
        lessons:
          - id: what-a-vpn-does
            title: What a VPN really does (and does not)
            summary: A VPN wraps your packets in an encrypted tunnel to another network. It moves where your traffic appears to come from. It does not make you anonymous or safe from everything.
            learn:
              - Tunnelling and encapsulation in one picture
              - What a VPN protects you from
              - What it does not protect you from
              - Full tunnel vs split tunnel
            body: |
              A **VPN** (virtual private network) takes each packet you send, encrypts it, and wraps it in a new packet addressed to a **VPN gateway**. The gateway unwraps it and sends the original packet on as if it started there. Replies come back the same way. This wrapping is **encapsulation**, and the encrypted path is the **tunnel**.

              ```
              outer IP: you -> gateway | UDP/ESP | encrypted [ inner IP: 10.8.0.2 -> 10.0.5.20 | TCP | data ]
              ```

              ### What it does
              - Hides your traffic from the local network and your ISP. They see encrypted packets to one gateway
              - Puts you **inside** another network, such as an office or a cloud VPC, with a private address there
              - Makes your traffic appear to come from the gateway's public IP

              ### What it does not do
              - It does not make you anonymous. The VPN operator now sees what your ISP used to see
              - It does not stop tracking by cookies, logins or browser fingerprints
              - It does not protect against malware or phishing
              - It does not encrypt anything past the gateway. HTTPS still does that job end to end

              ### Full vs split tunnel
              | Mode | What goes through the tunnel | Trade-off |
              |---|---|---|
              | **Full tunnel** | everything, a default route `0.0.0.0/0` | simple and private, but all traffic pays the detour |
              | **Split tunnel** | only listed prefixes, such as `10.0.0.0/8` | faster, but other traffic leaves locally |

              ### Common mistakes
              - **DNS leaks**: the tunnel carries traffic but DNS still goes to the local resolver, so names are visible. Push a DNS server through the tunnel
              - Forgetting **MTU**: the extra headers make packets larger, so large packets may need fragmenting or a lower tunnel MTU
            resources:
              - { label: "What is a VPN? (Cloudflare)", url: "https://www.cloudflare.com/learning/access-management/what-is-a-vpn/", kind: article }
              - { label: "Virtual private network (Wikipedia)", url: "https://en.wikipedia.org/wiki/Virtual_private_network", kind: article }
              - { label: "Choosing the VPN that's right for you (EFF Surveillance Self-Defense)", url: "https://ssd.eff.org/module/choosing-vpn-thats-right-you", kind: article }
              - { label: "VPNs, proxies and secure tunnels explained (LiveOverflow)", url: "https://www.youtube.com/watch?v=32KKwgF67Ho", kind: video }
              - { label: "VPN and remote working (Computerphile)", url: "https://www.youtube.com/watch?v=1mtSNVdC7tM", kind: video }
              - { label: "VPN explained (PowerCert)", url: "https://www.youtube.com/watch?v=R-JUOpCgTZc", kind: video }
          - id: ipsec-ikev2
            title: IPsec with IKEv2
            summary: The standard VPN of routers, firewalls and cloud gateways. IKEv2 agrees the keys, ESP carries the data, and NAT traversal wraps it all in UDP.
            learn:
              - IKE SAs and Child SAs
              - ESP vs AH
              - Tunnel mode vs transport mode
              - How NAT traversal works on UDP 4500
              - Policy-based vs route-based tunnels
            body: |
              **IPsec** is a set of protocols that encrypt and authenticate IP packets. Two parts do the work:

              1. **IKEv2** (RFC 7296) runs on **UDP 500**. In the `IKE_SA_INIT` exchange the peers agree algorithms and do a Diffie-Hellman key exchange. In `IKE_AUTH` they prove who they are with a pre-shared key or certificates, and set up the first **Child SA**
              2. **ESP** (Encapsulating Security Payload, IP protocol **50**) carries the actual traffic, encrypted and integrity-protected, usually with AES-GCM. Each SA has an **SPI** number so the receiver knows which keys to use

              An SA (security association) is one-way, so a tunnel uses a pair. Keys are renewed by rekeying on a timer. **AH** (protocol 51) authenticates without encrypting and breaks behind NAT, so it is rarely used.

              ### Tunnel vs transport mode
              | Mode | What is protected | Used for |
              |---|---|---|
              | **Tunnel** | the whole original IP packet, behind a new outer IP header | site-to-site and remote access VPNs |
              | **Transport** | only the payload; the original IP header stays | host to host, or under GRE or L2TP |

              ### NAT traversal (NAT-T)
              ESP has no port numbers, so a NAT device cannot track it. During IKE both sides send hashes of their addresses (NAT detection payloads). If a NAT changed them, IKE moves to **UDP 4500** and ESP is wrapped in UDP too (RFC 3948). Small keepalives keep the NAT mapping open. Firewalls must allow UDP 500 and 4500, plus protocol 50 if no NAT is involved.

              ### Policy-based vs route-based
              - **Policy-based**: traffic selectors (local and remote subnets) decide what gets encrypted
              - **Route-based**: a virtual tunnel interface (VTI) exists, and the routing table, often fed by **BGP**, decides. Cloud gateways prefer this

              ### In practice
              ```
              swanctl --list-sas   # strongSwan: show IKE and Child SAs
              ```
              Most failures are a mismatch: different proposals, pre-shared keys, IDs or traffic selectors on the two ends.
            resources:
              - { label: "RFC 7296: Internet Key Exchange Protocol Version 2 (IKEv2)", url: "https://www.rfc-editor.org/rfc/rfc7296", kind: docs }
              - { label: "RFC 4301: Security Architecture for the Internet Protocol", url: "https://www.rfc-editor.org/rfc/rfc4301", kind: docs }
              - { label: "RFC 4303: IP Encapsulating Security Payload (ESP)", url: "https://www.rfc-editor.org/rfc/rfc4303", kind: docs }
              - { label: "RFC 3948: UDP Encapsulation of IPsec ESP Packets", url: "https://www.rfc-editor.org/rfc/rfc3948", kind: docs }
              - { label: "IPsec protocol overview (strongSwan docs)", url: "https://docs.strongswan.org/docs/latest/howtos/ipsecProtocol.html", kind: docs }
              - { label: "NAT traversal (strongSwan docs)", url: "https://docs.strongswan.org/docs/latest/features/natTraversal.html", kind: docs }
              - { label: "What is IPsec? (Cloudflare)", url: "https://www.cloudflare.com/learning/network-layer/what-is-ipsec/", kind: article }
              - { label: "IPsec IKEv2 explained (Sikandar Shaik)", url: "https://www.youtube.com/watch?v=LHnnzdipaKQ", kind: video }
              - { label: "IPsec VPN fundamentals (LearnCantrill)", url: "https://www.youtube.com/watch?v=15amNny_kKI", kind: video }
          - id: wireguard
            title: WireGuard
            summary: A small, fast VPN built into the Linux kernel. Each peer is a public key plus a list of allowed IPs, and that list is both the routing table and the access control.
            learn:
              - Keys and the Noise-based handshake
              - Cryptokey routing with AllowedIPs
              - Why it uses only UDP and stays silent
              - A minimal working config
            body: |
              **WireGuard** is a layer 3 VPN with a fixed, modern set of crypto: Curve25519 keys, ChaCha20-Poly1305 encryption and BLAKE2s hashing, in a handshake built on the Noise framework. There is nothing to negotiate, so there is nothing to misconfigure. It has been in the Linux kernel since 5.6 and has apps for every major OS.

              ### Key ideas
              - **Keys are identities.** Each peer has a private key and shares its public key. No usernames, no certificates
              - **Cryptokey routing.** Each peer has an `AllowedIPs` list. Sending: the destination IP picks which peer to encrypt for. Receiving: a decrypted packet is dropped unless its source IP is in that peer's list
              - **UDP only**, on any port (51820 is the usual choice)
              - **Silent.** It does not answer packets that fail authentication, so a port scan sees nothing
              - **Roaming.** A peer's endpoint updates to wherever its latest valid packet came from, so a laptop can change networks without reconnecting
              - Session keys are renewed with a new handshake about every two minutes

              ### Example
              ```
              wg genkey | tee client.key | wg pubkey > client.pub
              ```
              ```
              # /etc/wireguard/wg0.conf on the client
              [Interface]
              PrivateKey = <contents of client.key>
              Address = 10.8.0.2/32
              DNS = 10.8.0.1

              [Peer]
              PublicKey = <server public key>
              Endpoint = vpn.example.com:51820
              AllowedIPs = 10.8.0.0/24, 10.0.0.0/16
              PersistentKeepalive = 25
              ```
              ```
              wg-quick up wg0
              wg show        # peers, latest handshake, bytes moved
              ```
              Set `AllowedIPs = 0.0.0.0/0, ::/0` instead for a full tunnel. `PersistentKeepalive` keeps a NAT mapping open when the peer sits behind NAT.

              ### Common mistakes
              - Giving two peers the same prefix in `AllowedIPs`: a prefix belongs to one peer only, so the later one takes it from the earlier. Different overlapping prefixes use the longest match
              - Forgetting IP forwarding and NAT on the server, so clients connect but reach nothing past it
            resources:
              - { label: "WireGuard (official site)", url: "https://www.wireguard.com/", kind: docs }
              - { label: "WireGuard quick start", url: "https://www.wireguard.com/quickstart/", kind: docs }
              - { label: "WireGuard protocol and cryptography", url: "https://www.wireguard.com/protocol/", kind: docs }
              - { label: "WireGuard whitepaper (Jason A. Donenfeld)", url: "https://www.wireguard.com/papers/wireguard.pdf", kind: docs }
              - { label: "wg(8) man page", url: "https://man7.org/linux/man-pages/man8/wg.8.html", kind: docs }
              - { label: "wg-quick(8) man page", url: "https://man7.org/linux/man-pages/man8/wg-quick.8.html", kind: docs }
              - { label: "WireGuard: next generation secure network tunnel (Black Hat talk)", url: "https://www.youtube.com/watch?v=88GyLoZbDNw", kind: video }
              - { label: "How to build your own WireGuard VPN server in the cloud (Lawrence Systems)", url: "https://www.youtube.com/watch?v=7yC-gJtl9mQ", kind: video }
          - id: tls-and-mesh-vpns
            title: TLS VPNs, mesh VPNs and zero trust
            optional: true
            summary: OpenVPN and AnyConnect-style VPNs ride on TLS and pass almost any firewall. Mesh tools like Tailscale connect devices directly, and zero trust checks every request instead of trusting the network.
            learn:
              - How TLS-based VPNs differ from IPsec
              - How a mesh VPN like Tailscale finds direct paths
              - What zero trust access changes
            body: |
              ### TLS and SSL VPNs
              Many remote access VPNs use TLS instead of IKE to agree keys:
              - **OpenVPN** uses TLS for the handshake and its own packet format for data, by default on UDP 1194. It can also run over TCP
              - **Cisco AnyConnect** (now Cisco Secure Client) and the open source **OpenConnect** run over TLS on TCP 443, usually with DTLS on UDP for the data

              Running on port 443 means they get through hotel and corporate firewalls that block UDP 500 and ESP. Running over TCP costs speed: when the inner TCP and outer TCP both retransmit on loss, performance falls apart.

              ### Mesh VPNs
              A classic VPN is hub and spoke: every packet goes through the gateway. A **mesh** connects each device to each other device.

              **Tailscale** builds a mesh out of WireGuard:
              1. A coordination server holds every device's public key and hands each device its peers' keys and addresses
              2. Devices use NAT traversal (STUN-style probing and hole punching) to talk directly
              3. When both sides are behind strict NAT, traffic goes through **DERP** relays, still end-to-end encrypted
              4. ACLs on the coordination server decide which device may reach which

              **Headscale** is an open source coordination server. ZeroTier and NetBird are similar products.

              ### Zero trust
              A VPN trusts you once you are "inside". **Zero trust** drops the idea of inside: every request to every app is checked against identity, device health and policy. Tools such as Cloudflare Access put an identity-aware proxy in front of each app instead of exposing a network.

              ### Common mistakes
              - Calling a mesh VPN zero trust by default: without tight ACLs, every device can still reach every other one
              - Running OpenVPN over TCP when UDP is allowed
            resources:
              - { label: "How Tailscale works (Tailscale)", url: "https://tailscale.com/blog/how-tailscale-works", kind: article }
              - { label: "How NAT traversal works (Tailscale)", url: "https://tailscale.com/blog/how-nat-traversal-works", kind: article }
              - { label: "DERP relay servers (Tailscale docs)", url: "https://tailscale.com/kb/1232/derp-servers", kind: docs }
              - { label: "Headscale: open source Tailscale control server", url: "https://headscale.net/", kind: tool }
              - { label: "OpenVPN community how-to", url: "https://openvpn.net/community-resources/how-to/", kind: docs }
              - { label: "OpenConnect VPN client", url: "https://www.infradead.org/openconnect/", kind: tool }
              - { label: "What is zero trust? (Cloudflare)", url: "https://www.cloudflare.com/learning/security/glossary/what-is-zero-trust/", kind: article }
              - { label: "How Tailscale makes managing WireGuard easy (Lawrence Systems)", url: "https://www.youtube.com/watch?v=bcRVkoeSN0E", kind: video }
          - id: site-to-site-vs-remote-access
            title: Site-to-site vs remote access, and cloud VPN gateways
            summary: Site-to-site VPNs join whole networks router to router. Remote access VPNs join one device at a time. Cloud providers sell managed gateways for both.
            learn:
              - The two VPN shapes and who runs each end
              - How AWS, Google Cloud and Azure build site-to-site links
              - Redundant tunnels and BGP failover
              - Planning address space before you connect
            body: |
              | | Site-to-site | Remote access |
              |---|---|---|
              | Joins | two networks | one device to a network |
              | Ends | router or firewall at each site | client app on the device, gateway at the office or cloud |
              | Users notice it | no, it is always on | yes, they connect and sign in |
              | Usual protocol | IPsec IKEv2, sometimes WireGuard | WireGuard, OpenVPN, IKEv2, TLS VPNs |

              ### Cloud VPN gateways
              Every big cloud sells a managed IPsec endpoint for site-to-site links to your office or data centre:
              - **AWS Site-to-Site VPN** gives each connection **two tunnels** to two different AWS endpoints, with static routes or BGP. It attaches to a virtual private gateway or a transit gateway
              - **Google Cloud HA VPN** has two interfaces. Its 99.99% availability SLA applies only when you build the required redundant tunnels
              - **Azure VPN Gateway** runs active-standby or active-active, with BGP optional
              - For remote access, **AWS Client VPN** is a managed OpenVPN-based service, and Azure has point-to-site VPN

              ### Key ideas
              - Always bring up **both** tunnels and use BGP, so traffic moves on its own when the provider does maintenance on one
              - The two sides' address ranges **must not overlap**. Two VPCs both on `10.0.0.0/16` cannot be routed to each other without NAT
              - A VPN rides the public internet. For steady high bandwidth or predictable latency, clouds offer private links instead (AWS Direct Connect, Google Cloud Interconnect, Azure ExpressRoute)

              ### Common mistakes
              - Building one tunnel only, then losing the link during routine maintenance
              - Allowing the tunnel but forgetting security groups or firewall rules on the far side
            resources:
              - { label: "What is AWS Site-to-Site VPN? (AWS docs)", url: "https://docs.aws.amazon.com/vpn/latest/s2svpn/VPC_VPN.html", kind: docs }
              - { label: "How AWS Site-to-Site VPN works (AWS docs)", url: "https://docs.aws.amazon.com/vpn/latest/s2svpn/how_it_works.html", kind: docs }
              - { label: "What is AWS Client VPN? (AWS docs)", url: "https://docs.aws.amazon.com/vpn/latest/clientvpn-admin/what-is.html", kind: docs }
              - { label: "Cloud VPN overview (Google Cloud docs)", url: "https://cloud.google.com/network-connectivity/docs/vpn/concepts/overview", kind: docs }
              - { label: "Cloud VPN topologies (Google Cloud docs)", url: "https://cloud.google.com/network-connectivity/docs/vpn/concepts/topologies", kind: docs }
              - { label: "What is Azure VPN Gateway? (Microsoft Learn)", url: "https://learn.microsoft.com/en-us/azure/vpn-gateway/vpn-gateway-about-vpngateways", kind: docs }
              - { label: "VPNs explained: site-to-site and remote access (CertBros)", url: "https://www.youtube.com/watch?v=CWy3x3Wux6o", kind: video }
              - { label: "Build a site-to-site VPN with pfSense and WireGuard (Lawrence Systems)", url: "https://www.youtube.com/watch?v=WXkWP-JZOd8", kind: video }

  - level: advanced
    title: Running real networks
    topics:
      - id: load-balancers
        title: Load balancers
        summary: Spreading traffic over many servers, and the algorithms that decide who gets the next request.
        lessons:
          - id: l4-vs-l7
            title: Layer 4 vs layer 7 load balancing
            summary: Balance raw TCP connections, or read each HTTP request and route on its path or headers.
            learn:
              - What each layer can see
              - TLS termination at the load balancer
            body: |
              A load balancer spreads traffic over several servers. It can work at two levels.

              A **layer 4** balancer sees only IPs, ports and TCP or UDP connections. It passes connections along without reading them, so it is fast and works for any protocol (databases, game servers). A **layer 7** balancer reads the application protocol. For HTTP it can route by host name, path or header, and reuse connections to backends.

              ### Key ideas
              - Layer 4: fast, simple, protocol-agnostic
              - Layer 7: smarter routing, such as `/api` to one pool and `/` to another
              - A layer 7 balancer can add headers, retry, rewrite and apply rules
              - **TLS termination**: the balancer decrypts HTTPS, so backends handle plain HTTP and certificates live in one place
              - You can also re-encrypt to backends if the network between is not trusted

              ### Example
              `harun.dev/api/*` goes to the API servers, and everything else goes to the web servers. Only a layer 7 balancer can do that.
            resources:
              - { label: "What is load balancing? (Cloudflare)", url: "https://www.cloudflare.com/learning/performance/what-is-load-balancing/", kind: article }
              - { label: "Layer 4 and layer 7 proxy mode (HAProxy)", url: "https://www.haproxy.com/blog/layer-4-and-layer-7-proxy-mode", kind: article }
              - { label: "Cloud Load Balancing overview (Google Cloud)", url: "https://cloud.google.com/load-balancing/docs/load-balancing-overview", kind: docs }
              - { label: "Load balancing options (Azure Architecture Center)", url: "https://learn.microsoft.com/en-us/azure/architecture/guide/technology-choices/load-balancing-overview", kind: docs }
              - { label: "How Elastic Load Balancing works (AWS docs)", url: "https://docs.aws.amazon.com/elasticloadbalancing/latest/userguide/how-elastic-load-balancing-works.html", kind: docs }
              - { label: "Load balancing in layer 4 vs layer 7 with HAProxy examples (Hussein Nasser)", url: "https://www.youtube.com/watch?v=aKMLgFVxZYk", kind: video }
              - post: add-lightsail-load-balancer-to-application-hosted-in-amazon-lightsail-instances
              - { label: "What is an Application Load Balancer? (AWS)", url: "https://docs.aws.amazon.com/elasticloadbalancing/latest/application/introduction.html", kind: docs }
              - { label: "What is a Network Load Balancer? (AWS)", url: "https://docs.aws.amazon.com/elasticloadbalancing/latest/network/introduction.html", kind: docs }
          - id: lb-algorithms
            title: Balancing algorithms
            summary: Round robin, least connections, hashing and more, and when each one fits.
            learn:
              - Round robin and weighted round robin
              - Least connections
              - IP hash and consistent hashing
            body: |
              The **algorithm** decides which server gets the next request. The right choice depends on how uniform your requests and servers are.

              ### Key ideas
              - **Round robin**: each server in turn. Simple, works when requests and servers are similar
              - **Weighted round robin**: bigger servers get a larger share
              - **Least connections**: send to the server with the fewest active connections. Good when requests vary in length
              - **IP hash**: hash the client address so the same client lands on the same server
              - **Consistent hashing**: hash a key onto a ring, so adding or removing a server moves only a few keys
              - Others include least response time and random choice

              ### Common mistakes
              - Round robin with long-lived connections, which piles load on early servers
              - IP hash behind a proxy, where every client shares one address
              - **Sticky sessions** hide state that should live in a shared store
            resources:
              - { label: "Load balancing, an interactive visual essay (Sam Rose)", url: "https://samwho.dev/load-balancing/", kind: article }
              - { label: "Using nginx as an HTTP load balancer (nginx docs)", url: "https://nginx.org/en/docs/http/load_balancing.html", kind: docs }
              - { label: "Supported load balancers (Envoy docs)", url: "https://www.envoyproxy.io/docs/envoy/latest/intro/arch_overview/upstream/load_balancing/load_balancers", kind: docs }
              - { label: "Load balancing algorithms (HAProxy docs)", url: "https://www.haproxy.com/documentation/haproxy-configuration-tutorials/load-balancing/", kind: docs }
              - { label: "Top 6 load balancing algorithms (ByteByteGo)", url: "https://www.youtube.com/watch?v=dBmxNsS3BGE", kind: video }
              - post: eight-load-balancer-algorithms
              - { label: "Types of load balancing algorithms (Cloudflare)", url: "https://www.cloudflare.com/learning/performance/types-of-load-balancing-algorithms/", kind: article }
              - { label: "Load balancing (computing) (Wikipedia)", url: "https://en.wikipedia.org/wiki/Load_balancing_(computing)", kind: article }
          - id: health-checks
            title: Health checks
            summary: The load balancer keeps asking each server if it is alive and stops sending traffic to the ones that fail.
            learn:
              - Active health checks
              - What a good health endpoint checks
            body: |
              A load balancer must not send traffic to a server that is down. **Health checks** let it know. It keeps probing every server, and takes the unhealthy ones out of rotation until they pass again.

              An **active** check sends a request on a schedule, for example `GET /health` every 10 seconds, and expects a `200`. Several failures in a row mark the server unhealthy, and several passes bring it back. Some balancers also use **passive** checks that watch real traffic for errors.

              ### Key ideas
              - A check can be TCP connect, or an HTTP request with an expected status
              - Set the interval and thresholds so one blip does not remove a server, but real failures are caught fast
              - A good health endpoint checks what the server needs to serve traffic, such as its database connection
              - It should be cheap, and must not take the server down under load

              ### Common mistakes
              - A check that always returns `200`, even when the database is gone
              - A deep check that fails every server at once when one shared dependency has a short outage
            resources:
              - { label: "Target group health checks (AWS docs)", url: "https://docs.aws.amazon.com/elasticloadbalancing/latest/application/target-group-health-checks.html", kind: docs }
              - { label: "Health checks overview (Google Cloud)", url: "https://cloud.google.com/load-balancing/docs/health-check-concepts", kind: docs }
              - { label: "Azure Load Balancer health probes (Microsoft Learn)", url: "https://learn.microsoft.com/en-us/azure/load-balancer/load-balancer-custom-probe-overview", kind: docs }
              - { label: "Implementing health checks (Amazon Builders' Library)", url: "https://aws.amazon.com/builders-library/implementing-health-checks/", kind: article }
              - { label: "Configure liveness, readiness and startup probes (Kubernetes docs)", url: "https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/", kind: docs }
              - { label: "Health checking (Envoy docs)", url: "https://www.envoyproxy.io/docs/envoy/latest/intro/arch_overview/upstream/health_checking", kind: docs }
              - { label: "Health checks (HAProxy docs)", url: "https://www.haproxy.com/documentation/haproxy-configuration-tutorials/reliability/health-checks/", kind: docs }
              - { label: "Monitors for load balancer health checks (Cloudflare docs)", url: "https://developers.cloudflare.com/load-balancing/monitors/", kind: docs }
              - { label: "Load balancer health checks, a lightboard talk (Progress Kemp)", url: "https://www.youtube.com/watch?v=oZFItaTq2oI", kind: video }
          - id: consistent-hashing
            title: Consistent hashing
            optional: true
            summary: Spread keys over servers so adding or removing one only moves a small share of them.
            learn:
              - The hash ring
              - Why caches and sticky routing use it
            body: |
              With plain hashing, you pick a server with `hash(key) mod N`. When N changes, almost every key moves to a different server. For a cache, that means almost everything is a miss.

              **Consistent hashing** places both servers and keys on a circle, called a **ring**. A key belongs to the first server found going clockwise from the key's position. If you add or remove a server, only the keys next to it move, about 1 divided by N of them.

              ### Key ideas
              - The hash ring maps keys and servers to the same space
              - Adding or removing a server moves only a small share of keys
              - **Virtual nodes** put each server on the ring many times, so load spreads evenly
              - Used by distributed caches, databases and load balancers that need requests for the same key to reach the same server

              ### Example
              Five cache servers hold user sessions. One more is added. With consistent hashing about one sixth of the keys move, and the rest stay put.
            resources:
              - { label: "Consistent hashing (Wikipedia)", url: "https://en.wikipedia.org/wiki/Consistent_hashing", kind: article }
              - { label: "Consistent hashing and random trees, the original paper (Karger et al.)", url: "https://www.cs.princeton.edu/courses/archive/fall09/cos518/papers/chash.pdf", kind: article }
              - { label: "Consistent hashing with bounded loads (Google Research)", url: "https://research.google/blog/consistent-hashing-with-bounded-loads/", kind: article }
              - { label: "A fast, minimal memory, consistent hash algorithm, jump hash (arXiv)", url: "https://arxiv.org/abs/1406.2294", kind: article }
              - { label: "Maglev: a fast and reliable software network load balancer (Google Research)", url: "https://research.google/pubs/maglev-a-fast-and-reliable-software-network-load-balancer/", kind: article }
              - { label: "Dynamo: Amazon's highly available key-value store (paper)", url: "https://www.allthingsdistributed.com/files/amazon-dynamo-sosp2007.pdf", kind: article }
              - { label: "Consistent hashing, algorithms you should know (ByteByteGo)", url: "https://www.youtube.com/watch?v=UF9Iqmg94tk", kind: video }

      - id: bgp-in-depth
        title: BGP in depth
        summary: How BGP picks one path among many, and the RFCs that define it.
        lessons:
          - id: bgp-path-selection
            title: Path selection
            summary: When a router hears many routes to the same prefix, it picks one by a fixed list of rules.
            learn:
              - Local preference and AS path length
              - Why the shortest path is not always chosen
            body: |
              A router often hears several routes for the same prefix. It must pick one. BGP uses a fixed list of rules, checked in order, and the first one that picks a winner decides.

              ### Key ideas
              - Highest **local preference** wins first. This is set by the network's own policy, for example "prefer customers over peers over transit"
              - Then the **shortest AS path**
              - Then lower origin type, lower MED, routes learned over eBGP before iBGP, and the lowest internal cost to the exit
              - Final tie-breakers such as the lowest router ID

              ### Why the shortest path is not always chosen
              Local preference comes before path length, so money and policy beat distance. A network prefers to send traffic through a customer, which pays it, rather than a shorter path through a provider, which it pays. The "best" route for BGP is the best by business rules, not by speed.

              This is also why engineers use **AS path prepending** to make a path look longer and steer traffic away.
            resources:
              - { label: "What is BGP? (Cloudflare)", url: "https://www.cloudflare.com/learning/security/glossary/what-is-bgp/", kind: article }
              - { label: "RFC 4271: BGP-4", url: "https://www.rfc-editor.org/rfc/rfc4271", kind: docs }
              - { label: "Tutorial: Introduction to BGP (NANOG)", url: "https://www.youtube.com/watch?v=mEkzTKjkNVI", kind: video }
              - { label: "Architecting Robust BGP Routing Policies (NANOG)", url: "https://www.youtube.com/watch?v=_wRvNINnSQg", kind: video }
              - { label: "RFC 1997: BGP Communities Attribute", url: "https://www.rfc-editor.org/rfc/rfc1997", kind: docs }
              - { label: "RFC 8092: BGP Large Communities Attribute", url: "https://www.rfc-editor.org/rfc/rfc8092", kind: docs }
              - { label: "What is BGP? Path attributes and selection (Kentik)", url: "https://www.kentik.com/kentipedia/what-is-bgp-border-gateway-protocol/", kind: article }
              - { label: "Looking Glass: see real BGP paths (Hurricane Electric)", url: "https://lg.he.net/", kind: tool }
          - id: bgp-rfc
            title: Reading the BGP-4 spec
            optional: true
            summary: Go to the source. The message types, the state machine and the decision process in the RFC.
            learn:
              - OPEN, UPDATE, KEEPALIVE and NOTIFICATION
              - The BGP finite state machine
            body: |
              The spec for BGP version 4 is **RFC 4271**. It is the source behind everything in this topic, and it is readable once you know the ideas.

              ### Key ideas
              - **Message types**: `OPEN` starts a session and sets parameters, `UPDATE` announces or withdraws routes, `KEEPALIVE` shows the peer is still there, and `NOTIFICATION` reports an error and closes the session
              - The **finite state machine** describes the life of a session: `Idle`, `Connect`, `Active`, `OpenSent`, `OpenConfirm` and `Established`
              - Routes only flow once the session is `Established`
              - The **decision process** has three phases: rank each route, choose the best for each prefix, then decide what to advertise to neighbours
              - Path attributes such as AS_PATH, NEXT_HOP and LOCAL_PREF carry the data used in selection

              ### In practice
              Read the sections on messages, the state machine and the decision process first. Skip the long tables on the first pass, then return to them when a real question comes up.
            resources:
              - { label: "RFC 4271: BGP-4", url: "https://www.rfc-editor.org/rfc/rfc4271", kind: docs }
              - { label: "RFC 6811: BGP prefix origin validation", url: "https://www.rfc-editor.org/rfc/rfc6811", kind: docs }
              - { label: "RFC 7454: BGP Operations and Security", url: "https://www.rfc-editor.org/rfc/rfc7454", kind: docs }
              - { label: "RFC 4760: Multiprotocol Extensions for BGP-4", url: "https://www.rfc-editor.org/rfc/rfc4760", kind: docs }
              - { label: "RFC 6793: BGP support for four-octet AS numbers", url: "https://www.rfc-editor.org/rfc/rfc6793", kind: docs }
              - { label: "RFC 7908: Problem definition and classification of BGP route leaks", url: "https://www.rfc-editor.org/rfc/rfc7908", kind: docs }
              - { label: "RFC 8212: Default EBGP route propagation behavior without policies", url: "https://www.rfc-editor.org/rfc/rfc8212", kind: docs }
              - { label: "RFC 8205: BGPsec protocol specification", url: "https://www.rfc-editor.org/rfc/rfc8205", kind: docs }
              - { label: "RFC 9234: Route leak prevention using roles in UPDATE and OPEN", url: "https://www.rfc-editor.org/rfc/rfc9234", kind: docs }

      - id: network-design
        title: Network design
        summary: Putting the pieces together. Redundant gateways with VRRP and HSRP, spine-leaf data centre fabrics, VXLAN and EVPN overlays, a small office built end to end, and how to see what the network is doing.
        lessons:
          - id: first-hop-redundancy
            title: "First-hop redundancy: VRRP and HSRP"
            summary: Every host has one default gateway. Two routers can share one virtual gateway address so a router failure goes unnoticed by the hosts.
            learn:
              - Why a single default gateway is a single point of failure
              - How a virtual IP and virtual MAC move between routers
              - VRRP vs HSRP, priorities and preemption
              - A keepalived config for Linux routers
            body: |
              A host is configured with one default gateway, for example `192.168.10.1`. If that router dies, the host cannot leave its subnet, even when a second router sits right next to it. **First-hop redundancy protocols** fix this. Two or more routers share a **virtual IP** and a **virtual MAC**. One is active and answers for both. The others listen and take over when the active router's adverts stop.

              | | VRRP | HSRP |
              |---|---|---|
              | Standard | open, RFC 9568 (VRRPv3) | Cisco, described in RFC 2281 |
              | Roles | master and backups | active, standby and listeners |
              | Adverts to | `224.0.0.18`, IP protocol 112 | `224.0.0.2` (v1) or `224.0.0.102` (v2), UDP 1985 |
              | Virtual MAC (IPv4) | `00-00-5E-00-01-{VRID}` | `0000.0c07.acXX` (v1) |
              | Default priority | 100 (255 for the router that owns the address) | 100 |
              | Preemption | on by default | off by default |

              ### Key ideas
              - Hosts never notice a failover. The new router sends **gratuitous ARP** so switches learn the virtual MAC on its port
              - The highest priority wins. With **preemption**, a recovered router with a higher priority takes the role back
              - **Tracking**: lower a router's priority when its uplink fails, so a router with no way out hands over the gateway
              - VRRPv3 adverts default to once per second, so failover takes about three seconds
              - GLBP (Cisco) and CARP (OpenBSD, pfSense, OPNsense) solve the same problem

              ### Example
              keepalived runs VRRP on Linux. On the backup router:
              ```
              vrrp_instance LAN {
                  state BACKUP
                  interface eth0
                  virtual_router_id 10
                  priority 100
                  advert_int 1
                  virtual_ipaddress {
                      192.168.10.1/24
                  }
              }
              ```
              The primary uses `state MASTER` and `priority 150`. DHCP hands out `192.168.10.1` as the gateway.

              ### Common mistakes
              - Two VRRP groups on one segment with the same `virtual_router_id`
              - A firewall between the routers dropping protocol 112, so both become master (split brain)
              - Forgetting to track the uplink: the gateway stays on a router that cannot reach the internet
            resources:
              - { label: "RFC 9568: Virtual Router Redundancy Protocol Version 3", url: "https://www.rfc-editor.org/rfc/rfc9568", kind: docs }
              - { label: "RFC 2281: Cisco Hot Standby Router Protocol", url: "https://www.rfc-editor.org/rfc/rfc2281", kind: docs }
              - { label: "keepalived documentation", url: "https://keepalived.readthedocs.io/en/latest/", kind: docs }
              - { label: "keepalived configuration synopsis", url: "https://keepalived.readthedocs.io/en/latest/configuration_synopsis.html", kind: docs }
              - { label: "VRRP (FRRouting docs)", url: "https://docs.frrouting.org/en/latest/vrrp.html", kind: docs }
              - { label: "First-hop redundancy protocol (Wikipedia)", url: "https://en.wikipedia.org/wiki/First-hop_redundancy_protocol", kind: article }
              - { label: "Free CCNA: First Hop Redundancy Protocols (Jeremy's IT Lab)", url: "https://www.youtube.com/watch?v=43WnpwQMolo", kind: video }
              - { label: "What is VRRP? (CBT Nuggets)", url: "https://www.youtube.com/watch?v=GyQrgfrKJ38", kind: video }
          - id: spine-leaf
            title: Spine-leaf fabrics and why they replaced three-tier
            summary: Modern data centres connect every leaf switch to every spine and route over all links at once. Why the old access, aggregation and core design could not keep up.
            learn:
              - The three-tier design and its limits
              - How a spine-leaf (Clos) fabric is wired
              - ECMP across every spine and routing to the leaf
              - Oversubscription and how a fabric grows
            body: |
              The classic campus and data centre design had **three tiers**: access switches for servers, aggregation switches above them and a core on top. It was built for **north-south** traffic, from users to servers. Layer 2 VLANs stretched across the access and aggregation layers, and **spanning tree** blocked redundant links to stop loops. Half the bought bandwidth sat idle.

              Then traffic changed. Virtual machines, microservices, storage and databases talk to each other far more than to users. This **east-west** traffic in a three-tier design climbs to the aggregation or core and back down, through paths of different length.

              ### Spine-leaf
              - Every **leaf** (top-of-rack switch) connects to every **spine**
              - Leaves never connect to leaves, and spines never connect to spines
              - A server reaches any server in another rack through leaf, spine, leaf: the same three switches, the same latency
              - Links between leaves and spines are **routed** (layer 3). There is no spanning tree, and all links are active through **ECMP**
              - Many fabrics run **eBGP** with a private ASN per leaf, as described in RFC 7938. OSPF and IS-IS also work

              This is a **Clos** network, named after Charles Clos, who described the idea for telephone switches in 1953.

              | | Three-tier | Spine-leaf |
              |---|---|---|
              | Links in use | about half (spanning tree blocks the rest) | all (ECMP) |
              | Server to server in another rack | 3 to 5 switches, varies | always 3 switches |
              | One spine fails | depends on the design | lose 1/N of the capacity, nothing else |
              | Growth | bigger boxes at the top | add leaves for ports, spines for bandwidth |

              ### Oversubscription
              A leaf with 48 × 25 Gbps server ports has 1,200 Gbps facing down. With 8 × 100 Gbps uplinks it has 800 Gbps facing up. The ratio is **1.5:1**. Storage and AI clusters aim for 1:1. General compute often accepts 3:1.

              ### Limits
              The number of leaves is capped by the port count of a spine. Very large sites add a third layer (super-spines) and repeat the pattern, as in Facebook's data centre fabric.
            resources:
              - { label: "RFC 7938: Use of BGP for routing in large-scale data centers", url: "https://www.rfc-editor.org/rfc/rfc7938", kind: docs }
              - { label: "Introducing data center fabric (Engineering at Meta)", url: "https://engineering.fb.com/2014/11/14/production-engineering/introducing-data-center-fabric-the-next-generation-facebook-data-center-network/", kind: article }
              - { label: "Clos network (Wikipedia)", url: "https://en.wikipedia.org/wiki/Clos_network", kind: article }
              - { label: "Spanning Tree Protocol (Wikipedia)", url: "https://en.wikipedia.org/wiki/Spanning_Tree_Protocol", kind: article }
              - { label: "Equal-cost multi-path routing (Wikipedia)", url: "https://en.wikipedia.org/wiki/Equal-cost_multi-path_routing", kind: article }
              - { label: "Spine-leaf network topology (Keith Barker)", url: "https://www.youtube.com/watch?v=IPaU-N7p4L0", kind: video }
              - { label: "Spine and leaf architecture explained (Networking with H)", url: "https://www.youtube.com/watch?v=xjc7WLBb-nI", kind: video }
          - id: vxlan-evpn
            title: "Overlays: VXLAN and EVPN"
            optional: true
            summary: A routed fabric has no stretched VLANs, but some workloads still need layer 2. VXLAN carries Ethernet frames inside UDP, and EVPN tells every switch where each MAC lives.
            learn:
              - Underlay vs overlay
              - How VXLAN wraps a frame and what a VTEP does
              - Why flood and learn was replaced by an EVPN control plane
              - The EVPN route types you meet first
            body: |
              A spine-leaf fabric is routed, so a VLAN ends at its leaf. But a virtual machine that moves between racks wants to keep its IP address, and some apps expect to share a layer 2 segment. An **overlay** solves this. The routed fabric is the **underlay**. On top of it, leaves build tunnels that carry Ethernet frames between them.

              ### VXLAN
              **VXLAN** (RFC 7348) puts the original Ethernet frame inside a UDP packet to port 4789. A **VTEP** (VXLAN tunnel endpoint), usually the leaf switch or a Linux host, adds and removes the outer headers.

              | Layer | Size |
              |---|---|
              | Outer Ethernet | 14 bytes |
              | Outer IPv4 | 20 bytes |
              | UDP | 8 bytes |
              | VXLAN header with the 24-bit **VNI** | 8 bytes |
              | Original frame | unchanged |

              - The VNI gives about 16 million segments, instead of 4,094 VLANs
              - The outer UDP source port is a hash of the inner frame, so ECMP in the underlay spreads tunnel traffic
              - The overhead is 50 bytes. Raise the underlay MTU (9,000 or more is common) so inner 1,500-byte frames fit

              ### EVPN, the control plane
              Plain VXLAN learns like a switch: it floods unknown frames to every VTEP and learns MACs from replies. That does not scale. **EVPN** (RFC 7432, and RFC 8365 for VXLAN) uses **BGP** to advertise MAC and IP addresses instead.

              | EVPN route | Says |
              |---|---|
              | Type 2, MAC/IP | "MAC `aa:bb:..` with IP `10.1.1.5` is behind VTEP 10.255.0.3, VNI 100" |
              | Type 3, inclusive multicast | "send broadcast and unknown traffic for VNI 100 to me" |
              | Type 5, IP prefix (RFC 9136) | "subnet `10.50.0.0/24` is reachable through me" |

              Because leaves know every MAC and IP in advance, they can answer ARP locally (**ARP suppression**) and route between VNIs at the first leaf.

              ### Example
              In FRR, after the VXLAN interfaces exist, one block turns on EVPN:
              ```
              router bgp 65001
               address-family l2vpn evpn
                neighbor fabric activate
                advertise-all-vni
              ```

              ### Common mistakes
              - Leaving the underlay at MTU 1,500: large packets in the overlay are dropped
              - Stretching layer 2 between data centres "because we can". A broadcast storm then spans both sites
            resources:
              - { label: "RFC 7348: VXLAN", url: "https://www.rfc-editor.org/rfc/rfc7348", kind: docs }
              - { label: "RFC 7432: BGP MPLS-based Ethernet VPN", url: "https://www.rfc-editor.org/rfc/rfc7432", kind: docs }
              - { label: "RFC 8365: A network virtualization overlay solution using EVPN", url: "https://www.rfc-editor.org/rfc/rfc8365", kind: docs }
              - { label: "RFC 9136: IP prefix advertisement in EVPN", url: "https://www.rfc-editor.org/rfc/rfc9136", kind: docs }
              - { label: "EVPN (FRRouting docs)", url: "https://docs.frrouting.org/en/latest/evpn.html", kind: docs }
              - { label: "Virtual eXtensible Local Area Networking (Linux kernel docs)", url: "https://docs.kernel.org/networking/vxlan.html", kind: docs }
              - { label: "What is EVPN-VXLAN anyways? (CBT Nuggets)", url: "https://www.youtube.com/watch?v=cdvstTm467k", kind: video }
              - { label: "EVPN VXLAN: learn the basics (The Netcademy)", url: "https://www.youtube.com/watch?v=3zjf1dPB_Es", kind: video }
          - id: office-vlan-and-addressing
            title: "Small office design, part 1: VLANs and addressing"
            summary: Plan a 40-person office before buying anything. Split devices by trust into VLANs, give each a subnet that is easy to read, and route between them through the firewall.
            learn:
              - Grouping devices by trust and function
              - A VLAN and subnet plan that is easy to remember
              - Trunk ports, access ports and where routing happens
              - Choosing private ranges that do not clash with home networks
            body: |
              Start from **who needs to talk to whom**, not from the hardware. Devices with different trust levels go into different **VLANs**, and the firewall routes between them. A guest phone and the accounting laptop should never share a broadcast domain.

              ### Example plan
              Site range `10.20.0.0/16`, with the VLAN number in the third octet:

              | VLAN | Name | Subnet | Who |
              |---|---|---|---|
              | 10 | staff | `10.20.10.0/24` | laptops and desktops |
              | 20 | voice | `10.20.20.0/24` | desk phones |
              | 30 | guest | `10.20.30.0/24` | visitors, internet only |
              | 40 | iot | `10.20.40.0/24` | printers, TVs, cameras |
              | 50 | servers | `10.20.50.0/24` | NAS, local services |
              | 99 | mgmt | `10.20.99.0/24` | switches, access points, firewall admin |

              The gateway of each subnet is `.1`, on the firewall. Infrastructure takes `.2` to `.49`, and DHCP hands out `.50` to `.250`.

              ### Key ideas
              - **Avoid `192.168.0.0/24` and `192.168.1.0/24`**. Staff on VPN from home have those ranges, and overlapping subnets break routing
              - Leave room: `10.20.0.0/16` is this site, `10.21.0.0/16` the next one. Each summarises to one route over a site-to-site VPN
              - Switch ports to end devices are **access** ports in one VLAN, untagged. Links between the firewall, switches and access points are **trunks** carrying several VLANs with 802.1Q tags
              - Route between VLANs **on the firewall**, so every crossing hits a policy. A layer 3 switch is faster, but it filters only with simple stateless ACLs
              - Put switch and access point management in its own VLAN, reachable only from admin machines

              ### Common mistakes
              - Using VLAN 1, the default, for real traffic. Leave it unused
              - A /24 for 600 guest devices at a busy event. Size guest networks for the peak
              - Writing the plan nowhere. Keep it in the repo or wiki with the configs
            resources:
              - { label: "VLANs (Practical Networking)", url: "https://www.practicalnetworking.net/stand-alone/vlans/", kind: article }
              - { label: "IEEE 802.1Q (Wikipedia)", url: "https://en.wikipedia.org/wiki/IEEE_802.1Q", kind: article }
              - { label: "RFC 1918: Address allocation for private internets", url: "https://www.rfc-editor.org/rfc/rfc1918", kind: docs }
              - { label: "VLANs (pfSense docs)", url: "https://docs.netgate.com/pfsense/en/latest/vlan/index.html", kind: docs }
              - { label: "OPNsense documentation", url: "https://docs.opnsense.org/", kind: docs }
              - { label: "Router on a stick (Wikipedia)", url: "https://en.wikipedia.org/wiki/Router_on_a_stick", kind: article }
              - { label: "Inter-VLAN routing, router on a stick lab (Jeremy's IT Lab)", url: "https://www.youtube.com/watch?v=3II2RwiXImg", kind: video }
              - { label: "Complete network configuration, CCNA mega lab (Jeremy's IT Lab)", url: "https://www.youtube.com/watch?v=2p7-MluKAgE", kind: video }
          - id: office-services-and-policy
            title: "Small office design, part 2: DHCP, DNS, Wi-Fi and firewall policy"
            summary: The services that make the plan work, and the rules between the VLANs. A policy table you can hand to anyone who touches the firewall.
            learn:
              - DHCP scopes, reservations and snooping
              - An internal DNS resolver and a local domain name
              - Mapping Wi-Fi networks to VLANs
              - A firewall policy between VLANs
            body: |
              ### DHCP
              - One scope per VLAN on the firewall. Short leases for guests (a few hours), longer for staff
              - **Reservations** for printers and anything other devices must find by address
              - Turn on **DHCP snooping** on the switches so a rogue DHCP server, such as a home router someone plugs in, cannot hand out addresses

              ### DNS
              - Run a resolver on the firewall (Unbound in OPNsense and pfSense) and hand it out through DHCP
              - Name local hosts under a subdomain you own, such as `office.example.com`. Do not use `.local`, which belongs to mDNS. For home networks, `home.arpa` is reserved for this
              - Guests get only public resolution, never internal names

              ### Wi-Fi
              Each SSID maps to one VLAN on the access points' trunk:
              - **Staff**: WPA3-Enterprise or WPA2-Enterprise with 802.1X, so leavers lose access when their account is disabled
              - **Guest**: WPA2 or WPA3 password, client isolation on, internet only
              - **IoT**: a separate password, since many devices support only WPA2-Personal

              ### Firewall policy
              | From | May reach | Denied |
              |---|---|---|
              | staff | internet, servers, printers in iot, voice server | mgmt |
              | voice | the phone provider, internal DNS | everything else |
              | guest | internet, DNS on the firewall | every internal VLAN |
              | iot | internet for updates, if needed | every other VLAN |
              | servers | internet for updates, backup target | staff, guest, iot |
              | mgmt | everything, admins only | nothing |

              Replies are allowed by state. Every rule outside this table is denied and logged.

              ### In practice
              - AirPrint and casting use mDNS, which does not cross VLANs. An **mDNS repeater** on the firewall forwards it from iot to staff only
              - Put the firewall, switches and access points on a UPS
              - Back up every config after each change

              ### Common mistakes
              - "Temporary" any-to-any rules between VLANs that stay forever
              - Guest Wi-Fi on the staff VLAN with a different password
            resources:
              - { label: "RFC 2131: Dynamic Host Configuration Protocol", url: "https://www.rfc-editor.org/rfc/rfc2131", kind: docs }
              - { label: "RFC 8375: Special-use domain home.arpa", url: "https://www.rfc-editor.org/rfc/rfc8375", kind: docs }
              - { label: "RFC 6762: Multicast DNS (the .local domain)", url: "https://www.rfc-editor.org/rfc/rfc6762", kind: docs }
              - { label: "Unbound DNS (OPNsense docs)", url: "https://docs.opnsense.org/manual/unbound.html", kind: docs }
              - { label: "Setting up a guest network (OPNsense docs)", url: "https://docs.opnsense.org/manual/how-tos/guestnet.html", kind: docs }
              - { label: "Wi-Fi security (Wi-Fi Alliance)", url: "https://www.wi-fi.org/discover-wi-fi/security", kind: docs }
              - { label: "IEEE 802.1X (Wikipedia)", url: "https://en.wikipedia.org/wiki/IEEE_802.1X", kind: article }
              - { label: "Free CCNA: DHCP Snooping (Jeremy's IT Lab)", url: "https://www.youtube.com/watch?v=qYYeg2kz1yE", kind: video }
          - id: network-observability
            title: "Network observability: SNMP, flows and streaming telemetry"
            optional: true
            summary: Three ways to see what the network is doing. SNMP counters for health, flow records for who talks to whom, and streaming telemetry for fast, detailed data.
            learn:
              - SNMP polling, traps and why v3 matters
              - NetFlow, IPFIX and sFlow, and how they differ
              - Streaming telemetry with gNMI and OpenConfig
              - Open source tools for each
            body: |
              Monitoring a network answers three questions. **Is it healthy?** **Who is using it?** **What changed, and when?** Each source answers a different one.

              | Source | How it works | Answers |
              |---|---|---|
              | **SNMP** | a poller asks devices for counters, UDP 161. Devices send traps, UDP 162 | link up or down, bytes, errors, CPU, temperature |
              | **NetFlow v9 / IPFIX** | the device summarises each flow and exports a record | who talked to whom, on which ports, how much |
              | **sFlow** | the device samples 1 in N packets and sends their headers, plus counters | the same, from samples, cheap even at 400 Gbps |
              | **Streaming telemetry** | the device pushes data on a subscription (gNMI over gRPC) | counters and state every few seconds, or on change |

              ### SNMP
              - Data is organised in **MIBs**. Interface counters live in IF-MIB
              - Use the 64-bit counters (`ifHCInOctets`). A 32-bit byte counter wraps in about 3.4 seconds at 10 Gbps
              - **v2c** sends a "community" string in plain text. **v3** adds users, authentication and encryption. Use v3, and never leave the community as `public`
              - Polling every 1 to 5 minutes averages away short bursts

              ### Flows
              - **NetFlow v5** is a fixed IPv4-only format. **v9** uses templates, and **IPFIX** (RFC 7011) is the IETF standard based on it
              - Flow data shows top talkers, DDoS sources and unexpected traffic, without capturing payloads
              - Sampling is fine for traffic engineering, but it misses single small flows during an investigation

              ### Streaming telemetry
              Instead of being polled, the device **pushes** data. **gNMI** carries it, and **OpenConfig** YANG models give it the same shape across vendors. Second-level detail shows microbursts that 5-minute SNMP averages hide.

              ### Tools
              - SNMP: LibreNMS, Prometheus `snmp_exporter`
              - Flows: Akvorado, pmacct, goflow2
              - Telemetry: gnmic into Prometheus or InfluxDB, with Grafana on top

              ### Common mistakes
              - Graphing only averages, then wondering why users complain about drops
              - Exposing SNMP to the internet. It has been used for DDoS amplification
            resources:
              - { label: "RFC 3414: User-based Security Model for SNMPv3", url: "https://www.rfc-editor.org/rfc/rfc3414", kind: docs }
              - { label: "RFC 2863: The Interfaces Group MIB", url: "https://www.rfc-editor.org/rfc/rfc2863", kind: docs }
              - { label: "RFC 7011: IPFIX protocol specification", url: "https://www.rfc-editor.org/rfc/rfc7011", kind: docs }
              - { label: "sFlow.org", url: "https://sflow.org/", kind: docs }
              - { label: "gNMI specification (OpenConfig)", url: "https://github.com/openconfig/reference/blob/master/rpc/gnmi/gnmi-specification.md", kind: docs }
              - { label: "gnmic", url: "https://gnmic.openconfig.net/", kind: tool }
              - { label: "Prometheus SNMP exporter", url: "https://github.com/prometheus/snmp_exporter", kind: tool }
              - { label: "Akvorado flow collector", url: "https://github.com/akvorado/akvorado", kind: tool }
              - { label: "SNMP explained (CertBros)", url: "https://www.youtube.com/watch?v=Lq7j-QipNrI", kind: video }

      - id: how-email-works
        title: How email works
        summary: The path a message takes from your mail app to someone's inbox, how SPF, DKIM and DMARC prove who sent it, how mailboxes are read, and why legitimate mail still lands in spam.
        lessons:
          - id: smtp-mail-path
            title: "The SMTP path: MUA, MSA, MTA and MX records"
            summary: Mail moves in hops. Your app submits it to your provider, your provider looks up the recipient's MX record, and server-to-server SMTP on port 25 delivers it.
            learn:
              - The roles of MUA, MSA, MTA and MDA
              - How MX records pick the receiving server
              - Ports 25, 587 and 465 and what each is for
              - Envelope addresses vs header addresses
              - Reading a raw SMTP conversation
            body: |
              Sending an email is a relay race between programs with fixed roles:

              1. **MUA** (mail user agent): your mail app, such as Outlook, Apple Mail or Thunderbird
              2. **MSA** (mail submission agent): your provider's server that accepts mail from logged-in users
              3. **MTA** (mail transfer agent): looks up where the recipient's domain takes mail and relays it there
              4. **MDA** (mail delivery agent): the receiving side files the message into the right mailbox

              To find the next hop, the MTA asks DNS for the domain's **MX records**. The **lowest** preference number is tried first, the others are backups. With no MX at all, the domain's A or AAAA record is used.
              ```
              dig +short MX example.com
              10 mx1.example.com.
              20 mx2.example.com.
              ```

              ### Ports
              | Port | Used for | Encryption |
              |---|---|---|
              | **25** | server to server relay | STARTTLS when both sides support it |
              | **587** | client submission, login required | STARTTLS |
              | **465** | client submission, login required | implicit TLS from the first byte, preferred by RFC 8314 |

              Many ISPs and cloud providers block outbound port 25 from ordinary machines, because spam bots used it.

              ### A raw SMTP session
              ```
              S: 220 mx1.example.com ESMTP
              C: EHLO mail.sender.net
              S: 250-mx1.example.com
              S: 250 STARTTLS
              C: MAIL FROM:<alice@sender.net>
              S: 250 OK
              C: RCPT TO:<bob@example.com>
              S: 250 OK
              C: DATA
              S: 354 End data with <CR><LF>.<CR><LF>
              C: From: Alice <alice@sender.net>
              C: Subject: Hello
              C: .
              S: 250 OK queued
              ```
              `MAIL FROM` and `RCPT TO` are the **envelope**. The `From:` you see in your app is a **header** inside the message, and the two do not have to match. Bounces go to the envelope sender.

              ### Key ideas
              - Codes starting with **4** are temporary, so the sender retries, often for several days. Codes starting with **5** are permanent and produce a bounce
              - Each server adds a `Received:` header. Read them from the bottom up to trace the path
            resources:
              - { label: "RFC 5321: Simple Mail Transfer Protocol", url: "https://www.rfc-editor.org/rfc/rfc5321", kind: docs }
              - { label: "RFC 5598: Internet Mail Architecture (MUA, MSA, MTA, MDA)", url: "https://www.rfc-editor.org/rfc/rfc5598", kind: docs }
              - { label: "RFC 6409: Message Submission for Mail", url: "https://www.rfc-editor.org/rfc/rfc6409", kind: docs }
              - { label: "RFC 8314: Cleartext Considered Obsolete (port 465)", url: "https://www.rfc-editor.org/rfc/rfc8314", kind: docs }
              - { label: "What is SMTP? (Cloudflare)", url: "https://www.cloudflare.com/learning/email-security/what-is-smtp/", kind: article }
              - { label: "MX record (Wikipedia)", url: "https://en.wikipedia.org/wiki/MX_record", kind: article }
              - { label: "Simple Mail Transfer Protocol (Wikipedia)", url: "https://en.wikipedia.org/wiki/Simple_Mail_Transfer_Protocol", kind: article }
              - { label: "Email (Computerphile)", url: "https://www.youtube.com/watch?v=7ZPW8FwgHoM", kind: video }
              - { label: "How email works (PowerCert)", url: "https://www.youtube.com/watch?v=ELioaGg4WOY", kind: video }
          - id: spf-dkim-dmarc
            title: SPF, DKIM and DMARC
            summary: Three DNS records that let a receiver check a message really came from the domain it claims. SPF lists servers, DKIM signs messages, DMARC ties both to the visible From address.
            learn:
              - What SPF checks and its 10-lookup limit
              - How DKIM signatures and selectors work
              - DMARC alignment and the none, quarantine and reject policies
              - Reading the Authentication-Results header
            body: |
              Plain SMTP lets anyone write any `From:` address. These three records, all published in DNS, fix that.

              ### SPF: which servers may send
              ```
              example.com. TXT "v=spf1 include:_spf.google.com ip4:203.0.113.25 -all"
              ```
              The receiver checks the connecting IP against this list for the **envelope** sender's domain (`MAIL FROM`), not the visible `From:`. `-all` means fail everything else, `~all` means soft fail. SPF allows at most **10 DNS lookups** (`include`, `a`, `mx` and similar), and it breaks when mail is forwarded, because the forwarder's IP is not listed.

              ### DKIM: a signature on the message
              The sending server signs chosen headers and a hash of the body, and adds a `DKIM-Signature` header with `d=` (the signing domain) and `s=` (the selector). The receiver fetches the public key from DNS:
              ```
              s1._domainkey.example.com. TXT "v=DKIM1; k=rsa; p=MIIBIjANBgkqh..."
              ```
              DKIM survives forwarding as long as nobody changes the signed parts. Use 2048-bit RSA keys.

              ### DMARC: tie it to the From address
              ```
              _dmarc.example.com. TXT "v=DMARC1; p=quarantine; rua=mailto:dmarc@example.com"
              ```
              DMARC passes when SPF **or** DKIM passes **and** that domain **aligns** with the `From:` domain (by default, the same organisational domain). `p=` tells receivers what to do when it fails: `none` (only report), `quarantine` (spam folder) or `reject`. `rua` receives daily XML reports of who sends as you.

              In 2026 DMARC was republished as RFC 9989, replacing RFC 7489. It drops the `pct` tag, adds `t=y` for test mode and `np` for non-existent subdomains.

              ### In practice
              Open a received message's original source and look for:
              ```
              Authentication-Results: mx.google.com; spf=pass ...; dkim=pass header.d=example.com; dmarc=pass
              ```
              Roll out in steps: `p=none`, read reports until every real sender passes, then `quarantine`, then `reject`.
            resources:
              - { label: "RFC 7208: Sender Policy Framework (SPF)", url: "https://www.rfc-editor.org/rfc/rfc7208", kind: docs }
              - { label: "RFC 6376: DomainKeys Identified Mail (DKIM) Signatures", url: "https://www.rfc-editor.org/rfc/rfc6376", kind: docs }
              - { label: "RFC 9989: DMARC", url: "https://www.rfc-editor.org/rfc/rfc9989", kind: docs }
              - { label: "DMARC, DKIM and SPF explained (Cloudflare)", url: "https://www.cloudflare.com/learning/email-security/dmarc-dkim-spf/", kind: article }
              - { label: "Set up DMARC (Google Workspace Admin Help)", url: "https://support.google.com/a/answer/2466580", kind: docs }
              - { label: "Email authentication in Microsoft 365 (Microsoft Learn)", url: "https://learn.microsoft.com/en-us/defender-office-365/email-authentication-about", kind: docs }
              - { label: "Learn and test DMARC (learndmarc.com)", url: "https://www.learndmarc.com/", kind: tool }
              - { label: "MxToolbox: check SPF, DKIM, DMARC and blocklists", url: "https://mxtoolbox.com/", kind: tool }
              - { label: "DMARC, DKIM and SPF explained (Mike Chapple)", url: "https://www.youtube.com/watch?v=Q8NUW3CZRvw", kind: video }
          - id: imap-pop3-mailbox-access
            title: "Reading mail: IMAP, POP3 and JMAP"
            summary: SMTP only moves mail between servers. Reading it is a separate protocol. IMAP keeps mail on the server and syncs every device, POP3 downloads it, and JMAP does the job over HTTPS and JSON.
            learn:
              - IMAP vs POP3 and their ports
              - Folders, flags and IDLE in IMAP
              - Talking IMAP by hand with openssl
              - Where JMAP and provider APIs fit
            body: |
              Once mail reaches the recipient's server, it waits in a mailbox. The recipient's app fetches it with a different protocol from the one that delivered it.

              | | IMAP | POP3 | JMAP |
              |---|---|---|---|
              | Ports | 143 with STARTTLS, **993** implicit TLS | 110 with STARTTLS, **995** implicit TLS | 443 (HTTPS) |
              | Mail lives | on the server | moved to one device, usually deleted from the server | on the server |
              | Folders and read flags | yes, synced to every device | no | yes |
              | Push | `IDLE` command | no, poll only | push over HTTP |
              | Standard | RFC 9051 (IMAP4rev2) | RFC 1939 | RFC 8620 and RFC 8621 |

              IMAP is the default for nearly everyone now, because people read mail on several devices. POP3 survives where a single machine should hold the only copy.

              ### Example
              ```
              openssl s_client -connect imap.example.com:993 -crlf -quiet
              a1 LOGIN bob@example.com app-password
              a2 LIST "" "*"
              a3 SELECT INBOX
              a4 FETCH 1 (FLAGS BODY.PEEK[HEADER.FIELDS (FROM SUBJECT)])
              a5 LOGOUT
              ```
              Each command starts with a tag (`a1`, `a2`) so replies can be matched to requests. `BODY.PEEK` reads without marking the message as seen.

              ### Key ideas
              - Sending is separate: even an IMAP app sends through SMTP submission on 587 or 465
              - Big providers prefer their own APIs (Gmail API, Microsoft Graph) and OAuth sign-in. Plain password login over IMAP is often disabled or needs an app password
              - **JMAP** replaces IMAP's many round trips with batched JSON requests, and can also send mail

              ### Common mistakes
              - Using POP3 on two devices and wondering where messages went
              - Connecting to 143 or 110 without STARTTLS, which sends the password in clear text
            resources:
              - { label: "RFC 9051: IMAP4rev2", url: "https://www.rfc-editor.org/rfc/rfc9051", kind: docs }
              - { label: "RFC 1939: Post Office Protocol version 3", url: "https://www.rfc-editor.org/rfc/rfc1939", kind: docs }
              - { label: "RFC 8620: The JSON Meta Application Protocol (JMAP)", url: "https://www.rfc-editor.org/rfc/rfc8620", kind: docs }
              - { label: "JMAP (official site)", url: "https://jmap.io/", kind: docs }
              - { label: "Internet Message Access Protocol (Wikipedia)", url: "https://en.wikipedia.org/wiki/Internet_Message_Access_Protocol", kind: article }
              - { label: "Post Office Protocol (Wikipedia)", url: "https://en.wikipedia.org/wiki/Post_Office_Protocol", kind: article }
              - { label: "POP3 vs IMAP: what's the difference? (PowerCert)", url: "https://www.youtube.com/watch?v=SBaARws0hy4", kind: video }
              - { label: "SMTP vs IMAP vs POP3 explained (Mailtrap)", url: "https://www.youtube.com/watch?v=IMLFrYqI-oQ", kind: video }
          - id: email-deliverability
            title: Why mail goes to spam, and the 2024 bulk sender rules
            optional: true
            summary: Receivers judge each message on authentication, the sender's reputation and how recipients react. Since February 2024 Gmail and Yahoo require bulk senders to meet hard rules.
            learn:
              - IP and domain reputation
              - Complaint rate and engagement signals
              - The Gmail and Yahoo bulk sender requirements
              - Practical habits that keep mail out of spam
            body: |
              Spam filters care much less about words like "free" than people think. The big signals are:

              - **Authentication**: SPF, DKIM and DMARC pass and align with the `From:` domain
              - **Reputation**: the history of the sending IP and, more and more, the sending **domain**. A new IP or domain has no history and must build up volume slowly (**warm-up**)
              - **Recipient behaviour**: spam complaints count heavily. Opens, replies and moving mail out of spam help
              - **List quality**: many bounces, old addresses or spam traps (addresses that never signed up) mark you as careless
              - **Infrastructure**: the sending IP needs a PTR record whose name resolves back to the same IP, and TLS on delivery

              ### The 2024 rules
              From February 2024, Gmail requires anyone sending **more than 5,000 messages a day** to Gmail accounts to:

              | Requirement | Detail |
              |---|---|
              | SPF **and** DKIM | for the sending domain |
              | DMARC | published, `p=none` is enough, and passing with alignment to `From:` |
              | One-click unsubscribe | `List-Unsubscribe` and `List-Unsubscribe-Post` headers (RFC 8058) on marketing mail, honoured within 48 hours |
              | Spam rate | below 0.3% in Postmaster Tools, ideally under 0.1% |
              | PTR and TLS | valid forward and reverse DNS, TLS for transmission |

              Yahoo announced matching rules at the same time. Smaller senders still need SPF or DKIM, PTR records and TLS.

              ### In practice
              - Send marketing and transactional mail from different subdomains, such as `news.example.com` and `mail.example.com`, so a campaign cannot hurt password resets
              - Watch Google Postmaster Tools and Yahoo Sender Hub, and read DMARC reports
              - Remove hard bounces at once and stop mailing people who never engage

              ### Common mistakes
              - Buying a list. It is full of spam traps
              - Hiding the unsubscribe link. People hit "Report spam" instead, which costs far more
            resources:
              - { label: "Email sender guidelines (Google)", url: "https://support.google.com/a/answer/81126", kind: docs }
              - { label: "Email sender guidelines FAQ (Google)", url: "https://support.google.com/a/answer/14229414", kind: docs }
              - { label: "Google Postmaster Tools", url: "https://postmaster.google.com/", kind: tool }
              - { label: "Sender best practices (Yahoo Sender Hub)", url: "https://senders.yahooinc.com/best-practices/", kind: docs }
              - { label: "M3AAWG Sender Best Common Practices", url: "https://www.m3aawg.org/sites/default/files/document/M3AAWG_Senders_BCP_Ver3-2015-02.pdf", kind: docs }
              - { label: "RFC 8058: One-click unsubscribe", url: "https://www.rfc-editor.org/rfc/rfc8058", kind: docs }
              - { label: "Spamhaus", url: "https://www.spamhaus.org/", kind: tool }
              - { label: "mail-tester: score a test message", url: "https://www.mail-tester.com/", kind: tool }
              - { label: "Gmail and Yahoo bulk sender requirements explained (mailmark)", url: "https://www.youtube.com/watch?v=qLa2kf9ESvw", kind: video }
